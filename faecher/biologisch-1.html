<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0A1428">
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2611170226">
<link rel="icon" type="image/png" href="../favicon-32.png?v=2611170226">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Biologische Psychologie I Lernbox</title>
<style>.hubback{display:inline-block;margin:0 0 10px;font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--paper)}.hubback:hover{color:var(--ink);border-color:var(--ink)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Psychologie-Style: Lernheft mit Textmarker. Fach-Tinte (--accent), Neon-Marker (--hl) für Fachbegriffe, Kapitel-Reiter links.
   FARBEN PRO FACH: nur die mit [FACH] markierten Tokens aus farben.md tauschen, Rest bleibt. */
:root{
  --bg:#EAF3ED; --paper:#FDFEFE; --ink:#0F2E1A; --muted:#517B60; --line:#D2E2D8;
  --accent:#1F6B3A; --accent-ink:#FFFFFF; --hl:#FFC9A0; --hl-ink:#0F2E1A;
  --good:#0F7A55; --good-bg:#DDF3EA; --bad:#C2361F; --bad-bg:#FBE3DE; --warn-bg:#FFF6CC; --warn-line:#E1C23A;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1911; --paper:#17281D; --ink:#E8F3EC; --muted:#A1BAAA; --line:#2B4534;
  --accent:#8DE2AB; --accent-ink:#0D1911; --hl:#FFB883; --hl-ink:#0F2E1A;
  --good:#5BD3A2; --good-bg:#12302A; --bad:#FF8A75; --bad-bg:#3A1C1A; --warn-bg:#2E2A12; --warn-line:#8A7A22;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1911; --paper:#17281D; --ink:#E8F3EC; --muted:#A1BAAA; --line:#2B4534;
  --accent:#8DE2AB; --accent-ink:#0D1911; --hl:#FFB883; --hl-ink:#0F2E1A;
  --good:#5BD3A2; --good-bg:#12302A; --bad:#FF8A75; --bad-bg:#3A1C1A; --warn-bg:#2E2A12; --warn-line:#8A7A22;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);color:var(--hl-ink);padding:0 .15em;border-radius:2px;font-weight:600}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em}

/* Kopf */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:.95;letter-spacing:-.03em;margin:0;text-wrap:balance}
.brand h1 span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 .18em;border-radius:8px;transform:rotate(-2deg);margin-left:.08em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.count{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px}
.count b{font-family:var(--display);font-weight:800;font-size:1.6rem;background:var(--hl);color:var(--hl-ink);border-radius:999px;min-width:48px;height:48px;display:grid;place-items:center;padding:0 10px}
.count div{font-size:.85rem;line-height:1.3}
.count small{display:block;color:var(--muted);font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:18px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs > button{background:none;border:0;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--muted)}
nav.tabs > button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs > button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--paper)}

/* Kapitel-Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip .mono{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .mono{color:inherit;opacity:.8}

/* Lernen */
/* Suche */
.search{margin-left:auto;position:relative;display:flex;align-items:center;flex:0 1 300px;min-width:0}
.search svg{position:absolute;left:10px;width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;font:inherit;font-size:.92rem;padding:8px 56px 8px 34px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input:focus{outline:none;border-color:var(--accent)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{position:absolute;right:8px;font-family:var(--mono);font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;pointer-events:none}
.search input:not(:placeholder-shown)~kbd{display:none}
.sres{position:absolute;top:calc(100% + 6px);right:0;width:min(680px,100%);max-height:min(70vh,640px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 44px rgba(0,0,0,.18);padding:10px;z-index:30}
.sgrp+.sgrp{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.sgrp>.label{display:block;padding:4px 10px 4px}
.shit{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit;font-size:.93rem;line-height:1.45}
button.shit{cursor:pointer}
button.shit:hover,button.shit:focus-visible{background:var(--bg);outline:none}
.shit .mono{font-size:.68rem;color:var(--muted);letter-spacing:.04em}
.shit .sol{color:var(--muted)}
.smore,.sempty{margin:6px 10px;color:var(--muted);font-size:.88rem}
.hit{background:var(--find,#FFB547);color:#1A1A1A;border-radius:3px;box-shadow:0 0 0 2px var(--find,#FFB547);font-weight:600}
mark .hit{box-shadow:0 0 0 2px var(--find,#FFB547),0 0 0 3px var(--ink)}
/* --find = Farbe der Suchtreffer; muss sich vom Marker --hl klar abheben (bei orangem/pfirsich --hl z. B. --find:#A6E35A setzen) */
.sec{scroll-margin-top:90px}
.sec.flash{outline:2px solid var(--accent);outline-offset:3px}

.learn{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px}
.rail button{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px}
.rail button .mono{color:var(--muted)}
.rail button[aria-current="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--accent)}
.rail button[aria-current="true"] .mono{color:var(--accent)}
.rail button:hover{background:var(--paper)}
.chap-head{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:14px}
.chap-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.chap-head .mono{color:var(--accent);display:block;margin-bottom:6px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.sec h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 10px;letter-spacing:-.01em}
.sec ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.sec li{max-width:72ch}
.sec li::marker{color:var(--accent)}
.sec p{margin:0 0 8px;max-width:72ch}
.sub{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;list-style:none;margin-left:-1.1em}
.warn{background:var(--warn-bg);border-left:4px solid var(--warn-line);border-radius:8px;padding:10px 14px;margin:6px 0;list-style:none;margin-left:-1.1em;font-size:.95rem}
.warn b{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.vid{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-left:-15px;list-style:none;position:relative}
.vidnote{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:9px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.vidnote b{color:var(--ink)}
.vidbar{flex:none;width:3px;height:1.3em;border-radius:2px;background:var(--accent)}
.neu{background:color-mix(in srgb,var(--accent) 9%,var(--paper));border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin:6px 0;list-style:none;margin-left:-1.1em;font-size:.95rem}
.neu b{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px;color:var(--accent)}
.tbl{overflow-x:auto;margin:6px 0 4px;list-style:none;margin-left:-1.1em}
.tbl table{border-collapse:collapse;font-size:.88rem;min-width:520px;width:100%}
.tbl th{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;text-align:left;color:var(--muted);border-bottom:2px solid var(--ink);padding:6px 10px 6px 0}
.tbl td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;vertical-align:top}
.tbl td:first-child{font-weight:600}

/* Quiz */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.setup{display:grid;gap:20px;max-width:820px}
.setup h2,.stage h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em;margin:0;line-height:1.05}
.label{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.setup-foot{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.setup-foot .mono{color:var(--muted)}
.stage{max-width:820px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.tag.alt{border-color:var(--ink);color:var(--ink);background:var(--hl);color:var(--hl-ink)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.25;letter-spacing:-.01em;margin:4px 0 18px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px}
.opt .k{font-family:var(--mono);font-weight:600;font-size:.8rem;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:var(--paper)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);color:var(--paper)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.sel .k{background:var(--ink);color:var(--paper)}
.ms .opt .k{border-radius:4px;border:1.5px solid var(--line)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt.miss .k{background:var(--good-bg);color:var(--good)}
.opt .why{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.opt.miss .why{color:var(--good)}.opt.no .why{color:var(--bad)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{grid-template-columns:1fr;text-align:center;font-weight:600;font-size:1.05rem;padding:16px}
.gap{display:flex;gap:8px;flex-wrap:wrap}
.gap input{flex:1;min-width:200px;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.gap input.ok{border-color:var(--good);background:var(--good-bg)}
.gap input.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.btn.pin[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb strong{font-family:var(--display);font-size:1.15rem;display:block;margin-bottom:4px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb p{margin:4px 0 0;max-width:70ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.hint{color:var(--muted);font-size:.82rem}
.fhint{margin:8px 2px 0}
.fhelp{margin:6px 2px 0}
.fhelp summary{cursor:pointer;color:var(--accent);font-weight:600}
.fhelp ol{margin:8px 0 6px;padding-left:1.3em}
.fhelp li{margin:4px 0}
.fhelp b{color:var(--ink)}
.simcard{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px;border-left:4px solid var(--accent)}
.simcard h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:4px 0}
.simcard .hint{margin:0;max-width:60ch}
.simclock{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 8px;margin-left:auto}
.simclock.low{background:var(--bad)}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px}
.simgrid button{font-family:var(--mono);font-size:.8rem;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 0}
.simgrid button.done{background:var(--bg);border-color:var(--muted)}
.simgrid button.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.simreview{display:grid;gap:10px;margin-top:18px}
.simreview>div{border-left:4px solid var(--line);padding:6px 0 6px 12px;display:grid;gap:4px}
.simreview>div.ok{border-left-color:var(--good)}.simreview>div.no{border-left-color:var(--bad)}
.simreview .mono{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.simreview .ya{color:var(--bad)}.simreview .a{color:var(--good);font-weight:600}
.result-big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,5rem);line-height:1;letter-spacing:-.04em}
.wrong-list{display:grid;gap:8px;margin-top:16px}
.wrong-list div{border-top:1px solid var(--line);padding-top:8px}
.wrong-list .a{color:var(--good);font-weight:600}
/* Fragenkatalog */
.browse{display:grid;gap:16px;max-width:860px}
.browse .setup{max-width:none}
.bsearch{width:100%;font:inherit;font-size:.95rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.bsearch:focus{outline:none;border-color:var(--accent)}
.btoggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:.92rem}
.btoggle input{width:18px;height:18px;accent-color:var(--accent)}
.blist{display:grid;gap:10px}
.bhead{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin:14px 0 2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bhead .mono{color:var(--accent)}
.bhead small{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:400}
.bq{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.bq .qmeta{margin:0}
.bq .qtext{font-size:clamp(1.05rem,2.4vw,1.2rem);margin:0}
.bq .opt{padding:9px 12px;cursor:default}
.bq .opt:hover{border-color:var(--line)}
.bq .opt.ok:hover{border-color:var(--good)}
.bq .opt.ok .why{color:var(--good)}
.bq .tf{grid-template-columns:1fr 1fr}
.bq .tf .opt{padding:10px;font-size:.98rem}
.bsol{color:var(--good);font-weight:600;margin:0}
.bexp{color:var(--muted);font-size:.93rem;margin:0;max-width:72ch}
.bfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bfoot .btn{padding:7px 12px;font-size:.88rem}
.tag.unsure{border-color:var(--warn-line);background:var(--warn-bg);color:var(--ink)}
.tag.st{border-style:dashed}
.breveal{display:none}
.blist.hide .bq:not(.rev) .opt.ok{border-color:var(--line);background:var(--paper)}
.blist.hide .bq:not(.rev) .opt.ok .k{background:var(--bg);color:var(--muted)}
.blist.hide .bq:not(.rev) .why,.blist.hide .bq:not(.rev) .bsol,.blist.hide .bq:not(.rev) .bexp{display:none}
.blist.hide .bq:not(.rev) .breveal{display:inline-block}
.bempty{color:var(--muted);padding:12px 2px}


/* Karten */
.cards{max-width:760px}
.cardbox{perspective:1400px;margin:16px 0}
.flip{position:relative;width:100%;min-height:280px;border:0;background:none;padding:0;text-align:left}
.face{position:absolute;inset:0;border-radius:18px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1);border:1px solid var(--line)}
.front{background:var(--paper)}
.back{background:var(--ink);color:var(--bg);transform:rotateY(180deg)}
.flip.on .front{transform:rotateY(-180deg)}
.flip.on .back{transform:rotateY(0)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.face .def{font-size:1.08rem;line-height:1.5;max-width:60ch}
.face .mono{opacity:.7}
.cardnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion: reduce){.face,.bar i{transition:none}}

/* Fortschritt */
.prog{display:grid;gap:14px;max-width:860px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi b{font-family:var(--display);font-weight:800;font-size:2rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.85rem}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 160px 70px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow .mono{color:var(--muted)}
.prow .pct{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.stack{height:10px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.stack i{display:block;height:100%}
.stack .g{background:var(--good)} .stack .b{background:var(--bad)}
.weak{display:grid;gap:8px}
.weak div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem}
.weak .mono{color:var(--bad);margin-right:8px}

@media (max-width:820px){
  .learn{grid-template-columns:1fr}
  .search{flex:1 1 100%;margin-left:0}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail button{grid-template-columns:auto;white-space:nowrap;border:1px solid var(--line);background:var(--paper)}
  .rail button .t{display:none}
  .rail button[aria-current="true"]{box-shadow:none;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .rail button[aria-current="true"] .mono{color:inherit}
  .kpis{grid-template-columns:1fr 1fr}
  .prow{grid-template-columns:1fr 70px}
  .prow .stack{grid-column:1/-1;order:3}
  .sec{padding:16px}
}

/* Lern-Haustier */
[hidden]{display:none!important}
.topr{display:flex;align-items:center;gap:10px;flex:none}
header.top .brand{flex:1 1 380px;min-width:0}
.petav{width:60px;height:60px;border-radius:50%;border:0;padding:4px;background:conic-gradient(var(--accent) var(--p,0%),var(--line) 0);flex:none;transition:transform .2s}
.petav:hover{transform:rotate(-4deg) scale(1.05)}
.petav>span{display:block;width:100%;height:100%;border-radius:50%;background:var(--paper);overflow:hidden}
.petav svg{width:100%;height:100%;display:block}
.pet{display:block;overflow:visible}
.pet .pbody{transform-origin:100px 184px;animation:pbreath 3.4s ease-in-out infinite}
.pet .peyes{animation:pblink 5s infinite}
.pet .ptail{animation:pwag 1.8s ease-in-out infinite}
.pet .pears{animation:pear 4s ease-in-out infinite}
.pet .pflop{transform-origin:100px 60px;animation:pear 4.6s ease-in-out infinite}
.pet .pgill{transform-origin:100px 96px;animation:pgill 2.6s ease-in-out infinite}
.pet .ptear{animation:ptear 2.4s ease-in infinite}
.pet .pthink{animation:pthink 3s ease-in-out infinite}
.pet .pchew{animation:pchew .22s ease-in-out infinite alternate}
.pet.m-happy .ptail{animation-duration:.7s}
.pet.m-sad .pbody{animation-duration:6s}
.pet.m-sad .ptail{animation:none}
.pet.hop{animation:phop .6s cubic-bezier(.3,.7,.3,1)}
.pet.shake{transform-origin:50% 95%;animation:pshake .5s ease-in-out}
@keyframes pbreath{50%{transform:scale(1.018,.982)}}
@keyframes pblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pwag{50%{transform:rotate(9deg)}}
@keyframes pear{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
@keyframes pgill{50%{transform:scale(1.04,.97)}}
@keyframes ptear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes pthink{50%{transform:translateY(-4px)}}
@keyframes pchew{to{transform:scaleY(.45)}}
@keyframes phop{30%{transform:translateY(-14%) scale(1.03,.97)}60%{transform:translateY(0) scale(1.05,.93)}80%{transform:scale(.98,1.02)}}
@keyframes pshake{20%,60%{transform:rotate(-7deg)}40%,80%{transform:rotate(7deg)}}
/* im Quiz */
.stage.panel{position:relative}
.stage:has(.petmini) .actions{padding-right:100px}
.petmini{position:absolute;right:12px;bottom:10px;width:92px;height:92px;border:0;background:none;padding:0}
.petmini svg{width:100%;height:100%}
.pbub{position:absolute;bottom:calc(100% - 4px);right:6px;white-space:nowrap;background:var(--ink);color:var(--paper);font-weight:600;font-size:.82rem;padding:4px 10px;border-radius:12px 12px 2px 12px;animation:ppop .25s cubic-bezier(.3,1.5,.5,1)}
.pfood{position:absolute;left:-26px;top:10px;font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--accent);white-space:nowrap;pointer-events:none;animation:pfloat 1.3s ease-out forwards}
@keyframes ppop{from{transform:scale(.6);opacity:0}}
@keyframes pfloat{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
/* Toast */
.ptoast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:12px;max-width:min(460px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:8px 16px 8px 8px;box-shadow:0 14px 40px rgba(0,0,0,.18);font-size:.93rem;transform:translate(-50%,140%);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.ptoast.in{transform:translate(-50%,0)}
.pt-pet{width:52px;height:52px;flex:none;border-radius:50%;background:var(--bg);overflow:hidden;display:block}
.pt-pet svg{width:100%;height:100%}
/* Einladung */
.pinvite{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center;margin-bottom:16px;border-left:4px solid var(--hl)}
.pinvite h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:4px 0}
.pinvite .hint{margin:0;max-width:58ch}
.pinvite .actions{margin-top:10px}
.pinv-pets{display:flex}
.pinv-pets svg{width:76px;height:76px;margin-right:-14px}
.pinv-pets svg:nth-child(2){transform:translateY(-6px)}
/* Tab */
.pgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:stretch}
.pstage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative}
.pbanner{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 12px;border-radius:999px;transform:rotate(-2deg)}
.psay{position:relative;background:var(--bg);border-radius:16px;padding:10px 16px;max-width:36ch;font-weight:500;min-height:2.6em;display:grid;place-items:center}
.psay::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--bg);border-bottom:0}
.proom{position:relative;width:min(300px,78vw);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer}
.proom svg{width:100%;height:100%}
.pheart{position:absolute;top:18%;color:#FF6F8A;font-size:1.8rem;pointer-events:none;animation:pfloat 1.2s ease-out forwards}
.pname{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.pname h2{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.02em;margin:0 6px 0 0}
.tag.pm-happy{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.tag.pm-hungry{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink)}
.tag.pm-sad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pkpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;margin-top:4px}
.pk,.pring{background:var(--bg);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pk b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.pk span,.pring>span{color:var(--muted);font-size:.8rem}
.pring{position:relative}
.pring svg{width:64px;height:64px;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:9}
.pring .bg{stroke:var(--line)}
.pring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .5s}
.pring b{position:absolute;top:12px;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.pring b small{font-size:.7rem;color:var(--muted);font-weight:600}
.pcloset,.pmiles,.pset{display:grid;gap:14px}
.pitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pitem{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 6px 8px;font-size:.85rem;font-weight:600}
.pitem svg{width:84px;height:84px}

.pnone{width:84px;height:84px;display:grid;place-items:center;font-size:1.8rem;color:var(--muted)}
.pcols{display:flex;flex-wrap:wrap;gap:8px}
.pcols button{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid color-mix(in srgb,var(--ink) 25%,transparent);padding:0}

.pnext{margin:0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pnext>span:first-child{flex:1 1 100%}
.pml{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 14px}
.pml li{display:grid;grid-template-columns:22px 1fr;gap:0 6px;padding:5px 0;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.pml li.ok{color:var(--ink)}
.pml li>span{grid-row:span 2}
.pml small{grid-column:2;font-size:.76rem;color:var(--muted)}
.pfield{display:grid;gap:6px}
.pfield>span{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pfield input{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:320px}
.pfield input:focus{outline:none;border-color:var(--accent)}
.pstep{display:flex;align-items:center;gap:10px}
.pstep b{font-family:var(--display);font-weight:800;font-size:1.6rem;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.pstep .btn{padding:6px 14px;font-size:1.1rem}
.ppick{display:grid;gap:18px}
.ppick h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em;margin:4px 0;line-height:1.05}
.ppick .hint{margin:0;max-width:70ch}
.psp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:620px){.psp{grid-template-columns:repeat(3,minmax(0,1fr))}.psp button svg{width:80px;height:80px}}

/* ================== INHALT: Lernzettel ==================
   Strings: **Fachbegriff** = Textmarker, '§Zwischenüberschrift', {warn:'…'} = Achtung-Box,

   x:1 am Kapitel = Extra-Kapitel (Lernzettel + Quiz-Chip, aber nicht in „Alle“, Fortschritt-Summe und Simulation) */
const CH = [
{"id": 1, "s": "Einführung & Methoden", "t": "Einführung, Definition und Methoden der Biologischen Psychologie", "sec": [{"h": "Das Gehirn in Zahlen", "b": ["Das menschliche Gehirn ist ca. **16–17 cm** lang und wiegt rund **1,5 kg**; es enthält ca. **100 Milliarden Nervenzellen**. Es gibt Geschlechtsunterschiede in Größe und Gewicht.", "**„Bigger is better“?** Seit dem 19. Jh. (Broca, Galton) wird der Zusammenhang Gehirngröße – Intelligenz untersucht. Heutige Korrelationen sind nur mäßig: Schädelgröße r ≈ .20, intrakranielles Volumen r ≈ .40, Gesamthirnvolumen r ≈ .30–.40, graue Substanz r ≈ .31, weiße Substanz r ≈ .27 → Größe ist nur **zum Teil** wichtig.", "Was den Menschen besonders macht: nicht das größte Gehirn, aber die meisten **kortikalen Neurone** (kaum mehr als Wale/Elefanten). Entscheidend sind die starke **Myelinisierung** (schnelle Nervenleitung) und die **kleinen Abstände** zwischen Neuronen → hohe Verarbeitungskapazität.", "Beim Menschen ist weniger Kortex fest einer Funktion zugeordnet, dafür gibt es viel mehr **Assoziationskortex**.", "**Plastizität** = Fähigkeit des Gehirns, sich strukturell zu verändern, z. B. in Anpassung an neue Umweltbedingungen oder durch Lernen (Beispiel: Einradfahren lernen verändert graue und weiße Substanz). Beim Menschen besonders ausgeprägt."]}, {"h": "Was ist Biopsychologie?", "b": ["Die **Biologische Psychologie** erforscht Zusammenhänge zwischen biologischen Prozessen und Verhalten – betrachtet werden alle Organe des Körpers, nicht nur das Gehirn. Kurz: die Biologie des Verhaltens.", {"tbl": [["Teilbereich", "Worum es geht"], ["**Physiologische Psychologie**", "neuronale Mechanismen des Verhaltens durch **Manipulation des Nervensystems von Tieren** in kontrollierten Experimenten"], ["**Psychopharmakologie**", "Wirkung von Medikamenten und Drogen auf Gehirn und Verhalten"], ["**Neuropsychologie**", "psychische Folgen von **Hirnschädigungen bei Patient:innen**"], ["**Psychophysiologie**", "Zusammenhang physiologische Aktivität – psychische Prozesse am **Menschen**, mit **nichtinvasiven** Messungen"], ["**Kognitive Neurowissenschaft**", "neuronale Grundlagen der Kognition, vor allem mit **funktioneller Bildgebung**"], ["**Vergleichende Psychologie**", "Evolution, Genetik und Anpassungswert von Verhalten (vergleichende Methode)"]]}, {"warn": "Diese sechs Bereiche werden gern als MC abgefragt – Begriffe genau auseinanderhalten! Tierexperimente = Physiologische Psychologie; nichtinvasiv am Menschen = Psychophysiologie."}, "Verwandte Disziplinen der Neurowissenschaft: **Neuroanatomie** (Struktur), **Neurochemie** (chemische Grundlagen), **Neuroendokrinologie** (Nervensystem ↔ Hormonsystem), **Neuropathologie** (Störungen), **Neuropharmakologie** (Wirkung von Pharmaka/Drogen auf neuronale Aktivität), **Neurophysiologie** (Funktionen und Aktivität).", "§Wurzeln", "Früher galt das Herz als Zentrum. **Trepanation** (Schädelöffnung) zeigte die Bedeutung des Gehirns. **Phrenologie** (Gall) = Pseudowissenschaft: Schädelform verrate den Charakter. **Phineas Gage**: Persönlichkeitsveränderung nach Unfall → frühe Läsionsstudie. **Broca** → Sprachproduktion, **Wernicke** → Sprachverständnis. **Hans Berger** zeichnete in den 1920er-Jahren das erste EEG beim Menschen auf und beschrieb den Alpha-Rhythmus."]}, {"h": "Methoden: strukturell vs. funktionell", "b": [{"tbl": [["Methode", "Was wird gemessen?", "Art"], ["**MRT**", "Anatomie über Magnetfelder und Radiowellen (graue/weiße Substanz)", "strukturell"], ["**DTI**", "Faserbahnen der weißen Substanz über die Diffusion von Wasser", "strukturell"], ["**MRS**", "chemische Zusammensetzung / Stoffwechselprodukte im Gewebe", "biochemisch"], ["**fMRT**", "Aktivität indirekt über den Blutsauerstoff (**BOLD**) – task-based oder resting state", "funktionell"], ["**PET**", "Stoffwechsel (z. B. Glukoseverbrauch) mit radioaktiven Tracern", "funktionell"], ["**NIRS**", "Sauerstoffgehalt des Blutes über Infrarotlicht", "funktionell"], ["**EEG**", "elektrische Aktivität an der Kopfhaut (µV)", "funktionell"], ["**MEG**", "magnetische Felder der Hirnaktivität", "funktionell"], ["**TMS / tDCS / tACS**", "Stimulation: Magnetfeld / Gleichstrom / Wechselstrom", "Stimulation"]]}, "**BOLD** = „blood oxygenation level dependent“: Aktive Areale bekommen mehr sauerstoffreiches Blut; das Verhältnis von sauerstoffreichem zu -armem Hämoglobin ändert das Signal.", {"warn": "Elektrische Stimulation des Gehirns = **tDCS** (Gleichstrom) und **tACS** (Wechselstrom). DTI und fMRT stimulieren nicht! Funktionelle Aktivität zeigen z. B. EEG, fMRT (auch resting state) und tACS – DTI und strukturelles MRT nicht."}]}, {"h": "EEG und ERP", "b": ["Das **EEG** misst Spannungsschwankungen an der Kopfhaut im **Mikrovolt-Bereich**. Messbar wird es nur, wenn viele Neurone im Cortex **synchron** feuern.", {"fig": "eeg", "cap": "Je schneller die Welle, desto wacher bzw. aktiver."}, {"tbl": [["Rhythmus", "Frequenz", "typisch für"], ["Delta", "< 4 Hz", "Tiefschlaf"], ["Theta", "4–8 Hz", "Müdigkeit, Dösen"], ["Alpha", "8–13 Hz", "entspannt, Augen zu"], ["Beta", "13–30 Hz", "wach, konzentriert"], ["Gamma", "> 30 Hz", "intensive Verarbeitung"]]}, "Merkhilfe von langsam nach schnell: **D – T – A – B – G** (Delta, Theta, Alpha, Beta, Gamma). 1 Hz = 1 Schwingung pro Sekunde.", "**ERP** (ereigniskorreliertes Potenzial): Man mittelt das EEG über viele Wiederholungen desselben Reizes; Zufallsrauschen fällt heraus, die reizbezogene Antwort bleibt. ERP ist eine **Auswertung des EEG**, kein eigenes Messgerät."]}, {"h": "Psychophysiologische Maße", "b": [{"fig": "ekg", "cap": ""}, "**EKG** = elektrische Herzaktivität: **P-Welle** (Vorhoferregung), **QRS** (Erregungsausbreitung in den Kammern), **T-Welle** (Erregungsrückbildung). Anwendungen: Herzratenvariabilität, **Cardiac Defense Response** (Herzreaktion auf bedrohliche Reize).", "**EMG** = Muskelaktivität, besonders im **Gesicht** (Stirn, Augen, Mundwinkel) → Mimik, faziale Mimikry. **EOG** = Sonderform des EMG für die **Augenmuskeln** → Schlaf- und Traumforschung.", "§Herausforderungen der kognitiven Neurowissenschaft", "passende Experimente für das gemessene Konstrukt entwickeln; genug Durchgänge (Reliabilität) und Versuchspersonen; Ethik und Datenmanagement; Verhalten (Aufgabenleistung) mit Hirnaktivität verknüpfen."]}]},
{"id": 2, "s": "Bausteine des NS", "t": "Bausteine des Nervensystems", "sec": [{"h": "ZNS und PNS", "b": ["Das Nervensystem der Wirbeltiere hat zwei Teile: **ZNS** = Gehirn (Encephalon) + Rückenmark (Medulla spinalis); **PNS** = alles außerhalb, mit somatischem (sensorisch + motorisch) und **autonomem** (= viszeralem = vegetativem) Nervensystem.", "**Graue Substanz** = Ansammlung von Zellkörpern (frisch geschnitten grau). **Weiße Substanz** = Ansammlung myelinisierter Axone (weiß).", "**Afferenzen** führen Information **zum** ZNS hin, **Efferenzen** führen Befehle **vom** ZNS weg.", {"tbl": [["Richtung", "Bezeichnung", "Quelle / Ziel"], ["afferent", "somatisch", "Haut, Gelenke, Skelettmuskeln"], ["afferent", "viszeral", "Eingeweide"], ["efferent", "motorisch", "Skelettmuskeln"], ["efferent", "vegetativ", "glatte Muskeln, Drüsen, Herz"]]}, "Über die **Hinterwurzeln** treten sensorische (somato- und viszerosensorische) Afferenzen ins Rückenmark ein; über die **Vorderwurzeln** verlassen motorische und vegetative Efferenzen das Rückenmark."]}, {"h": "Histologie und Größen", "b": ["**Histologie** = mikroskopische Untersuchung von Gewebe. **Nissl-Färbung** färbt Zellkörper; **Golgi-Färbung** färbt die ganze Zellmembran (Soma, Axon, Dendriten).", {"tbl": [["Struktur", "Größe", "sichtbar mit"], ["Gehirn", "ca. 15 cm", "freiem Auge"], ["Großhirnrinde (Dicke)", "ca. 3 mm", "freiem Auge"], ["Neuron (Durchmesser)", "ca. 100 µm", "Lichtmikroskop"], ["Teile von Neuronen", "ca. 10 µm", "Lichtmikroskop"], ["Synapse", "ca. 1 µm", "Elektronenmikroskop"], ["synaptischer Spalt", "ca. 20 nm", "Elektronenmikroskop"], ["Membran (Dicke)", "ca. 5 nm", "Elektronenmikroskop"], ["Ionenkanal", "ca. 0,5 nm", "Elektronenmikroskop"]]}]}, {"h": "Das Neuron", "b": ["Das **Neuron** ist auf Empfang, Weiterleitung und Übertragung von Information spezialisiert. **Neuriten** = alle Fortsätze, die vom Soma ausgehen (Axone und Dendriten).", {"fig": "neuron", "cap": "Information fließt von den Dendriten über das Soma zum Axon und zu den Endknöpfchen."}, "**Soma** (Ø ≈ 20 µm) enthält die Organellen. **Zytoplasma** = kaliumreiche Flüssigkeit innerhalb der Membran samt Organellen, ohne Zellkern.", "**Zellkern**: enthält die Chromosomen mit der **DNA**. **Genexpression** = „Ablesen“ der DNA mit dem Ziel, Proteine herzustellen. Weil die DNA den Kern nicht verlässt, bringt **mRNA** die Bauanleitung ins Zytoplasma.", "**Raues ER**: Membranstapel, auf denen **Ribosomen** sitzen → Ort der **Proteinsynthese**. Glattes ER: ohne Ribosomen.", "**Golgi-Apparat**: Organell aus Membranen, das neue Proteine **sortiert und in Vesikel verpackt** – für andere Organellen oder zur Abgabe nach außen (Exozytose).", "**Mitochondrien**: „Kraftwerke“ – Ort der **Zellatmung**; nehmen Pyruvat und Sauerstoff auf und bilden **ATP**.", "**Axon** (Ø 1–25 µm, Länge < 1 mm bis > 1 m): beginnt am **Axonhügel**, kann sich in **Axonkollaterale** verzweigen und endet im **Axonterminal / Endknöpfchen** (= präsynaptischer Teil). Zwischen den Myelinabschnitten liegen die **Ranvier’schen Schnürringe**.", "**Dendriten** („Bäumchen“) sind die Antennen des Neurons; die Membran unter einer Synapse heißt postsynaptische Membran und trägt **Rezeptoren**.", "**Zellmembran** = Lipiddoppelschicht aus Phospholipiden (hydrophiler Kopf, hydrophobe Schwänze). Eingelagerte Proteine bilden Kanäle, transportieren Stoffe, wirken im Stoffwechsel mit und stabilisieren die Membran.", "§Synapsentypen", "**axodendritisch** (Axon an Dendrit), **axosomatisch** (Axon direkt am Zellkörper), **axoaxonisch** (Axon an Axon).", {"warn": "Rechtschreibung zählt: In der Prüfung stehen manchmal absichtlich falsch geschriebene Begriffe als Distraktor („Saltitorisch“, „Rainers Schnürring“)."}, "§Einteilung", {"fig": "neurontypen", "cap": ""}, "nach Zahl der Fortsätze: **unipolar, bipolar, multipolar**; nach Verknüpfung: **motorisches** Neuron, **sensorisches** Neuron, **Interneuron**."]}, {"h": "Gliazellen", "b": ["**Gliazellen** sind der zweite Zelltyp; sie nehmen etwa so viel Raum ein wie die Neurone, stützen und ernähren, bilden Myelin und Blut-Hirn-Schranke und modulieren die Erregung.", {"fig": "glia", "cap": ""}, "**Astrozyten**: häufigste Gliazellen; regulieren das chemische Milieu und legen ihre Endfüßchen um die Kapillaren → **Blut-Hirn-Schranke**.", "**Oligodendrozyten** bilden das **Myelin im ZNS**, **Schwann-Zellen** das **Myelin im PNS**.", "**Mikroglia** = Fresszellen (Phagozyten) des ZNS; räumen Reste abgestorbener Zellen weg.", {"warn": "Typische Falle: „Schwann-Zellen bilden Myelin im ZNS“ und „Oligodendrozyten im PNS“ sind beide **falsch** – genau umgekehrt."}]}, {"h": "Hirnhäute, Ventrikel und Blutversorgung", "b": ["Das ZNS wird von Knochen und drei **Hirnhäuten** (Meningen) geschützt – von außen nach innen: **Dura mater** („harte Mutter“, lederartig), **Arachnoidea** (spinnwebartig), **Pia mater** („freundliche“ / weiche Mutter).", {"fig": "meningen", "cap": "Merksatz von außen nach innen: D – A – P."}, "Im **Subarachnoidalraum** (unter der Arachnoidea) liegen große Blutgefäße und **Liquor** (Cerebrospinalflüssigkeit).", "**Interstitium** = schmaler, flüssigkeitsgefüllter Spaltraum zwischen Nerven- und Gliazellen. Wo er sich erweitert, entstehen die **Ventrikel** (2 Seitenventrikel, 3. und 4. Ventrikel); sie und der Zentralkanal enthalten **Liquor cerebrospinalis**.", "Blutversorgung über zwei Arteriensysteme: **innere Karotiden** → vorderer (**rostraler**) Teil, **Vertebralarterien** → hinterer (**kaudaler**) Teil.", "Neurone liegen nah an Kapillaren, aber ohne direkten Blutkontakt (dazwischen Kapillarwand, Blut-Hirn-Schranke, Interstitium). Mehr Aktivität → mehr Stoffwechsel → Gefäße weiten sich → mehr Durchblutung → das misst die **fMRT**."]}, {"h": "Hirnnerven", "b": ["Die **12 Hirnnerven** entspringen dem Gehirn bzw. Hirnstamm und versorgen Kopf, Hals sowie (über den Vagus) Brust- und Bauchorgane. Sie zählen zum **PNS** (genau genommen sind I und II Teile des ZNS).", {"tbl": [["Nr.", "Name", "Funktion"], ["I", "N. olfactorius", "Riechen"], ["II", "N. opticus", "Sehen (Netzhaut)"], ["III", "N. oculomotorius", "Augenmuskeln"], ["IV", "N. trochlearis", "Augenmuskel"], ["V", "N. trigeminus", "Gefühl im Gesicht, Kaumuskeln"], ["VI", "N. abducens", "Augenmuskel"], ["VII", "N. facialis", "Mimik, Tränen-/Speicheldrüsen, Geschmack"], ["VIII", "N. vestibulocochlearis", "Hören, Gleichgewicht"], ["IX", "N. glossopharyngeus", "Rachen, Geschmack, Speicheldrüse"], ["X", "**N. vagus**", "Eingeweide (Parasympathikus!), Rachen, Kehlkopf"], ["XI", "N. accessorius", "Hals-/Schultermuskeln"], ["XII", "N. hypoglossus", "Zungenmuskeln"]]}, "Der **N. vagus** ist der X. Hirnnerv, entspringt in der **Medulla**, versorgt Brust- und Bauchorgane und ist die wichtigste Quelle **parasympathischer** präganglionärer Fasern.", {"warn": "„Welcher ist **kein** Hirnnerv?“ – Nerven wie der N. ischiadicus (Ischiasnerv) sind Rückenmarksnerven, keine Hirnnerven."}]}]},
{"id": 3, "s": "Nervenleitung & Synapse", "t": "Nervenleitung und synaptische Übertragung", "sec": [{"h": "Ruhemembranpotenzial", "b": ["Im Inneren eines ruhenden Neurons ist die Spannung ca. **−70 mV** gegenüber außen (**Ruhemembranpotenzial**).", "Grund: ungleiche Ionenverteilung – **Na⁺ außen mehr**, **K⁺ innen mehr**. **Ionenkanäle** lassen jeweils bestimmte Ionen durch.", "Na⁺ wird nach innen gedrängt durch (1) die **elektrostatische Anziehung** (innen negativ) und (2) den **Konzentrationsgradienten** (Diffusion). Trotzdem strömt kaum Na⁺ ein, weil die **Na⁺-Kanäle in Ruhe geschlossen** sind. K⁺-Kanäle sind offen, aber das negative Innere hält die meisten K⁺ zurück.", "Kleine Lecks gleicht die **Natrium-Kalium-Pumpe** aus: Sie pumpt Na⁺ hinaus und K⁺ hinein, so schnell wie sie durchsickern → das Ruhepotenzial bleibt stabil."]}, {"h": "Postsynaptische Potenziale", "b": ["Neurotransmitter können die postsynaptische Membran **depolarisieren** (weniger negativ, z. B. **−70 → −67 mV**) oder **hyperpolarisieren** (negativer, z. B. **−70 → −72 mV**).", "Depolarisationen = **EPSP** (erregend, Feuern wahrscheinlicher), Hyperpolarisationen = **IPSP** (hemmend). Beide sind **abgestuft**: je stärker das Signal, desto größer.", "**Integration**: Am Axonhügel / Initialsegment wird summiert. **Räumliche Summation** = Signale von **verschiedenen Synapsen gleichzeitig**; **zeitliche Summation** = **schnell nacheinander** an derselben Synapse. Erreicht die Summe die **Schwelle (ca. −65 mV)**, entsteht ein Aktionspotenzial."]}, {"h": "Das Aktionspotenzial", "b": ["Ein **Aktionspotenzial** ist eine kurze (ca. 1 ms) Umkehr der Membranspannung von −70 auf ca. **+50 mV**. Es folgt dem **Alles-oder-Nichts-Prinzip** – seine Größe hängt nicht von der Reizstärke ab.", {"fig": "ap", "cap": ""}, "Ablauf: Schwelle erreicht → **Na⁺-Kanäle öffnen**, Na⁺ strömt ein (Depolarisation) → K⁺-Kanäle öffnen, K⁺ strömt aus → Na⁺-Kanäle schließen (Spitze vorbei) → **Repolarisation** durch K⁺-Ausstrom → kurze **Hyperpolarisation**, weil die K⁺-Kanäle verzögert schließen.", "Fortleitung: vom Soma zu den Endknöpfchen = **orthodrom**; umgekehrt = **antidrom**.", "Marklose Fasern leiten langsam durch lokale Ströme (ca. 2,5 m/s). In myelinisierten Fasern springt die Erregung von Schnürring zu Schnürring = **saltatorische Erregungsleitung** (bis ca. 120 m/s)."]}, {"h": "Synaptische Übertragung", "b": ["Fünf Aspekte: (1) Aufbau der Synapse, (2) Synthese, Verpackung, Transport der Transmitter, (3) Freisetzung, (4) Aktivierung von Rezeptoren, (5) Wiederaufnahme und Recycling.", {"fig": "synapse", "cap": ""}, "**Direkte Synapsen**: Freisetzungsort und Rezeptor liegen nah beisammen. **Indirekte Synapsen**: Transmitter wird in einiger Entfernung freigesetzt und diffundiert weiter.", "**Kleine (niedermolekulare)** Transmitter werden meist im Endknöpfchen hergestellt und verpackt. **Große** (Neuropeptide) entstehen an Ribosomen im Soma, werden im Golgi-Apparat verpackt und über **Mikrotubuli** zum Endknöpfchen transportiert.", "**Exozytose**: Ein Aktionspotenzial öffnet **spannungsgesteuerte Ca²⁺-Kanäle**; Ca²⁺ strömt ein, Vesikel verschmelzen mit der Membran und geben den Transmitter in den Spalt ab.", "**Ionotrope Rezeptoren** sind direkt an Ionenkanäle gekoppelt (ligandengesteuert) → sofortige Wirkung. **Metabotrope Rezeptoren** sind an **G-Proteine** gekoppelt (Second Messenger) → häufiger, **langsamer, länger anhaltend**, diffuser und vielfältiger.", "Beendet wird die Übertragung durch **Wiederaufnahme** (Reuptake, der Großteil) und **enzymatischen Abbau**; Bestandteile werden recycelt.", "**Gap Junctions** = **elektrische Synapsen**: enge Kontaktstellen, deren Proteinkanäle (Connexine) das Zytoplasma zweier Zellen verbinden → sehr **schnelle** Übertragung."]}, {"h": "Neurotransmitter", "b": [{"tbl": [["Klasse", "Beispiele"], ["Aminosäuren", "**Glutamat**, Aspartat, Glycin, **GABA**"], ["Monoamine – Catecholamine", "Dopamin, Noradrenalin, Adrenalin (aus **Tyrosin**)"], ["Monoamine – Indolamine", "**Serotonin** (5-HT, aus **Tryptophan**)"], ["eigene Klasse", "**Acetylcholin**"], ["unkonventionell", "lösliche Gase (NO, CO), Endocannabinoide (Anandamid)"], ["große Moleküle", "**Neuropeptide** (z. B. Opioid-Peptide)"]]}, "**Acetylcholin (ACh)**: Transmitter an der **neuromuskulären Synapse** (Nerv → Skelettmuskel), wichtig im **vegetativen** Nervensystem und für Schlaf; Abbau im Spalt durch **Acetylcholinesterase**; ACh-Neurone heißen **cholinerg**.", "**Glutamat** = häufigster **erregender**, **GABA** = häufigster **hemmender** Transmitter im ZNS (GABA entsteht aus Glutamat).", "**Chorea Huntington**: **genetisch** bedingt; Untergang **GABAerger Neurone in den Basalganglien** (v. a. Nucleus caudatus) → unwillkürliche Zuckungen, Depression, intellektueller Abbau.", "**Serotonin**: Schlaf, Stimmung (Depression), Nahrungsaufnahme/Essstörungen.", "**Noradrenerges System**: kleine Neuronengruppe im **Locus coeruleus**, projiziert ins Rückenmark, Kleinhirn, Thalamus und Großhirnrinde → Aufmerksamkeit, Wachheit, Schlaf-Wach-Rhythmus, Lernen, Angst, Schmerz, Stimmung.", "**Dopaminerges System**: **Substantia nigra** und **Area tegmentalis ventralis (VTA)** im Mittelhirn → zum Striatum (Nucleus caudatus + Putamen) und zu limbischen/frontalen Arealen. Serotonerg wären dagegen die **Raphe-Kerne**."]}, {"h": "Störungen und Drogen", "b": ["**Morbus Parkinson** (ca. 1 % über 60): **Bradykinese** (Verlangsamung), **Akinese** (Startschwierigkeit), **Rigor** (Muskelsteife), **Tremor**; später kognitive Defizite. Ursache: Untergang **dopaminerger Neurone in der Substantia nigra** (nigrostriatale Bahn). Therapie: Vorstufe **L-Dopa**.", "**Schizophrenie** (ca. 1 %): Realitätsverlust, Denk-, Wahrnehmungs-, Stimmungs- und Bewegungsstörungen. **Dopamin-Hypothese**: psychotische Episoden durch **zu viel Dopaminaktivität an D2-Rezeptoren** – Amphetamine lösen psychoseähnliche Zustände aus, Antipsychotika blockieren Dopaminrezeptoren.", "**Monoamin-Hypothese der Depression**: Antidepressiva wirken an serotonergen bzw. noradrenergen Synapsen → Depression könnte auf Problemen dieser Systeme beruhen.", "**Sieben Schritte** der Transmitterwirkung (an jedem können Drogen ansetzen): Synthese → Speicherung in Vesikeln → Abbau überschüssiger Moleküle → Freisetzung (Exozytose) → Bindung an Rezeptoren → Beendigung durch Wiederaufnahme oder Abbau → Rückmeldung über Autorezeptoren.", "**Agonisten** verstärken oder imitieren einen Transmitter, **Antagonisten** schwächen oder blockieren ihn.", "**Benzodiazepine** (z. B. Diazepam/Valium) wirken angstlösend, weil sie die Wirkung von **GABA verstärken** (agonistisch). Zu viel Hemmung → Koma, zu wenig → Krämpfe.", "**Kokain und Amphetamin**: ZNS-Stimulanzien an **dopaminergen und noradrenergen** Synapsen, **hemmen die Wiederaufnahme der Catecholamine** → Wachheit, Euphorie, Selbstwertgefühl, weniger Hunger, höherer Puls und Blutdruck, weite Pupillen.", "**LSD** ist ein Halluzinogen; seine Struktur ähnelt **Serotonin** → wirkt am serotonergen System (traumähnlich, Vermischung von Sinneseindrücken)."]}]},
{"id": 4, "s": "Funktionelle Anatomie ZNS", "t": "Funktionelle Anatomie des Nervensystems (ZNS)", "sec": [{"h": "Richtungen und Schnittebenen", "b": [{"fig": "achsen", "cap": ""}, "Das Nervensystem der Wirbeltiere hat **drei Achsen**: anterior–posterior (auch rostral/cranial – caudal), **dorsal–ventral** (Rücken bzw. Kopfoberseite – Bauch bzw. Kopfunterseite) und **medial–lateral** (zur Mitte – zur Seite).", {"fig": "ebenen", "cap": ""}, "Schnittebenen: **Horizontal-**, **Frontal-** (= Koronar-) und **Sagittalschnitt**. Ein Schnitt genau zwischen den Hemisphären = **Mediansagittalschnitt**; rechtwinklig durch eine lange Struktur (Rückenmark, Nerv) = **Querschnitt**."]}, {"h": "Wichtige Begriffe", "b": [{"tbl": [["Begriff", "Bedeutung"], ["Cortex", "Zellschicht an der Oberfläche (z. B. Großhirnrinde)"], ["Nucleus", "„Kern“: abgegrenzte Zellkörpergruppe tief im ZNS"], ["Substantia", "funktionell zusammengehörige Zellgruppe"], ["Locus", "kleine, genau umrissene Zellgruppe"], ["Ganglion", "Zellkörperansammlung im **PNS**"], ["Nerv", "Axonbündel im **PNS** (Ausnahme: Sehnerv)"], ["Trakt", "Axonbündel im ZNS mit gemeinsamem Ursprung/Ziel"], ["Bündel", "gemeinsam laufende Axone, nicht unbedingt gleicher Ursprung"], ["Kapsel", "Faserbahn zwischen Großhirn und Hirnstamm"], ["**Kommissur**", "verbindet **rechte und linke** Hirnhälfte (größte: **Corpus callosum** = Balken)"], ["Lemniscus", "Schleifenbahn, die wie ein Band durchs Gehirn zieht"]]}]}, {"h": "Rückenmark", "b": [{"fig": "rueckenmark", "cap": "Weiße Substanz außen, schmetterlingsförmige graue Substanz innen."}, "Sensorische Information tritt über die **Hinterwurzel** ein; die Zellkörper dieser Neurone liegen im **Spinalganglion**. Motorische (und vegetative) Signale verlassen das Rückenmark über die **Vorderwurzel**; ihr Ursprung liegt im **Vorderhorn**.", "Graue Substanz: **Hinterhorn** (sensorisch), **Vorderhorn** (motorisch), **Seitenhorn** (vegetativ, v. a. präganglionär-sympathisch im Brust- und Lendenmark). Weiße Substanz: Hinter-, Seiten-, Vorderstrang. Im Zentrum der **Zentralkanal** mit Liquor.", "§Wichtige Bahnen", "**Hinterstrangbahn** (dorsal, weiße Substanz): **Berührung und Vibration** → bewusste Tastwahrnehmung; kreuzt erst in der Medulla auf die Gegenseite. **Vorderseitenstrangbahn**: **Schmerz und Temperatur**. Beide sind **aufsteigend sensorisch**.", "**Pyramidenbahn** (= **Tractus corticospinalis**): absteigend, für **willkürliche Bewegungen**."]}, {"h": "Großhirn (Telencephalon)", "b": [{"fig": "lappen", "cap": ""}, "Die Oberfläche ist gefaltet: Windungen = **Gyri**, Furchen = **Sulci**, besonders tiefe Furchen = **Fissuren**. Wichtig: **Sulcus centralis** (zwischen Frontal- und Parietallappen), **Fissura Sylvii** (seitlich, über dem Temporallappen), Fissura longitudinalis (trennt die Hemisphären).", "Vier Lappen: **Frontal-, Parietal-, Temporal- und Okzipitallappen**. Zieht man die Sylvische Furche auseinander, sieht man die versteckte **Insula** (Insel) zwischen Frontal- und Temporallappen.", {"fig": "areale", "cap": ""}, "**Gyrus praecentralis** = primär **motorischer** Cortex; **Gyrus postcentralis** = primär **somatosensorischer** Cortex mit dem **Homunculus** (Lippen und Finger nehmen viel Fläche ein). Primär visuell = Okzipitallappen, primär auditorisch = Temporallappen.", "**Primäre** Areale reagieren nur auf **eine Modalität**. **Assoziationsareale** (z. B. **präfrontaler** und **posteriorer parietaler** Cortex, inferotemporal) integrieren mehrere Modalitäten. Die Areale wurden ursprünglich von **Brodmann** eingeteilt (Brodmann-Areale).", "Bauprinzip der Rinde: geschichtet; ca. **80 % Pyramidenzellen** (daneben Sternzellen); spezifische Afferenzen enden v. a. in **Schicht IV**, die äußerste Schicht I liegt unter der Pia mater.", {"warn": "**Broca** (Frontallappen) = Sprach**produktion**, **Wernicke** (Temporallappen) = Sprach**verständnis**."}]}, {"h": "Basalganglien und limbisches System", "b": ["Die **Basalganglien** bestehen aus **Nucleus caudatus, Putamen, Pallidum** (Globus pallidus) und **Nucleus subthalamicus**; oft wird die **Substantia nigra** dazugezählt. Caudatus + Putamen = **Striatum** (Eingangsstation).", "Aufgaben: Festlegen von **Bewegungsparametern** (Richtung, Kraft, Tempo), Kontrolle laufender Bewegungen, Auswahl einer Bewegung bei Hemmung anderer (motorische Aufmerksamkeit); auch kognitive und emotionale Funktionen.", "Das **limbische System** im engeren Sinn: **Amygdala**, **Hippocampus**, **Gyrus cinguli** und ihre Verbindungen; im weiteren Sinn auch Teile von Thalamus, Hypothalamus und Cortex → emotionale und kognitive Funktionen, Lernen und Gedächtnis. Ob es ein einheitliches „Emotionssystem“ ist, wird heute bezweifelt."]}, {"h": "Zwischenhirn, Mittelhirn, Hinterhirn", "b": [{"fig": "sagittal", "cap": ""}, "Das **Diencephalon** besteht aus **Thalamus** und **Hypothalamus**.", "**Thalamus** = „**Tor zum Cortex**“: Hier werden alle sensorischen und motorischen Ein- und Ausgänge umgeschaltet. Wichtige Kerne: **Pulvinar** (Aufmerksamkeit, Assoziationscortex), **Corpus geniculatum laterale** (→ Sehrinde), **Corpus geniculatum mediale** (→ Hörrinde).", "**Hypothalamus** (unter dem vorderen Thalamus): verbindet Nerven-, Hormon- und vegetatives System; steuert **Homöostase**, Essen, Schlaf, Sexualität und über die **Hypophyse** den Hormonhaushalt. Schon winzige Läsionen können lebensgefährlich sein.", "Faserverbindungen des Hypothalamus: **Fornix** (Hippocampus → über die Corpora mamillaria zum Hypothalamus), **Stria terminalis** (Amygdala → Hypothalamus), mediales Vorderhirnbündel.", "Im **Chiasma opticum** kreuzen Sehnervenfasern so, dass die **linke Gesichtsfeldhälfte von der rechten Hirnhälfte** verarbeitet wird (und umgekehrt).", "**Mittelhirn (Mesencephalon)**: **Tectum** (Dach) mit **Colliculi superiores** (visuell-motorisch) und **Colliculi inferiores** (auditiv); **Tegmentum** mit periaquäduktalem Grau, **Substantia nigra** und **Nucleus ruber** („roter Kern“).", "**Metencephalon** = **Pons** (Brücke) + **Cerebellum** (Kleinhirn: Feinabstimmung von Bewegungen, auch kognitive Funktionen). **Myelencephalon** = **Medulla oblongata**. Die **Formatio reticularis** (netzartig, durchzieht den Hirnstamm) steuert Wachheit (Arousal), Schlaf, Aufmerksamkeit, Muskeltonus sowie Herz-, Kreislauf- und Atemreflexe."]}]},
{"id": 5, "s": "Peripheres NS", "t": "Das periphere Nervensystem (PNS)", "sec": [{"h": "Somatisches und autonomes Nervensystem", "b": ["Das PNS gliedert sich in das **somatische** Nervensystem (sensorisch + motorisch) und das **autonome** (= viszerale = vegetative) Nervensystem.", "**Somatisch**: innerviert Haut, Gelenke und Skelettmuskeln → bewusste Wahrnehmung und **willkürliche** Bewegung.", "**Autonom (ANS)**: reguliert die inneren Organe, also glatte Muskulatur, Herzmuskel und Drüsen → meist **unwillkürlich**: Atmung, Kreislauf, Verdauung, Stoffwechsel, Drüsensekretion, Temperatur, Fortpflanzung.", "Das ANS hat **drei Teilsysteme**: **Sympathikus**, **Parasympathikus** und **Darmnervensystem** (enterisches NS)."]}, {"h": "Sympathikus und Parasympathikus", "b": [{"fig": "ans", "cap": ""}, "Beide sind als **Zwei-Neuronen-Kette** gebaut: Das **präganglionäre** Neuron liegt im Hirnstamm oder Rückenmark und zieht zu einem Ganglion; dort beginnt das **postganglionäre** Neuron, das zum Erfolgsorgan zieht.", "Lage der präganglionären Neurone: **Sympathikus → Brustmark und oberes Lendenmark** (Axone verlassen das Rückenmark über die Vorderwurzeln zu den Grenzstrang-Ganglien). **Parasympathikus → Hirnstamm und Kreuzmark** (sakral).", "Der **Sympathikus** wirkt **ergotrop**: macht leistungsbereit – Herz, Kreislauf, Atmung werden aktiviert, Glykogen wird mobilisiert, **Verdauung gehemmt**. Gefäße, Schweißdrüsen und Nebennieren werden nur vom Sympathikus versorgt.", "Der **Parasympathikus** wirkt **trophotrop**: Erholung und Aufbau – senkt den Herzschlag, fördert die Verdauung.", "Viele Organe werden von beiden versorgt und meist **gegensätzlich** (antagonistisch) beeinflusst; im Alltag arbeiten sie aber koordiniert (**funktioneller Synergismus**).", {"warn": "„Setzt Adrenalin und Noradrenalin frei“ erledigt eigentlich das **Nebennierenmark** – das aber vom Sympathikus aktiviert wird."}]}, {"h": "Darmnervensystem, Nebennierenmark, Muskeln, Transmitter", "b": ["Das **Darmnervensystem** liegt in den Wänden von Speiseröhre, Magen, Darm, Bauchspeicheldrüse und Gallenblase, mit zwei Geflechten: **Plexus myentericus** (Auerbach) und **Plexus submucosus** (Meissner).", "Das **Nebennierenmark** (innerer Teil der Nebenniere) besteht aus umgewandelten **postganglionären sympathischen** Zellen. Bei Belastung schüttet es ca. **80 % Adrenalin und 20 % Noradrenalin** ins Blut aus.", "**Glatte Muskulatur** (Eingeweide, Gefäße) ist **nicht willkürlich** steuerbar (vegetativ), **quergestreifte** Skelettmuskulatur dagegen **willkürlich** direkt aus dem ZNS.", "**Transmitter im ANS**: **Acetylcholin** an allen **präganglionären** Fasern (Sympathikus und Parasympathikus) und an den **postganglionären parasympathischen**; **Noradrenalin** an den meisten **postganglionären sympathischen** Fasern.", "§Somatosensorik", "Die geordnete Abbildung der Körperoberfläche auf der Hirnrinde heißt **Somatotopie**; die Karte auf dem Gyrus postcentralis ist der **Homunculus** – viel benutzte Regionen wie Mund und Fingerspitzen sind übergroß."]}]},
{"id": 6, "s": "Endokrine Systeme", "t": "Endokrine Systeme (Hormone)", "sec": [{"h": "Drüsen und Hormonwirkung", "b": ["Nervensystem und Hormonsystem tauschen Informationen zwischen Organen aus und sind eng verknüpft. **Drüsenzellen** bilden Hormone.", "**Endokrine Drüsen** haben **keinen Ausführungsgang** – Hormone gehen direkt ins Blut (z. B. Schilddrüse, Hypophyse). **Exokrine Drüsen** geben ihr Sekret über einen **Ausführungsgang** ab (Speichel-, Tränendrüsen).", "Die meisten Hormone werden **granulär** in Vesikeln gespeichert und durch **Exozytose** freigesetzt (wie Transmitter). Steroid- und Schilddrüsenhormone werden **nicht granulär** gespeichert.", "**Klassische (endokrine) Wirkung**: über das Blut im ganzen Körper verteilt, Wirkung nur an den Zielorten; Bildungs- und Wirkort weit entfernt. **Parakrin** = Wirkung auf **benachbarte** Zellen. **Autokrin** = Wirkung auf die **eigene** Zelle.", "**Neurohormonwirkung**: Nervenzellen übertragen über Transmitter auf Nerven-, Muskel- oder Drüsenzellen – ähnlich parakrin, aber schneller und gezielter; manche neuronalen Peptide gelangen auch ins Blut.", "§Chemische Klassen", "(1) **Fettunlösliche Hormone aus Aminosäuren** (Peptide/Proteine, die Mehrheit): kommen nicht durch die Membran → **Rezeptoren an der Zelloberfläche**. (2) **Lipophile (fettlösliche) Hormone**, z. B. Steroide: diffundieren durch die Membran → Rezeptoren **im Zytoplasma**. (3) **Hormone aus Tyrosin** (Catecholamine, Schilddrüsenhormone): binden an Rezeptoren **im Zellkern**."]}, {"h": "Endokrine Drüsen im Überblick", "b": [{"fig": "druesen", "cap": ""}, "**Epiphyse** (Zirbeldrüse, erbsengroß, über dem Tectum) bildet **Melatonin** (aus Tryptophan) – nur bei **Dunkelheit**, Tageslicht hemmt es → wichtig für das Ein- und Durchschlafen (zirkadianer Rhythmus).", "**Pankreas**: Die **Langerhans-Inseln** enthalten **A-Zellen → Glukagon**, **B-Zellen → Insulin**, **D-Zellen → Somatostatin**. Insulinmangel → zu hoher Blutzucker (**Diabetes mellitus**)."]}, {"h": "Hypothalamus und Hypophyse", "b": [{"fig": "hypophyse", "cap": ""}, "Die **Hypophyse** (Hirnanhangdrüse) ist die Schnittstelle, über die der Hypothalamus mit dem Körper kommuniziert. Zwei Teile: **Vorderlappen = Adenohypophyse** (echte Drüse) und **Hinterlappen = Neurohypophyse** (Teil des Gehirns). Beide werden unterschiedlich vom Hypothalamus gesteuert.", "**Magnozelluläre** neurosekretorische Zellen des Hypothalamus schicken ihre Axone bis in den **Hinterlappen** und geben dort **Oxytocin** und **Adiuretin** direkt ins Blut ab (Neurohormone).", "**Oxytocin** („Bindungshormon“): kleines Peptid; steigt bei Sex und Zärtlichkeit, fördert soziale Bindung; Menschen mit Oxytocin-Gabe **und** guten Beziehungen reagierten in Studien am stressresistentesten. Dass „mehr Oxytocin“ Paarbeziehungen verbessert, ist **nicht** nachgewiesen.", "**Adiuretin** (ADH, Vasopressin): Peptid aus 9 Aminosäuren; **hemmt die Wasserausscheidung** der Niere, reguliert Blutvolumen und Osmolarität.", "**Parvozelluläre** Zellen (periventrikulär) steuern den **Vorderlappen** über das Blut: Sie geben hypophyseotrope (Releasing-)Hormone in den **Pfortaderkreislauf** am Hypophysenstiel ab.", "**Hypophysenvorderlappen** = „Hauptdrüse“: Seine Hormone steuern **Keimdrüsen, Schilddrüse, Nebennieren und Brustdrüsen** (TSH, ACTH, LH, FSH, Prolaktin, Wachstumshormon). Weil er selbst vom Hypothalamus gesteuert wird, gilt eigentlich der Hypothalamus als eigentliche Hauptdrüse.", {"warn": "Oxytocin und ADH werden im Hypothalamus **gebildet**, aber im **Hinterlappen** gespeichert und **freigesetzt**. TSH, ACTH, LH und FSH kommen aus dem **Vorderlappen**."}]}, {"h": "Schilddrüse", "b": ["Die **Schilddrüse** bildet **Kalzitonin** (Kalziumstoffwechsel) sowie **Trijodthyronin (T3)** und **Thyroxin (T4)** – die eigentlichen Schilddrüsenhormone; Baustein ist **Jod**. T3/T4 steuern Energiestoffwechsel (Blutdruck, Temperatur, Puls) und Wachstum.", {"fig": "regelkreise", "cap": "Negative Rückkopplung: viel Endhormon bremst die übergeordneten Stufen."}, "**Regelkreis**: Hypothalamus → **TRH** (Thyreotropin-Releasing-Hormon) → Hypophysenvorderlappen → **TSH** (Thyreotropin) → Schilddrüse → **T3/T4**. Viel T3/T4 hemmt Hypothalamus und Hypophyse (**negative Rückkopplung**) → TSH sinkt; wenig T3/T4 → TSH steigt.", "**Hypothyreose** (Unterfunktion, z. B. Jodmangel → Kropf, verlangsamter Stoffwechsel) vs. **Morbus Basedow** (Überfunktion, gesteigerter Stoffwechsel)."]}, {"h": "Sexualhormone", "b": ["**Eierstöcke** und **Hoden** bilden Sexualhormone; diese sind **Steroidhormone** (aus Cholesterin) und steuern Fortpflanzungsorgane und Sexualverhalten.", "Männer haben mehr **Androgene** (Testosteron; bei Frauen kaum 10 % davon), Frauen mehr **Östrogene** (Östradiol) und **Gestagene** (Progesteron). Östradiol entsteht aus Testosteron mithilfe des Enzyms **Aromatase**.", "Der Hypophysenvorderlappen bildet die **Gonadotropine** **LH** (luteinisierendes Hormon) und **FSH** (follikelstimulierendes Hormon). **FSH** fördert die **Follikelreifung** in den Eierstöcken und die **Spermienreifung**; LH löst u. a. den Eisprung aus und regt die Testosteronbildung an.", "**GnRH** (Gonadotropin-Releasing-Hormon, Gonadoliberin, auch LHRH) aus dem Hypothalamus setzt **LH und FSH** aus dem Vorderlappen frei – LH steigt dabei stärker."]}]},
{"id": 7, "s": "Immunsystem & Stress", "t": "Psychoneuroimmunologie und Stress", "sec": [{"h": "Stress", "b": ["**Cannon** prägte den Begriff **Homöostase**; **Selye** entwickelte den Stressbegriff: Stress = **unspezifische Antwort** des Organismus auf eine Störung des Gleichgewichts und Versuch, es wiederherzustellen (**allgemeines Adaptationssyndrom**).", "Kurzfristig hilft die Stressreaktion (Energie wird mobilisiert), langfristig wird sie schädlich (z. B. vergrößerte Nebennieren).", "Zwei Stresssysteme: **Hypophysenvorderlappen-Nebennierenrinden-System** (CRH → ACTH → **Cortisol**, ein Glucocorticoid) und **Sympathikus-Nebennierenmark-System** (**Adrenalin, Noradrenalin**).", {"warn": "Cortisol kommt aus der **Nebennierenrinde**, Adrenalin aus dem **Nebennierenmark**. Endprodukt der klassischen Stressachse = **Cortisol**."}, "Wie stark Stress wirkt, hängt u. a. ab von der objektiven und subjektiven Intensität, Bewältigungsmöglichkeiten (**Coping**), Vorerfahrung, Dauer und Häufigkeit, Persönlichkeit, Ausgangszustand, **sozialer Unterstützung** und Bewegung.", "Stressoren erhöhen auch die **Zytokine** im Blut. Zytokine sind Peptid-Botenstoffe, die Entzündung und Fieber auslösen; dazu zählen **Interferone, Interleukine, Tumor-Nekrose-Faktor und Monokine**. Mit den Nebennierenhormonen gelten sie als wichtigste Stresshormone."]}, {"h": "Organe und Zellen des Immunsystems", "b": ["**Psychoneuroimmunologie** = Wissenschaft von den Wechselwirkungen zwischen Verhalten, Nervensystem und Immunsystem.", {"fig": "immunorgane", "cap": ""}, "**Primäre lymphatische Organe** = Produktions- und Reifungsorte: **Knochenmark** (B-Lymphozyten, von „bone marrow“) und **Thymus** (T-Lymphozyten).", "**Sekundäre lymphatische Organe** = Reaktionsorte: **Lymphknoten** (Filterstationen, in denen Antigene auf Immunzellen treffen) und **Milz** (Wächter für Erreger im Blut). Das Lymphgefäßsystem sammelt Gewebeflüssigkeit und führt sie über die Lymphknoten ins Venenblut zurück.", "Lymphozyten: **B-Zellen**, **T-Zellen** und **NK-Zellen** (natürliche Killer: erkennen infizierte oder Tumorzellen und lösen dort den Zelltod aus)."]}, {"h": "Vier Verteidigungslinien", "b": ["(1) **Immunsystem des Verhaltens** (Kranke meiden), (2) **Oberflächenbarrieren** (v. a. Haut; Husten, Niesen, Tränen, Schleim), (3) **angeborenes** und (4) **adaptives (erworbenes)** Immunsystem. Nur 3 und 4 bilden zusammen das eigentliche **Immunsystem**.", "**Angeboren**: reagiert zuerst, **schnell** und **unspezifisch**, meist nahe der Eintrittspforte; typische erste Reaktion ist die **Entzündung**. Zytokine locken **Monozyten, Makrophagen, Granulozyten** und andere Fresszellen (Phagozyten) an; im ZNS übernehmen das die **Mikroglia**.", {"tbl": [["adaptives Immunsystem …", ""], ["entstand später", "erst bei frühen Wirbeltieren"], ["ist **langsamer**", "braucht länger bis zur vollen Antwort"], ["ist **spezifisch**", "reagiert auf bestimmte Antigene"], ["hat ein **Gedächtnis**", "reagiert beim zweiten Kontakt schneller (Prinzip der Impfung)"]]}, "**Zellvermittelte** Immunität = **T-Zellen** (T-Killerzellen zerstören befallene Zellen, T-Helferzellen unterstützen). T-Zellen erkennen Antigene nur, wenn andere Leukozyten sie „vorverdaut“ und präsentiert haben.", "**Antikörpervermittelte (humorale)** Immunität = **B-Zellen**: Eine B-Zelle bindet ein passendes Antigen, vermehrt sich und bildet **Antikörper**; dazu entstehen langlebige **B-Gedächtniszellen**. Eine **Schutzimpfung** nutzt dieses Gedächtnis (Immunisierung).", "**Antigen** = Stoff, den das Immunsystem als „fremd“ erkennt (Eindringling oder körpereigene Tumorzelle)."]}, {"h": "Stress und Immunfunktion", "b": ["Metaanalyse von **Segerstrom & Miller (2004)**, ca. 300 Studien: **akuter** (kurzer) Stress, z. B. Referat oder Wettkampf, **verbessert** die Immunfunktion – vor allem das **angeborene** System. **Chronischer** Stress, z. B. Pflege von Angehörigen oder Arbeitslosigkeit, schadet dem **adaptiven** System.", "**Eustress** = Stress, der Gesundheit und Funktion fördert; **Distress** = Stress, der beeinträchtigt.", "Wege der Beeinflussung: T- und B-Zellen besitzen **Glucocorticoid-Rezeptoren**, Lymphozyten auch Rezeptoren für Adrenalin und Noradrenalin; Immunzellen bilden Neuropeptide, das Nervensystem bildet Zytokine; Stress verändert Verhalten (Schlaf, Ernährung …).", "Ob Stress anfälliger für **Infektionen** macht, ist beim Menschen kausal schwer zu zeigen (nur **korrelative** Studien möglich). Gründe, warum weniger Immunfunktion nicht automatisch mehr Infekte bedeutet: Redundanz des Immunsystems, zu kurze Effekte, Kompensation. Insgesamt sprechen die Befunde aber deutlich für einen Zusammenhang.", "Langfristiger Stress ohne Bewältigung stört die Homöostase (**Allostase**, allostatische Belastung); **aktive Bewältigung** reduziert die Stressantwort.", "§Serotonin, Nahrung und Stimmung", "Serotonin entsteht aus **Tryptophan** (Getreide, Fleisch, Milch). **Kohlenhydrate** erhöhen Tryptophan im Blut und Serotonin im Gehirn → stimmungshebend, besonders unter Stress (Erklärung für Stress-Essen). Gestörte Serotoninregulation trägt vermutlich zu **Essstörungen** bei; bei Bulimie helfen serotoninsteigernde Antidepressiva (z. B. Fluoxetin)."]}]}
];

[5, "Ergotrop", "Sympathikus: **leistungsbereit** – Herz, Kreislauf, Atmung hoch, Verdauung gehemmt."],
[5, "Trophotrop", "Parasympathikus: **Erholung**, Verdauung, Herz langsamer."],
[5, "Darmnervensystem", "In der Darmwand; Plexus myentericus (Auerbach) und Plexus submucosus (Meissner)."],
[5, "Nebennierenmark", "Umgewandelte postganglionäre sympathische Zellen; schüttet **80 % Adrenalin, 20 % Noradrenalin** aus."],
[5, "Transmitter im ANS", "ACh: alle präganglionären + parasympathisch postganglionär; **Noradrenalin**: sympathisch postganglionär."],
[5, "Homunculus", "Somatotope Karte auf dem Gyrus postcentralis; Mund und Finger übergroß."],
[6, "Endokrin / exokrin", "Endokrin: **ohne Ausführungsgang** ins Blut; exokrin: mit Ausführungsgang (z. B. Speicheldrüse)."],
[6, "Parakrin / autokrin", "Parakrin: Wirkung auf **Nachbarzellen**; autokrin: auf die **eigene** Zelle."],
[6, "Hormonklassen", "Peptide (Rezeptor an der Membran), lipophile/Steroide (Zytoplasma), Tyrosin-Hormone (Zellkern)."],
[6, "Melatonin", "Aus der **Epiphyse**, nur bei Dunkelheit → Schlaf-Wach-Rhythmus."],
[6, "Langerhans-Inseln", "A-Zellen: Glukagon, **B-Zellen: Insulin**, D-Zellen: Somatostatin."],
[6, "Adenohypophyse", "= **Hypophysenvorderlappen**, echte Drüse (TSH, ACTH, LH, FSH, Prolaktin, Wachstumshormon)."],
[6, "Neurohypophyse", "= **Hypophysenhinterlappen**, Teil des Gehirns; setzt Oxytocin und ADH frei."],
[6, "Magnozelluläre Zellen", "Hypothalamus-Neurone, deren Axone in den Hinterlappen ziehen → **Oxytocin, Adiuretin**."],
[6, "Parvozelluläre Zellen", "Geben Releasing-Hormone in den **Pfortaderkreislauf** → steuern den Vorderlappen."],
[6, "Oxytocin", "Kleines Peptid, Bindungshormon; aus dem Hinterlappen freigesetzt."],
[6, "Adiuretin (ADH)", "Vasopressin: **hemmt die Wasserausscheidung** der Niere."],
[6, "TRH → TSH → T3/T4", "Schilddrüsen-Regelkreis mit **negativer Rückkopplung**."],
[6, "T3 / T4", "**Trijodthyronin** und **Thyroxin**, die Schilddrüsenhormone (mit Jod)."],
[6, "Kalzitonin", "Schilddrüsenhormon für den **Kalziumstoffwechsel**."],
[6, "Gonadotropine", "**LH und FSH** aus dem Vorderlappen; steuern die Keimdrüsen."],
[6, "FSH", "Follikelstimulierendes Hormon: **Follikelreifung** und **Spermienreifung**."],
[6, "GnRH", "Gonadoliberin aus dem Hypothalamus; setzt **LH und FSH** frei."],
[6, "Aromatase", "Enzym, das aus Testosteron **Östradiol** bildet."],
[6, "Hypothyreose / Basedow", "Unterfunktion (z. B. Jodmangel, Kropf) vs. Überfunktion der Schilddrüse."],
[7, "Psychoneuroimmunologie", "Wechselwirkungen zwischen **Verhalten, Nervensystem und Immunsystem**."],
[7, "Homöostase", "Gleichgewicht der inneren Körperbedingungen (Cannon)."],
[7, "Allgemeines Adaptationssyndrom", "Selye: Stress als **unspezifische** Antwort auf eine Störung des Gleichgewichts."],
[7, "Cortisol", "Glucocorticoid aus der **Nebennierenrinde**; Endprodukt der Stressachse (CRH → ACTH → Cortisol)."],
[7, "Zytokine", "Peptid-Botenstoffe des Immunsystems (Interferone, Interleukine, TNF, Monokine)."],
[7, "Primäre lymphatische Organe", "**Knochenmark und Thymus** – Bildung und Reifung der Immunzellen."],
[7, "Sekundäre lymphatische Organe", "**Lymphknoten und Milz** – Reaktionsorte."],
[7, "NK-Zellen", "Natürliche Killer: erkennen infizierte oder Tumorzellen und lösen deren Zelltod aus."],
[7, "Angeborenes Immunsystem", "Schnell, **unspezifisch**, reagiert zuerst (Entzündung, Phagozyten: Monozyten, Makrophagen, Granulozyten)."],
[7, "Adaptives Immunsystem", "Später entstanden, **langsamer**, **spezifisch**, mit **Gedächtnis**."],
[7, "Zellvermittelte Abwehr", "Getragen von **T-Zellen** (Killer- und Helferzellen)."],
[7, "Humorale Abwehr", "**Antikörper** aus B-Zellen in den Körperflüssigkeiten."],
[7, "Antigen", "Stoff, den das Immunsystem als **fremd** erkennt."],
[7, "Akuter vs. chronischer Stress", "Akut → angeborenes System **besser**; chronisch → adaptives System **schlechter**."],
[7, "Eustress / Distress", "Förderlicher vs. schädlicher Stress."],
[7, "Allostase", "Dauerhafte Störung der Homöostase durch Langzeitstress ohne Bewältigung."]
];

function figSVG(id, o){
  const f = FIGS[id]; if(!f) return '';
  o = o || {};
  const L = f.L || [];
  const lines = L.map(([n,tx,ty,bx,by])=>{
    const hl = o.q===n, dim = o.q && !hl;
    return `<g class="figlab${hl?' on':''}${dim?' dim':''}"><line x1="${tx}" y1="${ty}" x2="${bx}" y2="${by}"/><circle class="tg" cx="${tx}" cy="${ty}" r="3.6"/><circle class="bb" cx="${bx}" cy="${by}" r="12.5"/><text x="${bx}" y="${by+4.6}">${n}</text></g>`;
  }).join('');
  return `<svg class="figsvg" viewBox="${f.vb}" role="img" aria-label="${esc(f.t)}">${f.svg}${lines}</svg>`;
}
function figKey(id){
  const f = FIGS[id]; if(!f) return [];
  return f.k || (f.L||[]).map(x=>[x[0],x[5]]);
}
function figHTML(id, cap){
  const f = FIGS[id]; if(!f) return '';
  const key = figKey(id);
  return `<figure class="fig" data-fig="${id}"><div class="figbox">${figSVG(id)}</div>
    <figcaption><b>${esc(f.t)}</b>${cap?` <span>${fmt(cap)}</span>`:''}</figcaption>
    ${key.length?`<div class="figkey">${key.map(([n,t])=>`<span><i>${n}</i><em>${t}</em></span>`).join('')}</div>
    <button class="figtog" data-figtog type="button">Beschriftung verdecken</button>`:''}</figure>`;
}

function pool(){
  let p = Q.filter(q=>!setup.ch.length || setup.ch.includes(q.c));
  if(!setup.ch.length) p = p.filter(q=>MAIN.has(q.c));
  if(setup.filter==='alt') p=p.filter(q=>q.alt);
  if(setup.filter==='wrong') p=p.filter(q=>stats[q.id]&&stats[q.id].last==='w');
  if(setup.filter==='rep') p=p.filter(q=>isRep(q.id));
  if(setup.filter==='ever') p=p.filter(q=>isOpen(q.id));
  if(setup.filter==='new') p=p.filter(q=>!stats[q.id]);
  /* Fragetyp ist eigener Filter und kombiniert sich mit der Auswahl (z. B. Zuletzt falsch + Lückentext) */
  if(setup.type==='ms') p=p.filter(q=>q.t==='ms');
  if(setup.type==='gap') p=p.filter(q=>q.t==='gap');
  return p;
}

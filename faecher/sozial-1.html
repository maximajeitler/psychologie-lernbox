{c:2,t:'mc',alt:1,q:'Wann setzt sich nach dem Reflektiv-Impulsiv-Modell die Diätabsicht durch, obwohl man Schokolade eigentlich sehr gerne mag?',o:['Wenn man vorher seine Selbstregulationsfähigkeit noch nicht beanspruchen musste (Kapazität vorhanden)','Wenn eine äußere Motivation vorliegt','Wenn man unter Zeitdruck entscheidet','Wenn die positive implizite Assoziation mit Schokolade besonders stark ist'],a:0,e:'Das reflektive System (Diätvorsatz) braucht **Motivation und Ressourcen**. Hofmann et al. (2007): Nach Emotionsregulation (erschöpfte Kapazität) sagte die implizite Assoziation den Konsum vorher; in der Kontrollgruppe die Diätabsicht. (Protokoll 15.01.2025)'},
{c:2,t:'ms',alt:1,q:'Wie wirken sich Konsistenz und Inkonsistenz mit einem Schema auf die Informationsverarbeitung aus?',o:['Inkonsistente Informationen ziehen eher Aufmerksamkeit auf sich','Bei ausreichender Motivation und Kapazität werden inkonsistente Informationen oft besser erinnert','Bei der Rekonstruktion von Erinnerungen werden Lücken schemakonsistent aufgefüllt','Schemakonsistente Informationen werden grundsätzlich schlechter erinnert'],a:[0,1,2],e:'Inkonsistenzeffekt: Unerwartetes erhält Aufmerksamkeit und wird bei Motivation/Kapazität tiefer verarbeitet → bessere Erinnerung. Konsistenzeffekt: Konsistentes lässt sich leicht integrieren; beim Abruf füllen Schemata Lücken (Carol Harris/Helen Keller). „Grundsätzlich schlechter“ stimmt nicht. (Protokoll 19.11.2019)'},
{c:4,t:'mc',alt:1,q:'Dutton & Aron (1974): Männer werden nach einer schwankenden Hängebrücke oder einer stabilen Brücke von einer attraktiven Frau befragt, die ihre Telefonnummer hinterlässt. Wann riefen am meisten Männer an?',o:['Nach der schwankenden Hängebrücke','Nach der stabilen Holzbrücke','Nach der Hängebrücke mit 10 Minuten Pause','Es gab keinen Unterschied zwischen den Bedingungen'],a:0,e:'**Fehlattribution von Erregung** (Zwei-Faktoren-Theorie): Die Erregung durch die Brücke wird fälschlich der attraktiven Frau zugeschrieben. Nach der Pause war die Erregung abgeklungen → weniger Anrufe. (Protokolle 2018, 2019)'},
{c:4,t:'ms',alt:1,q:'In welcher Stimmung sollte man welche Aufgabe eher erledigen?',o:['Wer schnell Briefe sortieren soll und kleine Fehler nicht schlimm sind, sollte positiv gestimmt sein','Wer Poster auswählen soll, die später so klein abgebildet werden, dass man keine Details sieht, sollte positiv gestimmt sein','Wer beim Korrekturlesen Fehler finden soll, sollte positiv gestimmt sein','Wer Menschen verschiedener Herkunft objektiv beurteilen soll, sollte möglichst positiv gestimmt sein'],a:[0,1],e:'Positive Stimmung → top-down, global, heuristisch, schnell (Gesamteindruck reicht). Negative Stimmung → bottom-up, detailgenau – gut fürs Korrekturlesen. Positive Stimmung fördert stereotypes Urteilen (Bodenhausen et al., 1994) → für objektive Urteile ungünstig. (Protokolle 2018, 2020)'},
{c:4,t:'ms',alt:1,q:'Anna weiß, dass sie in der Klausur meistens negativ gestimmt ist. Wie sollte sie den Einfluss der Stimmung beim Lernen nutzen?',o:['Es vermeiden, in besonders positiver Stimmung zu lernen, weil Inhalte, die in ähnlicher Stimmung gelernt und abgerufen werden, einen Vorteil haben','Lernstoff mit negativer Valenz besonders intensiv lernen, weil ihr in negativer Stimmung negative Inhalte leichter einfallen','Lernstoff mit positiver Valenz besonders intensiv lernen, weil ihr in negativer Stimmung negative Inhalte leichter einfallen','Die Informationen möglichst neutral und emotionslos lernen, damit der Abruf nicht von der Stimmung abhängt'],a:[0,1],e:'**Mood-state-dependent memory**: Abruf gelingt am besten in derselben Stimmung wie beim Lernen. **Mood-congruent memory**: In negativer Stimmung fallen negative Inhalte leichter ein. Achtung laut Video (Corcoran): Mood-state-dependent memory ist weniger stabil – einfach in derselben Stimmung zu lernen reicht nicht immer, es wirkt v. a., wenn die Stimmung beim Lernen bedeutsam mit dem Inhalt verbunden ist. (Protokoll 28.06.2022 – Lösung aus dem Lehrbuch abgeleitet)'},
{c:5,t:'ms',alt:1,q:'Was sollte man aus sozialpsychologischer Sicht beachten, wenn man jemanden mit einer Rede überzeugen will?',o:['Keine Füllwörter verwenden','Mit eher tiefer Stimme sprechen','Langsam und deutlich sprechen','Eigene Zweifel und Unsicherheiten ansprechen'],a:[0,1],e:'Paraverbale Merkmale (Lehrbuch 7.2.7, Video Kap. 7): **tiefe Stimme** wirkt souveräner; **schnelles** Sprechtempo wirkt kompetenter als zu langsames; **Füllwörter, Zögern, leises Sprechen** wirken unsicher. Eigene Zweifel senken die Glaubwürdigkeit. (Protokoll 04.12.2024 – Originaloptionen)'},
{c:5,t:'mc',alt:1,q:'Mast & Hall (2004): Versuchspersonen sehen nur ein einzelnes Foto zweier Unikolleg:innen im Gespräch und sollen den Status einschätzen. Was zeigt die Studie?',o:['Status lässt sich schon aus einem kurzen ersten Eindruck (Haltung, Auftreten) überzufällig erkennen','Status lässt sich aus Fotos überhaupt nicht erkennen','Nur die Körpergröße bestimmt den eingeschätzten Status','Status wird nur bei Männern erkannt, nicht bei Frauen'],a:0,e:'Präsenzsitzung „Erster Eindruck Status“: Aus beobachtbaren Merkmalen (Haltung, Mimik, Auftreten) wird Status schnell und überzufällig zutreffend eingeschätzt. Passt zu: Kompetenz-/Statussignale wie Körpergröße, Kleidung, Titel. (Protokoll 19.11.2019 „Versuch mit Status“)'},
{c:5,t:'mc',alt:1,q:'Ein ambitionierter Schachspieler zieht neu in eine WG. Die Mitbewohner:innen kennen ihn noch nicht, wissen aber, dass er Schach spielt. Wie wird er spontan beschrieben werden und warum?',o:['Als intelligent und eher introvertiert – über Stereotype bzw. implizite Persönlichkeitstheorien werden fehlende Eigenschaften ergänzt','Neutral, weil ohne Verhaltensbeobachtung keine Eindrucksbildung stattfindet','Als besonders sportlich, weil Schach als Sport gilt (Kontrasteffekt)','Gar nicht – spontane Eindrucksbildung erfordert direkten Kontakt'],a:0,e:'Kategorie/Stereotyp „Schachspieler“ aktiviert typische Eigenschaften; **implizite Persönlichkeitstheorien** ergänzen fehlende Informationen (Top-down). (Protokoll 05.03.2018)'},
{c:5,t:'mc',alt:1,q:'Tim lächelt Hans immer an, aber nie Gustav und Peter; Gustav und Peter lächeln Hans nicht an. Wie sind Konsensus, Distinktheit und Konsistenz ausgeprägt?',o:['Niedriger Konsensus, hohe Distinktheit, hohe Konsistenz','Hoher Konsensus, hohe Distinktheit, hohe Konsistenz','Niedriger Konsensus, niedrige Distinktheit, hohe Konsistenz','Niedriger Konsensus, hohe Distinktheit, niedrige Konsistenz'],a:0,e:'Konsensus: Andere (Gustav, Peter) lächeln Hans nicht an → niedrig. Distinktheit: Tim lächelt nur Hans an, nicht andere → hoch. Konsistenz: „immer“ → hoch. Dieses Muster (niedrig/hoch/hoch) spricht weder klar für Person noch für Stimulus allein → eher **Kombination aus Tim und Hans** (Beziehung). (Protokolle 2017)'},
{c:5,t:'mc',alt:1,q:'Wann attribuieren Menschen ihr eigenes Verhalten entgegen der Akteur-Beobachter-Divergenz eher internal?',o:['Bei Erfolgen bzw. positivem Verhalten – aus selbstwertdienlichen Gründen','Bei Misserfolgen, weil sie die Situation dann besser überblicken','Immer dann, wenn sie sich selbst auf Video sehen','Nie – die Akteur-Beobachter-Divergenz gilt ausnahmslos'],a:0,e:'Die Akteur-Beobachter-Divergenz wird durch **selbstwertdienliche Attribution** überlagert: Eigene Erfolge werden internal erklärt (Fähigkeit, Anstrengung). Zusätzlich kann ein Perspektivenwechsel (z. B. sich selbst auf Video sehen) die Divergenz umkehren (Storms, 1973). (Protokoll 29.11.2018)'},
{c:5,t:'mc',alt:1,q:'Worum geht es in der Attributionstheorie von Heider?',o:['Der Mensch als „naiver Wissenschaftler“, der Verhalten auf internale (Person) oder externale (Situation) Ursachen zurückführt','Um drei Informationsdimensionen: Konsensus, Distinktheit, Konsistenz','Um die Differenzierung von Emotionen durch Kontrollierbarkeit','Um das Gleichgewicht zwischen zwei Personen und einem Objekt'],a:0,e:'Heider (1958): Grundunterscheidung **internal vs. external**. Konsensus/Distinktheit/Konsistenz = **Kelley** (Kovariationsmodell). Kontrollierbarkeit → Emotionen = Weiner. Das Dreieck Person–Person–Objekt ist Heiders **Balance-Theorie** (Kap. 7). (Protokolle 2019, 2021)'},
{c:6,t:'mc',alt:1,q:'Passant:innen sollen von vier identischen Strumpfhosen die beste wählen. Die meisten nehmen die rechte, begründen das aber mit der Qualität. Was zeigt diese Studie (Nisbett & Wilson, 1977)?',o:['Die wahren Gründe für das eigene Verhalten sind der Introspektion oft nicht zugänglich','Menschen erkennen durch Introspektion zuverlässig ihre Motive','Die Position hat keinen Einfluss auf Entscheidungen','Menschen schließen über Selbstwahrnehmung immer richtig auf Einstellungen'],a:0,e:'Grenzen der **Introspektion**: Die tatsächliche Ursache (Positionseffekt) war nicht bewusst; stattdessen nannten die Personen plausible Gründe. Verwandt: **Introspektionsillusion** – man hält eigene Urteile für objektiver als sie sind. (Protokoll 2015 „Passanten Socken“)'},
{c:6,t:'ms',alt:1,q:'Hansen et al. (2004): Eine Gruppe soll sich beim Beurteilen von Gemälden den Künstlernamen anzeigen lassen, die andere nicht. Die Ergebnisse sprechen für eine Introspektionsillusion. Wie sah das Muster aus?',o:['Obwohl die Gruppe mit Namen Bilder berühmter Künstler höher bewertete, hielt sie ihr Urteil für nicht weniger objektiv','Obwohl der Gruppe mit Namen bewusst war, dass der Name das Urteil beeinflussen könnte, schätzte sie ihr Urteil später als genauso objektiv ein','Die Gruppe mit Namen korrigierte ihre Urteile und war am Ende objektiver','Die Gruppe mit Namen schätzte ihr Urteil als weniger objektiv ein als die andere Gruppe'],a:[0,1],e:'**Introspektionsillusion**: Menschen merken nicht, dass ihr Urteil verzerrt ist, und halten es für genauso objektiv – selbst wenn sie um die mögliche Verzerrung wissen. (Protokoll 28.06.2022)'},
{c:6,t:'ms',alt:1,q:'Higgins (1987): Welche Gefühle entstehen bei Diskrepanzen zwischen dem aktuellen Selbst und anderen Selbstaspekten?',o:['Aktuelles vs. Ideal-Selbst → Niedergeschlagenheit, Trauer, Entmutigung','Aktuelles vs. Soll-Selbst → Aufregung, Angst, Besorgnis','Aktuelles vs. Ideal-Selbst → Angst und Schuld','Aktuelles vs. Soll-Selbst → Stolz und Erleichterung'],a:[0,1],e:'Selbstdiskrepanztheorie: Ideal-Selbst („wer möchte ich sein?“) → niedergeschlagene Gefühle. Soll-Selbst („wer sollte ich sein?“) → agitierte Gefühle (Angst, Besorgnis, Scham). (Protokoll 2015 „eigentliches Selbst und Wunsch-Selbst“)'},
{c:6,t:'ms',alt:1,q:'Welche Arten bzw. Unterscheidungen des Selbstwerts gibt es?',o:['Global vs. bereichsspezifisch','Explizit vs. implizit','Trait (habituell) vs. State (momentan)','Kognitiv vs. behavioral'],a:[0,1,2],e:'Präsenz Kap. 6: globaler vs. bereichsspezifischer Selbstwert; expliziter (z. B. Rosenberg-Skala) vs. impliziter (Name-letter-Effekt, IAT) – beide sind unabhängig voneinander; habitueller (trait) vs. momentaner (state) Selbstwert. (Protokoll 07.07.2020)'},
{c:6,t:'mc',alt:1,q:'Wie nennt man das Bedürfnis, das eigene Selbstkonzept zu bestätigen – auch wenn es negativ ist?',o:['Selbstverifizierung','Selbstwerterhaltung','Selbstwertbestätigung (Self-Affirmation)','Selbstüberwachung'],a:0,e:'**Selbstverifizierung** (Swann): Menschen wollen im Einklang mit ihrem Selbstbild gesehen werden – v. a. bei eindeutigen Eigenschaften und wenn ein falsches Selbstbild große Konsequenzen hätte (z. B. Partnerschaft). Grenze der selbstwertdienlichen Verzerrung. (Protokoll 07.07.2020 „Tendenz, mit seiner Persönlichkeit im Einklang zu stehen“)'},
{c:6,t:'mc',alt:1,q:'Warum führt eine Kamera im Prüfungsraum dazu, dass weniger geschummelt wird?',o:['Sie erhöht die Selbstaufmerksamkeit – man vergleicht das eigene Verhalten stärker mit inneren Normen','Sie senkt die Selbstaufmerksamkeit und damit die Versuchung','Sie löst Reaktanz aus','Sie erzeugt einen Mere-Exposure-Effekt'],a:0,e:'Kamera (oder Spiegel) → **Selbstaufmerksamkeit** → Abgleich mit inneren Standards → normgerechteres Verhalten (vgl. Beaman et al., 1979: Kinder mit Spiegel nahmen weniger Süßigkeiten). Zugleich: vorgestellte/implizite Anwesenheit anderer. (Protokoll 07.07.2020)'},
{c:6,t:'ms',alt:1,q:'Ein Freund bekommt eine begehrte Stelle als Assistent bei einer beliebten Professorin – die Stelle wolltest du auch. Wie könntest du nach der Theorie der Selbstwerterhaltung reagieren?',o:['Die Stelle abwerten („eh zu stressig“)','Den Freund abwerten oder auf Distanz gehen','Mit dem Erfolg des Freundes angeben','Dich besonders ärgern, weil du auf Platz 2 warst'],a:[0,1],e:'Tesser (1988): Ist ein **naher** Anderer in einem **relevanten** Bereich besser → Bedrohung. Strategien: Relevanz senken (Stelle abwerten), Nähe verringern bzw. den anderen abwerten, eigene Leistung verbessern. Angeben (Reflexion/„Sonnen im Glanz“) passt nur bei **irrelevanten** Bereichen. (Protokoll 04.12.2024)'},
{c:6,t:'ms',alt:1,q:'Wann kann sich Lob negativ auf Kinder auswirken?',o:['Wenn sie die Aufgabe ohnehin freiwillig und gern gemacht haben (Überrechtfertigung)','Wenn sie nur bei übermäßiger Anstrengung gelobt werden','Wenn die Aufgabe sehr einfach für sie ist','Wenn sie nur gelobt werden, wenn sie besser sind als andere'],a:[0,1,2],e:'Selbstwahrnehmung: Lob/Belohnung für eine intrinsisch motivierte Tätigkeit → **Überrechtfertigung**. Lob für Anstrengung bzw. bei leichten Aufgaben signalisiert „du hast wenig Fähigkeit“ (Kind schließt aus dem Lob auf geringe Begabung). (Protokoll 19.11.2019 – im Protokoll ohne Lösung; aus Selbstwahrnehmungstheorie abgeleitet)'},
{c:6,t:'mc',alt:1,q:'Das Selbst wird in der Selbstregulationsforschung häufig mit welchem Bild beschrieben?',o:['Mit einem Muskel, der durch Anstrengung ermüdet (Ego-Depletion)','Mit einem Dampfkessel, der Druck ablassen muss','Mit einem Spiegel, der die Umwelt reflektiert','Mit einer Kamera, die objektiv aufzeichnet'],a:0,e:'Kraftmodell der Selbstkontrolle (Baumeister et al., 1998): Selbstregulation verbraucht eine begrenzte Ressource wie ein **Muskel** (Rettich-Keks-Studie). Große Replikation (Hagger et al., 2016) fand den Effekt nicht – Feldstudien zeigen aber, dass Selbstregulation über die Zeit nachlässt. (Protokoll 2015)'},
{c:6,t:'mc',alt:1,q:'Wie sind gutartiger und bösartiger Neid in der Regel miteinander verbunden?',o:['Sie sind eigenständige Formen, die eher schwach positiv zusammenhängen','Sie korrelieren stark negativ – wer das eine erlebt, erlebt das andere nicht','Es gibt keine Regel, es hängt davon ab, ob der Neid schon Schmerz zugefügt hat','Sie sind identisch und nur unterschiedlich benannt'],a:0,e:'Achtung: Dazu steht nichts in deinen Unterlagen (Buch, Folien, Zusammenfassungen) – die Antwort stammt aus der Neid-Forschung (Lange & Crusius, 2015: zwei eigenständige Formen, schwach positiv korreliert). Gutartiger Neid motiviert zur Verbesserung (≈ Aufwärtsvergleich zur Selbstmotivation), bösartiger zielt auf Abwertung des Beneideten (≈ Selbstwerterhaltung). (Protokoll 15.01.2025)'},
{c:6,t:'mc',alt:1,q:'Corcoran untersuchte soziale Vergleiche von Frauen mit derselben (Krebs-)Diagnose, deren Vergleichsperson entweder gut oder schlecht mit der Krankheit zurechtkam. Was ist nach dem Selective Accessibility Model zu erwarten?',o:['Assimilation an die Vergleichsperson, weil die gleiche Diagnose den Fokus auf Ähnlichkeiten lenkt','Immer Kontrast, weil Krankheit eine Bedrohung ist','Kein Vergleichseffekt, weil Kranke sich nicht vergleichen','Assimilation nur bei Frauen mit niedrigem Selbstwert'],a:0,e:'SAM (Mussweiler): Gemeinsame Kategorie (gleiche Diagnose) → **Ähnlichkeitstesten** → standardkonsistentes Selbstwissen wird zugänglich → **Assimilation** (gute Vergleichsperson → besseres Selbstbild, schlechte → schlechteres). Hinweis: Die Studie steht nicht in deinen Unterlagen; im Protokoll war auch „hing vom Selbstwert ab“ als Option – die Antwort ist aus dem SAM abgeleitet. (Protokoll 15.01.2025)'},
{c:6,t:'mc',alt:1,q:'Das „Semantic-Procedural-Interface-Modell“ des Selbst beschreibt vor allem …',o:['wie independente bzw. interdependente Selbstkonstruktion die Art der Informationsverarbeitung (kontextunabhängig vs. kontextabhängig) prägt','wie Selbstwert über Lob und Tadel gelernt wird','wie das Selbst Erinnerungen bewusst unterdrückt','wie Emotionen durch Attributionen entstehen'],a:0,e:'Kühnen et al.: Selbstwissen (semantisch: independent vs. interdependent) ist mit einer Verarbeitungsprozedur verknüpft: **interdependentes Selbst → kontextabhängige**, independentes → kontextunabhängige Informationsverarbeitung. (Protokolle 2015)'},
{c:7,t:'mc',alt:1,q:'Warum kann eine implizite Einstellung nicht einfach mit Papier und Bleistift (Fragebogen) erfasst werden?',o:['Weil sie automatisch und oft unbewusst ist und daher nicht per Selbstbericht zugänglich ist','Weil Fragebögen nur die behaviorale Komponente messen','Weil implizite Einstellungen immer mit expliziten übereinstimmen','Weil Likert-Skalen keine Valenz erfassen'],a:0,e:'Implizite Einstellungen sind automatisch und der Introspektion kaum zugänglich → **indirekte Verfahren** (IAT, Go/No-Go, affektives Priming, AMP) über Reaktionszeiten. (Protokoll 2015)'},
{c:7,t:'mc',alt:1,q:'Welche Einstellungskomponente kann mit einer Likert-Skala nicht erfasst werden?',o:['Keine – mit Likert-Items lassen sich affektive, kognitive und behaviorale Aussagen erfassen','Die affektive Komponente','Die kognitive Komponente','Die behaviorale Komponente'],a:0,e:'Likert-Skala = Zustimmung zu Aussagen („stimme voll zu … gar nicht zu“) – die Aussagen können Gefühle, Überzeugungen oder Verhalten betreffen. Corcoran im Video: Likert-Fragebögen können **alle** Komponenten erfassen; das **semantische Differenzial** dagegen nur die affektive. (Protokoll 04.12.2024)'},
{c:7,t:'mc',alt:1,q:'Wann kann man jemanden mit einer persuasiven Botschaft mit schwachen Argumenten am ehesten beeinflussen?',o:['Wenn er abgelenkt ist (geringe Verarbeitungskapazität → periphere Route)','Wenn das Thema für ihn persönlich hochrelevant ist','Wenn er vorgewarnt wurde','Wenn er in negativer Stimmung ist'],a:0,e:'ELM: Ablenkung senkt die Fähigkeit zur Elaboration → schwache Argumente fallen weniger auf, periphere Hinweisreize wirken. Hohe Relevanz, Vorwarnung und negative Stimmung fördern dagegen kritisches Prüfen. (Protokoll 02.02.2017)'},
{c:7,t:'ms',alt:1,q:'Was trägt dazu bei, dass bei persuasiver Argumentation bessere Argumente tatsächlich zu stärkerer Einstellungsänderung führen?',o:['Hohe persönliche Relevanz des Themas (Involvement)','Ausreichende kognitive Kapazität (keine Ablenkung)','Hohes Bedürfnis nach Kognition (Need for Cognition)','Eine besonders attraktive Quelle'],a:[0,1,2],e:'Argumentqualität wirkt über die **zentrale Route** – dafür braucht es **Motivation** (Relevanz, Need for Cognition) und **Fähigkeit** (Kapazität). Attraktivität ist ein peripherer Hinweisreiz. (Protokoll 07.07.2020)'},
{c:7,t:'mc',alt:1,q:'Drei Freunde sehen einen Film, den ihnen ein weiterer Freund empfohlen hat. Allen gefällt er nicht. Wer erlebt die größte kognitive Dissonanz?',o:['Wer mit dem empfehlenden Freund am engsten befreundet ist','Wer den empfehlenden Freund kaum kennt','Alle gleich viel','Niemand, weil keiner selbst etwas entschieden hat'],a:0,e:'Dissonanz entsteht zwischen „Ich mag meinen engen Freund/vertraue seinem Geschmack“ und „Sein Film gefällt mir nicht“ – je wichtiger die Beziehung, desto stärker die Inkonsistenz (vgl. Balance-Theorie). (Protokoll 28.01.2021)'},
{c:7,t:'mc',alt:1,q:'Du hast dich zwischen Wanderurlaub in den Alpen und Badeurlaub in Kroatien für Kroatien entschieden. Im Zug siehst du die Alpen vorbeiziehen. Wie fühlst du dich höchstwahrscheinlich?',o:['Die Alpen wirken eher uninteressant, auf Wandern hast du kaum Lust (Dissonanzreduktion nach der Entscheidung)','Die Alpen wirken jetzt besonders reizvoll, du würdest am liebsten dort wandern','Die Alpen wirken nur deshalb uninteressant, weil Kroatien schon bezahlt ist','Gar nichts – nach Entscheidungen entsteht keine Dissonanz'],a:0,e:'**Irreversible Entscheidungen** erzeugen Dissonanz; reduziert wird sie, indem die gewählte Alternative auf- und die abgelehnte abgewertet wird (Spreading of alternatives). (Protokoll 15.01.2025)'},
{c:7,t:'mc',alt:1,q:'Stone et al. (1994): Studierende halten öffentlich ein Plädoyer für Kondome und werden danach an eigene Versäumnisse erinnert. Was passiert?',o:['Sie kaufen danach häufiger Kondome – die bewusst gemachte Heuchelei erzeugt Dissonanz, die durch Verhaltensänderung reduziert wird','Sie werten das Thema AIDS-Prävention ab','Sie kaufen weniger Kondome aus Reaktanz','Es gibt keinen Effekt, weil das Plädoyer freiwillig war'],a:0,e:'**Heuchelei-Paradigma**: Inkonsistenz zwischen öffentlicher Position und eigenem Verhalten bewusst machen → Dissonanz → Verhalten ändern. (Protokoll 19.11.2019 „HIV-Versuch“)'},
{c:7,t:'ms',alt:1,q:'Welche Theorien bzw. Mechanismen beschreiben, wie sich Einstellungen ändern?',o:['Persuasion (z. B. ELM, Yale-Ansatz)','Kognitive Dissonanz','Selbstwahrnehmung und Bodyfeedback','Repräsentativitätsheuristik'],a:[0,1,2],e:'Lehrbuch 7.2: Genetik, Lernprozesse (evaluative Konditionierung, operant, Modelllernen), Selbstwahrnehmung/Bodyfeedback, Mere Exposure, Konsistenzbestreben (Balance, Dissonanz), Persuasion. Die Repräsentativitätsheuristik ist eine Urteilsheuristik (Kap. 3). (Protokolle 2015, 2017)'},
{c:1,t:'tf',q:'Ein signifikantes Ergebnis (p < .05) bedeutet, dass der Effekt mit 95 % Wahrscheinlichkeit wirklich existiert.',a:false,e:'Falsch. p ist die Wahrscheinlichkeit für ein solches Ergebnis, **falls kein Effekt existiert**. Über die Wahrscheinlichkeit, dass der Effekt real ist oder repliziert wird, sagt es nichts.'},
{c:1,t:'tf',q:'Laborexperimente haben zwangsläufig eine geringere externe Validität als Feldstudien.',a:false,e:'Falsch – das ist die typische Falschoption. Externe Validität hängt von der Übertragbarkeit ab, nicht automatisch vom Ort.'},
{c:1,t:'gap',q:'Die Wahrscheinlichkeit, dass ein existierender Effekt in einer Studie signifikant wird, heißt statistische ___.',a:['Power','Teststärke'],e:'**Power** (1 − β); steigt mit Stichprobengröße, Messgenauigkeit und Effektgröße.'},
{c:1,t:'gap',q:'Wird ein Effekt angenommen, der in der Population gar nicht existiert, begeht man einen Fehler ___ Art.',a:['1.','1','ersten','erster'],e:'**Fehler 1. Art** (α). Fehler 2. Art = existierenden Effekt übersehen.'},
{c:1,t:'mc',q:'In einem 2×2-Design zeigen Buben nach aggressiven Filmen mehr Aggression als nach neutralen; bei Mädchen gibt es keinen Unterschied. Welches Muster liegt vor?',o:['Eine Interaktion','Nur ein Haupteffekt Filminhalt','Nur ein Haupteffekt Geschlecht','Kein Effekt'],a:0,e:'Der Effekt des Films **hängt vom Geschlecht ab** → Interaktion (Präsenzfolien Methoden).'},
{c:1,t:'tf',q:'Die Sozialpsychologie interessiert sich vor allem für das durchschnittliche Individuum, nicht für Unterschiede zwischen Personen.',a:true,e:'Richtig. Unterschiede zwischen Individuen sind Fokus der Persönlichkeitspsychologie.'},
{c:1,t:'gap',q:'Präregistrierung, Open Data und offene Analyse-Skripte gehören zur ___ ___.',a:['Open Science'],e:'**Open Science** soll Forschung transparent und überprüfbar machen.'},
{c:2,t:'gap',q:'Ein Schema über typische Handlungsabläufe, z. B. einen Restaurantbesuch, heißt ___.',a:['Skript'],e:'**Skripte** = Schemata über Abläufe; **Stereotype** = Schemata über Gruppen.'},
{c:2,t:'tf',q:'Das impulsive System kann Negationen wie „nicht rauchen“ verarbeiten.',a:false,e:'Falsch. Nur das **reflektive** System versteht Negationen → Bumerangeffekt unter Stress.'},
{c:2,t:'tf',q:'Priming wirkt vor allem dann, wenn der Zielreiz mehrdeutig ist und der aktivierte Inhalt auf ihn anwendbar ist.',a:true,e:'Richtig – Donald-Paradigma: nicht anwendbare Primes zeigen keinen Effekt.'},
{c:2,t:'mc',q:'Im Stroop-Test soll man die Schriftfarbe des Wortes „GRÜN“ benennen, das rot gedruckt ist. Warum dauert das länger?',o:['Das automatische Lesen interferiert mit der kontrollierten Farbbenennung','Die rote Farbe ist ein affektiver Prime','Das reflektive System verarbeitet Farben parallel','Die Kategorie „Farbe“ ist chronisch unzugänglich'],a:0,e:'Stark eingeübte Prozesse (Lesen) laufen **automatisch** und stören die kontrollierte Aufgabe.'},
{c:2,t:'gap',q:'Die Ausbreitung der Aktivierung von einem Knoten auf verbundene Knoten nennt man ___ activation.',a:['spreading'],e:'**Spreading activation** im assoziativen Netzwerk.'},
{c:2,t:'tf',q:'Schemainkonsistente Informationen werden immer schlechter erinnert als schemakonsistente.',a:false,e:'Falsch. Bei ausreichender Motivation und Kapazität werden inkonsistente Infos oft **besser** erinnert (Inkonsistenzeffekt).'},
{c:2,t:'mc',q:'Loftus & Pickrell (1995) „Lost in the mall“ zeigt …',o:['dass durch suggestive Befragung falsche Erinnerungen entstehen können','dass Erinnerungen originalgetreu gespeichert werden','dass Kinder sich besser erinnern als Erwachsene','dass Primes nur bei Bewusstheit wirken'],a:0,e:'Ca. 25 % „erinnerten“ sich an ein erfundenes Kindheitserlebnis – Erinnerung ist **rekonstruktiv**.'},
{c:3,t:'gap',q:'Bei vorgegebenen Ankern erklärt das ___ ___ Model den Ankereffekt.',a:['Selective Accessibility','Selektive Zugänglichkeit'],e:'**SAM**: Hypothesentest macht ankerkonsistentes Wissen zugänglich.'},
{c:3,t:'tf',q:'Bei selbstgenerierten Ankern (z. B. Gefrierpunkt von Wasser für Wodka) korrigiert man bewusst vom Anker weg, aber meist zu wenig.',a:true,e:'Richtig: **Verankerung und Anpassung** (Epley & Gilovich) – braucht Ressourcen und Motivation.'},
{c:3,t:'tf',q:'Informationen im Häufigkeitsformat („3 von 10“) verringern Fehler durch die Repräsentativitätsheuristik.',a:true,e:'Richtig – Häufigkeitsformat und Aufmerksamkeitslenkung sind Moderatoren.'},
{c:3,t:'mc',q:'70 % der Personen meinen, der Buchstabe „k“ komme im Englischen häufiger an erster als an dritter Stelle vor. Was erklärt das?',o:['Wörter mit bestimmtem Anfangsbuchstaben sind leichter abrufbar (Verfügbarkeitsheuristik)','Die Basisrate wird vernachlässigt','Der erste Buchstabe wirkt als Anker','Wörter mit k am Anfang sind repräsentativer'],a:0,e:'Art der Gedächtnissuche → Verfügbarkeit; tatsächlich steht k etwa dreimal häufiger an dritter Stelle.'},
{c:3,t:'gap',q:'Linda wird eher für eine „feministische Bankangestellte“ gehalten als für eine „Bankangestellte“. Diesen Fehler nennt man ___.',a:['Konjunktionstäuschung','Konjunktionsfehler'],e:'**Konjunktionstäuschung** durch die Repräsentativitätsheuristik.'},
{c:3,t:'tf',q:'Hohe persönliche Relevanz führt dazu, dass eher der Inhalt der abgerufenen Information und weniger das Leichtigkeitsgefühl ins Urteil eingeht.',a:true,e:'Richtig – systematischere Verarbeitung bei hoher Relevanz (auch in negativer Stimmung).'},
{c:4,t:'tf',q:'Stimmungen sind im Vergleich zu Emotionen intensiver und kürzer.',a:false,e:'Falsch – umgekehrt: Emotionen sind intensiver, kürzer und objektbezogen; Stimmungen diffus und länger.'},
{c:4,t:'gap',q:'Nach der Zwei-Faktoren-Theorie bestimmt die physiologische Erregung die ___ einer Emotion, die Kognition ihre Qualität.',a:['Intensität','Stärke'],e:'Erregung = **Intensität**, Kognition = **Qualität** (Schachter & Singer, 1962).'},
{c:4,t:'mc',q:'Ein negatives Ereignis wird einer anderen Person zugeschrieben, die es hätte verhindern können (external, kontrollierbar). Welche Emotion entsteht?',o:['Ärger','Mitleid','Schuld','Scham'],a:0,e:'External + kontrollierbar = **Ärger**; external + unkontrollierbar = Mitleid; internal + kontrollierbar = Schuld; internal + unkontrollierbar = Scham.'},
{c:4,t:'mc',q:'Welche Emotion entsteht nach der Bewertungstheorie bei einem positiven Ereignis, das man auf eigene kontrollierbare Anstrengung zurückführt?',o:['Stolz','Dankbarkeit','Erleichterung','Überraschung'],a:0,e:'Positiv + internal + kontrollierbar = **Stolz**; external + kontrollierbar = Dankbarkeit (Präsenzfolie).'},
{c:4,t:'tf',q:'Nach einem lustigen Film lösten in der Studie von Isen et al. (1987) deutlich mehr Personen das Kerzenproblem als in neutraler Stimmung.',a:true,e:'Richtig – 75 % vs. 20 %: positive Stimmung fördert Kreativität.'},
{c:4,t:'gap',q:'Dass man Inhalte am besten abruft, wenn man in derselben Stimmung ist wie beim Lernen, nennt man mood-state-___ memory.',a:['dependent'],e:'**Mood-state-dependent memory** – unabhängig vom Inhalt; nicht zu verwechseln mit mood-congruent memory.'},
{c:4,t:'tf',q:'Die How-do-I-feel-about-Heuristik verliert ihre Wirkung, wenn die Person eine plausible andere Ursache für ihre Stimmung erkennt.',a:true,e:'Richtig – Schwarz & Clore (1983): Frage nach dem Wetter beseitigt den Effekt.'},
{c:5,t:'gap',q:'Wenn eine hervorstechende Eigenschaft die Wahrnehmung aller weiteren Eigenschaften färbt, spricht man vom ___-Effekt.',a:['Halo'],e:'**Halo-Effekt**.'},
{c:5,t:'mc',q:'Alle Freund:innen genießen ein Konzert, nur Michael nicht; sonst ist er bei Konzerten begeistert, aber auch das letzte Konzert dieser Band gefiel ihm nicht. Wie sind die Dimensionen?',o:['Konsensus niedrig, Distinktheit hoch, Konsistenz hoch','Konsensus hoch, Distinktheit hoch, Konsistenz hoch','Konsensus niedrig, Distinktheit niedrig, Konsistenz hoch','Konsensus niedrig, Distinktheit hoch, Konsistenz niedrig'],a:0,e:'Andere mögen es → Konsensus niedrig; nur bei dieser Band → Distinktheit hoch; auch letztes Mal → Konsistenz hoch. Ursache: die Kombination Michael × diese Band. (Moodle-Übung Kap. 5)'},
{c:5,t:'tf',q:'Der Correspondence Bias ist in kollektivistischen Kulturen stärker ausgeprägt als in individualistischen.',a:false,e:'Falsch – stärker in **individualistischen** Kulturen; kollektivistische betonen situative Faktoren.'},
{c:5,t:'mc',q:'Lassiter et al. (2007): Richter:innen sehen ein Verhörvideo, in dem die Kamera nur den Verdächtigen zeigt. Wie beurteilen sie das Geständnis?',o:['Eher als freiwillig – der Verdächtige ist salient, situativer Druck wird unterschätzt','Eher als erzwungen','Genauso wie bei Kamera auf den Beamten','Gar nicht, weil Richter:innen immun gegen Blickwinkeleffekte sind'],a:0,e:'**Blickwinkel/Salienz**: Wer im Fokus ist, wird als Ursache gesehen → dispositionale Attribution.'},
{c:5,t:'gap',q:'Nach Kelley attribuiert man internal, wenn Konsensus ___ ist, Distinktheit niedrig und Konsistenz hoch.',a:['niedrig','gering'],e:'Konsensus **niedrig**, Distinktheit niedrig, Konsistenz hoch.'},
{c:5,t:'tf',q:'In der Quiz-Studie von Ross et al. (1977) wurde der Fragensteller als gebildeter eingeschätzt, obwohl die Rollen zufällig verteilt waren.',a:true,e:'Richtig – Correspondence Bias/Fundamentaler Attributionsfehler.'},
{c:5,t:'mc',q:'Welche Dimension gehört zu „Agency“?',o:['Durchsetzungsfähig, kompetent, ehrgeizig','Warm, vertrauenswürdig, fürsorglich','Attraktiv, jung, gesund','Ähnlich, vertraut, bekannt'],a:0,e:'Big Two: **Agency** = individuelles Streben; **Communion** = soziale Verbundenheit.'},
{c:6,t:'gap',q:'Nach der Theorie der sozialen Identität (Tajfel & Turner) beruht die ___ Identität auf einzigartigen Merkmalen des Individuums.',a:['personale','persönliche'],e:'**Personale** Identität (ich) vs. **soziale** Identität (wir).'},
{c:6,t:'tf',q:'Selbstaufmerksamkeit und Selbstüberwachung bedeuten dasselbe.',a:false,e:'Falsch. Selbstaufmerksamkeit → Orientierung an **inneren** Standards; Selbstüberwachung → Anpassung an **äußere** Erwartungen (Moodle-Aufgabe „Anna bei Stefans Eltern“).'},
{c:6,t:'mc',q:'Anna (liberal, engagiert) trifft Stefans konservative Eltern; das Gespräch kommt auf die Frauenbewegung. Wie verhält sich Anna bei hoher Selbstaufmerksamkeit?',o:['Sie vertritt ihre eigenen Überzeugungen','Sie passt ihre Aussagen den Erwartungen der Eltern an','Sie schweigt aus Reaktanz','Sie attribuiert das Thema external'],a:0,e:'Hohe Selbstaufmerksamkeit → Verhalten an **inneren Werten**. Bei hoher **Selbstüberwachung** würde sie sich eher anpassen.'},
{c:6,t:'tf',q:'Extreme Vergleichsstandards führen meist zu Assimilation.',a:false,e:'Falsch – extreme Standards führen meist zu **Kontrast**; moderate eher zu Assimilation.'},
{c:6,t:'gap',q:'Kinder, die für Malen belohnt werden, das ihnen vorher Spaß machte, malen danach weniger. Das ist der ___effekt.',a:['Überrechtfertigungs','Überrechtfertigung','Korrumpierungs'],e:'**Überrechtfertigungseffekt** (Greene et al., 1976).'},
{c:6,t:'tf',q:'Nach der Terror Management Theory werden Personen, die die eigene Weltsicht infrage stellen, nach Sterblichkeitssalienz positiver bewertet.',a:false,e:'Falsch – sie werden **abgewertet** bzw. aggressiver behandelt (McGregor et al., 1998); Weltsicht-Bestätigende werden aufgewertet.'},
{c:6,t:'mc',q:'Ehepartner schätzen ihren Anteil an der Hausarbeit zusammen auf über 100 %. Wie heißt dieser Effekt?',o:['Egocentric Bias','Self-Handicapping','Sandbagging','Schwarzes-Schaf-Effekt'],a:0,e:'**Egocentric Bias** (Ross & Sicoly, 1979).'},
{c:6,t:'tf',q:'Expliziter und impliziter Selbstwert hängen eng zusammen.',a:false,e:'Falsch – sie sind weitgehend **unabhängig** voneinander (Präsenzfolie, Rudolph et al., 2008).'},
{c:7,t:'gap',q:'Ein angeblicher Lügendetektor, der ehrlichere Selbstauskünfte bewirken soll, heißt ___-Pipeline.',a:['Bogus'],e:'**Bogus Pipeline** (Sigall & Page, 1971).'},
{c:7,t:'tf',q:'Nach der Theory of Planned Behavior beeinflussen Einstellungen das Verhalten nur indirekt über die Intention.',a:true,e:'Richtig – Einstellung, subjektive Norm und wahrgenommene Kontrolle → Intention → Verhalten.'},
{c:7,t:'mc',q:'Ein Kind bekommt für das Nicht-Spielen mit einem attraktiven Spielzeug nur eine milde Strafandrohung. Was passiert laut Dissonanztheorie?',o:['Es wertet das Spielzeug langfristig ab','Es wertet das Spielzeug auf','Es zeigt Reaktanz und spielt sofort damit','Es passiert nichts, weil Kinder keine Dissonanz erleben'],a:0,e:'**Unzureichende Rechtfertigung** (Aronson & Carlsmith, 1963; Freedman, 1965) → „Ich will es eh nicht“.'},
{c:7,t:'gap',q:'Die Annahme, dass Einstellung und Verhalten gleich spezifisch gemessen werden müssen, heißt ___prinzip.',a:['Korrespondenz'],e:'**Korrespondenzprinzip**; Aggregationsprinzip = globale Einstellung → Verhaltensindex.'},
{c:7,t:'tf',q:'Zweiseitige Botschaften (Pro und Contra) wirken oft glaubwürdiger als einseitige.',a:true,e:'Richtig – Botschaftsmerkmal im Yale-Ansatz.'},
{c:7,t:'mc',q:'Nach dem Elaboration-Likelihood-Model wirkt der Expertenstatus einer Quelle am stärksten, wenn …',o:['die persönliche Relevanz niedrig ist','die Argumente besonders stark sind','die Person hohes Need for Cognition hat','die Person vorgewarnt wurde'],a:0,e:'Niedrige Relevanz → **periphere Route** → Hinweisreize wie Expertise zählen (Petty et al., 1981).'},
{c:7,t:'tf',q:'Genetisch beeinflusste Einstellungen gelten als besonders zugänglich und änderungsresistent.',a:true,e:'Richtig (Zwillingsstudien, v. a. affektive Einstellungen).'},
{c:7,t:'gap',q:'Wird ein neutraler Reiz mit einem positiven gepaart, überträgt sich die Bewertung auch auf einen dritten, mit ihm assoziierten Reiz. Das ist der ___-Attitude-Effekt.',a:['Spreading'],e:'**Spreading-Attitude-Effekt** (Walther, 2002).'},
{id:'q1wvrs3f',c:1,t:'gap',q:'Nach Lewin ist Verhalten eine Funktion von Person und ___.',a:['Umwelt','Situation'],e:'V = f(P, U) – Person-Situation-Interaktion.'},
{c:1,v:1,t:'mc',q:'Was beschreibt die Lewin-Formel D, F, V = f(P, U) und worauf legt die Sozialpsychologie den Schwerpunkt?',o:['Denken, Fühlen, Verhalten hängen von Person und Umwelt ab – Fokus Sozialpsychologie: Wechselwirkung P × U','Denken, Fühlen, Verhalten hängen nur von der Person ab – Fokus: stabile Merkmale','Verhalten hängt nur von der Umwelt ab – Fokus: gesellschaftliche Strukturen','Denken, Fühlen, Verhalten sind unabhängig voneinander – Fokus: Messfehler'],a:0,e:'Video Kap. 1: Persönlichkeitspsychologie fokussiert P, Soziologie U, Sozialpsychologie die Wechselwirkung.'},
{c:1,v:1,t:'tf',q:'Bei sehr großen Stichproben können auch sehr kleine, praktisch unbedeutende Effekte statistisch signifikant werden.',a:true,e:'Video Kap. 1.2: „signifikant“ heißt nicht „bedeutsam“ – deshalb Effektstärken berichten.'},
{c:1,v:1,t:'mc',q:'Warum werden Teilnehmende im Experiment zufällig auf die Bedingungen verteilt?',o:['Damit es keine Selbstselektion gibt und auch unbeobachtete Variablen im Mittel gleich verteilt sind','Damit die externe Validität automatisch hoch ist','Damit man auf eine Kontrollgruppe verzichten kann','Damit die Stichprobe größer wird'],a:0,e:'Video Kap. 1.2: Randomisierung schützt vor Konfundierung durch Selbstselektion.'},
{c:1,v:1,t:'gap',q:'Dass im Labor nicht die Situation, sondern die psychologischen Prozesse realistisch sein müssen, nennt man psychologischen ___.',a:['Realismus'],e:'Video Kap. 1.2: psychologischer Realismus (Coverstory hilft dabei).'},
{c:2,v:1,t:'mc',q:'Welche Aussage über Prototypen stimmt laut Video?',o:['Ein Prototyp ist ein abstrakter Durchschnitt aller Exemplare und meist kein reales Exemplar','Ein Prototyp ist immer das bekannteste reale Mitglied einer Kategorie','Ein Prototyp ist ein Schema über Handlungsabläufe','Ein Prototyp ist ein sozial geteiltes Stereotyp'],a:0,e:'Video Kap. 2.1: Kategorisierung kann prototypen- oder exemplarbasiert erfolgen.'},
{c:2,v:1,t:'ms',q:'Welche Aussagen zu Priming-Arten stimmen laut Video?',o:['Konzeptuelles Priming kann ein ganzes Schema aktivieren, auch ohne semantische Verwandtschaft','Subliminales Priming beschreibt die Art der Darbietung, nicht die Art der Verknüpfung','Prozedurales Priming kann kognitive oder behaviorale Prozeduren betreffen','Affektives Priming beruht auf sprachlicher Ähnlichkeit von Prime und Target'],a:[0,1,2],e:'Affektives Priming beruht auf gleicher Valenz, semantisches auf sprachlicher/inhaltlicher Verknüpfung.'},
{c:2,v:1,t:'tf',q:'Laut Video lässt sich Verhaltenspriming (z. B. Altenstereotyp → langsameres Gehen) genauso robust replizieren wie semantisches Priming.',a:false,e:'Bargh-Studie nicht repliziert; semantisches Priming ist sehr robust, Verhaltenspriming hängt von vielen Faktoren ab.'},
{c:2,v:1,t:'mc',q:'Ein schwarzes Männchen fällt unter vielen roten sofort auf. Wie heißt dieses Merkmal des Stimulus?',o:['Salienz – er hebt sich vom Kontext ab','Lebhaftigkeit – der Reiz selbst ist auffällig','Negativity Bias','Chronische Zugänglichkeit'],a:0,e:'Video Kap. 2.2: Lebhaftigkeit liegt im Reiz (rotes Männchen unter schwarzen), Salienz im Kontrast zur Umgebung.'},
{c:3,v:1,t:'mc',q:'Was passiert laut Video mit dem Ankereffekt, wenn man nach der komparativen Frage („Elbe länger als 1000 km?“) nach einer ANDEREN Dimension fragt (Wassertiefe)?',o:['Kein Ankereffekt, weil das aktivierte Wissen nicht anwendbar ist','Ein noch stärkerer Ankereffekt','Ein Kontrasteffekt','Derselbe Effekt wie bei der Länge'],a:0,e:'Beleg für das Selective Accessibility Model: Wirkung nur bei Anwendbarkeit.'},
{c:3,v:1,t:'mc',q:'Wie wirkt eine hohe Motivation, genau zu urteilen, beim vorgegebenen Anker (SAM)?',o:['Sie schwächt den Effekt kaum – mehr Hypothesentesten macht noch mehr ankerkonsistentes Wissen zugänglich','Sie beseitigt den Effekt vollständig','Sie kehrt den Effekt um','Sie wirkt nur bei Expert:innen'],a:0,e:'Bei Verankerung und Anpassung (selbstgenerierte Anker) reduziert Motivation dagegen den Effekt.'},
{c:3,v:1,t:'tf',q:'Laut Video verlassen sich Expert:innen eher auf das Gefühl der Leichtigkeit des Abrufs als Laien.',a:true,e:'Bei Expert:innen ist die Leichtigkeit diagnostischer; Laien verarbeiten eher systematisch.'},
{c:4,v:1,t:'mc',q:'Was unterscheidet Emotion und Stimmung laut Video vor allem?',o:['Die Objektbezogenheit','Die Valenz (positiv/negativ)','Ob sie angeboren sind','Ob sie physiologisch messbar sind'],a:0,e:'Beide können positiv oder negativ sein; Emotionen sind objektbezogen, meist intensiver und kürzer.'},
{c:4,v:1,t:'tf',q:'Laut Corcoran reicht es sicher, in derselben Stimmung zu lernen wie in der Prüfung, damit der Abruf besser klappt.',a:false,e:'Mood-state-dependent memory ist wenig stabil – wirkt eher, wenn die Stimmung beim Enkodieren bedeutsam mit der Information verbunden ist.'},
{c:4,v:1,t:'mc',q:'Ein pessimistischer Attributionsstil erklärt negative Ereignisse …',o:['internal, stabil und global','external, variabel und spezifisch','internal, variabel und spezifisch','external, stabil und global'],a:0,e:'Video Kap. 4.2; der optimistische Stil ist genau umgekehrt.'},
{c:5,v:1,t:'mc',q:'Welche Aussage zum Correspondence Bias stimmt laut Buch/Video?',o:['Der fundamentale Attributionsfehler ist ein Spezialfall des Correspondence Bias','Der Correspondence Bias ist ein Spezialfall des fundamentalen Attributionsfehlers','Beide Begriffe beschreiben unterschiedliche Richtungen der Verzerrung','Der Correspondence Bias tritt nur bei eigenen Handlungen auf'],a:0,e:'Correspondence Bias = Annahme, dass Verhalten und Persönlichkeit korrespondieren.'},
{c:5,v:1,t:'tf',q:'Anhand nonverbaler Signale lässt sich laut Forschung zuverlässig erkennen, ob jemand lügt.',a:false,e:'Video Kap. 5.1: Dafür gibt es praktisch keine empirische Evidenz.'},
{c:5,v:1,t:'mc',q:'Wann bekommt nonverbale Kommunikation laut Video besonders viel Gewicht?',o:['Wenn sie der verbalen Botschaft widerspricht','Wenn die Person sehr attraktiv ist','Wenn man die Person schon lange kennt','Nur bei schriftlicher Kommunikation'],a:0,e:'Sonst gehen verbal und nonverbal meist Hand in Hand.'},
{c:6,v:1,t:'mc',q:'Eine Studentin sitzt in der Statistikvorlesung und denkt an das Klischee „Frauen können kein Mathe“. Welche Bedrohung des Selbst ist das?',o:['Stereotype Threat','Sandbagging','Erwartungsverletzung','Terror Management'],a:0,e:'Video Kap. 6.3: Bedrohung über die soziale Identität (Gruppe mit negativem Stereotyp).'},
{c:6,v:1,t:'mc',q:'Ein naher Freund gewinnt einen Preis in einem Bereich, der dir völlig unwichtig ist. Was sagt Tesser voraus?',o:['Du sonnst dich in seinem Erfolg (Basking in Reflected Glory)','Du fühlst dich stark bedroht','Du wertest den Freund ab','Du betreibst Self-Handicapping'],a:0,e:'Bedrohlich ist es nur bei naher Person UND relevantem Bereich.'},
{c:6,v:1,t:'tf',q:'Soziale Anerkennung als Grund für ein Verhalten zählt laut Video zur intrinsischen Motivation.',a:false,e:'Sie gilt als extrinsisch – auch wenn das Bedürfnis, gemocht zu werden, „in uns“ liegt; die Übergänge sind fließend.'},
{c:6,v:1,t:'mc',q:'Was bedeutet „Defensive Attribution“?',o:['Bei Unglück anderer Ursachen sehen, die man hätte vermeiden können – bis hin zu Blaming the victim','Eigene Erfolge internal erklären','Den eigenen Beitrag zu Gruppenleistungen überschätzen','Vorab Hindernisse schaffen'],a:0,e:'Das gibt uns selbst das Gefühl von Kontrolle.'},
{c:7,v:1,t:'mc',q:'Welche Einstellungskomponente(n) erfasst das semantische Differenzial laut Video?',o:['Nur die affektive','Alle drei (A, B, C)','Nur die kognitive','Nur die behaviorale'],a:0,e:'Likert-Fragebögen können dagegen alle drei Komponenten erfassen.'},
{c:7,v:1,t:'mc',q:'Bei der Affective Misattribution Procedure (AMP) wird nach dem Einstellungsobjekt …',o:['ein neutraler Reiz (z. B. Schriftzeichen) gezeigt, den man bewerten soll','ein Wort mit klarer Valenz gezeigt, das man kategorisieren soll','eine Maus zum Körper gezogen','nur eine Taste gedrückt oder nicht'],a:0,e:'Der Affekt vom Einstellungsobjekt wird fälschlich dem neutralen Zeichen zugeschrieben. Klare Valenz = affektives Priming.'},
{c:7,v:1,t:'tf',q:'Implizite Einstellungsmessungen sind grundsätzlich die „wahrere“ Messung als explizite.',a:false,e:'Video Kap. 7: Beide können verzerrt sein; welche besser ist, hängt vom vorherzusagenden Verhalten ab.'},
{c:7,v:1,t:'mc',q:'In der Pille-Studie korrelierte die Einstellung zur Verhütung allgemein kaum mit der Pilleneinnahme (r ≈ .08). Was erhöht die Vorhersage?',o:['Eine ebenso spezifische Einstellung (die Pille in den nächsten zwei Jahren nehmen)','Eine noch globalere Einstellungsfrage','Mehr Teilnehmende bei gleicher Frage','Eine Messung der impliziten Einstellung zu Medizin'],a:0,e:'Korrespondenzprinzip.'},
{c:7,v:1,t:'mc',q:'Eine Einstellungsänderung über die periphere Route ist laut ELM im Vergleich zur zentralen Route …',o:['weniger stabil (fragil)','stabiler','gar nicht möglich','nur bei negativer Stimmung möglich'],a:0,e:'Zentrale Route → durchdachte, stabile Änderung; peripher → beruht auf Hinweisreizen wie Expertise, Länge der Rede, Anzahl der Argumente.'},
{c:7,v:1,t:'ms',q:'Unter welchen Bedingungen muss die Rechtfertigung unzureichend sein, damit Dissonanz zu Einstellungsänderung führt?',o:['Für das Bemühen','Für das Verhalten bzw. dessen Unterlassen','Für das unangenehme Gefühl','Für die eigene Stimmung am Vortag'],a:[0,1,2],e:'Video Kap. 7.2.6: drei Rechtfertigungsebenen.'},
{c:PQ,k:1,t:'mc',q:'Eine Studie findet: Je mehr Zeit Studierende in der Bibliothek verbringen, desto bessere Noten haben sie. Welche Schlussfolgerung ist zulässig?',o:['Bibliothekszeit und Noten hängen zusammen','Mehr Bibliothekszeit verursacht bessere Noten','Bessere Noten verursachen längere Bibliothekszeiten','Eine Drittvariable als Ursache ist damit ausgeschlossen'],a:0,e:'Korrelation → nur Zusammenhang, keine Richtung. Motivation könnte beides erklären (Drittvariable).'},
{c:PQ,k:1,t:'mc',q:'Welche Fragestellung untersucht am ehesten die Soziologie und nicht die Sozialpsychologie?',o:['Wie sich Einkommensschichten über Jahrzehnte verändern','Ob Zuschauer:innen die Leistung von Sportler:innen beeinflussen','Ob ein Spiegel im Raum das Schummeln in Tests reduziert','Wie die momentane Stimmung Produkturteile verändert'],a:0,e:'Gesellschaftliche Strukturen = Soziologie; die anderen fragen nach dem Einfluss der sozialen Situation auf das Individuum.'},
{c:PQ,k:1,t:'mc',q:'Forschende teilen Personen zufällig einer Bedingung mit lauter oder leiser Musik zu und messen danach die Konzentration. Was sichert die zufällige Zuteilung vor allem?',o:['Die interne Validität','Die externe Validität der Ergebnisse','Die Reliabilität der Konzentrationsmessung','Die statistische Power der Studie'],a:0,e:'Randomisierung verteilt Störvariablen gleichmäßig → Effekt eindeutig auf die UV zurückführbar.'},
{c:PQ,k:1,t:'ms',q:'Was erhöht die statistische Power einer Studie?',o:['Eine größere Stichprobe','Eine genauere Messung','Ein größerer Effekt in der Population','Ein strengeres Signifikanzniveau (p < .001)'],a:[0,1,2],e:'Power steigt mit n, Messgenauigkeit und Effektgröße. Ein strengeres α senkt die Power eher.'},
{c:PQ,k:1,t:'mc',q:'Eine Forscherin legt Hypothesen, Stichprobengröße und Analyseplan vor der Datenerhebung öffentlich fest. Wie nennt man das?',o:['Präregistrierung','Konzeptuelle Replikation','Many-Lab-Studie mit mehreren Laboren','Kontinuierliches Datenmonitoring'],a:0,e:'**Präregistrierung** – Kernelement von Open Science. Datenmonitoring („erheben, bis es passt“) ist eine fragwürdige Praxis.'},
{c:PQ,k:1,t:'mc',q:'Ein Team prüft den Prozess einer Priming-Studie erneut, nutzt aber andere Reize und eine andere abhängige Variable. Was ist das?',o:['Eine konzeptuelle Replikation','Eine direkte Replikation der Originalstudie','Eine Metaanalyse über mehrere Studien','Eine Präregistrierung des Designs'],a:0,e:'Gleicher Prozess, andere Operationalisierung = **konzeptuell**; direkte Replikation = möglichst exakte Wiederholung.'},
{c:PQ,k:1,t:'mc',q:'In einem 2×2-Experiment (Stimmung × Argumentstärke) überzeugen starke Argumente nur negativ Gestimmte; positiv Gestimmte sind von starken und schwachen Argumenten gleich überzeugt. Was liegt mindestens vor?',o:['Eine Interaktion','Nur ein Haupteffekt der Stimmung','Nur ein Haupteffekt der Argumentstärke','Kein Effekt, weil sich alles aufhebt'],a:0,e:'Der Effekt der Argumente hängt von der Stimmung ab → Interaktion (vgl. Bless et al., 1990).'},
{c:PQ,k:1,t:'ms',q:'Welche Praktiken können zu falsch-positiven signifikanten Ergebnissen beitragen?',o:['Daten erheben, bis p < .05 erreicht ist','Nur die signifikanten von vielen Studien berichten','Ausreißer nachträglich passend ausschließen','Hypothesen vor der Erhebung festlegen'],a:[0,1,2],e:'Fragwürdige Forschungspraktiken + Publication Bias. Präregistrierung wirkt dagegen.'},
{c:PQ,k:1,t:'mc',q:'Eine Skala misst Hilfsbereitschaft bei denselben Personen im Abstand einer Woche mit sehr ähnlichen Werten. Welches Gütekriterium ist damit belegt?',o:['Reliabilität','Validität der Skala','Externe Validität der Studie','Interne Validität des Designs'],a:0,e:'Stabile Messwerte → **Zuverlässigkeit** (Reliabilität). Ob wirklich Hilfsbereitschaft gemessen wird, ist Validität.'},
{c:PQ,k:1,t:'mc',q:'Welche Aussage über eine Coverstory trifft zu?',o:['Sie verbirgt den wahren Zweck der Studie','Sie ist die Aufklärung nach der Studie','Sie ersetzt die informierte Einwilligung','Sie misst die externe Validität eines Befunds'],a:0,e:'Deckgeschichte → psychologischer Realismus, natürlicheres Verhalten; Aufklärung (Debriefing) erfolgt danach.'},
{c:PQ,k:1,t:'mc',q:'„Je mehr Milch Kinder trinken, desto mehr nehmen sie zu.“ Welche Alternativerklärung ist am plausibelsten?',o:['Das Alter bzw. Wachstum der Kinder','Die Gewichtszunahme macht Kinder durstig','Ein starker Zusammenhang muss kausal sein','Milch wirkt als affektiver Prime für Hunger'],a:0,e:'Moodle-Übung „Alternativerklärungen“: Ältere, wachsende Kinder trinken mehr und nehmen ohnehin zu.'},
{c:PQ,k:1,t:'mc',q:'Ein Ergebnis ist mit p = .03 signifikant. Welche Interpretation ist korrekt?',o:['Ohne echten Effekt wäre so ein Ergebnis unwahrscheinlich','Der Effekt existiert mit 97 % Sicherheit wirklich','Eine Replikation wird zu 97 % wieder signifikant','Der Effekt ist dadurch auch praktisch bedeutsam'],a:0,e:'Klassische Fehlinterpretationen von p (Präsenz: „Signifikant heißt nicht …“).'},
{c:PQ,k:1,t:'mc',q:'Eine Forscherin untersucht, ob schon die bloße Vorstellung, beobachtet zu werden, prosoziales Verhalten erhöht. Welcher Teil der Definition der Sozialpsychologie ist gemeint?',o:['Die vorgestellte Anwesenheit anderer','Die tatsächliche Anwesenheit anderer Personen','Die Unterschiede zwischen einzelnen Individuen','Die Struktur gesellschaftlicher Institutionen'],a:0,e:'Tatsächlich – vorgestellt – implizit: Hier wird nur vorgestellt.'},
{c:PQ,k:2,t:'mc',q:'Nach dem Wort „Arzt“ wird „Krankenschwester“ schneller als Wort erkannt als „Butter“. Welcher Mechanismus erklärt das?',o:['Sich ausbreitende Aktivierung','Prozedurales Priming einer Operation','Der Inkonsistenzeffekt beim Abruf','Regelbasierte reflektive Verarbeitung'],a:0,e:'Semantisches Priming über **spreading activation** im assoziativen Netzwerk.'},
{c:PQ,k:2,t:'mc',q:'Personen suchen zuerst Gemeinsamkeiten zwischen Bildern. Danach vergleichen sie sich mit einer Person und sehen sich ihr ähnlicher. Welche Art Priming liegt vor?',o:['Prozedurales Priming','Affektives Priming über die Valenz','Semantisches Priming über die Bedeutung','Subliminales Priming eines Konzepts'],a:0,e:'Eine **Verarbeitungsprozedur** (Ähnlichkeitssuche) wird übertragen.'},
{c:PQ,k:2,t:'ms',q:'Welche Bedingungen begünstigen, dass das impulsive System das Verhalten steuert?',o:['Zeitdruck','Ablenkung durch eine Zweitaufgabe','Erschöpfte Selbstregulationsressourcen','Hohe Motivation und viel Zeit zum Nachdenken'],a:[0,1,2],e:'Das reflektive System braucht Motivation **und** Kapazität.'},
{c:PQ,k:2,t:'mc',q:'Lena nimmt sich vor: „Ich darf in der Prüfung nicht nervös werden.“ Unter Stress wird sie besonders nervös. Wie erklärt das RIM diesen Effekt?',o:['Das impulsive System ignoriert das „nicht“','Das reflektive System verstärkt die Nervosität','Die Nervosität ist ein klassischer Kontrasteffekt','Lena attribuiert ihre Erregung auf die Prüferin'],a:0,e:'Negationen versteht nur das reflektive System → **Bumerangeffekt**.'},
{c:PQ,k:2,t:'mc',q:'Teilnehmer:innen lesen eine Geschichte über „Carol Harris“. Später erfahren einige, es sei um Helen Keller gegangen. Was „erinnern“ sie dann eher?',o:['Dass die Frau taub und blind war','Den Text wortgetreuer als die Kontrollgruppe','Vor allem die schemainkonsistenten Details','Gar nichts mehr, weil das Schema blockiert'],a:0,e:'Rekonstruktive Erinnerung – Lücken werden schemabasiert gefüllt, obwohl das nicht im Text stand (Dooling & Christiansen, 1977).'},
{c:PQ,k:2,t:'mc',q:'Eine Gruppe soll sich zu Verhaltensweisen einer Person einen Eindruck bilden, eine andere soll sie nur auswendig lernen. Was zeigt sich (Hamilton et al., 1980)?',o:['Die Eindrucksgruppe erinnert besser','Die Lerngruppe erinnert besser, weil sie gezielt lernt','Beide Gruppen erinnern genau gleich viel','Die Eindrucksgruppe erinnert nur Negatives'],a:0,e:'Das **Verarbeitungsziel** steuert die Organisation: Eindrucksbildung → Integration → bessere Erinnerung.'},
{c:PQ,k:2,t:'mc',q:'Ein leidenschaftlicher Fußballfan denkt bei vielen mehrdeutigen Situationen sofort an Fußball. Welcher Begriff beschreibt das am besten?',o:['Chronische Zugänglichkeit','Situative Anwendbarkeit eines Primes','Mood repair nach negativer Stimmung','Der Inkonsistenzeffekt bei Schemata'],a:0,e:'Häufig genutzte Konzepte sind **chronisch zugänglich**.'},
{c:PQ,k:2,t:'ms',q:'Welche Aussagen treffen auf Skripte zu?',o:['Sie sind eine Sonderform von Schemata','In guter Stimmung nutzt man sie stärker','Sie können Erinnerungslücken auffüllen','Sie bezeichnen den typischsten Vertreter einer Kategorie'],a:[0,1,2],e:'Der typischste Vertreter = Prototyp. Bless et al. (1996): positive Stimmung → Skriptnutzung → falsche Wiedererkennung typischer Ereignisse.'},
{c:PQ,k:2,t:'mc',q:'Bei Payne et al. (2016) wurden beim Kartenspiel kurz die Wörter BET oder PASS eingeblendet. Was zeigte sich bei mittelguten Karten?',o:['Die Entscheidungen folgten den Wörtern','Die Wörter wirkten nur, wenn sie bewusst gesehen wurden','Die Wörter führten zum Gegenteil (Kontrasteffekt)','Ein Effekt zeigte sich nur bei sehr guten Karten'],a:0,e:'Subliminale Primes können Verhalten beeinflussen – v. a. in mehrdeutiger Lage.'},
{c:PQ,k:2,t:'mc',q:'Welche Aussage über das reflektive System ist FALSCH?',o:['Es arbeitet parallel und assoziativ','Es arbeitet regelbasiert mit logischen Propositionen','Es braucht Motivation und kognitive Ressourcen','Es kann Negationen wie „nicht“ verarbeiten'],a:0,e:'Parallele, assoziative Verarbeitung über Aktivierungsausbreitung = **impulsives** System.'},
{c:PQ,k:2,t:'mc',q:'Ein unerwartetes Detail (die Professorin kommt im Clownskostüm) wird später besonders gut erinnert. Unter welcher Bedingung ist dieser Effekt am stärksten?',o:['Bei genug Motivation und Kapazität','Bei starkem Zeitdruck während des Sehens','Wenn das Detail gut zum Schema passt','In besonders positiver, sorgloser Stimmung'],a:0,e:'**Inkonsistenzeffekt** braucht Verarbeitungsressourcen.'},
{c:PQ,k:2,t:'ms',q:'Welche Reize ziehen besonders leicht Aufmerksamkeit auf sich?',o:['Persönlich relevante Reize wie der eigene Name','Saliente und lebhafte Reize','Unerwartete Reize','Vollständig erwartete, völlig unauffällige Reize'],a:[0,1,2],e:'Relevanz, Salienz, Lebhaftigkeit, Unerwartetheit (und Erwartungen) lenken die Aufmerksamkeit.'},
{c:PQ,k:3,t:'mc',q:'In einem Spital werden täglich ca. 45 Babys geboren, in einem anderen ca. 15. In welchem gibt es eher Tage mit über 60 % Buben?',o:['Im kleinen Spital','Im großen Spital, weil es mehr Geburten gibt','In beiden Spitälern ungefähr gleich häufig','Das lässt sich ohne die Basisrate nicht sagen'],a:0,e:'Kleine Stichproben schwanken stärker → **Vernachlässigung der Stichprobengröße** (Repräsentativitätsheuristik).'},
{c:PQ,k:3,t:'mc',q:'Personen sollen 2 oder 10 Argumente für ein Produkt nennen. Wer 10 nennen musste, bewertet das Produkt schlechter. Was erklärt das am besten?',o:['Die erlebte Schwierigkeit des Abrufs','Die Zahl 10 wirkt als numerischer Anker','Die Personen nutzen die Basisrate stärker','Die Argumente waren weniger repräsentativ'],a:0,e:'Leichtigkeit des Abrufs wird als Information genutzt (wie Schwarz et al., 1991).'},
{c:PQ,k:3,t:'mc',q:'Wie im vorigen Fall, aber den Personen wird gesagt, die Hintergrundmusik erschwere das Nachdenken. Was ist zu erwarten?',o:['Der Schwierigkeitseffekt verschwindet','Der Schwierigkeitseffekt wird noch stärker','Die Musik wirkt als zusätzlicher Anker','Es ändert sich am Urteil gar nichts'],a:0,e:'Alternativerklärung für das (Nicht-)Leichtigkeitsgefühl → es verliert seinen Informationswert, der **Inhalt** zählt.'},
{c:PQ,k:3,t:'mc',q:'Ein Richter liest vor seinem Urteil die Strafforderung der Staatsanwaltschaft; sein Urteil fällt in diese Richtung aus. Was erklärt das nach dem SAM?',o:['Passendes Wissen wird selektiv zugänglich','Er korrigiert bewusst und ausreichend weg','Er ignoriert die Forderung vollständig','Er nutzt die Basisrate früherer Urteile'],a:0,e:'Vorgegebener Anker → Hypothesentest „Ist das angemessen?“ → **ankerkonsistentes Wissen** wird zugänglich.'},
{c:PQ,k:3,t:'ms',q:'Welche Maßnahmen können den Ankereffekt bei vorgegebenen Ankern verringern?',o:['Gründe überlegen, warum der Anker falsch ist','Eine allgemeine Warnung vor Ankereffekten','Eine Geldprämie für genaue Schätzungen','Den Anker mehrmals wiederholen'],a:[0],e:'Beim SAM helfen Warnungen und Motivation kaum; **Consider the Opposite** aktiviert ankerinkonsistentes Wissen.'},
{c:PQ,k:3,t:'mc',q:'Nach einem Flugzeugabsturz in den Nachrichten fahren viele lieber mit dem Auto in den Urlaub, obwohl das gefährlicher ist. Was treibt diese Fehleinschätzung?',o:['Recency und Lebhaftigkeit','Die bekannte Basisrate von Flugunfällen','Ein selbstgenerierter numerischer Anker','Die korrekt angewandte Konjunktionsregel'],a:0,e:'Kürzlich, medial präsent, lebhaft → leicht verfügbar → überschätzt.'},
{c:PQ,k:3,t:'mc',q:'Eine Person wird als still, ordentlich und detailverliebt beschrieben. Man hält sie eher für eine Bibliothekarin als für eine Verkäuferin, obwohl es viel mehr Verkäuferinnen gibt. Welcher Fehler liegt vor?',o:['Vernachlässigung der Basisrate','Konjunktionstäuschung','Ankerassimilation','Illusorische Korrelation'],a:0,e:'Repräsentativität wird über die Basisrate gestellt.'},
{c:PQ,k:3,t:'mc',q:'Warum werden Zusammenhänge zwischen zwei seltenen Ereignissen (z. B. Vollmond und volle Notaufnahmen) oft überschätzt?',o:['Gemeinsames Auftreten bleibt besser hängen','Seltene Ereignisse wirken repräsentativer','Der Vollmond wirkt als numerischer Anker','Man gewichtet die Basisrate zu stark'],a:0,e:'Gemeinsames Auftreten wird besser erinnert als gemeinsames Nicht-Auftreten → **illusorische Korrelation**.'},
{c:PQ,k:3,t:'mc',q:'Warum verstärkt Zeitdruck den Ankereffekt bei selbstgenerierten Ankern?',o:['Die Korrektur bricht früher ab','Ankerkonsistentes Wissen wird zugänglicher','Die Basisrate wird stärker genutzt','Der Anker wird dadurch ignoriert'],a:0,e:'**Verankerung und Anpassung** – die Anpassung braucht Ressourcen; unter Zeitdruck bleibt sie unzureichend.'},
{c:PQ,k:3,t:'mc',q:'Wann ist laut Lehrbuch der Inhalt der abgerufenen Beispiele wichtiger als das Gefühl der Leichtigkeit?',o:['Bei hoher persönlicher Relevanz','Bei positiver, entspannter Stimmung','Bei sehr wenig verfügbarer Zeit','Wenn sich der Abruf leicht anfühlt'],a:0,e:'Hohe Relevanz (und negative Stimmung) → systematische Verarbeitung → Inhalt zählt.'},
{c:PQ,k:3,t:'mc',q:'Beim Gebrauchtwagenkauf nennt der Verkäufer zuerst einen hohen Preis. Was hilft der Käuferin am meisten?',o:['Gründe für einen niedrigen Preis sammeln','Lange schweigen, bis der Anker verblasst','Den Preis bewusst gar nicht anhören','Sich nur auf das Bauchgefühl verlassen'],a:0,e:'Erstes Gebot wirkt stark (Galinsky & Mussweiler); Gegenstrategie: ankerinkonsistentes Wissen aktivieren (Consider the Opposite).'},
{c:PQ,k:4,t:'mc',q:'Max hat schlechte Laune, weil er im Stau stand, und bewertet danach ein neues Lokal schlecht. Ein Freund fragt vorher: „Nervt dich der Stau noch?“ Was ist zu erwarten?',o:['Max urteilt weniger negativ','Max urteilt noch negativer','Die Frage hat keinen Einfluss','Max wird dadurch kreativer'],a:0,e:'Ursache der Stimmung wird salient → Stimmung verliert ihren Informationswert (wie Schwarz & Clore).'},
{c:PQ,k:4,t:'mc',q:'Warum fördert positive Stimmung nach dem Lehrbuch die Kreativität?',o:['Sie erlaubt globale, flexible Verarbeitung','Sie erzeugt Erregung, die neue Ideen auslöst','Sie lenkt die Aufmerksamkeit auf Details','Sie aktiviert stärker das reflektive System'],a:0,e:'Positive Stimmung = Sicherheitssignal → globaler Fokus, top-down, ungewöhnliche Verknüpfungen.'},
{c:PQ,k:4,t:'ms',q:'Welche Aussagen über den indirekten Einfluss der Stimmung auf Urteile (Affekt-Priming) sind richtig?',o:['Kongruente Inhalte werden zugänglicher','Er wirkt v. a. bei komplexen Aufgaben','Er läuft über „Wie fühle ich mich dabei?“','Er endet, sobald man die Ursache kennt'],a:[0,1],e:'„Wie fühle ich mich dabei?“ und die Korrektur durch die Ursache betreffen den **direkten** Einfluss (How-do-I-feel).'},
{c:PQ,k:4,t:'mc',q:'Sara bekommt eine schlechte Note, weil sie nicht gelernt hat. Welche Emotion ist nach der kognitiven Bewertungstheorie am wahrscheinlichsten?',o:['Schuld','Scham','Ärger','Mitleid'],a:0,e:'Negativ + internal + kontrollierbar (Anstrengung) = Schuld. Bei fehlendem Talent (unkontrollierbar) = Scham.'},
{c:PQ,k:4,t:'mc',q:'Ein Kollege scheitert, weil ihm das Talent fehlt. Wie reagierst du nach der Attributionstheorie der Emotionen eher?',o:['Mit Mitleid','Mit Ärger','Mit Schuld','Mit Stolz'],a:0,e:'External (anderer) + unkontrollierbar = **Mitleid**; bei mangelnder Anstrengung (kontrollierbar) = Ärger.'},
{c:PQ,k:4,t:'mc',q:'Mit noch erhöhtem Puls aus dem Fitnessstudio findet jemand einen Witz besonders lustig. Welche Theorie erklärt das am besten?',o:['Die Zwei-Faktoren-Theorie','Die How-do-I-feel-about-Heuristik','Das stimmungsabhängige Gedächtnis','Die Theorie der Selbstwerterhaltung'],a:0,e:'Unspezifische Rest-Erregung wird dem Witz zugeschrieben (Fehlattribution) → intensiveres Gefühl.'},
{c:PQ,k:4,t:'mc',q:'Personen in guter Stimmung hören eine Geschichte über einen Restaurantbesuch und sollen sie später wiedererkennen. Welcher Fehler passiert ihnen eher?',o:['Typische, nicht genannte Ereignisse „erkennen“','Nur die ungewöhnlichen Details erkennen','Sich überhaupt an nichts mehr erinnern','Keinen Fehler, weil sie genau verarbeiten'],a:0,e:'Bless et al. (1996): positive Stimmung → Skriptnutzung → falsche Wiedererkennung.'},
{c:PQ,k:4,t:'mc',q:'Welche Aussage über emotionale Ansteckung ist richtig?',o:['Sie läuft über Imitation und Feedback','Sie setzt Wissen über die Ursache voraus','Sie funktioniert nur visuell, nicht akustisch','Sie betrifft Emotionen, aber nie Stimmungen'],a:0,e:'Neumann & Strack (2000): schon eine Stimme reicht; Ansteckung über unbewusste Imitation → Body Feedback.'},
{c:PQ,k:4,t:'mc',q:'Warum erinnern depressive Personen bei Ruiz-Caballero & Gonzalez (1994) mehr negative Wörter?',o:['Stimmungskongruentes Gedächtnis','Mood repair nach negativen Ereignissen','Inkonsistenzeffekt beim Abruf','Erregungstransfer durch Grübeln'],a:0,e:'**Mood-congruent memory** – Inhalte, die zur Stimmung passen, werden leichter abgerufen.'},
{c:PQ,k:4,t:'mc',q:'Welche Aussage passt NICHT zur negativen Stimmung?',o:['Stärkerer Rückgriff auf Stereotype','Detailorientierte, lokale Verarbeitung','Höhere Sensibilität für Argumentqualität','Signal, dass die Lage problematisch ist'],a:0,e:'Stereotype/Heuristiken nutzt man eher in **positiver** Stimmung (Bodenhausen et al., 1994).'},
{c:PQ,k:4,t:'ms',q:'Max steht nach einem Sprint neben einer Person, die ihn anschreit, und fühlt starke Wut. Was trifft nach Schachter & Singer zu?',o:['Die Sprint-Erregung erhöht die Intensität','Die Kognition „er schreit mich an“ legt die Wut fest','Ohne Erregung wäre die Emotion schwächer','Jede Emotion hat ein eigenes Erregungsmuster'],a:[0,1,2],e:'Erregung ist unspezifisch (Intensität), die Kognition bestimmt die Qualität. Spezifische Erregungsmuster widersprechen der Theorie.'},
{c:PQ,k:4,t:'mc',q:'Van den Bos (2003): Wann nutzen Menschen ihre Stimmung besonders stark als Information für Fairnessurteile?',o:['Wenn klare Fairness-Infos fehlen','Wenn sie sehr viele Informationen haben','Wenn sie in neutraler Stimmung sind','Wenn sie die Ursache der Stimmung kennen'],a:0,e:'Stimmung als Information v. a. unter **Urteilsunsicherheit**.'},
{c:PQ,k:4,t:'mc',q:'Was ergab die groß angelegte Replikation (Yap et al., 2017) der Wetter-Studie von Schwarz & Clore (1983)?',o:['Kaum einen Wetter-Effekt','Einen noch größeren Effekt','Eine exakte Bestätigung','Dass Regen glücklicher macht'],a:0,e:'Kein bzw. nur ein sehr kleiner Zusammenhang zwischen Wetter und Lebenszufriedenheit (Replikationsstudie 4.1).'},
{c:PQ,k:5,t:'mc',q:'Eine Lehrerin hält einen Schüler für begabt und gibt ihm mehr Aufmerksamkeit; er wird tatsächlich besser. Wie heißt das?',o:['Sich selbst erfüllende Prophezeiung','Halo-Effekt durch die Begabung','Akteur-Beobachter-Divergenz','Kontrasteffekt zu anderen Kindern'],a:0,e:'Erwartung → eigenes Verhalten → erwartungskonformes Verhalten des anderen (Snyder et al., 1977).'},
{c:PQ,k:5,t:'mc',q:'Ein Chef sieht einen Mitarbeiter einmal unpünktlich und hält ihn sofort für unzuverlässig – obwohl ein Zugausfall bekannt war. Welche Verzerrung ist das?',o:['Fundamentaler Attributionsfehler','Self-Serving Bias des Chefs','Egocentric Bias bei Teamarbeit','Positives Hypothesentesten'],a:0,e:'Situation (Zugausfall) wird unterschätzt, Disposition überschätzt.'},
{c:PQ,k:5,t:'mc',q:'Nur Clara lacht im Kabarett nicht; sie lacht auch bei anderen Komiker:innen nie und hat bei diesem schon öfter nicht gelacht. Worauf wird attribuiert?',o:['Auf Clara','Auf den Komiker','Auf Zufall','Auf beide zusammen'],a:0,e:'Konsensus niedrig, Distinktheit niedrig, Konsistenz hoch → **internal** (Person).'},
{c:PQ,k:5,t:'mc',q:'Alle lachen beim Komiker, Clara auch – sie lacht aber sonst bei niemandem und hat bei ihm immer gelacht. Worauf wird attribuiert?',o:['Auf den Komiker','Auf Clara','Auf Zufall','Gar nicht möglich'],a:0,e:'Konsensus hoch, Distinktheit hoch, Konsistenz hoch → **Stimulus**.'},
{c:PQ,k:5,t:'mc',q:'Warum attribuiert man nach dem zweistufigen Modell unter Zeitdruck stärker dispositional?',o:['Die situative Korrektur entfällt','Zeitdruck aktiviert das reflektive System','Zeitdruck senkt den Konsensus','Zuerst wird immer external attribuiert'],a:0,e:'Schritt 1 automatisch internal, Schritt 2 (Korrektur um die Situation) braucht Kapazität.'},
{c:PQ,k:5,t:'ms',q:'Welche Faktoren verstärken den Correspondence Bias?',o:['Die Person ist besonders salient','Wenig Zeit und Kapazität','Besonders diagnostisches Verhalten','Kollektivistischer Kulturhintergrund'],a:[0,1,2],e:'In kollektivistischen Kulturen ist der Bias **schwächer**.'},
{c:PQ,k:5,t:'mc',q:'Männer sehen sexistische Werbespots und führen danach ein Bewerbungsgespräch mit einer Frau. Was zeigen Rudman & Borgida (1995)?',o:['Sie halten sie für weniger kompetent','Sie halten sie für kompetenter','Die Spots haben keinen Einfluss','Sie stellen mehr Fachfragen'],a:0,e:'Priming von Konzepten (Voreinstellungen des Beurteilers): stärker als Sexualobjekt, weniger kompetent wahrgenommen.'},
{c:PQ,k:5,t:'mc',q:'Ein Verkaufs- und ein Produktionsmanager lesen denselben Firmenbericht. Was ist nach Dearborn & Simon (1958) zu erwarten?',o:['Jeder sieht Probleme im eigenen Bereich','Beide sehen exakt dieselben Probleme','Beide übersehen sämtliche Probleme','Der Verkäufer sieht Produktionsprobleme'],a:0,e:'Beruflicher Hintergrund = Kontext/Voreinstellung des Beurteilers.'},
{c:PQ,k:5,t:'ms',q:'Welche Merkmale lassen eine Person laut Lehrbuch eher kompetent, autoritär oder glaubwürdig erscheinen?',o:['Uniform oder Arztkittel','Größere Körpergröße','Viel Blickkontakt','Schwer lesbarer, seltener Name'],a:[0,1,2],e:'Ein schwer lesbarer Name senkt eher die Sympathie (Fluency).'},
{c:PQ,k:5,t:'mc',q:'Warum erscheinen uns unsere Personenurteile trotz Verzerrungen meist akkurat?',o:['Andere teilen unsere Urteile','Verzerrungen heben sich immer auf','Der Bias tritt nur bei Fremden auf','Erste Eindrücke sind immer korrekt'],a:0,e:'Begrenzte Situationen, geteilte Vorurteile, sich selbst erfüllende Prophezeiung.'},
{c:PQ,k:5,t:'mc',q:'Bei Taylor et al. (1977) wird eine Person in einer Gruppe als besonders einflussreich gesehen. Warum?',o:['Sie fällt durch ein Merkmal auf','Sie hat objektiv am meisten gesagt','Sie sitzt am weitesten entfernt','Sie ist dem Beobachter ähnlich'],a:0,e:'**Salienz** (z. B. einzige Person mit anderer Hautfarbe) → Überschätzung dispositionaler Ursachen.'},
{c:PQ,k:5,t:'mc',q:'Turner:innen mit späterer Startnummer erhalten bei gleicher Leistung bessere Noten. Wodurch lässt sich das erklären?',o:['Annahmen über Reihenfolgen','Den Mere-Exposure-Effekt','Self-Handicapping der Jury','Die Konjunktionstäuschung'],a:0,e:'Persönliche Annahmen über Reihenfolgen (Leistungssteigerung erwartet; Lehrbuch 5.3.3).'},
{c:PQ,k:5,t:'mc',q:'Welche Aussage über Behavior-trait-inferences ist richtig?',o:['Sie entstehen automatisch','Sie erfordern eine Kovariationsanalyse','Sie entstehen nur bei negativem Verhalten','Sie sind der kontrollierte zweite Schritt'],a:0,e:'Assoziativer Weg von Verhalten zu Eigenschaft – besonders mit dem Ziel der Eindrucksbildung.'},
{c:PQ,k:5,t:'mc',q:'Nach einem Artikel über einen extrem brutalen Diktator wird eine neutrale Person als freundlicher bewertet. Wie heißt das?',o:['Kontrasteffekt','Assimilationseffekt','Halo-Effekt','Mere-Exposure-Effekt'],a:0,e:'Extremer Vergleichsstandard → Kontrast.'},
{c:PQ,k:6,t:'mc',q:'Mia, sehr gut in Mathe, ist die einzige Frau in einem Mathe-Seminar. Welcher Selbstaspekt wird dort besonders zugänglich?',o:['Ihr Geschlecht','Ihre Mathekompetenz','Ihre Nationalität','Gar keiner'],a:0,e:'**Temporäre Zugänglichkeit** durch Salienz (abweichendes Merkmal in der Situation).'},
{c:PQ,k:6,t:'mc',q:'Jonas verpasst den Zug um 1 Minute und ärgert sich mehr als Tim, der ihn um 30 Minuten verpasst. Was erklärt das?',o:['Mehr aufwärts gerichtetes kontrafaktisches Denken','Tim betreibt vorab gezielt Self-Handicapping','Ein extremer Standard erzeugt bei Jonas Kontrast','Tim attribuiert sein Zuspätkommen internal'],a:0,e:'Kontrafaktisches Denken („hätte ich nur …“) ist bei knappem Verfehlen besonders häufig.'},
{c:PQ,k:6,t:'mc',q:'Eine Sportlerin vergleicht sich vor dem Wettkampf mit der Olympiasiegerin und fühlt sich danach schwächer. Was ist nach dem SAM am wahrscheinlichsten passiert?',o:['Kontrast durch Fokus auf Unterschiede','Assimilation durch Fokus auf Ähnlichkeit','Selbsterkenntnis durch lateralen Vergleich','Selbsterhöhung durch Abwärtsvergleich'],a:0,e:'Extrem hohe Standards führen meist zu Kontrast.'},
{c:PQ,k:6,t:'mc',q:'Wann ist der Erfolg eines engen Freundes nach Tesser für den eigenen Selbstwert eher eine Bereicherung als eine Bedrohung?',o:['Wenn der Bereich für mich unwichtig ist','Wenn der Bereich für mich sehr wichtig ist','Wenn wir uns besonders nahestehen','Wenn ich im selben Bereich schlechter bin'],a:0,e:'Irrelevanter Bereich → **Reflexion** („Sonnen im Glanz“); relevanter Bereich + Nähe → Vergleich und Bedrohung.'},
{c:PQ,k:6,t:'mc',q:'Ein Student erzählt vor der Prüfung allen, er habe kaum gelernt, obwohl er viel gelernt hat. Wie heißt das?',o:['Sandbagging','Self-Handicapping','Self-Affirmation','Egocentric Bias'],a:0,e:'Sandbagging = Erwartungen durch Herunterspielen senken; Self-Handicapping = ein echtes Hindernis schaffen.'},
{c:PQ,k:6,t:'mc',q:'Nach schlechtem Feedback im Job denkt Lea daran, wie gut sie als Freundin und Musikerin ist, und fühlt sich besser. Welche Strategie ist das?',o:['Self-Affirmation','Self-Evaluation Maintenance','Abwärtsgerichteter Vergleich','Selbstverifizierung'],a:0,e:'Selbstwert in anderen, nicht bedrohten Bereichen bestätigen.'},
{c:PQ,k:6,t:'mc',q:'Kinder, die allein in einem Raum mit Spiegel sind, nehmen weniger Süßigkeiten als erlaubt. Welcher Mechanismus erklärt das?',o:['Selbstaufmerksamkeit','Selbstüberwachung','Ego-Depletion','Mere Exposure'],a:0,e:'Beaman et al. (1979): Spiegel → Selbstaufmerksamkeit → innere Normen.'},
{c:PQ,k:6,t:'mc',q:'Wer ist am ehesten vom Schwarzen-Schaf-Effekt betroffen?',o:['Ein schwaches Eigengruppenmitglied','Ein schwaches Fremdgruppenmitglied','Ein starkes Eigengruppenmitglied','Eine neutrale Person ohne Gruppe'],a:0,e:'Es bedroht die positive soziale Identität → besonders harte Abwertung.'},
{c:PQ,k:6,t:'ms',q:'Welche Aussagen über das Selbst in unterschiedlichen Kulturen sind richtig?',o:['Westliche Kulturen fördern eher ein independentes Selbst','Interdependenz geht mit kontextabhängiger Verarbeitung einher','In kollektivistischen Kulturen ist der Correspondence Bias schwächer','Interdependente definieren sich v. a. über kontextfreie Eigenschaften'],a:[0,1,2],e:'Interdependent = Definition über Beziehungen und Kontext.'},
{c:PQ,k:6,t:'mc',q:'Personen merken sich Wörter mit der Frage „Beschreibt mich das?“, andere mit „Ist das Wort lang?“. Wer erinnert mehr?',o:['Die „Beschreibt mich das?“-Gruppe','Die „Ist das Wort lang?“-Gruppe','Beide Gruppen gleich viel','Keine – Selbstbezug stört'],a:0,e:'**Self-Reference-Effekt**: Selbstbezug → tiefere Verarbeitung → bessere Erinnerung.'},
{c:PQ,k:6,t:'mc',q:'Jemand fühlt sich ängstlich und besorgt, weil er nicht so ist, wie seine Eltern es von ihm erwarten. Welche Diskrepanz liegt nach Higgins (1987) vor?',o:['Aktuelles vs. Soll-Selbst','Aktuelles vs. Ideal-Selbst','Ideal- vs. Soll-Selbst','Working Self vs. Selbstkonzept'],a:0,e:'Soll-Selbst-Diskrepanz → agitierte Gefühle (Angst, Besorgnis); Ideal-Diskrepanz → Niedergeschlagenheit.'},
{c:PQ,k:6,t:'mc',q:'Ein Kind malt gern. Es bekommt eine Urkunde fürs Malen und malt danach seltener freiwillig. Welche Erklärung passt?',o:['Überrechtfertigung','Dissonanz mit Aufwertung','Reaktanz gegen die Lehrerin','Self-Handicapping'],a:0,e:'Selbstwahrnehmung → Malen wird der Belohnung zugeschrieben → weniger intrinsische Motivation.'},
{c:PQ,k:6,t:'mc',q:'Welche Aussage über die Ego-Depletion-Forschung ist nach dem Lehrbuch richtig?',o:['Große Replikation scheiterte, Feldstudien zeigen aber Effekte','Alle Replikationen haben den Effekt klar bestätigt','Der Ansatz gilt als widerlegt und wird nicht diskutiert','Ego-Depletion betrifft nur das impulsive System'],a:0,e:'Replikationsstudie 6.1 (Baumeister et al., 1998; Hagger et al., 2016); Feldstudien zur Krankenhaushygiene zeigen Nachlassen über die Zeit.'},
{c:PQ,k:6,t:'mc',q:'Personen erhalten negatives Feedback und sehen danach eine überlegene Vergleichsperson. Was tun sie nach Mussweiler et al. (2000) zum Schutz des Selbstwerts?',o:['Sie betonen die Unterschiede','Sie betonen die Ähnlichkeiten','Sie vergleichen sich öfter','Sie werten sich selbst ab'],a:0,e:'Unterschiede betonen → die Person wird für das eigene Selbstbild irrelevant.'},
{c:PQ,k:7,t:'mc',q:'Nach einer schweren Wahl zwischen zwei gleich guten Jobs bewertet Nina den gewählten Job danach deutlich besser. Was ist das?',o:['Dissonanzreduktion','Mere-Exposure-Effekt','Reaktanz','Evaluative Konditionierung'],a:0,e:'Nach irreversiblen Entscheidungen wird die gewählte Alternative auf- und die abgelehnte abgewertet.'},
{c:PQ,k:7,t:'mc',q:'Ein Werbespot zeigt eine beliebte Sängerin mit einem Getränk, dazu fröhliche Musik. Über welchen Mechanismus soll die Einstellung zum Getränk entstehen?',o:['Evaluative Konditionierung','Kognitive Dissonanz','Einstellungsimpfung','Selbstwahrnehmung'],a:0,e:'Neutraler Reiz (Produkt) + positiver Reiz → Valenz wird übertragen.'},
{c:PQ,k:7,t:'mc',q:'Eltern wollen, dass ihr Kind dauerhaft keine Süßigkeiten vor dem Essen mag. Was ist nach der Dissonanztheorie langfristig am wirksamsten?',o:['Eine milde Ermahnung','Eine strenge Strafandrohung','Eine große Belohnung','Gar nichts sagen'],a:0,e:'Unzureichende externe Rechtfertigung → das Kind rechtfertigt den Verzicht innerlich (Aronson & Carlsmith, 1963).'},
{c:PQ,k:7,t:'ms',q:'Was sollte man beachten, wenn man Einstellungen über Dissonanz verändern will?',o:['Verhalten öffentlich und unwiderruflich machen','Externe Rechtfertigungen gering halten','Die Inkonsistenz bewusst machen','Möglichst hohe Belohnungen bieten'],a:[0,1,2],e:'Präsenzfolie „Einstellungsänderung durch Dissonanzreduktion“; eine hohe Belohnung wäre eine ausreichende Rechtfertigung.'},
{c:PQ,k:7,t:'mc',q:'Eine Kampagne will Jugendliche gegen spätere Zigarettenwerbung wappnen. Welche Strategie entspricht der Einstellungsimpfung?',o:['Schwache Pro-Rauch-Argumente widerlegen lassen','Starke Pro-Rauch-Argumente unkommentiert zeigen','Nur Argumente gegen das Rauchen wiederholen','Zigarettenwerbung grundsätzlich verbieten'],a:0,e:'Kleine Dosis schwacher Gegenargumente → eigene Gegenargumente → Abwehr aufbauen.'},
{c:PQ,k:7,t:'mc',q:'Auf einem Schild steht: „Graffiti hier STRENG verboten – Anzeige!“ An dieser Wand gibt es mehr Graffiti als an einer mit mildem Hinweis. Wie heißt das?',o:['Reaktanz','Einstellungsimpfung','Vorwarnung','Selbstwahrnehmung'],a:0,e:'Pennebaker & Sanders (1976).'},
{c:PQ,k:7,t:'mc',q:'Die allgemeine Einstellung zum Umweltschutz sagt schlecht voraus, ob jemand am Samstag Altglas wegbringt. Welches Prinzip erklärt das?',o:['Korrespondenzprinzip','Aggregationsprinzip','Mere Exposure','Balance-Theorie'],a:0,e:'Globale Einstellung vs. spezifisches Verhalten → mangelnde Korrespondenz.'},
{c:PQ,k:7,t:'mc',q:'Was lässt sich aus einer globalen Umwelteinstellung am besten vorhersagen?',o:['Ein Index vieler Umweltverhaltensweisen','Ob jemand morgen das Rad nimmt','Ob jemand eine bestimmte Petition unterschreibt','Ob jemand eine bestimmte Zahnpasta kauft'],a:0,e:'**Aggregationsprinzip**: globale Einstellung → Verhaltensindex.'},
{c:PQ,k:7,t:'mc',q:'Lukas findet Sport gut und seine Freunde erwarten, dass er mitkommt – trotzdem trainiert er nicht, weil er glaubt, neben der Arbeit keine Zeit zu haben. Welche TPB-Komponente ist niedrig?',o:['Wahrgenommene Verhaltenskontrolle','Einstellung gegenüber dem Verhalten','Subjektive Norm','Implizite Einstellung'],a:0,e:'Theory of Planned Behavior: Einstellung + subjektive Norm sind hoch, aber die **wahrgenommene Kontrolle** fehlt.'},
{c:PQ,k:7,t:'mc',q:'Personen werden an einen angeblichen Lügendetektor angeschlossen und geben dann stärkere Vorurteile an. Was wird dadurch vor allem reduziert?',o:['Der Einfluss sozialer Erwünschtheit','Die Zugänglichkeit impliziter Einstellungen','Die Reliabilität der Messung','Die Ambivalenz der Einstellung'],a:0,e:'Bogus Pipeline (Sigall & Page, 1971).'},
{c:PQ,k:7,t:'mc',q:'Studierende hören eine Rede für eine Pflichtprüfung, die erst in 10 Jahren kommen soll. Was beeinflusst ihre Zustimmung am stärksten?',o:['Die Expertise des Redners','Die Qualität der Argumente','Die Zahl der Gegenargumente','Die eigene Stimmung'],a:0,e:'Niedrige Relevanz → periphere Route (Petty et al., 1981).'},
{c:PQ,k:7,t:'mc',q:'Welche Aussage über implizite und explizite Einstellungen trifft zu?',o:['Implizite sagen eher spontanes Verhalten vorher','Beide stimmen immer überein','Explizite werden mit dem IAT gemessen','Implizite sind stets bewusst zugänglich'],a:0,e:'Implizit = automatisch → impulsives Verhalten; explizit = bewusst → reflektiertes Verhalten.'},
{c:PQ,k:7,t:'mc',q:'Personen lachen trotz störender Lachkonserven über Witze und bewerten sie danach als besonders lustig. Was erklärt das (Olson, 1992)?',o:['Selbstwahrnehmung','Evaluative Konditionierung','Reaktanz','Mere Exposure'],a:0,e:'Aus dem eigenen Lachen trotz Hindernis wird auf die Lustigkeit geschlossen.'},
{c:PQ,k:7,t:'mc',q:'Anna mag Ben (+), Ben liebt Rapmusik (+), Anna mag Rap nicht (−). Wie kommt die Triade nach Heider am ehesten ins Gleichgewicht?',o:['Anna beginnt, Rap zu mögen','Anna mag Ben noch mehr','Nichts – die Triade ist balanciert','Ben mag Rap noch mehr'],a:0,e:'Balanciert, wenn das Produkt der Vorzeichen positiv ist; hier (+ · + · −) unbalanciert → eine Beziehung muss kippen.'},

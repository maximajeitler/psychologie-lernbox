[4,'Mood-congruent memory','Stimmungskongruente Inhalte werden leichter erinnert.'],
[4,'Mood-state-dependent memory','Abruf am besten in derselben Stimmung wie beim Lernen (unabhängig vom Inhalt).'],
[4,'Mood repair','In schlechter Stimmung bewusst Positives abrufen, um sich besser zu fühlen.'],
[4,'Affekt-Priming','**Indirekter** Einfluss: Stimmung macht kongruente Inhalte zugänglich, die ins Urteil einfließen.'],
[4,'How-do-I-feel-about-Heuristik','**Direkter** Einfluss: Die aktuelle Stimmung wird als Information über das Urteilsobjekt genutzt.'],
[4,'Schwarz & Clore (1983)','Wetter → Lebenszufriedenheit; Effekt verschwindet, wenn das Wetter als Ursache salient gemacht wird (Missattribution korrigiert).'],
[4,'Facial Feedback','Gesichtsmuskelaktivität wird zurückgemeldet und beeinflusst Gefühle/Urteile (Pen-Study).'],
[4,'Kognitive Bewertungstheorie','Emotion aus Bewertung (Ziel gefördert/behindert) + **Attribution** (internal/external, kontrollierbar/nicht).'],
[4,'Schuld – Scham – Ärger – Mitleid','Negativ + internal + kontrollierbar = Schuld; internal + unkontrollierbar = Scham; external + kontrollierbar = Ärger; external + unkontrollierbar = Mitleid.'],
[4,'Zwei-Faktoren-Theorie','Schachter & Singer: **unspezifische Erregung** (Intensität) + **Kognition** (Qualität).'],
[4,'Fehlattribution von Erregung','Erregung wird einer falschen Ursache zugeschrieben (Hängebrücke → Anziehung).'],
[5,'Soziale Wahrnehmung','Informationen über andere aufnehmen, kombinieren, integrieren und interpretieren → **Eindruck**.'],
[5,'Halo-Effekt','Eine hervorstechende Eigenschaft **färbt die Wahrnehmung aller weiteren** Eigenschaften.'],
[5,'First Impression Error','Der erste Eindruck weckt Erwartungen, die spätere Wahrnehmung färben und stabilisieren.'],
[5,'Beauty-is-good','Attraktiven werden mehr positive Eigenschaften (Intelligenz, Kompetenz) zugeschrieben.'],
[5,'Mere-Exposure-Effekt','Wiederholte bloße Darbietung → positivere Bewertung (Zajonc; Fluency-Erklärung).'],
[5,'Big Two','**Communion** (warm, nett, vertrauenswürdig) und **Agency** (kompetent, dominant, durchsetzungsfähig).'],
[5,'Körpergröße','Große Menschen werden als **kompetenter** eingeschätzt; hoher Status lässt Personen größer wirken (Wilson, 1968).'],
[5,'Behavior-trait-inference','Automatischer Schluss vom Verhalten auf eine Eigenschaft (hilft → hilfsbereit).'],
[5,'Konsensus','Verhalten sich **andere Personen** in derselben Situation ähnlich?'],
[5,'Distinktheit','Zeigt die Person das Verhalten nur bei **diesem Stimulus** oder auch in **anderen Situationen**?'],
[5,'Konsistenz','Zeigt die Person das Verhalten in dieser Situation **über die Zeit** immer wieder?'],
[5,'Internale Attribution laut Kelley','Konsensus **niedrig**, Distinktheit **niedrig**, Konsistenz **hoch**.'],
[5,'Correspondence Bias','Aus Verhalten auf stabile Dispositionen schließen, obwohl es situativ bedingt ist (Jones & Harris: Castro-Aufsatz).'],
[5,'Fundamentaler Attributionsfehler','Einfluss der Person wird **über**-, der Situation **unter**schätzt.'],
[5,'Akteur-Beobachter-Divergenz','Andere → internal, sich selbst → situativ. Gründe: Informationsvorteil, **perzeptuelle Salienz**/Blickwinkel.'],
[5,'Zweistufiger Attributionsprozess','1. automatisch internal, 2. kontrollierte Korrektur um die Situation (braucht Motivation + Kapazität).'],
[5,'Implizite Persönlichkeitstheorien','Annahmen, welche Eigenschaften zusammengehören → ergänzen fehlende Infos, färben Interpretation.'],
[5,'Positives Hypothesentesten','Suche nach **bestätigenden** Informationen; Mehrdeutiges wird hypothesenkonform gedeutet.'],
[5,'Sich selbst erfüllende Prophezeiung','Erwartungen ändern das eigene Verhalten so, dass der andere erwartungskonform reagiert (Snyder et al., 1977).'],
[5,'Rosenhan (1973)','Kontext „Klinik“: gesunde Pseudopatienten als schizophren diagnostiziert, normales Verhalten umgedeutet.'],
[6,'Working Self','Der zu einem Zeitpunkt **aktivierte Teil** des umfangreichen Selbstwissens.'],
[6,'Social Identity Theory','Tajfel & Turner: **personale** Identität (einzigartige Merkmale) und **soziale** Identität (Gruppenmitgliedschaften).'],
[6,'Self-Reference-Effekt','Selbstbezogene Informationen werden **tiefer verarbeitet und besser erinnert**.'],
[6,'Selbstaufmerksamkeit','Aufmerksamkeit aufs Selbst (Spiegel, Kamera) → Abgleich mit **inneren Werten/Normen**.'],
[6,'Selbstüberwachung','Self-Monitoring: Verhalten an **äußere** Erwartungen der Situation anpassen.'],
[6,'Chronische Zugänglichkeit von Selbstaspekten','Entwicklungsaufgaben, auffällige/abweichende Merkmale, kultureller Kontext.'],
[6,'Independentes vs. interdependentes Selbst','Independent: eigenständig, innere Werte, westlich. Interdependent: verbunden, Kontext/andere bestimmen, östlich.'],
[6,'Relationale vs. kollektive Interdependenz','Relational: enge Einzelbeziehungen (Frauen stärker). Kollektiv: größere Gruppen (Männer stärker).'],
[6,'Kontrafaktisches Denken','Vergangenes gedanklich umändern („was wäre, wenn“) – aufwärts (Enttäuschung, Lernen) oder abwärts (Erleichterung).'],
[6,'Introspektionsillusion','Man überschätzt die Einsicht in eigene Motive und hält eigene Urteile für objektiver als sie sind.'],
[6,'Selbstwahrnehmungstheorie','Bem: Aus eigenem **freiwilligem** Verhalten auf Einstellungen schließen – v. a. bei unklarer Einstellung.'],
[6,'Überrechtfertigungseffekt','Belohnung für eine intrinsisch motivierte Tätigkeit → Motivation wird extern attribuiert → sinkt.'],
[6,'Sozialer Vergleich: Richtungen','Lateral (Selbsterkenntnis), abwärts (Selbsterhöhung), aufwärts (Selbstmotivation).'],
[6,'Assimilation vs. Kontrast','Assimilation: Selbstbild nähert sich dem Standard. Kontrast: entfernt sich. Fokus Ähnlichkeit → Assimilation.'],
[6,'Selbstdiskrepanztheorie','Higgins: aktuell vs. Ideal → Niedergeschlagenheit; aktuell vs. Soll → Angst, Besorgnis.'],
[6,'Terror Management Theory','Sterblichkeitssalienz → Weltsicht verteidigen: Bestätigendes aufwerten, Übeltäter härter bestrafen, Aggression gegen Kritiker.'],
[6,'Self-Evaluation Maintenance','Tesser: Bedrohung durch **nahen** Anderen, der in **relevantem** Bereich besser ist → Leistung, Nähe oder Relevanz ändern.'],
[6,'Self-Serving Bias','Erfolge internal, Misserfolge external attribuieren.'],
[6,'Egocentric Bias','Eigenen Beitrag an gemeinsamen Leistungen überschätzen (Ross & Sicoly, 1979).'],
[6,'Self-Handicapping','Vorab Hindernisse schaffen (vor der Prüfung feiern) → Ausrede für möglichen Misserfolg.'],
[6,'Sandbagging','Eigene Fähigkeiten vorab herunterspielen, um Erwartungen zu senken.'],
[6,'Schwarzes-Schaf-Effekt','Leistungsschwache Eigengruppenmitglieder werden besonders hart abgewertet.'],
[6,'Selbstverifizierung','Bedürfnis, das eigene Selbstkonzept bestätigt zu bekommen – auch wenn es negativ ist.'],
[6,'Ego-Depletion','Selbstkontrolle verbraucht eine begrenzte Ressource („Muskel“); große Replikation fand den Effekt nicht.'],
[7,'Einstellung','Mentale Repräsentation mit zusammenfassender **Bewertung** eines Einstellungsobjekts.'],
[7,'ABC-Modell','**A**ffektiv (Gefühle), **B**ehavioral (Verhalten), **C**ognitiv (Überzeugungen).'],
[7,'Implizit vs. explizit','Explizit: bewusst, per Selbstbericht. Implizit: automatisch, indirekt gemessen; beide können abweichen.'],
[7,'Ambivalente Einstellung','Gleichzeitig stark positive **und** negative Bewertungen; positiv/negativ als getrennte Dimensionen.'],
[7,'Evaluative Konditionierung','Neutraler Reiz übernimmt die Valenz eines gleichzeitig auftretenden Reizes.'],
[7,'Spreading-Attitude-Effekt','Die konditionierte Bewertung überträgt sich auch auf einen mit dem CS **assoziierten** Reiz (Walther, 2002).'],
[7,'Pen-Study','Strack et al. (1988): Stift zwischen den **Zähnen** (Lächeln) → Cartoons lustiger als mit den **Lippen**.'],
[7,'Balance-Theorie','Heider: Triade Person–Person–Objekt strebt nach Gleichgewicht (Produkt der Vorzeichen positiv).'],
[7,'Kognitive Dissonanz','Unangenehme Spannung durch inkonsistente Kognitionen bzw. Handeln gegen das positive Selbstkonzept.'],
[7,'Dissonanzreduktion','Verhalten ändern, konsonante Kognitionen hinzufügen, dissonante abschwächen/Relevanz senken, Self-Affirmation.'],
[7,'Festinger & Carlsmith (1959)','Lüge für **1 $** → Aufgabe interessanter bewertet als für 20 $ (unzureichende Rechtfertigung).'],
[7,'Anstrengungsrechtfertigung','Aronson & Mills: schwierige Aufnahme → Gruppe wird aufgewertet.'],
[7,'Zanna & Cooper (1974)','Erregung auf Placebo attribuierbar → keine Dissonanz-Einstellungsänderung; „Entspannungspille“ → stärkste Änderung.'],
[7,'Yale-Ansatz','Wer (Kommunikator) sagt was (Botschaft) zu wem (Rezipient)?'],
[7,'Elaboration-Likelihood-Model','Zentrale Route (Argumente) vs. periphere Route (Hinweisreize); abhängig von **Motivation** und **Fähigkeit**.'],
[7,'Petty, Cacioppo & Goldman (1981)','Hohe Relevanz → Argumentqualität zählt; niedrige Relevanz → Expertise der Quelle zählt.'],
[7,'Einstellungsimpfung','Kleine Dosis schwacher Gegenargumente → eigene Gegenargumente entwickeln → resistenter.'],
[7,'Vorwarnung','Ankündigung eines Beeinflussungsversuchs → Zeit für Gegenargumente.'],
[7,'Reaktanz','Wahrgenommene Freiheitseinschränkung (Druck, Verbot) → Widerstand, Gegenteil tun.'],
[7,'Korrespondenzprinzip','Einstellung und Verhalten sagen sich besser vorher, wenn sie **gleich spezifisch** gemessen werden.'],
[7,'Aggregationsprinzip','Globale Einstellungen sagen einen **Verhaltensindex** (viele Verhaltensweisen) besser vorher als Einzelhandlungen.'],
[7,'Theory of Planned Behavior','Einstellung zum Verhalten + subjektive Norm + wahrgenommene Verhaltenskontrolle → Intention → Verhalten.'],
[7,'Likert-Skala vs. semantisches Differenzial','Likert: Zustimmung zu Aussagen. Semantisches Differenzial: bipolare Wortpaare (gut–schlecht), oft für die affektive Komponente.'],
[7,'Bogus Pipeline','Angeblicher Lügendetektor → ehrlichere **explizite** Angaben (Sigall & Page, 1971).'],
[7,'IAT','Implicit Association Test: Kategorisierung mit kombinierten Tasten; Reaktionszeitunterschiede = Assoziationsstärke.'],

const PQ = 99;
const Q = [
{"id": "q7e5kj7", "c": 1, "t": "mc", "alt": 1, "q": "Was ist das Hauptthema der Persönlichkeitspsychologie?", "o": ["Wie sich psychische Merkmale im Verlauf des Lebens verändern", "Wie sich Menschen in eher stabilen Eigenschaften voneinander unterscheiden", "Wie große Gruppen und gesellschaftliche Systeme aufgebaut sind", "Wie reale oder vorgestellte soziale Situationen den durchschnittlichen Menschen beeinflussen"], "a": 1, "e": "Persönlichkeitspsychologie fragt nach **stabilen Unterschieden** zwischen Personen. Lebensspanne = Entwicklungspsychologie, Gesellschaft = Soziologie, Einfluss sozialer Situationen = Sozialpsychologie."},
{"id": "q1y9jhum", "c": 1, "t": "ms", "alt": 1, "q": "Mit welchen Methoden arbeitet die Sozialpsychologie?", "o": ["Korrelationsstudien", "Rein logisches Ableiten ohne Daten", "Beobachtung", "Experimente"], "a": [0, 2, 3], "e": "Die Sozialpsychologie ist empirisch: Sie **beobachtet**, rechnet **Korrelationen** und führt **Experimente** durch. Reines Nachdenken ohne Daten zählt nicht dazu."},
{"id": "q1x9rn8", "c": 1, "t": "ms", "alt": 1, "q": "Die soziale Umwelt prägt, wie wir denken, fühlen und handeln. Was gilt für diesen Einfluss?", "o": ["Wir halten ihn meist für stärker, als er ist", "Er wirkt schon, wenn andere nur vorgestellt oder erwartet werden", "Eine bestimmte soziale Situation ist objektiv und wirkt auf alle gleich", "Wir halten ihn meist für schwächer, als er ist"], "a": [1, 3], "e": "Sozialer Einfluss wird **unterschätzt**. Andere müssen nicht wirklich da sein – ihre **vorgestellte oder implizite** Anwesenheit genügt. Wie eine Situation wirkt, hängt von ihrer subjektiven Deutung ab."},
{"id": "q1qwfebz", "c": 1, "t": "mc", "alt": 1, "q": "Welche Forschungsfrage gehört typischerweise zur Sozialpsychologie und nicht in erster Linie zu einem anderen Fach der Psychologie?", "o": ["Worin unterscheiden sich ängstliche von mutigen Menschen?", "Ändert sich das Verhalten von Menschen, wenn eine Kamera auf sie gerichtet ist?", "Was löst im öffentlichen Raum Aggression aus?", "Wie wandeln sich Einstellungen über die Lebensspanne?"], "a": 1, "e": "Typisch sozialpsychologisch: Wie wirkt die (gefühlte) **Anwesenheit anderer** auf das Verhalten? Eine Kamera erzeugt das Gefühl, beobachtet zu werden. Ängstlich vs. mutig = Persönlichkeit, Lebensspanne = Entwicklung."},
{"id": "q1tlujsf", "c": 1, "t": "mc", "alt": 1, "q": "Welches Ergebnis eines Experiments zeigt eine Interaktion?", "o": ["Je öfter Personen einen Reiz sahen, desto besser gefiel er ihnen.", "Positive Reize wurden in jeder Stimmung schneller eingeordnet als negative.", "Wer Umweltschutz positiv sieht, hält Texte für Mülltrennung für glaubwürdiger als Texte dagegen – wer Umweltschutz negativ sieht, urteilt genau umgekehrt.", "Menschen schätzen die Chance auf positive Ereignisse für sich selbst höher ein als für andere."], "a": 2, "e": "**Interaktion:** Die Wirkung einer UV hängt von der Ausprägung einer zweiten UV ab – hier dreht sich der Effekt je nach Umwelteinstellung sogar um. Die anderen Beispiele sind einzelne Haupteffekte bzw. Zusammenhänge."},
{"id": "qh829gb", "c": 1, "t": "mc", "alt": 1, "q": "Was ist in einer Studie die unabhängige Variable?", "o": ["Die Variable, die die Forschenden im Experiment gezielt verändern", "Eine Variable, die in allen Bedingungen gleich bleibt", "Eine Variable, die ohne bewusstes Zutun der Teilnehmenden gemessen wird", "Eine Variable, deren Streuung von der abhängigen Variable vorhergesagt wird"], "a": 0, "e": "Die **UV wird manipuliert**, um zu sehen, wie sich das auf die **abhängige Variable** (das Gemessene) auswirkt."},
{"id": "q6vmugb", "c": 1, "t": "mc", "alt": 1, "q": "Woran erkennt man eine negative Korrelation?", "o": ["Sinkt eine Variable, sinkt auch die andere.", "Die beiden Variablen hängen gar nicht zusammen.", "Steigt eine Variable, sinkt tendenziell die andere.", "Sinkt eine Variable, bleibt die andere gleich."], "a": 2, "e": "**Negativ** = gegenläufig: hohe Werte der einen gehen mit niedrigen Werten der anderen einher. Gleichläufig wäre positiv, kein Zusammenhang wäre r ≈ 0."},
{"id": "qr4tqvw", "c": 1, "t": "mc", "alt": 1, "q": "Wofür nutzt man eine Korrelation?", "o": ["Um Zusammenhänge zwischen Variablen zu beschreiben und vorherzusagen", "Um Personen zufällig auf Bedingungen aufzuteilen", "Um durch Standardisierung andere Ursachen auszuschließen", "Um eine Variable zu verändern und ihre Ursache-Wirkung zu prüfen"], "a": 0, "e": "Korrelationen zeigen, **ob und wie stark** Variablen zusammenhängen. Kausalität lässt sich daraus nicht ableiten – dafür braucht man ein Experiment."},
{"id": "q1nbg1b8", "c": 1, "t": "mc", "alt": 1, "q": "Mit welcher Methode kann man Ursache und Wirkung prüfen?", "o": ["Dokumentenanalyse", "Beobachtung, ohne etwas zu verändern", "Korrelationsstudie", "Experiment"], "a": 3, "e": "Nur im **Experiment** wird eine UV gezielt verändert und der Rest kontrolliert – das erlaubt **kausale** Schlüsse."},
{"id": "q1pqask3", "c": 1, "t": "ms", "alt": 1, "q": "Worin unterscheidet sich die Sozialpsychologie von der Soziologie?", "o": ["Nur die Sozialpsychologie arbeitet empirisch.", "Die Sozialpsychologie schaut, wie soziale Faktoren das Denken, Fühlen und Verhalten einzelner Personen beeinflussen.", "Die Sozialpsychologie erklärt Unterschiede vor allem über stabile Persönlichkeitsmerkmale.", "Die Soziologie interessiert sich eher für Gruppen, Gesellschaftsstrukturen und kollektive Phänomene."], "a": [1, 3], "e": "Sozialpsychologie = **Individuum im sozialen Kontext**, Soziologie = **Gruppen und Gesellschaft**. Beide arbeiten empirisch. Stabile Merkmale sind Thema der Persönlichkeitspsychologie."},
{"id": "q8219q0", "c": 1, "t": "ms", "alt": 1, "q": "Was stimmt über interne und externe Validität?", "o": ["Laborexperimente haben wegen der künstlichen Umgebung automatisch eine geringere externe Validität.", "Ohne interne Validität lässt sich die externe Validität kaum sinnvoll beurteilen.", "Interne Validität: Lässt sich der Effekt wirklich auf die UV zurückführen?", "Externe Validität: Lässt sich das Ergebnis auf andere Personen, Situationen oder Kontexte übertragen?"], "a": [1, 2, 3], "e": "Zuerst muss der Effekt eindeutig auf die Ursache zurückgehen (**intern**), erst dann fragt man nach der **Übertragbarkeit** (extern). Labor heißt nicht automatisch geringe externe Validität."},
{"id": "q1shhxn9", "c": 1, "t": "mc", "alt": 1, "q": "Was bedeutet „Open Science“?", "o": ["Forschung, die auch von Laien betrieben wird", "Forschung, bei der Hypothesen, Methoden, Analysen, Daten und Ergebnisse öffentlich gemacht werden", "Forschung ohne eigenes Themengebiet, nur auf die Methode konzentriert", "Forschung, bei der man vorher absichtlich keine Hypothesen aufstellt"], "a": 1, "e": "Open Science macht Forschung **transparent und überprüfbar** – z. B. durch vorab registrierte Hypothesen und frei zugängliche Daten."},
{"id": "q15s6x82", "c": 1, "t": "mc", "alt": 1, "q": "Was meint man mit der „Krise in der Psychologie“?", "o": ["Viele veröffentlichte Befunde lassen sich bei Wiederholung nicht bestätigen.", "Theorien werden ständig verworfen oder umgebaut.", "Replikationen werden lieber veröffentlicht als Originalstudien.", "Forschende finden immer seltener eine Stelle."], "a": 0, "e": "Gemeint ist die **Replikationskrise**: Viele Effekte zeigen sich in unabhängigen Wiederholungsstudien nicht mehr zuverlässig."},
{"id": "q16exi6q", "c": 1, "t": "ms", "alt": 1, "q": "Was trifft auf die statistische Power zu?", "o": ["Sie ist die Wahrscheinlichkeit, ein signifikantes Ergebnis zu bekommen, obwohl es keinen Effekt gibt.", "Sie wird bei sonst gleichen Bedingungen mit größerer Stichprobe höher.", "Sie wird unter anderem durch genauere Messung höher.", "Sie ist die Wahrscheinlichkeit, dass ein real vorhandener Effekt in der Studie signifikant wird."], "a": [1, 2, 3], "e": "**Power** = Chance, einen echten Effekt auch zu finden. Größere Stichprobe und präzisere Messung erhöhen sie. Signifikanz ohne echten Effekt wäre ein Fehler 1. Art (α)."},
{"id": "qv85qom", "c": 1, "t": "ms", "alt": 1, "q": "Was beschreibt die Reliabilität?", "o": ["Wie gut sich Ergebnisse auf andere Gruppen und Situationen übertragen lassen", "Wie genau und verlässlich eine Messung ist", "Ob ein Test wirklich das Merkmal misst, das er messen soll", "Welcher Anteil der Unterschiede in den Messwerten auf echte Merkmalsunterschiede statt auf Messfehler zurückgeht"], "a": [1, 3], "e": "Reliabilität = **Zuverlässigkeit/Messgenauigkeit**: wenig Messfehler, viel „wahre“ Varianz. Ob das Richtige gemessen wird, ist Validität; Übertragbarkeit ist externe Validität."},
{"id": "q1wsodw8", "c": 1, "t": "mc", "alt": 1, "q": "Zu welcher Art von Methode gehört die Dokumentenanalyse?", "o": ["Experimentelle Methode", "Psychophysiologische Methode", "Beobachtungsmethode", "Quasi-experimentelle Manipulation"], "a": 2, "e": "Bei der Dokumentenanalyse wertet man **vorhandene Aufzeichnungen** systematisch aus – das ist eine Form der **Beobachtung**, es wird nichts manipuliert."},
{"id": "qsvjmun", "c": 1, "t": "ms", "alt": 1, "q": "Was gilt für ein statistisch signifikantes Ergebnis?", "o": ["Es heißt nicht, dass der Effekt in einer neuen Stichprobe wahrscheinlich wieder signifikant wird.", "Es ist unter der Annahme „kein Effekt in der Population“ ausreichend unwahrscheinlich.", "Es gibt vor allem an, wie groß der Effekt praktisch ist.", "Es heißt nicht, dass der Effekt mit hoher Sicherheit wirklich existiert."], "a": [0, 1, 3], "e": "Signifikanz = das Ergebnis wäre **unter der Nullhypothese unwahrscheinlich**. Über die **Effektgröße** sagt sie nichts direkt, und sie garantiert weder, dass der Effekt sicher existiert, noch dass er sich repliziert."},
{"id": "q1535fun", "c": 1, "t": "mc", "alt": 1, "q": "Womit prüft die Wissenschaft, ob angenommene Gesetzmäßigkeiten in der Realität gelten?", "o": ["Mit statistischer Auswertung", "Mit wissenschaftlicher Diskussion", "Mit Prüfung der inneren Logik", "Mit systematischem Sammeln von Informationen"], "a": 0, "e": "Erhobene Daten werden **statistisch ausgewertet**, um zu sehen, ob sie zur vorhergesagten Gesetzmäßigkeit passen."},
{"id": "qklwhpm", "c": 2, "t": "mc", "alt": 1, "q": "Was ist ein Skript?", "o": ["Eine Kategorie, die Dinge mit gemeinsamen Merkmalen zusammenfasst", "Ein Schema über den typischen Ablauf von Handlungen und Ereignissen", "Die gedankliche Vorstellung vom typischsten Mitglied einer Kategorie", "Geteilte Annahmen über Eigenschaften einer sozialen Gruppe"], "a": 1, "e": "**Skripte** speichern, wie Situationen üblicherweise ablaufen (z. B. Restaurantbesuch). Typischstes Mitglied = Prototyp, Annahmen über Gruppen = Stereotyp."},
{"id": "q18wknks", "c": 2, "t": "ms", "alt": 1, "q": "Welche davon sind Formen von Schemata?", "o": ["Kategorien", "Stereotype", "Prototypen", "Skripte"], "a": [1, 3], "e": "**Skripte** (Wissen über Abläufe) und **Stereotype** (Wissen und Erwartungen über Gruppen) sind spezielle Schemata."},
{"id": "q1lluccu", "c": 2, "t": "ms", "alt": 1, "q": "Was stimmt über Bottom-up- und Top-down-Verarbeitung?", "o": ["Bottom-up stützt sich vor allem auf bereits aktivierte Kategorien und Erwartungen.", "Bei Bottom-up bestimmen vor allem die Merkmale des wahrgenommenen Reizes die Deutung.", "Top-down heißt, dass Vorwissen bei der Verarbeitung keine Rolle spielt.", "Bei Top-down prägen Vorwissen, Erwartungen und Schemata die Deutung."], "a": [1, 3], "e": "**Bottom-up** = reizgesteuert (vom Reiz zum Urteil). **Top-down** = wissensgesteuert (Erwartungen und Schemata formen die Deutung)."},
{"id": "q1v9x99q", "c": 2, "t": "ms", "alt": 1, "q": "Was ergab die „Donald“-Studie von Higgins, Rholes und Jones?", "o": ["Auch Eigenschaften, die nicht zu Donald passten, beeinflussten das Urteil genauso stark.", "Vorher aktivierte Eigenschaften, die zu Donalds Verhalten passten, färbten das spätere Urteil über ihn.", "Der Effekt entstand, weil Donald die Wörter selbst in seiner Beschreibung benutzte.", "Passende positive Primes führten zu einem freundlicheren Urteil als passende negative Primes."], "a": [1, 3], "e": "Donalds Verhalten war **mehrdeutig**. Geprimte Eigenschaften wirkten nur, wenn sie **anwendbar** waren (z. B. „abenteuerlustig“ vs. „leichtsinnig“) – positive Primes → positiveres Urteil."},
{"id": "q1v59dnk", "c": 2, "t": "ms", "alt": 1, "q": "Was lenkt unsere Aufmerksamkeit?", "o": ["Ungewöhnliches und Auffälliges zieht sie eher an.", "Was wir erwarten, bemerken wir eher.", "Vertrautes wie der eigene Name wird meist überhört.", "Was für unsere momentanen Ziele oder Bedürfnisse wichtig ist, wird eher beachtet."], "a": [0, 1, 3], "e": "Aufmerksamkeit folgt **Auffälligkeit (Salienz)**, **Erwartungen** und **persönlicher Relevanz**. Der eigene Name fällt gerade besonders leicht auf (Cocktailparty-Effekt)."},
{"id": "q171ky79", "c": 2, "t": "ms", "alt": 1, "q": "Priming aktiviert Wissen vorab, sodass es schneller verarbeitet wird und spätere Urteile färbt. Wann wird dieser Effekt schwächer?", "o": ["Wenn Prime und Ziel nur über ihre Gefühlsbewertung verbunden sind", "Wenn die Primes unter der Bewusstseinsschwelle gezeigt werden", "Wenn man merkt, dass man gerade geprimt wird", "Wenn der Prime inhaltlich nicht auf das Ziel passt"], "a": [2, 3], "e": "Wer den Prime **bemerkt**, kann sein Urteil korrigieren. Und ein Prime wirkt nur, wenn er auf das Ziel **anwendbar** ist. Unterschwellige Primes wirken oft sogar besonders gut."},
{"id": "q1sa4mtb", "c": 2, "t": "ms", "alt": 1, "q": "Was bewirkt Priming?", "o": ["Es überprüft ein spontanes Urteil bewusst auf Verzerrungen.", "Ein vorher verarbeiteter Reiz kann die Reaktion auf einen späteren Reiz erleichtern oder verändern.", "Es speichert eine neu gelernte Kategorie dauerhaft im Gedächtnis.", "Bestimmtes Wissen wird kurzfristig leichter abrufbar."], "a": [1, 3], "e": "Ein **Prime** macht verknüpftes Wissen **vorübergehend zugänglicher** und beeinflusst so die Verarbeitung des nachfolgenden Zielreizes."},
{"id": "qx78zbl", "c": 2, "t": "ms", "alt": 1, "q": "Was kennzeichnet ein assoziatives Netzwerk?", "o": ["Wissen ist als Knoten gespeichert, die miteinander verbunden sind.", "Verbindungen zwischen Knoten können verschieden stark sein.", "Neue Informationen werden vor allem über logische Regeln verarbeitet.", "Wird ein Knoten aktiviert, kann sich das auf verbundene Knoten ausbreiten."], "a": [0, 1, 3], "e": "Im assoziativen Netzwerk hängen **Knoten** über **unterschiedlich starke Verbindungen** zusammen; Aktivierung **breitet sich aus** (spreading activation). Regelbasiert arbeitet das reflektive System."},
{"id": "qjdzg5r", "c": 2, "t": "mc", "alt": 1, "q": "Prime und Target haben dieselbe positive oder negative Bewertung. Welche Art von Priming ist das?", "o": ["Konzeptuelles Priming", "Prozedurales Priming", "Affektives Priming", "Semantisches Priming"], "a": 2, "e": "Beim **affektiven Priming** verbindet Prime und Target ihre **Valenz** (gut/schlecht), nicht ihre Bedeutung."},
{"id": "q1lds5bv", "c": 2, "t": "ms", "alt": 1, "q": "Unter welchen Bedingungen färbt ein Prime, wie Informationen aufgenommen und gedeutet werden?", "o": ["Wenn der Prime zwar präsent ist, aber inhaltlich nicht zum Zielreiz passt", "Wenn der Zielreiz mehrdeutig ist oder schnell beurteilt werden muss", "Wenn der Zielreiz eindeutig ist und nur eine Deutung zulässt", "Wenn der aktivierte Inhalt auf den Zielreiz anwendbar ist"], "a": [1, 3], "e": "Priming wirkt vor allem bei **mehrdeutigen** Zielen (oder unter Zeitdruck) und wenn der Prime **anwendbar** ist."},
{"id": "q191fn8a", "c": 2, "t": "mc", "alt": 1, "q": "Welches Schema wir in einer unklaren Situation verwenden, hängt von seiner Zugänglichkeit ab. Was stimmt über Zugänglichkeit?", "o": ["Schon das Verarbeiten einzelner Wörter kann komplexe Schemata zugänglicher machen.", "Ein zugängliches Schema wird immer auch angewendet.", "Chronische Zugänglichkeit hängt davon ab, was gerade eben passiert ist.", "Nur bewusst verarbeitete Informationen erhöhen die Zugänglichkeit."], "a": 0, "e": "Schon **einzelne Begriffe** können ganze Wissensstrukturen aktivieren – auch unbewusst. Was gerade eben passiert ist, betrifft die **temporäre**, nicht die chronische Zugänglichkeit. Angewendet wird ein Schema nur, wenn es passt."},
{"id": "q1l9fa0d", "c": 2, "t": "ms", "alt": 1, "q": "Was heißt es, dass Kategorien hierarchisch organisiert sind?", "o": ["Manche Kategorien sind anderen übergeordnet.", "Bestimmte Kategorien beeinflussen die Verarbeitung grundsätzlich stärker.", "Breitere Kategorien schließen engere Kategorien ein.", "Die einzelnen Exemplare sind nach Wichtigkeit sortiert."], "a": [0, 2], "e": "Hierarchie = **Über- und Unterordnung**: Eine breite Kategorie (z. B. Tier) enthält engere (Hund, Katze)."},
{"id": "q1dczaod", "c": 2, "t": "mc", "alt": 1, "q": "Was meint prozedurales Priming?", "o": ["Ein mit dem Prime bedeutungsverwandter Begriff wird leichter zugänglich.", "Eine Denkoperation geht leichter, wenn man sie kurz zuvor schon einmal ausgeführt hat.", "Ein Target wird leichter bewertet, wenn es dieselbe Valenz wie der Prime hat.", "Eine zuvor benutzte Kategorie färbt die Deutung einer mehrdeutigen Person."], "a": 1, "e": "Beim **prozeduralen Priming** wird kein Inhalt, sondern eine **Verarbeitungsweise** voraktiviert. Die anderen Optionen beschreiben semantisches, affektives bzw. kategoriales Priming."},
{"id": "q1j5thjz", "c": 2, "t": "mc", "alt": 1, "q": "In einer M&M's-Studie hängt der Verzehr negativ mit der Diätabsicht zusammen, aber nicht mit positiven Assoziationen zu M&M's. Welches System steuert hier das Verhalten?", "o": ["Das reflektive System", "Beide Systeme gleich stark", "Das impulsive System", "Keines der beiden"], "a": 0, "e": "Die **bewusste Absicht** (Diät) sagt das Verhalten vorher, die Assoziation nicht – also steuert das **reflektive** System."},
{"id": "q1c6kjwa", "c": 2, "t": "ms", "alt": 1, "q": "Was macht der Stroop-Test sichtbar?", "o": ["Dass ein affektiver Prime die Bewertung des nächsten Targets verschiebt", "Dass das automatische Lesen das kontrollierte Benennen der Schriftfarbe stört", "Dass Reaktionszeiten die Bewertung zweier sozialer Kategorien verraten", "Dass gut eingeübte Abläufe automatisch laufen und mit einer anderen Antwort konkurrieren können"], "a": [1, 3], "e": "Stroop: **Automatisches Lesen** stört die **kontrollierte** Farbbenennung (z. B. „ROT“ in blauer Schrift). Bewertungen über Reaktionszeiten misst der IAT."},
{"id": "q21n56e", "c": 2, "t": "ms", "alt": 1, "q": "Was stimmt über das Reflektiv-Impulsiv-Modell?", "o": ["Das reflektive System arbeitet hauptsächlich parallel über sich ausbreitende Aktivierung.", "Das reflektive System folgt Regeln und braucht Motivation und genug kognitive Kapazität.", "Bei Zeitdruck, Ablenkung oder Müdigkeit gewinnt das impulsive System an Gewicht.", "Das impulsive System arbeitet assoziativ und braucht kaum kognitive Ressourcen."], "a": [1, 2, 3], "e": "**Impulsiv:** schnell, assoziativ, mühelos. **Reflektiv:** langsam, regelbasiert, braucht Motivation und Kapazität. Fehlt die Kapazität, übernimmt eher das impulsive System. Ausbreitende Aktivierung gehört zum impulsiven System."},
{"id": "q6d0b5a", "c": 2, "t": "mc", "alt": 1, "q": "Förster (2003): Beim Ansehen eines Videos drückte eine Gruppe die Hand von oben auf den Tisch, eine von unten gegen die Tischplatte, eine dritte bekam keine Anweisung. Ein Getränk stand bereit. Was kam heraus?", "o": ["Die Handhaltung änderte nichts am Trinken, aber wer mehr trank, fand das Video schlechter.", "Die Gruppe ohne Anweisung trank am meisten, die „von unten“-Gruppe am wenigsten.", "Beide Gruppen mit Handanweisung tranken mehr als die Gruppe ohne.", "Die „von unten“-Gruppe trank mehr als die „von oben“-Gruppe; die Gruppe ohne Anweisung lag dazwischen."], "a": 3, "e": "Von unten drücken = **Armbeugung** = **Annäherung** → mehr getrunken. Von oben = Streckung = Vermeidung → weniger. Ohne Anweisung: in der Mitte."},
{"id": "q1cwhju1", "c": 3, "t": "mc", "alt": 1, "q": "Schwarz et al. (1991): Die Teilnehmenden sollten 6 oder 12 Beispiele für eigenes selbstsicheres Verhalten aufschreiben. Wie selbstsicher fanden sie sich danach?", "o": ["Mit 6 Beispielen weniger, weil ihnen weniger selbstsicheres Verhalten eingefallen war", "Mit 12 Beispielen weniger, weil es ihnen schwerfiel, so viele zu finden", "Kein Unterschied, weil sich Menge und Schwierigkeit gegenseitig aufhoben", "Mit 12 Beispielen mehr, weil sie mehr Belege gesammelt hatten"], "a": 1, "e": "Entscheidend war die **erlebte Abrufleichtigkeit**: Zwölf Beispiele zu finden war mühsam → „so selbstsicher bin ich wohl doch nicht“."},
{"id": "qeiy2an", "c": 3, "t": "mc", "alt": 1, "q": "Was ist die Verfügbarkeitsheuristik?", "o": ["Man nutzt Basisraten gezielt, um Bauchurteile zu korrigieren.", "Man schätzt die Wahrscheinlichkeit danach, wie sehr etwas dem typischen Vertreter einer Kategorie ähnelt.", "Ein vorgegebener Startwert verschiebt spätere Zahlenschätzungen.", "Man schätzt Häufigkeit oder Wahrscheinlichkeit danach, wie leicht einem Beispiele einfallen."], "a": 3, "e": "**Verfügbarkeit:** Was **leicht einfällt**, wirkt häufiger/wahrscheinlicher. Ähnlichkeit = Repräsentativität, Startwert = Anker."},
{"id": "q153rfub", "c": 3, "t": "mc", "alt": 1, "q": "Warum glauben viele, dass mehr Menschen im Straßenverkehr sterben als durch andere Ursachen, die in Wahrheit häufiger sind?", "o": ["Unfälle wirken besonders typisch für häufige Todesursachen.", "Bei anschaulichen Ereignissen achtet man genauer auf Basisraten.", "Über Verkehrsunfälle wird viel berichtet, daher fallen sie einem leichter ein.", "Die Zahl bekannter Unfälle dient als Anker für die übrigen Schätzungen."], "a": 2, "e": "**Verfügbarkeitsheuristik:** Häufig berichtete, auffällige Ereignisse sind **leicht abrufbar** und werden darum überschätzt."},
{"id": "q1dalui1", "c": 3, "t": "mc", "alt": 1, "q": "Lisa ist klug, hat Philosophie studiert und geht regelmäßig auf Anti-Atomkraft-Demos. Sie halten es für wahrscheinlicher, dass sie Bankangestellte UND in der Frauenbewegung aktiv ist, als dass sie nur Bankangestellte ist. Welche Heuristik steckt dahinter?", "o": ["Verfügbarkeitsheuristik", "Basisraten-Heuristik", "Repräsentativitätsheuristik", "Ankerheuristik"], "a": 2, "e": "Die Beschreibung **passt zum Bild** einer engagierten Frau (**Repräsentativität**). Dabei übersieht man, dass eine Kombination nie wahrscheinlicher sein kann als einer ihrer Teile (Konjunktionsfehler)."},
{"id": "q1iw449b", "c": 3, "t": "ms", "alt": 1, "q": "Wir nutzen Heuristiken oft beim Entscheiden. Was zeichnet sie aus?", "o": ["Sie werden vor allem von Laien ohne Fachwissen verwendet.", "Sie sparen Ressourcen.", "Sie führen meistens zu falschen Entscheidungen.", "Sie erlauben schnelle Urteile."], "a": [1, 3], "e": "Heuristiken sind **Faustregeln**: **schnell und sparsam**. Sie können verzerren, liegen aber oft richtig – und auch Fachleute verwenden sie."},
{"id": "q1nsx10f", "c": 3, "t": "ms", "alt": 1, "q": "Wie kann man verhindern, dass jemand beim Schätzen auf die Verfügbarkeitsheuristik zurückgreift?", "o": ["Man lenkt die Aufmerksamkeit auf die eigenen Gefühle.", "Man erhöht durch Anreize die Motivation, gründlich nachzudenken.", "Man bietet eine andere Erklärung dafür an, warum sich das Abrufen leicht oder schwer anfühlt.", "Man stellt die Frage offen, ohne eine Zahl vorzugeben."], "a": [1, 2], "e": "Mit **mehr Motivation** wird systematischer verarbeitet. Und wenn das Leichtigkeitsgefühl **anders erklärt** wird, verliert es seinen Informationswert. Keine Zahl vorzugeben hilft gegen den Anker, nicht gegen Verfügbarkeit."},
{"id": "qowed70", "c": 3, "t": "mc", "alt": 1, "q": "Anna erwischt ihre Tochter beim Schreiben eines Schummelzettels. Am nächsten Tag führt sie als neue Professorin Aufsicht bei ihrer ersten Klausur und passt besonders streng auf, weil sie viele Schummler erwartet. Wie heißt dieses Phänomen?", "o": ["Verfügbarkeitsheuristik", "Ankerheuristik", "Repräsentativitätsheuristik", "Keine dieser Antworten"], "a": 0, "e": "Das Erlebnis mit der Tochter ist **frisch im Gedächtnis** und daher leicht verfügbar → Anna überschätzt, wie oft Studierende schummeln."},
{"id": "q151b1cb", "c": 3, "t": "mc", "alt": 1, "q": "Warum lohnt es sich bei einer Versteigerung, selbst das erste Gebot zu nennen?", "o": ["Wegen der Basisraten-Heuristik", "Wegen der Verfügbarkeitsheuristik", "Wegen der Ankerheuristik", "Wegen der Repräsentativitätsheuristik"], "a": 2, "e": "Das erste Gebot wirkt als **Anker** und zieht alle weiteren Schätzungen und Gebote in seine Richtung."},
{"id": "qj270r3", "c": 3, "t": "ms", "alt": 1, "q": "Was macht ein Ereignis leichter verfügbar – unabhängig davon, wie oft es tatsächlich vorkommt?", "o": ["Wenn man erst vor Kurzem daran gedacht hat", "Wenn statistische Angaben als Häufigkeiten statt als Wahrscheinlichkeiten präsentiert werden", "Wenn man kaum je daran denkt", "Wenn die Erinnerung daran sehr lebhaft ist"], "a": [0, 3], "e": "**Lebhafte** und **kürzlich** aktivierte Erinnerungen sind leichter abrufbar und wirken deshalb häufiger."},
{"id": "q1e7ab4g", "c": 3, "t": "ms", "alt": 1, "q": "Wie erklärt das Selective Accessibility Model den Ankereffekt?", "o": ["Der Zahlenwert des Ankers bleibt einfach besser im Gedächtnis als alles andere.", "Wissen, das zum Anker passt, wird dadurch leichter zugänglich.", "Man korrigiert bewusst von einem selbst ausgedachten Anker weg.", "Man prüft zuerst, ob der Ankerwert stimmen könnte."], "a": [1, 3], "e": "Erst wird getestet, ob der Anker zutreffen könnte → dabei wird **ankerpassendes Wissen selektiv aktiviert** → die Schätzung rutscht in Richtung Anker. Bewusstes Wegkorrigieren beschreibt Anchoring-and-Adjustment."},
{"id": "q1izfzvp", "c": 4, "t": "mc", "alt": 1, "q": "Welcher Baustein ist in der Zwei-Faktoren-Theorie zentral, in der kognitiven Bewertungstheorie aber nicht?", "o": ["Die Frage, ob die Ursache intern oder extern liegt", "Die Frage, ob die Ursache kontrollierbar ist", "Eine unspezifische körperliche Erregung als eigener Faktor", "Die gedankliche Bewertung, was das Ereignis bedeutet"], "a": 2, "e": "Schachter & Singer brauchen **Erregung + Kognition**. Bewertungstheorien setzen auf die **Bewertung** des Ereignisses und seiner Ursachen; eine eigene unspezifische Erregung ist dort kein zentraler Faktor."},
{"id": "qsvknmq", "c": 4, "t": "mc", "alt": 1, "q": "Aus welchen zwei Faktoren entsteht laut Zwei-Faktoren-Theorie eine Emotion?", "o": ["Kognition und Affekt", "Valenz und Intensität", "Physiologische Erregung und ihre kognitive Deutung", "Selbstbezug und Fremdbezug"], "a": 2, "e": "**Erregung** bestimmt eher, wie stark, die **Kognition** (Deutung), welche Emotion man erlebt."},
{"id": "q1x7x3ma", "c": 4, "t": "ms", "alt": 1, "q": "Worin unterscheiden sich Emotionen von Stimmungen?", "o": ["Stimmungen dauern meist länger.", "Emotionen sind feiner ausdifferenziert.", "Nur Emotionen zählen zu den affektiven Gefühlen.", "Emotionen beziehen sich auf ein bestimmtes Objekt."], "a": [0, 1, 3], "e": "Emotionen: **objektbezogen, intensiver, differenzierter**. Stimmungen: **diffus, länger anhaltend**. Beide sind affektive Gefühle."},
{"id": "qset7w3", "c": 4, "t": "mc", "alt": 1, "q": "Warum beeinflusst unsere Stimmung, wie wir Informationen verarbeiten?", "o": ["Nur die körperliche Erregung, die mit Stimmungen einhergeht, wirkt auf die Verarbeitung.", "Weil Menschen immer gute Laune wollen, muss jede Verarbeitung von der Stimmung gesteuert werden.", "Stimmung wird nie bewusst wahrgenommen und wirkt deshalb unterschwellig.", "Stimmung meldet, wie die Lage ist – schlechte Stimmung kann signalisieren, dass etwas problematisch oder unsicher ist."], "a": 3, "e": "**Stimmung als Signal:** gute Stimmung = „alles sicher“ → eher globale Top-down-Verarbeitung; schlechte Stimmung = „Problem“ → genauere, detailorientierte Verarbeitung."},
{"id": "qqpzwke", "c": 4, "t": "mc", "alt": 1, "q": "Wann trifft „den Wald vor lauter Bäumen nicht sehen“ am ehesten zu?", "o": ["Bei positiver Stimmung", "Wenn man stark auf übergeordnetes Wissen zurückgreift", "Bei negativer Stimmung", "Wenn man zu wenig kognitive Kapazität hat"], "a": 2, "e": "**Negative Stimmung** fördert lokale, detailorientierte Bottom-up-Verarbeitung – man sieht die einzelnen Bäume, aber nicht den Wald."},
{"id": "qo2au9d", "c": 4, "t": "ms", "alt": 1, "q": "Was folgt aus der „How-do-I-feel-about-it“-Heuristik für Urteile?", "o": ["In schlechter Stimmung urteilt man eher negativ.", "In schlechter Stimmung prüft man den Gegenstand besonders genau.", "In guter Stimmung greift man eher zu Heuristiken.", "In guter Stimmung urteilt man eher positiv."], "a": [0, 3], "e": "Die Heuristik nutzt die **aktuelle Stimmung als Information**: „Wie fühle ich mich dabei?“ → gute Laune → besseres Urteil, schlechte Laune → schlechteres. (Die anderen beiden stimmen zwar oft, sind aber nicht Inhalt dieser Heuristik.)"},
{"id": "q1uq1611", "c": 4, "t": "mc", "alt": 1, "q": "Nach fröhlicher oder trauriger Musik erkennen Personen positive, negative und neutrale Wörter. Welches Ergebnis zeigt stimmungskongruente Verarbeitung?", "o": ["Fröhliche erkennen negative Wörter schneller, Traurige positive.", "Fröhliche erkennen positive Wörter schneller, Traurige negative.", "Die Stimmung wirkt nur auf neutrale Wörter.", "Die Stimmung wirkt nur auf das spätere Erinnern, nicht auf das Erkennen."], "a": 1, "e": "**Stimmungskongruenz:** Was zur aktuellen Stimmung **passt**, wird leichter verarbeitet."},
{"id": "q1nu64dx", "c": 4, "t": "mc", "alt": 1, "q": "Eine Freundin hat dich versetzt und du ärgerst dich über sie. Was ist das am ehesten?", "o": ["Eine Stimmung", "Eine Emotion", "Ein nicht-affektives Gefühl", "Ein Erregungstransfer"], "a": 1, "e": "Der Ärger hat ein **klares Objekt** (die Freundin, das Versetzen) → **Emotion**. Eine Stimmung wäre diffus, ohne konkreten Anlass."},
{"id": "q1lj59ct", "c": 4, "t": "mc", "alt": 1, "q": "Stimmungen sind eher diffus, Emotionen unterscheiden wir sehr fein. Wovon hängt diese Unterscheidung ab?", "o": ["Jede Emotion hat ein eigenes, klar abgrenzbares Erregungsmuster.", "Man lernt, welches Objekt welche Emotion auslöst.", "Keine dieser Antworten stimmt.", "Vor allem davon, wie wir uns das auslösende Ereignis erklären."], "a": 3, "e": "Die **kognitive Bewertung** des Ereignisses entscheidet, ob z. B. Ärger, Schuld oder Scham entsteht – die Erregung allein ist zu unspezifisch."},
{"id": "q1pic4z1", "c": 4, "t": "mc", "alt": 1, "q": "Warum fallen Urteile oft passend zur Stimmung aus?", "o": ["Frühere Urteile werden im Nachhinein an die Stimmung angepasst.", "Zur Stimmung passende Inhalte lassen sich leichter aus dem Gedächtnis abrufen.", "Zur Stimmung passende Informationen werden immer stärker wahrgenommen.", "Jedes Urteil beruht direkt auf der Stimmung."], "a": 1, "e": "Stimmung macht **passende Gedächtnisinhalte zugänglicher** – und was leichter einfällt, fließt stärker ins Urteil ein."},
{"id": "q298s4r", "c": 4, "t": "ms", "alt": 1, "q": "Was stimmt über Affekt und Gefühle?", "o": ["Müdigkeit lässt sich als nicht-affektives Gefühl einordnen.", "Stimmungen sind meist intensiver und kürzer als Emotionen.", "Emotionen und Stimmungen sind beides affektive Gefühle.", "Emotionen haben eher ein bestimmtes Objekt als Stimmungen."], "a": [0, 2, 3], "e": "**Gefühl** ist der Oberbegriff: affektiv (Emotionen, Stimmungen) vs. nicht-affektiv (z. B. Müdigkeit). Emotionen sind intensiver und kürzer, nicht Stimmungen."},
{"id": "q1iy1m83", "c": 4, "t": "ms", "alt": 1, "q": "Menschen wurden an sonnigen oder verregneten Tagen nach ihrer Lebenszufriedenheit gefragt. Wies man sie vorher auf das Wetter hin, spielte das Wetter keine Rolle mehr. Was erklärt das?", "o": ["Verfügbarkeitsheuristik", "How-do-I-feel-about-it-Heuristik", "Fehlattribution", "Erregungstransfer"], "a": [1, 2], "e": "Ohne Hinweis wird die wetterbedingte Stimmung als Info über das eigene Leben genutzt (**How-do-I-feel**) – eine **Fehlattribution**. Wird das Wetter als Ursache bewusst, korrigiert man sie."},
{"id": "q1f80lbx", "c": 5, "t": "mc", "alt": 1, "q": "Personen sehen ein Foto unterschiedlich lange und sollen sich einen Eindruck bilden. Was zeigt sich?", "o": ["Je länger man hinsieht, desto extremer wird das Urteil.", "Für einen stabilen Eindruck braucht man mindestens eine Sekunde.", "Je kürzer man hinsieht, desto extremer wird das Urteil.", "Der Eindruck steht schon nach Sekundenbruchteilen und ändert sich danach kaum noch."], "a": 3, "e": "Erste Eindrücke entstehen **extrem schnell** – längeres Hinsehen ändert sie meist nur wenig (eher wächst die Sicherheit)."},
{"id": "q1iksqp0", "c": 5, "t": "mc", "alt": 1, "q": "Womit befasst sich die soziale Wahrnehmung?", "o": ["Wie Kommunikation Einstellungen verändert", "Wie man sich selbst durch Vergleiche mit anderen einschätzt", "Wie man Informationen über andere aufnimmt, verknüpft und deutet, um sich ein Bild von ihnen zu machen", "Wie man aus Normen auf das Verhalten einer Gruppe schließt"], "a": 2, "e": "**Soziale Wahrnehmung** = Eindrucksbildung über **andere Personen**."},
{"id": "q1no2ed4", "c": 5, "t": "mc", "alt": 1, "q": "Wie hängt der Halo-Effekt mit dem ersten Eindruck zusammen?", "o": ["Typische Merkmale entscheiden, welcher Kategorie man jemanden zuordnet.", "Eine auffällige Eigenschaft färbt, wie man die übrigen Eigenschaften der Person sieht.", "Der erste Eindruck macht passende Informationen über die Person leichter zugänglich.", "Neben einer auffälligen Eigenschaft wirken andere Eigenschaften im Kontrast dazu."], "a": 1, "e": "**Halo:** Eine hervorstechende Eigenschaft (z. B. Attraktivität) **strahlt** auf das Urteil über andere Merkmale aus."},
{"id": "q2hyjp6", "c": 5, "t": "mc", "alt": 1, "q": "Als was wird eine große Person typischerweise eher eingeschätzt?", "o": ["Einfühlsam", "Gewissenhaft", "Kompetent", "Kooperativ"], "a": 2, "e": "Körpergröße wirkt als Hinweis auf **Status und Kompetenz**."},
{"id": "qq8ceir", "c": 5, "t": "ms", "alt": 1, "q": "Welche zwei Dimensionen sind die „Big Two“ der Personenwahrnehmung?", "o": ["Valenz", "Communion (Wärme, Gemeinschaft)", "Aktivierung", "Agency (Kompetenz, Durchsetzung)"], "a": [1, 3], "e": "**Agency** (kompetent, durchsetzungsfähig) und **Communion** (warm, vertrauenswürdig)."},
{"id": "qakqpoy", "c": 5, "t": "ms", "alt": 1, "q": "Was bewirken kurze, beiläufige Berührungen bei anderen?", "o": ["Wer vom Verkaufspersonal berührt wird, kauft eher.", "Wer kurz berührt wird, erfüllt eher eine Bitte.", "In Wettkampfsituationen senken Berührungen das Statusgefühl.", "Wer von Lehrenden berührt wird, ist motivierter."], "a": [0, 1, 3], "e": "Flüchtige, angemessene Berührungen steigern **Hilfsbereitschaft**, **Kaufbereitschaft** und **Motivation**."},
{"id": "qsn5tum", "c": 5, "t": "mc", "alt": 1, "q": "Nach Kelley wird Verhalten über drei Kriterien erklärt. Zeigt die Person dieses Verhalten auch bei anderen Reizen bzw. in anderen Situationen? Welches Kriterium ist das?", "o": ["Konsistenz", "Konsensus", "Distinktheit", "Spezifität"], "a": 2, "e": "**Distinktheit:** nur bei diesem Reiz oder auch bei anderen? Achtung: dieselbe Situation zu verschiedenen Zeitpunkten = **Konsistenz**, andere Personen = **Konsensus**."},
{"id": "q1kz04y", "c": 5, "t": "ms", "alt": 1, "q": "Auf einem Dating-Portal sieht man zuerst nur Foto und Nickname. Womit macht man den besten ersten Eindruck?", "o": ["Mit einem leicht lesbaren, vertrauten Nickname, der an etwas Positives erinnert", "Mit einem möglichst ausgefallenen Nickname, um aufzufallen", "Als Frau mit leicht abgewandtem Blick, um weniger dominant zu wirken", "Mit freundlichem Gesichtsausdruck und Blickkontakt"], "a": [0, 3], "e": "**Leicht verarbeitbare** Namen mit positiven Assoziationen (Fluency) und ein **freundliches Gesicht mit Blickkontakt** wirken am besten."},
{"id": "q1ia4vmx", "c": 5, "t": "mc", "alt": 1, "q": "Welches Beispiel zeigt im Kovariationsmodell eine niedrige Konsistenz?", "o": ["Tina nimmt an der Uni mal die Treppe, mal den Aufzug.", "Tina fährt regelmäßig mit dem Aufzug.", "Tina nimmt die Treppe, Julia und Anna nehmen den Aufzug.", "Tina nimmt an der Uni die Treppe, im Einkaufszentrum die Rolltreppe."], "a": 0, "e": "**Konsistenz** = gleiches Verhalten beim **selben Reiz über die Zeit**. Mal so, mal so → niedrig. Andere Personen = Konsensus, andere Orte/Reize = Distinktheit."},
{"id": "q1lvogqo", "c": 5, "t": "mc", "alt": 1, "q": "Nach Kelley prüft man unter anderem: Verhalten sich andere Menschen in derselben Situation ähnlich? Wie heißt dieses Kriterium?", "o": ["Konsensus", "Konsistenz", "Spezifität", "Distinktheit"], "a": 0, "e": "**Konsensus** = Verhalten **andere** sich gegenüber demselben Reiz genauso?"},
{"id": "q10u5jq", "c": 5, "t": "ms", "alt": 1, "q": "Was gehört zum positiven Hypothesentesten bei der Eindrucksbildung?", "o": ["Widersprechende Infos zählen stärker als bestätigende.", "Der erste Eindruck steuert, nach welchen weiteren Infos man sucht.", "Zuerst gleicht man die Hypothese mit Basisraten ab.", "Mehrdeutige Infos werden passend zur bestehenden Annahme gedeutet."], "a": [1, 3], "e": "Man **sucht und deutet** Informationen so, dass die bestehende Annahme **bestätigt** wird."},
{"id": "q1o0jh3n", "c": 5, "t": "ms", "alt": 1, "q": "Was stimmt über die Akteur-Beobachter-Divergenz?", "o": ["Beobachter achten vor allem auf die Situation statt auf die handelnde Person.", "Akteure wissen meist mehr darüber, wie unterschiedlich sie sich in verschiedenen Situationen verhalten.", "Wer handelt, führt das eigene Verhalten eher auf die Situation zurück.", "Wer beobachtet, führt das Verhalten anderer eher auf deren Person zurück."], "a": [1, 2, 3], "e": "Akteure sehen die **Situation**, Beobachter die **Person** (Salienz). Dazu kommt: Akteure kennen ihr eigenes Verhalten in vielen Situationen."},
{"id": "q1grf0q2", "c": 5, "t": "mc", "alt": 1, "q": "Wie läuft Attribution laut dem Zwei-Stufen-Modell ab?", "o": ["Zuerst Konsensus, dann Konsistenz", "Interne und externe Infos werden zuerst parallel verarbeitet und dann zusammengeführt", "Zuerst ein schneller Schluss auf die Person, danach eventuell eine bewusste Korrektur durch die Situation", "Zuerst Prüfung der Situation, dann Abgleich mit Persönlichkeitsmerkmalen"], "a": 2, "e": "**Stufe 1:** automatisch dispositional. **Stufe 2:** Korrektur um situative Faktoren – kostet Kapazität und fällt unter Ablenkung oft weg."},
{"id": "q178hp9a", "c": 5, "t": "mc", "alt": 1, "q": "Stereotype über das Geschlecht beeinflussen, wie man eine Person deutet. Welche Art von Verarbeitung ist das?", "o": ["Kovariationsanalyse", "Bottom-up-Verarbeitung", "Kontrollierte Korrektur einer Attribution", "Top-down-Verarbeitung"], "a": 3, "e": "Ein Stereotyp ist ein **Schema** – wenn Vorwissen die Deutung lenkt, ist das **Top-down**."},
{"id": "q135xmat", "c": 5, "t": "mc", "alt": 1, "q": "Welches Phänomen wird unter anderem mit perzeptueller Salienz erklärt?", "o": ["Mere-Exposure-Effekt", "Selbstwertdienliche Attribution", "Sozialer Vergleich", "Akteur-Beobachter-Divergenz"], "a": 3, "e": "Für Beobachter ist die **Person salient**, für Akteure die **Situation** → unterschiedliche Ursachenzuschreibung."},
{"id": "qxk6m9b", "c": 5, "t": "ms", "alt": 1, "q": "Was trifft auf implizite Persönlichkeitstheorien zu?", "o": ["Sie beschreiben, wie soziale Situationen typischerweise ablaufen.", "Sie färben, wie man vorhandene Infos über jemanden deutet.", "Sie lassen uns Lücken im Bild einer Person auffüllen.", "Sie enthalten Annahmen, welche Eigenschaften meist zusammen auftreten."], "a": [1, 2, 3], "e": "**Implizite Persönlichkeitstheorie:** „Wer X ist, ist bestimmt auch Y.“ So ergänzt und deutet man. Typische Abläufe wären Skripte."},
{"id": "q15gk4xh", "c": 5, "t": "mc", "alt": 1, "q": "Bei welchem Muster schließt man laut Kovariationsmodell auf eine Ursache in der Person?", "o": ["Konsensus niedrig, Distinktheit niedrig, Konsistenz hoch", "Konsensus hoch, Konsistenz hoch, Distinktheit niedrig", "Die Person steht im Fokus der Aufmerksamkeit", "Passende Eigenschaften sind gerade besonders zugänglich"], "a": 0, "e": "**Intern:** nur diese Person (Konsensus ↓), bei vielen Reizen (Distinktheit ↓), immer wieder (Konsistenz ↑)."},
{"id": "q16o288x", "c": 5, "t": "ms", "alt": 1, "q": "Was beschreibt der fundamentale Attributionsfehler?", "o": ["Man erklärt eigenes Verhalten stärker über die Persönlichkeit als das Verhalten anderer.", "Man unterschätzt die Situation als Ursache für das Verhalten anderer.", "Man gewichtet Konsensus-Infos stärker als Infos über die Person.", "Man überschätzt die Persönlichkeit als Ursache für das Verhalten anderer."], "a": [1, 3], "e": "Beim Verhalten **anderer**: Person **über**-, Situation **unter**schätzt."},
{"id": "q1qo1hl5", "c": 6, "t": "mc", "alt": 1, "q": "Was ist mit dem „Working Self“ gemeint?", "o": ["Das Selbst als ständiger Entwicklungsprozess", "Das Selbst im Arbeitskontext", "Der Teil des großen Selbstwissens, der gerade aktiviert ist", "Das handelnde Selbst im Gegensatz zum gespeicherten Wissen"], "a": 2, "e": "Vom riesigen Selbstwissen ist immer nur ein **Ausschnitt aktiv** – je nach Situation, Zielen und Zugänglichkeit."},
{"id": "q1eoihl5", "c": 6, "t": "ms", "alt": 1, "q": "Was kennzeichnet das Selbstkonzept?", "o": ["Wir wollen ein stabiles und positives Bild von uns selbst.", "Je nach Situation sind andere Teile des Selbstkonzepts aktiv.", "Ob ein Selbstaspekt zugänglich ist, hängt vor allem davon ab, wie stabil er über das Leben ist.", "Abweichungen zwischen aktuellem und möglichem zukünftigem Selbst können bestimmte Emotionen auslösen."], "a": [0, 1, 3], "e": "Das Selbstkonzept ist **kontextabhängig aktiviert**, wir streben nach einer **positiven, stabilen** Sicht, und **Selbst-Diskrepanzen** erzeugen Gefühle (z. B. Enttäuschung, Angst)."},
{"id": "q6utuv6", "c": 6, "t": "mc", "alt": 1, "q": "Was passiert, wenn die Selbstaufmerksamkeit steigt?", "o": ["Man achtet mehr auf andere Personen.", "Äußere Merkmale zählen mehr als innere Maßstäbe.", "Situative Anforderungen werden wichtiger als persönliche Werte.", "Eigene Ziele und Werte werden stärker aktiviert."], "a": 3, "e": "Bei hoher Selbstaufmerksamkeit (z. B. vor einem Spiegel) werden **persönliche Standards** salient und man vergleicht sein Verhalten damit."},
{"id": "q10od6hi", "c": 6, "t": "ms", "alt": 1, "q": "Was kann bestimmte Selbstaspekte dauerhaft (chronisch) zugänglich machen?", "o": ["Entwicklungsaufgaben", "Die aktuelle Stimmung", "Eigene Merkmale, die auffallen oder von anderen abweichen", "Die Kultur, in der man aufwächst"], "a": [0, 2, 3], "e": "**Entwicklungsaufgaben**, **Auffälligkeit** und **Kultur** wirken dauerhaft. Stimmung wirkt nur kurzfristig."},
{"id": "qf3q2rc", "c": 6, "t": "ms", "alt": 1, "q": "Was besagt der Self-Reference-Effekt?", "o": ["Selbstbezug macht situative Erklärungen des eigenen Verhaltens wahrscheinlicher.", "Was mit uns selbst zu tun hat, wird oft besser behalten.", "Selbstbezogenes wird vor allem über soziale Vergleiche verarbeitet.", "Was mit uns selbst zu tun hat, wird besonders tief verarbeitet."], "a": [1, 3], "e": "Das Selbst ist ein **besonders reiches Schema** – Infos mit Selbstbezug werden **tiefer verarbeitet** und **besser erinnert**."},
{"id": "q1ddn5d5", "c": 6, "t": "ms", "alt": 1, "q": "Was stimmt über independentes und interdependentes Selbst?", "o": ["Beim interdependenten Selbst spielen Beziehungen für die Selbstdefinition eine kleinere Rolle.", "Beim interdependenten Selbst gehören Beziehungen und Kontext stärker zur Selbstdefinition.", "Beim independenten Selbst leiten eigene Gedanken und Gefühle das Handeln stärker.", "Das independente Selbst betont Eigenständigkeit und Einzigartigkeit."], "a": [1, 2, 3], "e": "**Independent:** autonom, einzigartig, innere Zustände leiten. **Interdependent:** verbunden, durch Beziehungen und Kontext definiert."},
{"id": "q9s4pm5", "c": 6, "t": "mc", "alt": 1, "q": "Lena feiert die ganze Nacht vor einer wichtigen Prüfung. Welcher Mechanismus könnte dahinterstecken?", "o": ["Self-Serving Bias", "Self-Handicapping", "Sandbagging", "Self-Affirmation"], "a": 1, "e": "**Self-Handicapping:** Man baut sich selbst ein Hindernis ein – fällt man durch, lag’s an der Party, nicht an der Fähigkeit."},
{"id": "qm7borh", "c": 6, "t": "ms", "alt": 1, "q": "Welche Arten von Identität unterscheidet die Theorie der sozialen Identität?", "o": ["Soziale Identität", "Situative Identität", "Personale Identität", "Relationale Identität"], "a": [0, 2], "e": "**Personal** = eigene, individuelle Merkmale. **Sozial** = Zugehörigkeit zu Gruppen."},
{"id": "q697z94", "c": 6, "t": "ms", "alt": 1, "q": "Welche Folgen kann es laut Terror-Management-Theorie haben, an den eigenen Tod erinnert zu werden?", "o": ["Leistungsvergleiche mit anderen werden für das Selbstbild wichtiger.", "Wer die eigene Weltsicht bedroht, wird eher aggressiv behandelt.", "Moralische Vergehen werden strenger bestraft.", "Wer die eigene Weltsicht bestätigt, wird positiver gesehen."], "a": [1, 2, 3], "e": "**Mortalitätssalienz** → man **verteidigt die eigene Weltsicht**: Bestätigende werden aufgewertet, Bedrohende und Normbrecher härter behandelt."},
{"id": "q1f2tptb", "c": 6, "t": "ms", "alt": 1, "q": "Eine Freundin ist in einem Bereich, der dir wichtig ist, besser als du. Wie kann man laut Selbstwerterhaltungs-Modell reagieren?", "o": ["Den Bereich für sich selbst unwichtiger machen", "Mehr Abstand zur Freundin nehmen", "Sich über ihren Erfolg noch stärker mit dem Bereich identifizieren", "Die eigene Leistung steigern"], "a": [0, 1, 3], "e": "Bei **selbstrelevanten** Vergleichen schützt man den Selbstwert durch: **Leistung verbessern**, **Relevanz senken** oder **Nähe verringern**."},
{"id": "qiyex6a", "c": 6, "t": "mc", "alt": 1, "q": "Was versteht man unter sozialer Identität?", "o": ["Die Fähigkeit, sich in verschiedenen Situationen passend zu verhalten", "Die Einschätzung der eigenen sozialen Fähigkeiten im Vergleich zu anderen", "Den Teil des Selbst, der aus der Zugehörigkeit zu Gruppen entsteht", "Die Selbstbeschreibung über individuelle Merkmale"], "a": 2, "e": "**Soziale Identität** = wer ich bin als **Gruppenmitglied** (Eigengruppe vs. Fremdgruppe). Individuelle Merkmale = personale Identität."},
{"id": "qh2u46m", "c": 6, "t": "ms", "alt": 1, "q": "Was stimmt über relationale und kollektive Interdependenz?", "o": ["Relationale Interdependenz meint vor allem die Zugehörigkeit zu großen sozialen Kategorien.", "Relationale Interdependenz meint vor allem enge Beziehungen zu einzelnen Menschen.", "Kollektive Interdependenz meint vor allem die Verbundenheit mit größeren Gruppen.", "Kollektive Interdependenz ist bei Männern im Schnitt stärker ausgeprägt."], "a": [1, 2, 3], "e": "**Relational** = enge Zweierbeziehungen (eher bei Frauen), **kollektiv** = größere Gruppen (eher bei Männern)."},
{"id": "qyrmven", "c": 6, "t": "ms", "alt": 1, "q": "Was ist kontrafaktisches Denken?", "o": ["Nach einem Ereignis mehrere mögliche Ursachen gegeneinander abwägen", "Sich ausmalen, wie ein vergangenes Ereignis anders hätte ausgehen können", "Vor einer Entscheidung künftige Möglichkeiten im Kopf durchspielen", "Über Vergangenes nachdenken, um daraus etwas für die Zukunft zu lernen"], "a": [1, 3], "e": "**„Was wäre, wenn …?“** – man verändert Vergangenes gedanklich und kann daraus für künftiges Verhalten lernen."},
{"id": "qqe3l5b", "c": 6, "t": "mc", "alt": 1, "q": "Laut welcher Theorie kann die Leistung einer anderen Person das eigene Selbstbild bedrohen – umso mehr, je näher sie uns steht und je wichtiger uns der Bereich ist?", "o": ["Theorie der Dissonanzreduktion", "Selbstergänzungstheorie", "Selbstwahrnehmungstheorie", "Self-Evaluation-Maintenance-Theorie (Selbstwerterhaltung)"], "a": 3, "e": "Tesser: Bedrohung = **Nähe × Relevanz** des Bereichs."},
{"id": "q11e7oyh", "c": 6, "t": "ms", "alt": 1, "q": "Was kennzeichnet selbstwertdienliche Attributionen?", "o": ["Erfolge schreibt man eher den eigenen Fähigkeiten oder der eigenen Anstrengung zu.", "Erfolge führt man lieber auf günstige Umstände zurück.", "Misserfolge erklärt man eher mit der Situation.", "Bei Misserfolgen betont man vor allem stabile eigene Schwächen."], "a": [0, 2], "e": "Zum Schutz des Selbstwerts: **Erfolg intern**, **Misserfolg extern**."},
{"id": "qu8ge1l", "c": 6, "t": "ms", "alt": 1, "q": "Was stimmt über Assimilation und Kontrast bei sozialen Vergleichen?", "o": ["Assimilation: Das eigene Urteil rückt näher an den Vergleichsmaßstab heran.", "Wer auf Ähnlichkeiten achtet, erlebt eher Kontrast.", "Wer auf Unterschiede achtet, erlebt eher Assimilation.", "Kontrast: Das eigene Urteil entfernt sich vom Vergleichsmaßstab."], "a": [0, 3], "e": "**Ähnlichkeitsfokus → Assimilation** (man rückt heran), **Unterschiedsfokus → Kontrast** (man rückt weg)."},
{"id": "qxxl7jh", "c": 7, "t": "mc", "alt": 1, "q": "Welche Einstellungen sagen spontanes Verhalten am besten vorher?", "o": ["Einstellungen, die auf eigenem Verhalten beruhen", "Spontan gebildete Einstellungen", "Explizite Einstellungen, die sehr leicht zugänglich sind", "Einstellungen aus persönlicher Erfahrung"], "a": 2, "e": "In spontanen Situationen bleibt keine Zeit zum Nachdenken – es wirkt, was **schnell aktiviert** wird. Entscheidend ist also die **hohe Zugänglichkeit**."},
{"id": "qs97ujb", "c": 7, "t": "mc", "alt": 1, "q": "In einem Lokal stinkt es, im Hintergrund läuft ein Lied, das Tom nicht kennt. Am nächsten Tag hört er das Lied in einem Geschäft und fühlt sich unwohl. Wie heißt dieser Vorgang?", "o": ["Mere-Exposure-Effekt", "Evaluatives Konditionieren", "Modelllernen", "Operantes Lernen"], "a": 1, "e": "Ein **neutraler Reiz** (Lied) übernimmt die **Bewertung** eines gleichzeitig erlebten negativen Reizes (Gestank) → **evaluatives Konditionieren**."},
{"id": "q1kpmhe9", "c": 7, "t": "mc", "alt": 1, "q": "Um die implizite Einstellung zu Katzen zu messen, sortieren Personen Wörter nach positiv/negativ und Bilder nach Hund/Katze. In einem Block liegen „positiv + Katze“ auf einer Taste und „negativ + Hund“ auf der anderen, im nächsten Block ist es vertauscht. Welches Verfahren ist das?", "o": ["Affektives Priming", "Affect Misattribution Procedure", "Go/No-Go-Aufgabe", "Impliziter Assoziationstest (IAT)"], "a": 3, "e": "Beim **IAT** teilen sich Ziel- und Bewertungskategorie eine Taste. Schnellere Reaktionen bei einer Kombination zeigen eine stärkere Assoziation."},
{"id": "q1dgeylk", "c": 7, "t": "ms", "alt": 1, "q": "Aus welchen Komponenten besteht eine Einstellung laut ABC-Modell?", "o": ["Kognitiv (Gedanken, Überzeugungen)", "Perzeptuell (Wahrnehmung)", "Behavioral (Verhalten)", "Affektiv (Gefühle)"], "a": [0, 2, 3], "e": "**A**ffect, **B**ehavior, **C**ognition."},
{"id": "q1s2w0qh", "c": 7, "t": "mc", "alt": 1, "q": "Was ist die Bogus-Pipeline-Methode?", "o": ["Eine Messung von Einstellungen über Körpersignale", "Ein Verfahren, das explizite Antworten an vorher gemessene implizite Werte angleicht", "Ein Verfahren, das Assoziationen über Reaktionszeiten misst", "Ein Trick, um bei direkten Fragen Verzerrungen durch soziale Erwünschtheit zu verringern"], "a": 3, "e": "Man lässt die Person glauben, ein Gerät erkenne **Lügen** – dadurch antwortet sie ehrlicher, auch bei unbeliebten Meinungen."},
{"id": "quzn99p", "c": 7, "t": "mc", "alt": 1, "q": "Für Pralinen soll ein Werbespruch her. Welcher passt laut ABC-Modell am besten?", "o": ["„Feinste Zutaten – da nehm ich gern noch eine.“", "„Das ABC-Modell sagt dazu nichts.“", "„Zartschmelzende Versuchung.“", "„85 % Kakao aus fairem Handel.“"], "a": 2, "e": "Bei Genussmitteln dominiert die **affektive** Komponente – ein Spruch, der **Genuss und Gefühl** anspricht, wirkt am besten. Fakten über Kakao sprechen die kognitive Komponente an."},
{"id": "qfpges3", "c": 7, "t": "mc", "alt": 1, "q": "In Stracks Stift-Studie hielten Personen einen Stift mit den Zähnen oder mit den Lippen und bewerteten Cartoons. Welches Ergebnis passt zur Facial-Feedback-Hypothese?", "o": ["Die Stifthaltung wirkte eher auf das Erinnern als auf die Bewertung.", "„Lippen“-Gruppe fand die Cartoons lustiger als die „Zähne“-Gruppe.", "Beide Haltungen wirkten in dieselbe Richtung, nur verschieden stark.", "„Zähne“-Gruppe fand die Cartoons lustiger als die „Lippen“-Gruppe."], "a": 3, "e": "Stift zwischen den **Zähnen** aktiviert die **Lächelmuskeln** → Rückmeldung ans Gehirn → Cartoons wirken lustiger."},
{"id": "q1wxv4rh", "c": 7, "t": "mc", "alt": 1, "q": "„Ich kaufe das Auto, weil es umweltfreundlich ist.“ Welche Einstellungskomponente steht hier im Vordergrund?", "o": ["Behavioral", "Affektiv", "Evaluativ", "Kognitiv"], "a": 3, "e": "Die Begründung stützt sich auf eine **Überzeugung über eine Eigenschaft** → **kognitiv**."},
{"id": "q14ibdwf", "c": 7, "t": "ms", "alt": 1, "q": "Einstellungen können durch evaluatives Konditionieren entstehen. Was stimmt?", "o": ["Tritt B nur manchmal mit A auf und kündigt A das Auftreten von B nicht an, ändert sich die Einstellung zu A nicht.", "Wird ein neutraler Reiz A mit einem positiven Reiz B verknüpft, wird A positiver bewertet.", "Ist A mit einem positiven B verknüpft, kann auch ein mit A verbundener neutraler Reiz C positiver werden.", "Wird B unterhalb der Wahrnehmungsschwelle gezeigt, ändert sich die Einstellung zu A nicht."], "a": [1, 2], "e": "Beim evaluativen Konditionieren reicht das **gemeinsame Auftreten** (keine Vorhersage nötig) und es klappt teils sogar **unterschwellig**. Die Bewertung kann sich auf **verbundene Reize ausbreiten**."},
{"id": "q3dzy8i", "c": 7, "t": "ms", "alt": 1, "q": "Zanna & Cooper (1974): Personen bekamen ein Placebo mit angeblich anregender, beruhigender oder keiner Wirkung und schrieben dann einen Aufsatz gegen ihre Meinung (für ein Redeverbot am Campus). Was stimmt?", "o": ["Die „anregend“-Gruppe führte ihre Erregung eher auf den Aufsatz zurück als die anderen.", "Die angekündigte Wirkung steigerte die Selbstaufmerksamkeit und damit die Einstellungsänderung.", "Die „anregend“-Gruppe änderte ihre Einstellung kaum mehr als die Kontrollgruppe.", "Die „beruhigend“-Gruppe erlebte besonders viel Dissonanz und befürwortete das Verbot danach stärker."], "a": [2, 3], "e": "Wer die unangenehme Erregung **auf die Pille schieben** kann, muss seine Einstellung nicht ändern. Wer Entspannung erwartet, kann die Erregung nicht wegerklären → stärkere Dissonanz → mehr Einstellungsänderung."},
{"id": "qcjoam5", "c": 7, "t": "mc", "alt": 1, "q": "Pia kann dich nicht leiden, tut dir aber trotzdem einen Gefallen, weil du sie darum gebeten hast. Was ist laut Dissonanztheorie wahrscheinlich?", "o": ["Pia erlebt Dissonanz und mag dich danach mehr.", "Du erlebst Dissonanz und magst Pia danach weniger.", "Pia erlebt Dissonanz und mag dich danach noch weniger.", "Du erlebst Dissonanz und magst Pia danach mehr."], "a": 0, "e": "Pias **Verhalten** (Gefallen) widerspricht ihrer **Einstellung** (Abneigung). Um die Dissonanz zu verringern, passt sie die Einstellung an und mag dich danach mehr (Ben-Franklin-Effekt)."},
{"id": "qg4n66w", "c": 7, "t": "ms", "alt": 1, "q": "Was stimmt über die Theorie des geplanten Verhaltens?", "o": ["Soziale Normen geben an, wie viele andere das Verhalten tatsächlich zeigen.", "Einstellungen wirken über die Verhaltensabsicht auf das Verhalten.", "Die affektive Komponente beeinflusst die Absicht besonders stark.", "Neben der Absicht sagt auch die wahrgenommene Kontrolle das Verhalten vorher."], "a": [1, 3], "e": "**Einstellung + subjektive Norm + wahrgenommene Kontrolle → Intention → Verhalten**. Die Kontrolle wirkt zusätzlich auch direkt. Die subjektive Norm meint, was wichtige andere **erwarten**, nicht wie viele es tun."},
{"id": "q1q2vsf7", "c": 7, "t": "ms", "alt": 1, "q": "Wann zeigt sich eine Einstellung eher im Verhalten?", "o": ["Wenn Einstellung und Verhalten ähnlich konkret formuliert sind", "Wenn die Einstellung gleichzeitig stark positiv und negativ ist", "Wenn die Einstellung sehr leicht zugänglich ist", "Wenn die Einstellung eher auf Erzählungen anderer als auf eigener Erfahrung beruht"], "a": [0, 2], "e": "**Zugängliche** Einstellungen werden schnell aktiviert, und **gleiche Spezifität** (Korrespondenz) verbessert die Vorhersage. Ambivalenz und indirekte Erfahrung schwächen den Zusammenhang."},
{"id": "q418h1y", "c": 7, "t": "mc", "alt": 1, "q": "Festinger & Carlsmith (1959): Teilnehmende bekamen 1 $ oder 20 $ dafür, jemandem eine langweilige Aufgabe als spannend zu verkaufen. Was kam heraus?", "o": ["Die 1-$-Gruppe fand die Aufgabe danach interessanter als die 20-$-Gruppe.", "Die 1-$-Gruppe fand die Aufgabe danach noch langweiliger, weil das wenige Geld zusätzlich frustrierte.", "Beide Gruppen bewerteten die Aufgabe gleich, weil beide gelogen hatten.", "Die 20-$-Gruppe fand die Aufgabe danach interessanter, weil die Belohnung die Bewertung verstärkte."], "a": 0, "e": "**Unzureichende Rechtfertigung:** 1 $ erklärt die Lüge nicht → Dissonanz → „War eigentlich eh ganz interessant.“ 20 $ reichen als Rechtfertigung."},
{"id": "q1bywdfq", "c": 7, "t": "mc", "alt": 1, "q": "Was haben die Theorie des geplanten Verhaltens und das reflektive System im Reflektiv-Impulsiv-Modell gemeinsam?", "o": ["Beide setzen sozialen Druck von außen ins Zentrum.", "Beide hängen stark von der Zugänglichkeit impliziter Assoziationen ab.", "Beide beschreiben bewusst geplantes, durchdachtes Verhalten.", "Bei beiden ist die Absicht der direkte Ausgangspunkt jeder Steuerung."], "a": 2, "e": "Beide beschreiben **überlegte, zielgerichtete** Verhaltenssteuerung. Normen gehören zur TPB, aber nicht zum Kern des reflektiven Systems."},
{"id": "q1mfwxfb", "c": 7, "t": "ms", "alt": 1, "q": "Wie hängen Stärke und Zugänglichkeit einer Einstellung zusammen?", "o": ["Eigene Erfahrungen machen eine Einstellung stärker, aber kaum zugänglicher.", "Starke Einstellungen sind oft auch gut zugänglich.", "Gut zugängliche Einstellungen sind meist extrem, starke eher selten.", "Starke und gut zugängliche Einstellungen sagen Verhalten besser vorher als schwache oder schwer zugängliche."], "a": [1, 3], "e": "Stärke und Zugänglichkeit sind **verschiedene Merkmale**, gehen aber **oft zusammen** – und beide machen eine Einstellung **verhaltenswirksamer**."},
{"id": "qjfe2zv", "c": 7, "t": "ms", "alt": 1, "q": "Wie lässt sich kognitive Dissonanz verringern?", "o": ["Man verändert eine der widersprüchlichen Kognitionen oder macht sie unwichtiger.", "Man ändert sein Verhalten, damit es zur Einstellung passt.", "Man macht die widersprüchlichen Kognitionen wichtiger.", "Man fügt neue, passende Kognitionen hinzu."], "a": [0, 1, 3], "e": "Dissonanz sinkt durch **Verhalten ändern**, **Kognition ändern/abwerten** oder **passende Kognitionen ergänzen**. Mehr Wichtigkeit würde sie verstärken."},
{"id": "q2iu5yj", "c": 7, "t": "mc", "alt": 1, "q": "Was besagt das Korrespondenzprinzip?", "o": ["Allgemeine Einstellungen sagen konkretes Verhalten besser vorher als spezifische.", "Eine starke Einstellung gleicht unterschiedliche Spezifität aus.", "Einstellung und Verhalten hängen enger zusammen, wenn beide gleich spezifisch erfasst werden.", "Der Zusammenhang wächst, wenn man beides zu verschiedenen Zeitpunkten und Ebenen misst."], "a": 2, "e": "**Gleiche Ebene:** „Einstellung zum Recyceln von Glas“ sagt das Glas-Recyceln besser vorher als „Einstellung zur Umwelt“."},
{"id": "q38oszj", "c": 7, "t": "mc", "alt": 1, "q": "Warum mögen Menschen eine Gruppe oft mehr, wenn die Aufnahme besonders hart war?", "o": ["Die harte Aufnahme wird als Zeichen für hohen Status gedeutet.", "Man wertet die Gruppe auf, um sich von Abgelehnten abzuheben.", "Durch die Mitgliedschaft wird die positive soziale Identität wichtiger als das frühere Urteil.", "Den großen Aufwand rechtfertigt man, indem man die Gruppe im Nachhinein besonders attraktiv findet."], "a": 3, "e": "**Aufwandsrechtfertigung (Dissonanz):** „So viel Mühe für eine mittelmäßige Gruppe?“ → Gruppe wird aufgewertet."},
{"id": "q1umon91", "c": 7, "t": "mc", "alt": 1, "q": "Wie geht man nach dem Prinzip der Einstellungsimpfung vor?", "o": ["Man liefert viele Argumente, die die bisherige Meinung stützen.", "Man bringt einige wenige, schwache Argumente gegen die bisherige Meinung.", "Man ergänzt ein paar weitere Argumente, die die Meinung bestätigen.", "Man konfrontiert mit vielen starken Gegenargumenten und bespricht sie danach."], "a": 1, "e": "Wie bei einer Impfung: eine **schwache Dosis Gegenargumente** regt an, eigene Abwehrargumente zu bilden → später widerstandsfähiger gegen starke Angriffe."},
{"id": "qjxbff9", "c": 7, "t": "ms", "alt": 1, "q": "Studierende lesen einen Text über höhere Studiengebühren – geplant in 1 Jahr oder in 10 Jahren. Der Text stammt von einem Professor oder einem Schüler und hat starke oder schwache Argumente. Was passt zum Elaboration-Likelihood-Modell?", "o": ["Beim Professor wirken schwache Argumente überzeugender, beim Schüler verlieren starke Argumente an Wirkung.", "Bei Umsetzung in 10 Jahren zählt eher, wie kompetent die Quelle ist.", "Wann die Erhöhung kommt, spielt für die Verarbeitung keine Rolle.", "Bei Umsetzung schon in 1 Jahr zählt eher, wie gut die Argumente sind."], "a": [1, 3], "e": "**Hohe Relevanz** (betrifft mich bald) → zentrale Route → **Argumentqualität** zählt. **Geringe Relevanz** → periphere Route → **Hinweisreize** wie Expertise der Quelle zählen."},
{"id": "q7a276b", "c": 7, "t": "ms", "alt": 1, "q": "Was macht eine ambivalente Einstellung aus?", "o": ["Positive und negative Bewertungen können als getrennte Dimensionen vorliegen.", "Man hat nur eine schwache Bewertung ohne viel Gefühl.", "Sie ist besonders stabil, weil sich Positives und Negatives ausgleichen.", "Man verbindet mit demselben Objekt gleichzeitig Positives und Negatives."], "a": [0, 3], "e": "**Ambivalent** = gleichzeitig **positiv und negativ**; beide Seiten können getrennt repräsentiert sein. Solche Einstellungen sind eher instabil."},
{"id": "q1qxgw5o", "c": 7, "t": "ms", "alt": 1, "q": "Was kann Reaktanz auslösen?", "o": ["Wenn man seine Wahl- oder Handlungsfreiheit eingeschränkt sieht", "Eine Vorwarnung, dass gleich jemand die eigene Meinung ändern will", "Psychischer Druck wie Drohungen oder Nötigung", "Schwache Gegenargumente, die man leicht widerlegen kann"], "a": [0, 2], "e": "**Reaktanz** = Gegenwehr, wenn die **Freiheit bedroht** ist – man will den Spielraum zurückgewinnen."},
{"id": "q15iaxk0", "c": 7, "t": "ms", "alt": 1, "q": "Worauf konzentriert sich der Yale-Ansatz zur Überzeugung?", "o": ["Auf das Publikum (wer hört zu)", "Auf die Quelle (wer spricht)", "Auf das verwendete Einstellungsmaß", "Auf die Botschaft (was wird gesagt)"], "a": [0, 1, 3], "e": "Yale: **„Wer sagt was zu wem?“** – Quelle, Botschaft, Publikum."},
{"id": "q1fukv96", "c": 7, "t": "ms", "alt": 1, "q": "Was stimmt über das Elaboration-Likelihood-Modell?", "o": ["Es unterscheidet drei getrennte Wege der Verarbeitung.", "Periphere Hinweisreize wie der Expertenstatus können zusätzlich zur Argumentqualität wirken.", "Ob man sich mit einer Botschaft befasst, hängt vor allem von stabilen Persönlichkeitsmerkmalen ab.", "Motivation und Fähigkeit entscheiden, welcher Verarbeitungsweg stärker genutzt wird."], "a": [1, 3], "e": "Zwei Routen: **zentral** (Argumente) und **peripher** (Hinweisreize). Welche dominiert, hängt von **Motivation und Fähigkeit** ab."},
{"id": "q6xg6sx", "c": 7, "t": "ms", "alt": 1, "q": "Was stimmt über explizite und implizite Einstellungen?", "o": ["Implizite Einstellungen erschließt man über indirekte Verfahren, z. B. Reaktionszeiten.", "Implizite Einstellungen misst man am genauesten durch direktes Fragen.", "Zum selben Objekt können explizite und implizite Einstellung auseinandergehen.", "Explizite Einstellungen kann man direkt per Selbstauskunft erfragen."], "a": [0, 2, 3], "e": "**Explizit** = bewusst, direkt erfragbar. **Implizit** = automatische Assoziationen, nur **indirekt** messbar (z. B. IAT). Beide können sich unterscheiden."},
{"id": "q1l6yjsp", "c": 7, "t": "ms", "alt": 1, "q": "Was sagt Bems Selbstwahrnehmungstheorie?", "o": ["Man berücksichtigt dabei auch die Umstände, unter denen man sich so verhalten hat.", "Man schließt vor allem dann aus dem Verhalten, wenn man schon eine starke, klare Einstellung hat.", "Man kann aus dem eigenen Verhalten erschließen, welche Einstellung man hat.", "Das Beobachten des eigenen Verhaltens erzeugt Spannung, die man durch Einstellungsänderung abbaut."], "a": [0, 2], "e": "Wie ein Beobachter von außen: **Verhalten + Situation → Rückschluss auf die eigene Einstellung**, vor allem wenn die Einstellung **schwach/unklar** ist. Spannung abbauen wäre Dissonanztheorie."},
{c:1,t:'mc',alt:1,q:'Worin definiert sich die Sozialpsychologie?',o:['Wie sich das Denken, Fühlen und Verhalten von Menschen durch die tatsächliche, vorgestellte oder implizite Anwesenheit anderer verändert','Wie sich ein bestimmtes Individuum in stabilen Merkmalen von der Gesamtheit unterscheidet','Wie gesellschaftliche Institutionen und Strukturen entstehen und sich wandeln','Wie sich psychologische Merkmale über die Lebensspanne systematisch verändern'],a:0,e:'Definition (Allport, Lehrbuch Kap. 1): Formulierung von Gesetzmäßigkeiten über die Beeinflussung von Denken, Fühlen und Verhalten durch die **tatsächliche, vorgestellte oder implizite Anwesenheit anderer** – und deren Überprüfung an der Realität. Das zweite ist Persönlichkeitspsychologie, das dritte Soziologie, das vierte Entwicklungspsychologie. (Protokoll 15.01.2025)'},
{c:1,t:'ms',alt:1,q:'Was unterscheidet Experimente von korrelativen Studien?',o:['Bei Experimenten werden Personen zufällig auf Bedingungen aufgeteilt, die gezielt hergestellt werden','Nur bei Experimenten darf von Ursache und Wirkung (Kausalität) gesprochen werden','Experimente finden immer im Labor statt, korrelative Studien immer im Feld','Nur bei korrelativen Studien darf von Kausalität gesprochen werden'],a:[0,1],e:'Im Experiment wird die UV **systematisch variiert** und die Zuteilung erfolgt **zufällig** – nur so sind Kausalaussagen möglich. Experimente gibt es auch im Feld (Feldexperiment), Korrelationsstudien auch im Labor. (Protokoll 15.01.2025)'},
{c:1,t:'mc',alt:1,q:'Eine Forscherin will prüfen, ob ein neues Trainingsprogramm die Hilfsbereitschaft erhöht. Worauf liegt bei der experimentellen Methode der Fokus?',o:['Auf Kausalität – ob die Variation der UV die AV verursacht','Auf die Beschreibung von Zusammenhängen zwischen Variablen','Auf eine möglichst genaue Prognose zukünftigen Verhaltens','Auf die Beobachtung von Verhalten im natürlichen Umfeld'],a:0,e:'Experiment = Ursache-Wirkungs-Aussagen (Kausalität). Beschreibung und Vorhersage von Zusammenhängen ist der Fokus der **Korrelation**, Beobachtung im natürlichen Umfeld die **Beobachtungsmethode**. (Protokolle 2017, 2020)'},
{c:1,t:'mc',alt:1,q:'In einem Experiment sehen Kinder entweder einen aggressiven oder einen neutralen Film; danach wird gezählt, wie lange sie einen „hurt“-Knopf drücken. Alle Kinder sehen den Film allein und in demselben Raum. Was ist „derselbe Raum“?',o:['Eine Kontrollvariable (konstant gehaltene Bedingung)','Die unabhängige Variable','Die abhängige Variable','Eine Moderatorvariable'],a:0,e:'UV = Filminhalt (aggressiv vs. neutral), AV = Dauer des „hurt“-Drückens (Liebert & Baron, 1972). Merkmale, die in allen Bedingungen **gleich gehalten** werden (Standardisierung), sind Kontrollvariablen – sie sichern die interne Validität. (Protokoll 28.01.2021: Anwendungsaufgabe UV/AV/Kontrollvariable)'},
{c:1,t:'ms',alt:1,q:'Welche Motive bzw. Bedürfnisse haben für die Theoriebildung in der Sozialpsychologie grundlegende Bedeutung?',o:['Bedürfnis nach einem positiven Selbstbild (Selbstwert)','Bedürfnis nach Zugehörigkeit (Need to belong)','Bedürfnis nach Konsistenz bzw. Kontrolle und Vorhersagbarkeit','Bedürfnis nach Schlaf und Nahrung'],a:[0,1,2],e:'Diese Motive ziehen sich durch das Buch: positives Selbstkonzept (Kap. 6, Selbstwerterhaltung), Zugehörigkeit (soziale Zurückweisung, Social Identity), Konsistenz (Dissonanz, Balance) und Kontrolle/Vorhersagbarkeit (Erwartungsverletzung). Biologische Grundbedürfnisse sind kein sozialpsychologisches Erklärungsmotiv. (Protokoll 07.07.2020 – im Protokoll ohne Antwort, aus dem Buch abgeleitet)'},
{c:2,t:'mc',alt:1,q:'Was passiert typischerweise, wenn man versucht, einen Gedanken zu unterdrücken („Denk nicht an einen weißen Bären!“) – vor allem unter Stress oder Zeitdruck?',o:['Der Gedanke kehrt verstärkt zurück (Bumerangeffekt)','Der Gedanke wird dauerhaft gelöscht','Der Gedanke wird ins reflektive System verschoben und dort kontrolliert','Der Gedanke verliert sofort seine Zugänglichkeit'],a:0,e:'Gedankenunterdrückung führt zum **Bumerangeffekt** (Wegner et al., 1987): Das impulsive System versteht keine Negation – „nicht X“ aktiviert X. Besonders unter Zeitdruck, eingeschränkter Kapazität und Stress. (Protokolle 2015)'},
{c:2,t:'ms',alt:1,q:'Was trifft auf automatische Informationsverarbeitung zu?',o:['Sie ist ressourcenschonend','Sie läuft schnell und weitgehend unbewusst ab','Sie läuft nur ab, wenn man keine Motivation für reflektive Verarbeitung hat','Sie verarbeitet Informationen streng sequenziell und regelbasiert'],a:[0,1],e:'Automatisch = unbewusst, nicht intendiert, ohne Anstrengung (wenig Ressourcen). Sie läuft **immer** mit – nicht nur, wenn Motivation fehlt; das reflektive System kommt bei Motivation und Kapazität nur **hinzu**. Sequenziell/regelbasiert = reflektiv. (Protokoll 04.12.2024)'},

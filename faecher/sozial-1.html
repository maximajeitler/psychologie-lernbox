/* ================== INHALT: Lernzettel ================== */
const CH = [
{id:1, s:'Einführung & Methoden', t:'Einführung in die Sozialpsychologie · Methoden · Krise', sec:[
 {h:'Was ist Sozialpsychologie?', b:[
  '**Wissenschaft** = Formulierung von für andere nachvollziehbaren (intersubjektiven) Gesetzmäßigkeiten und deren **Prüfung an der Realität**.',
  '**Sozialpsychologie** = Formulierung von Gesetzmäßigkeiten über die Beeinflussung von **Denken, Fühlen und Verhalten** von Menschen durch die **tatsächliche, vorgestellte oder implizite Anwesenheit anderer** – und deren Überprüfung an der Realität.',
  'Betrachtet das **durchschnittliche Individuum** im sozialen Kontext (Mensch als Akteur), um allgemeingültige Aussagen zu treffen.',
  'Der soziale Einfluss wird von Menschen meist **unterschätzt**. Es reicht, wenn die soziale Umwelt nur **vorgestellt oder antizipiert** wird (z. B. eine Kamera → Gefühl, beobachtet zu werden).',
  {warn:'Altfrage-Klassiker: „Wie wirkt sich eine Kamera auf das Verhalten aus?“ = Sozialpsychologie. „Ängstliche vs. mutige Personen“ = Persönlichkeitspsychologie, „Einstellungen über die Lebensspanne“ = Entwicklungspsychologie.'},
  '§Abgrenzung zu Nachbardisziplinen',
  {tbl:[['Fach','Fokus'],['Sozialpsychologie','Wie soziale/situative Faktoren Denken, Fühlen, Verhalten des **Individuums** beeinflussen'],['Soziologie','Struktur und Funktion von **Gruppen, Gesellschaften**, Institutionen'],['Persönlichkeitspsychologie','**Unterschiede zwischen Individuen** in relativ überdauernden Merkmalen']]},
  '§Laienpsychologie reicht nicht',
  {vid:"**Lewin-Formel**: D, F, V = f(P, U) – Denken, Fühlen, Verhalten sind eine Funktion von **Person** und **Umwelt**. Sozialpsychologie: die **Wechselwirkung** P × U; Persönlichkeitspsychologie: Fokus auf **P**; Soziologie: Fokus auf **U**."},
  {vid:"Soziologie berücksichtigt die **subjektive Wahrnehmung** der Situation weniger – in der Sozialpsychologie zählt, wie die Situation erlebt wird, nicht nur, wie sie objektiv ist."},
  {vid:"Psychologie arbeitet **empirisch** (wie Physik, Biologie) – deshalb an vielen Unis (auch Graz) an der naturwissenschaftlichen Fakultät; nicht-empirisch arbeiten z. B. formale Philosophie, Rechtswissenschaft."},
  'Volksweisheiten widersprechen sich („Gegensätze ziehen sich an“ vs. „Gleich und gleich gesellt sich gern“). Verzerrungen: **Rückschaufehler (Hindsight Bias)** – im Nachhinein wirkt alles vorhersehbar – und **illusorische Korrelationen**.',
  {vid:"Wir sind alle **Laienpsycholog:innen** (überlebenswichtig, andere vorherzusagen). Aber auch Erklärungen für das **eigene** Verhalten können falsch sein – deshalb wissenschaftliche Prüfung."},
 ]},
 {h:'Methoden: Beobachtung, Korrelation, Experiment', b:[
  'Wissenschaftlicher Prozess: Theorie/Alltagsbeobachtung → **Hypothese** (Wenn-dann, allgemein, empirisch prüfbar) → **Operationalisierung** (konkrete Umsetzung: Bedingungen, Messmethoden) → Datenerhebung → **statistische Auswertung** → empirische Befunde → Theorie.',
  {vid:"**Modell** = mehrere zusammenhängende Hypothesen. Hypothesen stammen aus Theorien, früheren Befunden oder **persönlicher Beobachtung**. Operationalisierungsbeispiel: „umweltfreundliches Verhalten“ als Flugreisen, Mülltrennung oder Öffi-Nutzung. Korrelationen sieht man im **Streudiagramm** (jeder Punkt = eine Person)."},
  'Gesetzmäßigkeiten werden an der Realität über die **statistische Analyse** empirischer Daten geprüft.',
  'Drei Methoden: **Beobachtung**, **Korrelation**, **Experiment**. Die **Dokumentenanalyse** (Auswertung vorhandener Dokumente/Aufzeichnungen) ist eine Form der **Beobachtungsmethode**.',
  '§Korrelation',
  'Fokus: **Beschreibung und Vorhersage** von Zusammenhängen („Je …, desto …“). Korrelationskoeffizient −1 ≤ r ≤ +1.',
  '**Positive Korrelation**: hohe Werte gehen mit hohen Werten einher. **Negative Korrelation**: Zunahme der einen Variable geht mit **Abnahme** der anderen einher.',
  {warn:'Korrelation ≠ Kausalität! Drittvariablen (Konfundierung) können den Zusammenhang erklären (Störche & Geburtenrate; Tattoos & Motorradunfälle → Risikobereitschaft).'},
  '§Experiment',
  'Einzige Methode für **Kausalität** (Ursache–Wirkung): mindestens eine **unabhängige Variable (UV)** wird systematisch **manipuliert**, die **abhängige Variable (AV)** gemessen; **zufällige Zuteilung** zu den Bedingungen.',
  {vid:"Nur die angenommene Ursache darf variiert werden (z. B. nur die **Menge** des Fernsehens, nicht der Inhalt) – wird unbeabsichtigt etwas mitvariiert: **Konfundierung**. **Randomisierung** verhindert **Selbstselektion** und sorgt dafür, dass auch unbeobachtete Variablen **im Mittel** in allen Bedingungen gleich sind. Vermutete Störgrößen kann man **miterheben** (Kontrollvariablen) und – auch in korrelativen Studien – **statistisch konstant halten**."},
  '**Kontrollvariablen** werden in allen Bedingungen konstant gehalten (Standardisierung).',
  'Beispiel Liebert & Baron (1972): UV Filminhalte (aggressiv vs. neutral), UV2 Geschlecht, UV3 Alter (5/6 vs. 8/9); AV aggressives Verhalten = Dauer, den „hurt“-Knopf zu drücken.',
  '**Interne Validität**: Ist der Effekt wirklich auf die UV zurückzuführen? (Standardisierung, Kontrolle, Randomisierung). **Externe Validität**: Übertragbarkeit auf andere Personen, Situationen, Zeitpunkte. Externe Validität ist erst sinnvoll beurteilbar, wenn interne gegeben ist.',
  {warn:'Laborexperimente haben NICHT „zwangsläufig“ geringere externe Validität – das ist in Altfragen die falsche Option.'},
  '**Reliabilität** = Zuverlässigkeit/formale Genauigkeit einer Messung; Anteil der Messwertvarianz, der auf wahre Unterschiede (nicht Messfehler) zurückgeht. (**Validität** = misst es das Gemeinte?)',
  'Kritik am Experiment: künstliche Experimentalsituation, Hauptteilnehmergruppe Studierende, **Coverstory** (Deckgeschichte → psychologischer Realismus) – ethisch: informierte Einwilligung, Datenschutz, Aufklärung.',
  {vid:"**Psychologischer Realismus**: Entscheidend ist nicht, dass die Laborsituation realistisch ist, sondern dass die **psychologischen Prozesse** dieselben sind wie im Alltag; überzeugend sind Replikationen im **Feld**. Die Kritik an Laborsituation und Studierendenstichproben betrifft die **externe Validität**. Coverstories sind ethisch heikel (informierte, freiwillige Zustimmung) → müssen begründet werden, und spätestens danach wird **aufgeklärt**."},
 ]},
 {h:'Design, Haupteffekt, Interaktion', b:[
  '**Einfaktorielles Design** = eine UV; **mehrfaktorielles** = zwei oder mehr UVs (Faktoren). **Stufen** = Anzahl der Bedingungen eines Faktors. 2×2-Design = 2 UVs mit je 2 Stufen → 4 Bedingungen → 2 mögliche Haupteffekte + 1 Interaktion.',
  '**Haupteffekt**: Eine UV wirkt auf die AV in ähnlicher Weise, **unabhängig** von der Ausprägung der anderen UV (z. B. aggressive Filme → mehr Aggression bei Mädchen UND Buben).',
  '**Interaktion (Wechselwirkung)**: Der Effekt einer UV **hängt von der Ausprägung der anderen UV ab** (z. B. aggressive Filme erhöhen Aggression nur bei Buben, bei Mädchen kein Unterschied).',
  {warn:'Altfrage: „Personen mit positiver Umwelteinstellung finden Pro-Mülltrennung-Infos glaubwürdiger, bei negativer Einstellung ist es andersherum“ = Interaktion. „Unabhängig von der Stimmung …“ = Haupteffekt.'},
  'Eine Interaktion kann ohne Haupteffekt auftreten (gekreuztes Muster). Sind in einem 2×2-Design nicht alle Kontraste spezifiziert, gibt es mehrere richtige Diagramme.'
 ]},
 {h:'Statistik & Krise der Psychologie', b:[
  '**Deskriptive Statistik** beschreibt die Stichprobe, **Inferenzstatistik** prüft, ob der Schluss auf die Population zulässig ist.',
  'Konvention: **p < .05** = signifikant. p = Wahrscheinlichkeit, dass in der Stichprobe ein Effekt auftritt, obwohl er in der Population **nicht** existiert. Würde man ihn trotzdem annehmen → **Fehler 1. Art** (α). Wird ein existierender Effekt übersehen → **Fehler 2. Art** (β).',
  {vid:"**Nullhypothese**: kein Effekt in der Population; **Alternativhypothese**: Effekt mindestens so groß wie in der Studie. Signifikant = die Nullhypothese darf zurückgewiesen werden. Bei **sehr großen Stichproben** werden auch winzige Effekte signifikant – „signifikant“ heißt nicht „bedeutsam“."},
  {warn:'Signifikant heißt NICHT, dass der Effekt sicher existiert, und NICHT, dass er in einer zweiten Stichprobe wieder signifikant wird (Dance of the p-values). Signifikanz sagt nichts über die praktische Größe → dafür **Effektstärken**. (Fehler in „Zusammenfassung.pdf“: dort steht p < 0,5 – richtig ist 0,05.)'},
  'Signifikante Ergebnisse entstehen durch: echten Effekt, Zufall, Datenfälschung, **zweifelhafte Forschungspraktiken** (viele Studien, wenige berichten; so lange erheben, bis es passt; kreative Analysen). Problem: **Publication Bias**.',
  '**Krise der Psychologie (Replikationskrise)**: Viele veröffentlichte Befunde lassen sich nicht replizieren (Open Science Collaboration 2015).',
  '**Direkte Replikation** = möglichst exakte Wiederholung; **konzeptuelle Replikation** = gleicher Prozess, andere Operationalisierung.',
  {vid:"Gründe für geringe Replizierbarkeit: Methoden/Material früher unvollständig beschrieben (Open Science bessert das), **fragwürdige Forschungspraktiken** (z. B. Kontrollvariablen ausprobieren, bis das „sauberste“ Ergebnis herauskommt). Eine gescheiterte **konzeptuelle** Replikation kann wertvoll sein: Sie weist auf **Moderatoren** hin."},
  '**Open Science**: Hypothesen, Methoden, Analysen, Daten und Ergebnisse werden öffentlich zugänglich gemacht – **Präregistrierung**, Registered Reports, Open Data/Scripts.',
  '**Power** (1 − β) = Wahrscheinlichkeit, dass ein **existierender** Effekt ein signifikantes Ergebnis liefert. Steigt mit **Stichprobengröße**, **Messgenauigkeit** und **Effektgröße**. Mehr Power und Many-Lab-Studien → zuverlässigere Ergebnisse.',
  'Fazit (Präsenz): Die wissenschaftliche Praxis befindet sich in einer Phase des Umbruchs mit dem Ziel der Qualitätssicherung.',
  'Grundlegende **Motive** in sozialpsychologischen Theorien: positives Selbstbild (Selbstwert), **Zugehörigkeit** (Need to belong), **Konsistenz**, Kontrolle/Vorhersagbarkeit.'
 ]},
 {h:"Hypothesen, Fehlerarten & Korrelationen lesen", b:[
  "**Nullhypothese (H0)**: Es gibt **keinen** Effekt bzw. Zusammenhang. **Alternativhypothese (H1)**: Es gibt einen. Getestet wird immer gegen H0.",
  "**Fehler 1. Art (α)**: H0 wird verworfen, obwohl sie stimmt – man „findet“ einen Effekt, den es nicht gibt (falsch positiv). Höchstens 5 % (α = .05).",
  "**Fehler 2. Art (β)**: H0 wird beibehalten, obwohl es den Effekt gibt – man übersieht einen echten Effekt (falsch negativ). **Power = 1 − β**.",
  {warn:"Fallen bei Ankreuzfragen: α = 5 % heißt NICHT „5 % aller signifikanten Ergebnisse sind falsch“ und NICHT „der Effekt ist zu 95 % echt“."},
  "**Korrelationen lesen**: Das Vorzeichen zeigt die Richtung, der Betrag die Stärke. r = .20 und r = −.21 sind **gleich stark** (beide klein), nur gegenläufig. Beide Variablen sagen also teilweise etwas über das Merkmal aus – über die Ursache sagt keine etwas."
 ]}
]},
{id:2, s:'Soziale Kognition', t:'Soziale Kognition: Grundlagen sozialer Informationsverarbeitung', sec:[
 {h:'Struktur unseres Wissens', b:[
  '**Kategorien**: elementare Basis, gruppieren Objekte mit Gemeinsamkeiten; repräsentiert über **Prototyp** (typischster Vertreter) oder **Exemplare** (konkrete Fälle). Kategorien sind **hierarchisch** aufgebaut: Eine breitere Kategorie umfasst/ist anderen übergeordnet.',
  '**Schemata**: übergeordnete Wissensstrukturen über Themenbereiche und ihre Merkmale; Strukturhilfe für Wahrnehmung und Interpretation.',
  '**Stereotype** = Schemata über soziale Gruppen (sozial geteilte Überzeugungen). **Skripte** = Schemata über typische **Handlungsabläufe** (Mensa-, Restaurantbesuch).',
  {vid:"**Prototyp** = abstrakter **Durchschnitt** aller Exemplare – meist **kein** reales Exemplar. Kategorisierung kann **prototypenbasiert** oder **exemplarbasiert** erfolgen (Ähnlichkeitsabgleich; keine willentliche Entscheidung)."},
  {vid:"**Schemata** bündeln Wissen zu einem **Themenbereich**, nicht nach Ähnlichkeit (Schema „Universität“: Menschen UND Hörsäle). Von **Stereotyp** spricht man nur, wenn das Wissen **sozial geteilt** ist (Vertiefung in Sozialpsychologie II)."},
  {warn:'Altfrage „Was davon sind Schemata?“ → Skripte und Stereotype (nicht: Kategorien, Prototypen).'},
  '**Assoziative Netzwerke**: Wissensinhalte = **Knoten**, Verbindungen unterschiedlich stark; Aktivierung breitet sich aus (**spreading activation**) → verbundene Konzepte werden leichter zugänglich.',
  {vid:"Verbindungen entstehen, wenn zwei Knoten **gemeinsam aktiviert** werden – je häufiger, desto stärker. Übersteigt die Aktivierung eine Schwelle, „kommt es einem in den Sinn“."},
  '**Bottom-up** (datengesteuert): Interpretation v. a. durch Merkmale des Reizes. **Top-down** (konzeptgesteuert): Vorwissen, Erwartungen, Schemata steuern die Interpretation (z. B. Geschlechterstereotype färben den Eindruck).',
  {vid:"Sobald **relevantes Vorwissen** vorhanden ist, läuft zumindest teilweise **top-down** (Vorwissen lässt sich kaum abschalten); rein bottom-up nur bei völlig Neuem. Die Trennung ist idealtypisch."},
  'Verarbeitungsaufwand: **systematisch** (genau, aufwendig) vs. **heuristisch** (Faustregeln, kapazitätssparend). Mensch als **kognitiver Geizhals**.',
  {tbl:[['Automatisch','Kontrolliert'],['unbewusst, nicht intendiert','bewusst, absichtsvoll'],['unwillkürlich','willkürlich'],['ohne Anstrengung, wenig Ressourcen','mit Anstrengung, viele Ressourcen'],['heuristisch, impulsiv, periphere Route','systematisch, reflektiv, zentrale Route']]},
  '**Stroop-Test**: Wort „ROT“ in blauer Schrift – das **automatische Lesen** interferiert mit dem **kontrollierten** Benennen der Schriftfarbe (stark eingeübte Prozesse laufen automatisch ab).'
 ]},
 {h:'Wahrnehmung & Aufmerksamkeit', b:[
  'Wahrnehmung ist keine objektive Kamera: begrenzte Kapazität → **Filter** (Informationsverarbeitung: Filter → Interpretation → Abspeichern → Abruf).',
  'Aufmerksamkeit erhalten: **persönlich Relevantes** (eigener Name → **Cocktailparty-Phänomen**), Reize für aktuelle **Ziele/Bedürfnisse**, **Erwartetes**, aber auch **Unerwartetes**, **saliente**, **lebhafte**, **negative** Reize.',
  {warn:'Falle: „Gewohnte Dinge wie der eigene Name werden ausgeblendet“ ist FALSCH.'},
  {vid:"Aufmerksamkeitsfaktoren in der **Person**: Relevanz, Ziele/Motivation, Erwartungen. Im **Stimulus**: **Negativität** (**Negativity Bias**: ein ärgerliches Gesicht in einer fröhlichen Menge wird schneller entdeckt), **Lebhaftigkeit** (rotes Männchen unter schwarzen), **Salienz** = hebt sich vom **Kontext** ab (schwarzes Männchen unter roten)."},
  {vid:"Erwartetes wird eher wahrgenommen – stark **Unerwartetes** zieht aber ebenfalls Aufmerksamkeit an (Knall im stillen Hörsaal vs. beim Motocross). Moodle-Kartentrick: Ziele lenken die Aufmerksamkeit, anderes wird ausgeblendet."},,
  "**Versuchsaufbau Cocktailparty-Effekt** (Moray, 1959): Über Kopfhörer hört man auf jedem Ohr etwas anderes und spricht den Text auf **einem** Ohr laut nach („beschatten“). Vom anderen Ohr bekommt man kaum etwas mit – den **eigenen Namen** bemerkt aber rund ein Drittel."
 ]},
 {h:'Enkodierung & Interpretation: Zugänglichkeit und Priming', b:[
  'Welche Kategorie zur Interpretation genutzt wird, hängt von ihrer **Zugänglichkeit** ab: erhöht durch **häufigen** (→ **chronische** Zugänglichkeit) oder **kürzlichen** Gebrauch (→ situative Zugänglichkeit).',
  {vid:"**Enkodierung** = Umwandlung eines externen Stimulus in eine **interne Repräsentation mit Bedeutung** (keine 1:1-Abbildung – „Brille“ des gerade zugänglichen Wissens)."},
  'Schon die Verarbeitung **einzelner Wörter** kann komplexe Schemata zugänglich machen. Zugängliche Schemata werden aber nicht immer angewendet.',
  '**Priming**: Voraktivierung durch einen **Prime** erleichtert/beeinflusst die Verarbeitung des **Targets**.',
  {vid:"Definition Corcoran: Priming = **Vorbereitung/Erleichterung einer Reaktion** auf ein Target durch die Verarbeitung eines Primes. Lehrbuch: **Voraktivierung** durch Reize, die mit dem Zielreiz **assoziiert** sind (betont das Netzwerk)."},
  {vid:"**Konzeptuelles Priming**: Ein Prime aktiviert ein ganzes **Schema**, auch ohne semantische Verwandtschaft (Hörsäle → Professoren). **Subliminales Priming** ist KEINE eigene Verknüpfungsart, sondern die **Art der Darbietung** (unter der Bewusstseinsschwelle)."},
  {tbl:[['Art','Prime und Target verbunden über …'],['Semantisch/konzeptuell','Bedeutung (Arzt → Krankenschwester)'],['**Affektiv**','gleiche **Valenz** (positiv–positiv)'],['**Prozedurales Priming**','dieselbe **Verarbeitungsprozedur/Operation** wird erneut leichter ausgeführt']]},
  'Priming wirkt, wenn das Target **mehrdeutig** ist und der Prime **anwendbar** ist. Priming wird **vermindert**, wenn der Prime nicht anwendbar ist oder einem **bewusst** wird, dass man geprimt wurde (Korrektur). Subliminale Primes können trotzdem wirken (Payne et al., 2016: BET/PASS beim Kartenspiel).',
  {vid:"Priming wirkt stärker bei **uneindeutiger** Information ODER wenn **schnell reagiert** werden muss (rot vs. lila). **Bargh**: Altenstereotyp-Priming → langsameres Gehen – **nicht repliziert**; Verhaltenspriming ist weniger robust als semantisches Priming (das sehr gut replizierbar ist)."},
  '**Donald-Paradigma** (Higgins, Rholes & Jones, 1977): Prime-Wörter positiv/negativ × anwendbar/nicht anwendbar; danach mehrdeutige Beschreibung von Donald. Positive **anwendbare** Primes („abenteuerlustig“) → positivere Beurteilung als negative anwendbare („leichtsinnig“); **nicht anwendbare** Primes → kein Effekt. 10–14 Tage später waren die Effekte sogar stärker.',
  'Metaanalyse Weingarten et al. (2016): Priming wirkt stärker, wenn ein für die Person wichtiges Ziel/Leistungskonzept aktiviert wird.',
  "**Fallbeispiel Zugänglichkeit**: Ein Dozent hat einen Fridays-for-Future-Sticker am Laptop. Wer ständig FFF-Nachrichten bekommt oder selbst mitmacht, hat das Konzept **chronisch zugänglich** – bemerkt den Sticker eher und ordnet den Dozenten über diese Kategorie ein. Wer „einfach nur da“ ist, achtet kaum darauf.",
  "**Bargh, Chen & Burrows (1996)**: Altersstereotyp-Priming → langsameres Gehen. Spätere direkte Replikationen konnten den Effekt **nicht** zuverlässig nachweisen."
 ]},
 {h:'Organisation, Erinnerung, Urteil', b:[
  'Organisation bevorzugt nach **Personen**, sonst nach sozialen Gruppen (Geschlecht, Alter). Abhängig vom **Verarbeitungsziel**: Eindrucksbildung → stärkere Integration, bessere Erinnerung als bloßes Auswendiglernen (Hamilton et al., 1980).',
  '**Konsistenzeffekt**: schemakonsistente Infos werden leicht integriert; beim Abruf füllen Schemata Lücken. **Inkonsistenzeffekt**: Unerwartetes zieht Aufmerksamkeit an und wird bei Motivation/Kapazität **besser erinnert**.',
  'Erinnerung ist **rekonstruktiv**: Lücken werden schemabasiert aufgefüllt (Carol Harris/Helen Keller – Dooling & Christiansen, 1977). **Quellenverwechslung**, falsche Erinnerungen durch Suggestion („Lost in the mall“, Loftus & Pickrell, 1995: ca. 25 %). Overconfidence.',
  {vid:"**Overconfidence**: Wir überschätzen, wie gut und sicher wir uns erinnern. Ob etwas inkonsistent wirkt, hängt auch von der **Aufgabenstellung** ab (Physikerin-Beispiel)."},
  'Urteile beruhen auf dem, was im Moment **verfügbar/zugänglich** ist; vor der Mitteilung kann das Urteil noch **editiert** werden (soziale Erwünschtheit).'
 ]},
 {h:'Verhalten: Reflektiv-Impulsiv-Modell (RIM)', b:[
  'Zwei-Prozess-Modell (Strack & Deutsch, 2004).',
  {vid:"Der Name bezieht sich auf zwei **Systeme**. Das RIM selbst sagt nicht ausdrücklich „bewusst/unbewusst“ (andere Zwei-Prozess-Modelle schon). Zweites Zwei-Prozess-Modell im Kurs: **ELM** (Kap. 7)."},
  {vid:"Beide Systeme arbeiten **parallel** (kein Entweder-oder); das reflektive greift auf den Langzeitspeicher zu, seine Entscheidungen werden dort wieder abgelegt. Input kommt aus **Wahrnehmung oder Vorstellung** → **Verhaltensschema** wird aktiviert → Verhalten wahrscheinlicher. Suboptimal: Zeitdruck, Ablenkung, **Müdigkeit**."},
  {tbl:[['Impulsives System','Reflektives System'],['assoziativ, sich ausbreitende Aktivierung, **parallel**','**regelbasiert**, logische Propositionen, **sequenziell**'],['schnell, unbewusst, braucht kaum Kapazität','langsam, bewusst, braucht **Motivation + Ressourcen**'],['Verhaltensschemata, Annäherung/Vermeidung','bewusste Verhaltensentscheidung (Urteil- und Kontrollsystem)'],['steuert unter Stress, Zeitdruck, Ablenkung','setzt sich nur bei genug Kapazität durch']]},
  'Beide Systeme wirken **synergetisch** oder **antagonistisch** (Hunger vs. Diät).',
  '**Hofmann et al. (2007)**: Nach Emotionsregulation (erschöpfte Kapazität) sagte die **implizite** Assoziation mit M&Ms den Konsum vorher (impulsiv); in der Kontrollgruppe korrelierte der Konsum **negativ mit der Diätabsicht** (reflektiv).',
  {warn:'Altfrage: Konsum korreliert negativ mit Diätabsicht, kein Zusammenhang mit positiver Assoziation → reflektives System steuert.'},
  '§Negationen',
  'Nur das reflektive System versteht **Negationen**. „Ich will nicht rauchen“ aktiviert impulsiv nur „rauchen“ → unter Stress **Bumerangeffekt** (Wegner: Gedankenunterdrückung – unterdrückte Gedanken kehren zurück).',
  {vid:"Praxis: Unter Zeitdruck lieber das **gewünschte Verhalten** aktivieren statt Negationen („Schau nicht aufs Handy“ aktiviert „Handy“)."},
  '§Passung/Kompatibilität',
  'Annäherungsbewegungen (Arm beugen, heranziehen) erleichtern positive, Vermeidungsbewegungen (Arm strecken, wegdrücken) negative Informationen. **Förster (2003)**: Hand von **unten** gegen die Tischplatte (Annäherung) → **mehr** Orangensaft getrunken als von oben (Vermeidung); Kontrollgruppe dazwischen.',
  {vid:"**Annäherung**: Kopfnicken, Lächeln, **Armbeuger (Bizeps)**; **Vermeidung**: Kopfschütteln, Stirnrunzeln, **Armstrecker (Trizeps)**. **Passung** zwischen Verhalten, Valenz der Information und eigenem Affekt erleichtert die Verarbeitung – in alle Richtungen (Kopfschütteln erleichtert negative Infos; Arm von unten gegen den Tisch → Infos positiver)."},
 ]},
 {h:"Rückschau & rekonstruiertes Gedächtnis: Jack & Barbara", b:[
  "**Carli (1999)**: Versuchspersonen lasen dieselbe Geschichte über ein Date von **Barbara und Jack**. Nur das Ende unterschied sich: **Heiratsantrag** oder **Vergewaltigung**.",
  "Zwei Wochen später (Gedächtnistest) „erinnerten“ die Personen fälschlich Details, die **zum gelesenen Ende passten** – auch solche, die nie in der Geschichte standen. Das Ende wirkte im Nachhinein vorhersehbar (**Rückschaufehler**), die Erinnerung wurde **schemakonsistent rekonstruiert**.",
  "Folge: Wer das negative Ende kannte, gab Barbara eher eine Mitschuld – ein Beispiel dafür, wie Wissen über den Ausgang Urteile über Opfer verzerrt."
 ]}
]},
{id:3, s:'Heuristiken', t:'Heuristiken: Repräsentativität, Verfügbarkeit, Anker', sec:[
 {h:'Was sind Heuristiken?', b:[
  'Mentale **Faustregeln**: ermöglichen **schnelle Urteile** und einen **sparsamen Einsatz von Ressourcen**. Meist hinreichend genau, unter bestimmten Bedingungen systematische Fehler.',
  {vid:"Heuristiken sind **effizient** (hinreichend genau + wenig Ressourcen). Die Forschung zeigt sie in Fehlersituationen, weil man sie nur dort erkennt – sie sind NICHT generell schlecht."},
  {warn:'Falsch: „führen in der Regel zu fehlerhaften Entscheidungen“ und „werden v. a. von Laien angewandt“.'}
 ]},
 {h:'Repräsentativitätsheuristik', b:[
  'Urteil danach, wie **typisch** (repräsentativ) ein Element für eine Kategorie/einen Prototyp ist.',
  {vid:"**Lotto-Beispiel**: Eine „typisch“ wirkende Zahlenreihe und 1-2-3-4-5-6 sind **gleich wahrscheinlich** – trotzdem tippt man die typische (rational wäre die untypische sogar besser: man teilt den Gewinn seltener)."},
  {vid:"Konjunktion = **Schnittmenge**: kann nie größer sein als eine der Ausgangsmengen. Basisrate-Beispiel: 90 % Psychologie, 2 % BWL in der Vorlesung – der Sitznachbar „wirkt wie ein BWLer“."},
  '**Konjunktionstäuschung**: Linda-Studie (Tversky & Kahneman, 1983): 85 % halten „Bankangestellte UND Feministin“ für wahrscheinlicher als „Bankangestellte“ – logisch unmöglich.',
  '**Vernachlässigung der Basisrate**: Ingenieure vs. Juristen (Kahneman & Tversky, 1973) – sobald eine Personenbeschreibung vorliegt, wird die Basisrate (30:70) ignoriert, auch bei wertloser Beschreibung (~50 %).',
  '**Vernachlässigung der Stichprobengröße**: Abweichungen sind in kleinen Stichproben viel wahrscheinlicher.',
  'Moderatoren: **Aufmerksamkeitslenkung** (statistische Rahmung, Training) und **Häufigkeitsformat** („1 von 10“ statt %).',
  {vid:"Konkret: weitere Infos **nach** der Eindrucksbildung anbieten, auf die Gefahr hinweisen, als **statistisches Problem** rahmen, statistisches **Vorwissen**; „**70 von 100**“ statt 70 %."},
 ]},
 {h:'Verfügbarkeitsheuristik', b:[
  'Häufigkeit/Wahrscheinlichkeit wird danach beurteilt, **wie leicht Beispiele einfallen** („Was mir leicht einfällt, muss häufig sein“).',
  'Verfügbarkeit unabhängig von der Häufigkeit erhöht durch: **Art der Gedächtnissuche** (Buchstabe k: 1. vs. 3. Stelle – 70 % sagen 1. Stelle, tatsächlich 3× häufiger 3. Stelle), **Frequency & Recency** (oft/kürzlich gedacht, Medien), **Salienz & Lebhaftigkeit** (Vividness), **Ereignisverknüpfungen** → illusorische Korrelation, positives Hypothesentesten. Berühmte Namen → Geschlecht überschätzt.',
  {vid:"**Frequency** = chronische, **Recency** = situative Zugänglichkeit; **Hinweisreize** wirken wie Primes. Medien: häufige UND lebhafte, emotionale Darstellung → Wahrscheinlichkeit überschätzt."},
  {vid:"Ereignisverknüpfung: **positives Hypothesentesten** → man sucht positive **Kontingenzen** (beides tritt auf) → diese werden zugänglicher → **illusorische Korrelation**."},
  {warn:'Altfragen: Verkehrsunfälle/Flugzeugabstürze werden überschätzt, weil medial präsenter. Anna (Tochter mit Spickzettel) erwartet viele Schummler = Verfügbarkeitsheuristik.'},
  '**Leichtigkeit des Abrufs** statt Menge: Schwarz et al. (1991): Wer **12** Beispiele für selbstsicheres Verhalten nennen musste (schwer), hielt sich für **weniger** selbstsicher als wer 6 nannte (leicht).',
  'Grenzen – dann zählt der **Inhalt**: Alternativerklärung für das Leichtigkeitsgefühl (Musik), Aufmerksamkeit auf das Gefühl gelenkt (Salienz), hohe persönliche Relevanz/Motivation, negative Stimmung (systematische Verarbeitung), fehlende Expertise (geringe Diagnostizität).',
  {vid:"**Ease of Retrieval** = das **kognitive Gefühl** der Leichtigkeit dient als Information (nicht der Inhalt). Moderatoren: **Salienz** des Gefühls (↑), **systematische** Verarbeitung (↓), **Diagnostizität** (Alternativerklärung ↓; **Expert:innen** verlassen sich EHER auf die Leichtigkeit, Laien verarbeiten eher systematisch), **Urteilsgewohnheiten** (Domänen, in denen man Gefühle als Info gewohnt ist)."},
  {warn:'Weniger Verfügbarkeitsheuristik: Motivation erhöhen + Alternativerklärung für das Leichtigkeitsgefühl anbieten. „Keine Zahl vorgeben“ betrifft die Ankerheuristik.'}
 ]},
 {h:'Ankerheuristik', b:[
  'Ein (vorgegebener oder selbstgenerierter) Ausgangswert verzerrt das Urteil in seine Richtung (**Ankerassimilation**) – auch wenn er irrelevant/zufällig ist.',
  {vid:"Der Anker kann **plausibel, implausibel oder erkennbar zufällig** sein – er wirkt trotzdem. Einzige Voraussetzung: **Unsicherheit** (es gibt keinen richtigen Wert oder man kennt ihn nicht). Paradigma: **komparative** Frage („Elbe länger/kürzer als 1000 km?“) → **absolute** Frage („Wie lang?“)."},
  'Auftreten: Schätzaufgaben, **Verhandlungen** (erstes Gebot: Galinsky & Mussweiler, 2001 – ~20 vs. ~25 Mio.), **Gerichtsurteile** (Strafforderung), Leistungsbeurteilungen, Selbsteinschätzungen. Sehr robust (Many-Labs, Klein et al., 2014).',
  '**Selective Accessibility Model (SAM)** – v. a. bei **vorgegebenen** Ankern: Man testet die Hypothese, der Anker könnte stimmen → **ankerkonsistentes Wissen** wird selektiv zugänglich (Mussweiler & Strack: 20 °C-Anker → schnellere Reaktion auf Sommerwörter). Kaum durch Warnungen/Motivation zu verhindern; hilfreich: **Consider the Opposite**.',
  {vid:"SAM: Priming ist nur untergeordnet, Hauptmechanismus = **positives Hypothesentesten**; die Aktivierung bleibt, auch wenn man den Anker verwirft. Beleg: Effekt nur bei **Anwendbarkeit** – fragt man danach nach einer anderen Dimension (Wassertiefe der Elbe), gibt es keinen Ankereffekt."},
  {vid:"**Genauigkeitsmotivation**: beim SAM **keine** Abschwächung (mehr Hypothesentesten → noch mehr ankerkonsistentes Wissen); bei Verankerung und Anpassung **schwächer** (man passt länger an). Die Anpassung endet, sobald ein Wert **plausibel** wirkt."},
  '**Verankerung und Anpassung** – v. a. bei **selbstgenerierten** Ankern (Gefrierpunkt Wasser → Wodka): bewusste, aber **unzureichende** Korrektur; braucht Ressourcen und Motivation (Epley & Gilovich, 2004: Arm beugen → näher am Anker).',
  "**Anker abschwächen**: Gezielt **Gründe gegen den Anker** bzw. für das Gegenteil überlegen („consider the opposite“) – dann wird anderes Wissen zugänglich. Wissen um den Effekt, Expertise oder Belohnungen helfen dagegen kaum.",
  "**Alltagsbeispiele**: Wer beim Verkauf das **erste Gebot** macht, setzt den Anker (Verkäufer zuerst → höherer Preis). Eine Lehrkraft, die die **früheren Leistungen** einer Schülerin kennt, nutzt diese als Anker für die neue Note."
 ]}
]},
{id:4, s:'Denken & Fühlen', t:'Denken und Fühlen: Stimmung, Emotion, Kognition', sec:[
 {h:'Begriffe: Gefühl, Affekt, Emotion, Stimmung', b:[
  '**Gefühl** = Oberbegriff. **Affektive Gefühle**: Emotionen und Stimmungen (positiv/negativ). **Nicht-affektive Gefühle**: z. B. **Müdigkeit**, Hunger, Leichtigkeit des Abrufs (kognitives Gefühl).',
  {vid:"**Affekt** = Gefühl **mit Valenz**. Dimensionen: Valenz, Intensität, Dauer, Objektbezogenheit. Emotion und Stimmung unterscheiden sich NICHT in der Valenz – entscheidend ist die **Objektbezogenheit** (Angst **vor**, Freude **über**). Sehr intensive Emotionen (Panik) halten nicht lange an (Expositionstherapie)."},
  {vid:"Funktion: **positive** Gefühle = Sicherheitssignal, erleichtern Annäherung; **negative** = Warnsignal (Problem, Gefahr)."},
  {tbl:[['','Emotion','Stimmung'],['Objektbezug','**ja** (auf etwas gerichtet)','nein, diffus'],['Intensität','stärker','schwächer'],['Dauer','kürzer','**länger anhaltend**'],['Differenzierung','stark ausdifferenziert (Ärger, Scham …)','eher nur positiv/negativ']]},
  {warn:'Ärger über einen Freund, der dich versetzt hat = Emotion (klarer Objektbezug). „Nur Emotionen sind affektive Gefühle“ = falsch.'},
  'Gefühle sind **Signale** über die Bedeutsamkeit einer Situation und steuern Aufmerksamkeit. Stimmungen wirken breit, weil ihre Ursache diffus ist und sie leicht fälschlich als Information genutzt werden.'
 ]},
 {h:'Stimmung → Verarbeitungsstil', b:[
  '**Positive Stimmung** = „Situation sicher“ → **Top-down**, Rückgriff auf Schemata/Heuristiken/Skripte, **globaler** Fokus, **kreativ**, aber weniger Detail.',
  '**Negative Stimmung** = „Problem/Gefahr“ → **Bottom-up**, analytisch, detailgenau, **lokaler** Fokus („den Wald vor lauter Bäumen nicht sehen“).',
  {vid:"**Global/lokal-Aufgabe** (Kimchi & Palmer): Welche Figur ist der Zielfigur ähnlicher – gleiche Gesamtform (global) oder gleiche Einzelelemente (lokal)? Positiv → global, negativ → lokal. Kap. 4.1 betrifft die **Stimmung**, weil sie diffus und überdauernd ist und das Denken breit beeinflusst – unabhängig von ihrer Ursache."},
  'Studien: Gasper & Clore (2002) – negativ: kleine Dreiecke (lokal), positiv: großes Quadrat (global). Bless et al. (1996) – positiv: mehr skripttypische Restaurant-Ereignisse fälschlich „wiedererkannt“. Isen et al. (1987) – nach lustigem Film lösen 75 % das Duncker-Kerzenproblem vs. 20 % neutral. Bodenhausen et al. (1994) – gute Stimmung → stereotypere Schuldurteile.',
  {warn:'Präsenz-Frage: Korrekturlesen → negative Stimmung; schnelles Briefe-Sortieren oder grobe Auswahl → positive Stimmung.'}
 ]},
 {h:'Stimmung → Wahrnehmung & Erinnerung', b:[
  '**Mood-congruent encoding**: stimmungspassende Reize werden bevorzugt wahrgenommen (Niedenthal et al., 1997: fröhliche Musik → „Freude“-Wörter schneller erkannt, traurige Musik → Trauer-Wörter).',
  '**Mood-congruent memory**: in guter Stimmung fallen positive, in schlechter negative Erinnerungen leichter ein (Ruiz-Caballero & Gonzalez, 1994: Depressive erinnern mehr negative Wörter).',
  '**Mood-state-dependent memory**: Abruf am besten, wenn die Stimmung beim Abruf der beim Lernen entspricht – unabhängig vom Inhalt.',
  {vid:"Achtung: Mood-state-dependent memory ist **weniger stabil**. Es reicht NICHT, einfach in derselben Stimmung zu lernen wie in der Prüfung; es wirkt eher, wenn die Stimmung beim Enkodieren **bedeutsam mit der Information verbunden** ist (autobiografisch, z. B. Kirche auf der Hochzeitsreise). Mood-congruent encoding/memory = **affektives Priming**."},
  '**Mood repair**: in schlechter Stimmung bewusst positive Erinnerungen abrufen.',
  {vid:"Mood repair ist ein **motivationaler** Prozess (kein Priming); klappt besser bei guter Emotionsregulation bzw. hohem Selbstwert, schlechter bei Depression."},
 ]},
 {h:'Stimmung → Urteile', b:[
  '**Indirekter Einfluss (Affekt-Priming)**: Stimmung macht kongruente Gedächtnisinhalte zugänglich → fließen ins Urteil ein; v. a. bei komplexen, schlecht strukturierten Aufgaben.',
  '**Direkter Einfluss: How-do-I-feel-about-Heuristik** (Affect-as-information): „Wie fühle ich mich dabei?“ – gute Stimmung → bessere Bewertung, schlechte → schlechtere (Fedorikhin & Cole, 2004: Kekse). Stärker bei wenig Ressourcen, Unsicherheit (Van den Bos, 2003), unbekannter Ursache.',
  '**Schwarz & Clore (1983)**: Lebenszufriedenheit an sonnigen > regnerischen Tagen – **verschwindet**, wenn man vorher nach dem Wetter fragt: Die Stimmung verliert ihren Informationswert, die **Missattribution** wird korrigiert. Replikation (Yap et al., 2017): kein bzw. nur sehr kleiner Effekt.',
  {warn:'Stimmungskongruente Urteile entstehen v. a., weil stimmungskongruente Infos leichter abrufbar sind – und über die How-do-I-feel-Heuristik.'}
 ]},
 {h:'Wie Emotionen entstehen: Wahrnehmung & Kognition', b:[
  'Auslösung durch **Wahrnehmung**: angeborene Reiz-Reaktions-Verbindungen (Preparedness: Schlangen, Ekel), gelernte (klassisch, operant, Modelllernen).',
  {vid:"Emotionen können **ohne Denken** entstehen (schnell, unmittelbar). Angeborene/**Preparedness**-Verbindungen (z. B. Höhe) sind nur ein kleiner Teil; die meisten Reiz-Emotions-Verbindungen sind **gelernt** – oft reicht **eine** Paarung (Lebensmittelvergiftung → Ekel beim Geruch)."},
  {vid:"**Mimicry**: Wir imitieren nicht nur Gesichtsausdrücke, auch Körperhaltung. **Embodiment**: Muskelaktivität wird zurückgemeldet und als Gefühl interpretiert."},
  {vid:"Kognitionen selbst können Auslöser sein (schon der **Gedanke** an eine Spinne macht Angst) und die **Interpretation** steuern (Menschen mit Spinnenphobie erkennen mehrdeutige Reize schneller als Spinne)."},
  '**Emotionale Ansteckung** über Imitation und **Body/Facial Feedback**; Neumann & Strack (2000): Stimmung überträgt sich schon über eine fröhliche/traurige Stimme. Chartrand et al. (2006): subliminale Wörter verändern die Stimmung.',
  '**Kognitive Bewertung (Appraisal)**: Ereignis fördert Ziele → positiv, behindert → negativ.',
  {vid:"Ob etwas positiv oder negativ erlebt wird, hängt von **Zielen und Kontext** ab – dasselbe Objekt kann mal förderlich, mal hinderlich sein. Diese Valenzbewertung läuft schnell und **automatisch** (assoziativ) oder reflektiv ab."},
  {vid:"Beispiel aus dem Video: Kind bringt eine **schlechte Note** heim. Eltern denken „wir hätten mehr üben können“ (internal, kontrollierbar) → **Schuld**; „das Kind kann nichts dafür“ (external, unkontrollierbar) → **Mitleid**. Die Zuordnungen sind Annäherungen."},
  '§Kognitive Bewertungstheorie (Weiner): Ausdifferenzierung über Attribution',
  {tbl:[['Negatives Ereignis','internal','external'],['kontrollierbar','Schuld','Ärger'],['unkontrollierbar','Scham','Mitleid']]},
  {tbl:[['Positives Ereignis','internal','external'],['kontrollierbar','Stolz','Dankbarkeit'],['unkontrollierbar','Erleichterung','Überraschung']]},
  'Neumann (2000): auf sich selbst geprimt → eher Schuld, auf Umwelt geprimt → eher Ärger. Pessimistischer Attributionsstil (Erfolg external, Misserfolg internal-stabil) → Depression.',
  {vid:"**Pessimistischer Attributionsstil**: negative Ereignisse **internal, stabil und global** (betrifft viele Bereiche) erklären; **optimistisch** genau umgekehrt (external, veränderlich, spezifisch) → schützt eine positive Selbst- und Weltsicht."},
  {vid:"Sozial: Wir wählen Erklärungen so, dass beim anderen eine günstige Emotion entsteht (Ausrede fürs Zuspätkommen), und schließen aus Emotionen anderer auf deren Attribution (Eltern reagieren auf einen Schulpreis mit **Stolz** vs. **Erleichterung**)."},
  '§Zwei-Faktoren-Theorie (Schachter & Singer, 1962)',
  'Emotion = **physiologische Erregung** (unspezifisch, bestimmt die **Intensität**) + **Kognition** (Ursachensuche, bestimmt die **Qualität**).',
  {warn:'Unterschied: Die Zwei-Faktoren-Theorie berücksichtigt **unspezifische Erregung als eigenen Faktor** – die kognitive Bewertungstheorie nicht. Attribution kommt in beiden vor.'},
  '**Fehlattribution von Erregung**: Dutton & Aron (1974) – nach der schwankenden Hängebrücke riefen mehr Männer die attraktive Interviewerin an (Erregung → Anziehung). Nach 10 Minuten Pause kein Effekt.'
 ]}
]},
{id:5, s:'Soziale Wahrnehmung', t:'Soziale Wahrnehmung: Merkmale, Verhalten, Voreinstellungen', sec:[
 {h:'Was ist soziale Wahrnehmung?', b:[
  '**Soziale Wahrnehmung** = wie Menschen Informationen über andere aufnehmen, **kombinieren, integrieren und interpretieren**, um sich einen **Eindruck** zu bilden.',
  'Drei Einflussquellen: beobachtbare **Merkmale** (5.1), **Verhalten** (5.2), **Voreinstellungen** des Beurteilers (5.3).'
 ]},
 {h:'Beobachtbare Merkmale & erster Eindruck', b:[
  'Erster Eindruck entsteht **blitzschnell**: Willis & Todorov (2006) – nach **100 ms** korrelieren Urteile (v. a. Vertrauenswürdigkeit) schon hoch mit Urteilen ohne Zeitlimit; längeres Ansehen macht sicherer, ändert aber kaum.',
  '**First Impression Error**: Der erste Eindruck färbt nachfolgende Wahrnehmung. **Halo-Effekt**: Eine hervorstechende Eigenschaft (z. B. Attraktivität) **färbt die Wahrnehmung aller weiteren** Eigenschaften. Asch (1946) „warm/kalt“ – Replikation (Nauts et al., 2014): Ausstrahlung eher auf verwandte Merkmale begrenzt.',
  {vid:"Ein falscher erster Eindruck ist schwer zu korrigieren: Wir suchen **bestätigende** Infos, gewichten sie stärker, deuten Mehrdeutiges passend – und wollen uns den Fehler oft nicht eingestehen (motivational). Der **Halo-Effekt** wirkt v. a. bei **positiven** zentralen Eigenschaften und nicht auf alle anderen Eigenschaften gleich stark."},
  {vid:"Die **Big Two** strukturieren das Kapitel: Was macht jemanden **sympathisch** (Communion) und was **kompetent** (Agency)?"},
  'Sympathie: **Beauty-is-good**, **Ähnlichkeit** (Similar-to-me), **Vertrautheit/Mere Exposure** (Zajonc, 1968; Reber et al., 1998 – **Fluency**: höherer Figur-Grund-Kontrast → hübscher), **Assoziation mit Positivem**.',
  {vid:"Beauty-is-good wirkt von der Kindererziehung bis zu Notfällen (Attraktiven wird eher geholfen) – obwohl real kaum Zusammenhänge mit Leistung bestehen (kleine Zusammenhänge evtl. durch sich selbst erfüllende Prophezeiung)."},
  {vid:"**Ähnlichkeit** macht sympathisch, weil sie das eigene Selbstbild **bestätigt**, weil man **Gegenseitigkeit** erwartet (Reziprozitätsannahme) und weil man sich leichter **hineinversetzen** und mit Ähnlichen interagieren kann."},
  {vid:"**Mere Exposure**: **umgekehrt U-förmig** (Sättigung bei sehr vielen Darbietungen), v. a. bei anfangs **neutralen** Reizen; Mechanismus: **Leichtigkeit der Verarbeitung** (Fluency) – nicht dasselbe wie Vertrautheit. **Assoziation**: Berufsgruppen, die man mit Negativem verbindet (z. B. Metzger für Veganer:innen), wirken weniger sympathisch."},
  'Kompetenz/Status/Autorität: **Körpergröße** (Große werden als **kompetent** eingeschätzt; umgekehrt: Wilson 1968 – „Professor“ wird ca. 6 cm größer geschätzt als „Student“), Körperbau, **Kleidung, Uniform, Titel, Luxusartikel**. Mast & Hall (2004): Status wird schon aus einem Foto erkannt. Forgas (2011): typischer „Philosoph“ → Aufsatz besser bewertet.',
  {vid:"Auch der **Körperbau** zählt: Übergewichtigen wird oft Kompetenz abgesprochen – ohne realen Zusammenhang. Luxusartikel, Kleidung und **Titel** sind Selbstdarstellung, die Kompetenz signalisieren soll – und auch so gelesen wird."},
  '**The Big Two**: **Communion** (soziale Verbundenheit, Wärme: warm, nett, vertrauenswürdig, moralisch) und **Agency** (individuelles Streben: kompetent, dominant, durchsetzungsfähig, ehrgeizig).',
  'Nonverbal: viel **Blickkontakt** ↔ Macht, Kompetenz, Glaubwürdigkeit; situationsangemessenes **Lächeln** → Sympathie; leichte **Berührungen** → mehr Trinkgeld, höhere Kauf- und Hilfsbereitschaft, Motivation von Lernenden.',
  {vid:"Nonverbal: Blickkontakt, Berührung und **räumlicher Abstand** wirken v. a. auf **Sympathie** (Annäherung). Mimik zeigt v. a. **emotionale Zustände** und wird **kulturübergreifend** gut gelesen (wie viel man zeigt, prägt die Kultur); weitere Kanäle: Stimme, Gestik, Körperhaltung, Kopfnicken, Fußwippen."},
  {vid:"Nonverbales bekommt **mehr Gewicht**, wenn es der verbalen Botschaft **widerspricht**. **Lügen erkennen** an nonverbalen Signalen: praktisch **keine** empirische Evidenz. Es gibt individuelle Unterschiede im Lesen von Emotionen (Geschlecht, emotionale Intelligenz)."},
  {warn:'Online-Dating-Altfrage: geläufiger, positiver, leicht lesbarer Nickname (Fluency) + freundliches Gesicht mit Blickkontakt.'}
 ]},
 {h:'Vom Verhalten auf das Wesen schließen', b:[
  '**Assoziativ**: **Behavior-trait-inferences** – automatisch wird eine Eigenschaft aktiviert („hilft über die Straße“ → hilfsbereit), v. a. mit dem Ziel der Eindrucksbildung.',
  '**Attributional** (Heider: naiver Wissenschaftler): **internale/dispositionale** vs. **externale/situationale** Ursachen.',
  {vid:"Die Trennung internal/external ist oft nicht scharf (Einstellungen „in der Person“ entstehen z. B. auch durch die Situation). Psychologisch entsteht Verhalten aus **Person × Situation**."},
  '§Kovariationsmodell (Kelley)',
  {tbl:[['Kriterium','Frage'],['**Konsensus**','Verhalten sich **andere Personen** in derselben Situation/gegenüber demselben Stimulus ähnlich?'],['**Distinktheit**','Zeigt die Person das Verhalten nur bei **diesem Stimulus** oder auch **in anderen Situationen**?'],['**Konsistenz**','Zeigt die Person das Verhalten in dieser Situation **über die Zeit** immer wieder?']]},
  'Internal (Person): **Konsensus niedrig, Distinktheit niedrig, Konsistenz hoch**. Stimulus: alle drei hoch. Niedrige Konsistenz → Umstände/Zufall.',
  {vid:"Beispiel im Buch: Jemand **beschwert sich im Restaurant** – nörgelige Person (internal) oder wirklich schlechtes Essen (external)? Grenzen der Kausalattribution: Sie braucht **Motivation**, läuft oft **intuitiv** ab, und die Daten fehlen häufig (man trifft jemanden nur im Sportverein) → Lücken werden aufgefüllt."},
  {warn:'Niedrige Konsistenz: „Tina nimmt an der Uni mal den Aufzug, mal die Treppe.“ – Andere Personen = Konsensus, andere Situationen = Distinktheit.'}
 ]},
 {h:'Correspondence Bias & Attributionsfehler', b:[
  '**Correspondence Bias**: vom Verhalten auf stabile Eigenschaften schließen, obwohl es situativ bedingt ist. **Fundamentaler Attributionsfehler**: Disposition **über**-, Situation **unter**schätzt.',
  {vid:"Correspondence Bias = Tendenz anzunehmen, dass **Verhalten und Persönlichkeit korrespondieren**. Der **fundamentale Attributionsfehler ist ein Spezialfall** davon (Buch), auch wenn er der gängigere Begriff ist."},
  {vid:"**Situative Theorie** – vier Wege zum Bias: (1) man zieht situative Einflüsse **gar nicht in Erwägung** (≈ fundamentaler Attributionsfehler), (2) man **sieht** sie in dieser Situation nicht, (3) man **ignoriert** sie bewusst (v. a. bei sehr diagnostischem Verhalten), (4) wahrgenommene situative Faktoren **verzerren** die Wahrnehmung des Verhaltens und führen sogar zu noch stärkerer dispositionaler Attribution."},
  'Jones & Harris (1967): Pro-/Contra-Castro-Aufsatz – Einstellung wird dem Autor zugeschrieben, auch wenn die Position **vorgegeben** war. Ross et al. (1977): Quizmaster wirkt gebildeter als Kandidat trotz zufälliger Rollen.',
  '**Akteur-Beobachter-Divergenz**: Andere → internal, sich selbst → situativ. Gründe: **Informationsvorteil** über eigene Verhaltensvariation und **Blickwinkel/perzeptuelle Salienz** (Beobachter sieht die Person, Akteur die Situation). Wird durch **selbstwertdienliche Attribution** überlagert (Erfolge internal).',
  '**Zweistufiger Prozess**: 1. automatische **internale** Attribution, 2. kontrollierte **Korrektur** um situative Faktoren – braucht Motivation und Kapazität.',
  'Weitere Einflüsse: **Blickwinkel** (Taylor & Fiske, 1975; Lassiter et al., 2007: Geständnisvideo mit Kamera auf den Verdächtigen → eher „freiwillig“), **Salienz** (Taylor et al., 1977: einzige auffällige Person wirkt einflussreicher), **Verarbeitungsziele**, **Diagnostizität** (unmoralisches Verhalten), **Kultur** (stärker in individualistischen Kulturen).',
  {vid:"Gemeinsamer Mechanismus von Blickwinkel, Akteur-Beobachter-Effekt, Auffälligkeit und Verarbeitungszielen: **Aufmerksamkeit** – Ursache ist, was man gerade ansieht. Als Akteur sieht man die Situation, als Beobachter die Person. Das zweistufige Modell (erst automatisch, dann aufwendige Korrektur) ähnelt der **Verankerung und Anpassung** bei der Ankerheuristik."},
 ]},
 {h:'Voreinstellungen des Beurteilers', b:[
  '**Verfügbarkeit** von Konzepten (chronisch vs. situativ/Priming) → **Assimilation**; bei extremen Standards **Kontrast**. Nur bei **Anwendbarkeit** (Donald). Sex-Aggression-Link (Mussweiler & Förster, 2000), Rudman & Borgida (1995).',
  {vid:"Laut Corcoran bringt 5.3 kaum Neues (Wiederholung von Kap. 2, angewandt auf Personen). Hervorgehoben: Neben **Assimilation** ist bei der Personenwahrnehmung auch **Kontrast** wichtig (kommt beim Selbst/sozialen Vergleich wieder). Kontext erzeugt **Erwartungen**; nicht erwartungskonforme Personen sind uns unangenehm → färbt die Bewertung. Implizite Persönlichkeitstheorien sind **gelernt** und kulturabhängig."},
  '**Kontext**: „B“ vs. „13“; Dearborn & Simon (1958): Manager sehen Probleme ihres Ressorts; **Rosenhan (1973)**: gesunde Pseudopatienten in der Klinik als schizophren diagnostiziert.',
  '**Implizite Persönlichkeitstheorien**: Annahmen, welche Eigenschaften zusammengehören – ergänzen fehlende Infos und färben die Interpretation (Chiu et al., 1997: wer Moral für unveränderbar hält, straft härter).',
  '**Stereotype** → top-down, erwartungskonsistente Wahrnehmung. **Positives Hypothesentesten**: Ein erster Eindruck lenkt die Suche in bestätigende Richtung; Mehrdeutiges wird hypothesenkonform interpretiert.',
  'Warum uns Urteile trotzdem akkurat erscheinen: begrenzte Situationen, andere teilen die Vorurteile, **sich selbst erfüllende Prophezeiung** (Snyder et al., 1977: „attraktive“ Frau am Telefon).'
 ]}
]},
{id:6, s:'Das Selbst', t:'Das Selbst: Funktionen, Selbsterkenntnis, Bedrohung', sec:[
 {h:'Definition & soziale Identität', b:[
  'Selbstbezogenes Wissen ist **kontextgebunden** repräsentiert – man beschreibt sich je nach Situation anders.',
  '**Working Self**: Zu einem bestimmten Zeitpunkt ist nur ein **Teil** des umfangreichen Selbstwissens aktiviert.',
  '**Social Identity Theory** (Tajfel & Turner, 1979): **personale Identität** (ich vs. du – einzigartige Merkmale) und **soziale Identität** (wir vs. ihr – aus **Gruppenmitgliedschaften**). Streben nach positiver Distinktheit → Eigengruppe aufwerten.',
  {vid:"Personale und soziale Identität können **in Konflikt** stehen (einzigartig sein vs. dazugehören/ähnlich sein) und müssen ausbalanciert werden; **beide** streben danach, positiv gesehen zu werden – die soziale über eine Eigengruppe, die besser dasteht als Fremdgruppen (stärkt den Selbstwert)."},
  '**Theorie der optimalen Distinktheit** (Brewer, 1991): Balance aus Bedürfnis nach Individualität und nach Zugehörigkeit.',
  'Menschen streben nach einem **stabilen, positiven Selbstkonzept**.'
 ]},
 {h:'Funktionen des Selbst', b:[
  '**Strukturierende (kognitive) Funktion**: Selbstkonzept als Schema. **Self-Reference-Effekt**: Selbstbezogenes wird **tiefer verarbeitet und besser erinnert**.',
  '**Emotionale Funktion (Selbstwert)**: positives Selbstwertgefühl erhalten – Mnemic Neglect (bedrohliches Feedback wird schlechter erinnert), Vergleich mit früherem Selbst. Selbstwert: **global vs. bereichsspezifisch**, **explizit** (Rosenberg-Skala) vs. **implizit** (Name-letter-Effekt, IAT; unabhängig voneinander), **trait vs. state**.',
  '**Ausführende Funktion**: Ziele, Selbstregulation. **Ego-Depletion** (Baumeister et al., 1998: Selbst als **Muskel**; Rettich-Keks) – Replikation (Hagger et al., 2016) nicht bestätigt, Feldstudien zeigen aber Nachlassen über die Zeit.',
  {vid:"**Selbstwirksamkeit** = wie sehr man sich zutraut, die eigenen Ziele zu erreichen (motivationaler Aspekt, wichtig für die handelnde Funktion). **Selbstregulation** = das eigene Handeln auf Ziele und Werte ausrichten. Bei Ego-Depletion ist laut Corcoran nicht das Phänomen (Selbstregulation ermüdet) umstritten, sondern die **genauen Mechanismen**."},
  '**Selbstaufmerksamkeit** (Spiegel, Kamera): Aufmerksamkeit aufs Selbst → Abgleich mit **inneren Werten/Standards** → normgerechteres Verhalten (Beaman et al., 1979: Kinder nehmen weniger Süßigkeiten). **Selbstüberwachung** (Self-Monitoring) = Anpassung an **äußere** situative Erwartungen.',
  {vid:"Corcoran: Selbstaufmerksamkeit und Selbstüberwachung sind „**beinahe das Gegenteil**“ – Selbstaufmerksamkeit aktiviert eigene Werte/Normen/Ziele, die dann handlungswirksam werden; starke Selbstüberwachung → Verhalten weniger von eigenen Werten gesteuert, mehr von Erwartungen anderer."},
  'Genschow & Schindler (2016): hohes Zugehörigkeitsbedürfnis → mehr Imitation der Eigengruppe.'
 ]},
 {h:'Zugänglichkeit von Selbstaspekten', b:[
  '**Chronisch**: **Entwicklungsaufgaben** (Elternschaft), **äußerliche/abweichende Merkmale** (Geschlecht, Ethnie), **kultureller Kontext**.',
  {vid:"Weil nie das ganze Selbstkonzept aktiv ist, ist das Selbst zugleich **konstant und flexibel**. **Entwicklungsaufgaben** sind ein Zwischending zwischen chronisch und situativ (z. B. Wechsel Schule → Studium prägt die Selbstsicht eine Zeit lang)."},
  '**Temporär**: Salienz (einzige Frau in einer Männergruppe), Stimmung, eigenes Verhalten, momentane Ziele.',
  {vid:"Temporär außerdem: **Selbstkategorisierung** (personale vs. soziale Identität und welche Gruppe: an der Uni „Studentin“, im Heimaturlaub die nationale Identität), **eigenes Verhalten** (Fachtexte lesen aktiviert die studentische Identität), **selbstbezogene Ziele** (zieldienliche Selbstaspekte werden aktiviert)."},
  {tbl:[['Independentes Selbst','Interdependentes Selbst'],['getrennt vom sozialen Kontext','verbunden mit dem sozialen Kontext'],['Unabhängigkeit, Einmaligkeit','Verbundenheit, Abhängigkeit'],['eigene Gedanken/Gefühle bestimmen das Handeln','Gedanken/Gefühle anderer bestimmen das Handeln'],['westlich, individualistisch','östlich, kollektivistisch'],['kontextunabhängige Informationsverarbeitung','**kontextabhängige** Verarbeitung']]},
  '**Semantic-Procedural-Interface-Modell**: Die Selbstkonstruktion (semantisches Selbstwissen) ist mit einer Verarbeitungsprozedur verknüpft – interdependent → kontextabhängig, independent → kontextunabhängig.',
  '**Relationale Interdependenz** = enge Beziehungen zu einzelnen Personen (bei Frauen stärker), **kollektive Interdependenz** = Zugehörigkeit zu größeren Gruppen (bei Männern stärker).',
  {vid:"Kollektivistisch sind laut Corcoran eher asiatische, ost- und südeuropäische Kulturen; **Österreich** liegt näher am Kollektivistischen als Deutschland. Alle tragen **beide** Selbstanteile in sich – auch das interdependente Selbst kann situativ aktiviert werden (independent ≈ personale, interdependent ≈ soziale Identität)."},
  '**Kontrafaktisches Denken**: Vergangenes gedanklich umändern („was wäre, wenn …“), v. a. nach knappem Verfehlen. **Aufwärts** (besserer Ausgang → Enttäuschung, aber Lernen), **abwärts** (schlimmerer Ausgang → Erleichterung).'
 ]},
 {h:'Wege der Selbsterkenntnis', b:[
  '**Introspektion**: begrenzt – wahre Gründe oft unbewusst (Nisbett & Wilson: Strumpfhosen-Positionseffekt), **Introspektionsillusion** (Hansen et al., 2004: Künstlername beeinflusst Urteil, trotzdem hält man sich für objektiv), schlechte Verhaltensvorhersage.',
  {vid:"Selbst als **I** (handelnd) und **Me** (Objekt der Betrachtung) – Introspektion richtet sich aufs „Me“. Grenze: Nur **bewusst Zugängliches** ist erreichbar, Unbewusstes steuert aber mit – und wir merken nicht einmal, **dass** wir es nicht erkennen (wir finden trotzdem eine Erklärung)."},
  '**Selbstwahrnehmung** (Bem): Aus eigenem Verhalten auf Einstellungen schließen – wenn die Einstellung unklar ist und das Verhalten **freiwillig** war (situative Bedingungen werden mitberücksichtigt). **Überrechtfertigungseffekt** (Greene et al., 1976): Belohnung zerstört intrinsische Motivation. Auch **Lob** kann schaden: bei ohnehin freiwilliger Tätigkeit, für bloße Anstrengung oder bei sehr leichten Aufgaben (signalisiert geringe Fähigkeit). **Fehlattribution von Erregung** (Hängebrücke).',
  {vid:"Selbstwahrnehmung funktioniert wie **soziale Wahrnehmung** auf sich selbst angewandt: statt internal/external → **intrinsisch** (Freude an der Tätigkeit) vs. **extrinsisch** (auch soziale Anerkennung zählt als extrinsisch!); die Übergänge sind fließend."},
  {vid:"Überrechtfertigung in der Praxis: Eltern zahlen für gute Noten → die sichtbare extrinsische Ursache verdrängt die intrinsische Motivation; fällt die Belohnung weg, gibt es keinen Grund mehr zu lernen. **Erregungstransfer**: Rest-Erregung aus Situation 1 wird in Situation 2 einer falschen Ursache zugeschrieben."},
  '**Soziale Vergleiche** (wenn objektive Maßstäbe fehlen): **lateral** (Ähnliche → Selbsterkenntnis), **abwärts** (Schlechtere → Selbsterhöhung), **aufwärts** (Bessere → Selbstmotivation/-verbesserung).',
  {vid:"Viele Selbsturteile sind **implizit relativ** („Ich bin intelligent“ = intelligenter als andere). Vergleiche sind ein **fundamentales Bedürfnis**, besonders bei **Unsicherheit** und in neuen Situationen; es gibt individuelle Unterschiede. Vergleiche sind nicht immer strategisch – oft werden sie uns aufgedrängt. Die Wahl des Standards heißt **Standardselektion**."},
  '**Assimilation** = Selbsteinschätzung nähert sich dem Standard an; **Kontrast** = bewegt sich weg. SAM (Mussweiler): Fokus auf **Ähnlichkeiten → Assimilation**, auf **Unterschiede → Kontrast**; **extreme** Standards → meist Kontrast.',
  {vid:"Aufwärtsvergleich motiviert nur bei **Assimilation** (Ziel wirkt erreichbar, vgl. Selbstwirksamkeit); Abwärtsvergleich hebt den Selbstwert nur bei **Kontrast** (assimiliert man sich an das Elend anderer, geht es einem schlechter). Ob Assimilation oder Kontrast: wahrgenommene **Ähnlichkeit** (moderater vs. extremer Standard, Gruppenzugehörigkeit) und was die Person gerade sucht bzw. wofür sie geprimt ist."},
  {warn:'Protokoll 2025 (nicht in deinen Unterlagen): Corcoran-Studie zu Frauen mit gleicher Diagnose → nach SAM gleiche Kategorie = Ähnlichkeitsfokus → Assimilation. Gutartiger vs. bösartiger Neid: zwei eigenständige Formen, eher schwach positiv korreliert (Lange & Crusius, 2015).'},
  'Higgins (1987) **Selbstdiskrepanz**: aktuelles vs. **Ideal**-Selbst → Niedergeschlagenheit, Trauer; aktuelles vs. **Soll**-Selbst → Angst, Besorgnis, Scham.',
  "**Überrechtfertigung – Studie** (Lepper, Greene & Nisbett, 1973): Kinder, die gern malten und dafür eine **Belohnung erwarteten**, malten danach in der freien Zeit **weniger** als Kinder ohne Belohnung. Die Belohnung wird als Grund gesehen → die eigene Freude daran tritt zurück."
 ]},
 {h:'Bedrohungen des Selbst', b:[
  'Bedeutsame Lebenseinschnitte, Konfrontation mit Schwächen (negatives Feedback, Vergleich mit Besseren), **soziale Zurückweisung** (Ostracism, Need to belong), **kognitive Dissonanz**, **Erwartungsverletzung**, **Erinnerung an die eigene Sterblichkeit**.',
  {vid:"**Better-than-average-Effekt**: Die meisten halten sich auf positiven Eigenschaften für überdurchschnittlich – weil positive selbstbezogene Infos schneller verarbeitet, zugänglicher und besser erinnert werden. Bedrohlich sind auch **positive** Umbrüche (Auszug zum Studium, Kinder) wegen der Unsicherheit. Negatives Feedback kommt **direkt** (Versagen) oder **indirekt** (Rückmeldung, Note)."},
  {vid:"**Stereotype Threat**: Bedrohung, wenn einem bewusst wird, dass man einer Gruppe mit negativem Stereotyp angehört (z. B. Frau in der Statistikvorlesung) – wirkt über die soziale Identität. Erwartungsverletzung bedroht das Bedürfnis nach **Kontrolle**; TMT: Strategie = Eigengruppe, kulturelle Werte und Normen aufwerten (überdauern den eigenen Tod), Fremdgruppe abwerten."},
  '**Terror Management Theory**: Sterblichkeitssalienz → eigene Weltsicht verteidigen: Bestätigende Personen/Ideen werden **aufgewertet**, moralische Übeltäter **härter bestraft**, mehr **Aggression** gegen Weltsicht-Bedroher (McGregor et al., 1998: Chilisauce).'
 ]},
 {h:'Strategien gegen Bedrohung', b:[
  '**Self-Affirmation**: andere eigene Stärken betonen.',
  '**Theorie der Selbstwerterhaltung / Self-Evaluation Maintenance** (Tesser, 1988): Bedrohung, wenn ein **naher** Anderer in einem **relevanten** Bereich besser ist. Strategien: **Leistung** ändern (eigene verbessern, die des anderen erschweren – Tesser & Smith, 1980: Freunden weniger geholfen), **Nähe** ändern (Distanz, Unterschiede betonen), **Relevanz** ändern (Bereich abwerten). Irrelevanter Bereich → Sonnen im Glanz des anderen.',
  {vid:"Tesser-Muster: anderer besser + **Freund** + **relevant** → am negativsten; **Fremder** → eher neutral; **nahe** Person + **irrelevanter** Bereich → sogar positiv (**Basking in Reflected Glory**). Im Schulkontext führt Abwerten der Dimension oft dazu, dass man die Lust am Fach verliert."},
  '**Schwarzes-Schaf-Effekt**: schwache Eigengruppenmitglieder werden besonders hart abgewertet.',
  '**Selbstwertdienliche Attribution (Self-Serving Bias)**: Erfolg internal, Misserfolg external. **Egocentric Bias** (eigener Beitrag überschätzt – Ross & Sicoly, 1979), **defensive Attribution/unrealistischer Optimismus**, Better-than-average-Effekt.',
  {vid:"**Defensive Attribution**: Bei Unglück anderer suchen wir Ursachen, die man hätte **kontrollieren/vermeiden** können (→ **Blaming the victim**) – gibt uns selbst das Gefühl von Kontrolle. **Unrealistischer Optimismus**: Uns werden eher gute und seltener schlechte Dinge passieren. Self-Handicapping und Sandbagging sind **präventive** Strategien (die Erklärung liegt schon vor dem Ergebnis bereit)."},
  '**Self-Handicapping**: vorab Hindernisse schaffen (vor der Prüfung feiern gehen) → Entschuldigung für Misserfolg. **Sandbagging**: Fähigkeiten vorab herunterspielen.',
  'Grenzen: counter-defensive Attribution, **Selbstverifizierung** (Selbstkonzept bestätigen, auch negativ). Illusorisch hoher Selbstwert hat Vor- und Nachteile.',
  {vid:"**Counter-defensive Attribution**, wenn die Ausrede zu durchschaubar wäre oder andere mit abwerten würde („die Klausur war reines Glück“ entwertet die gute Note des Freundes). **Selbstverifizierung** v. a. gegenüber Nahestehenden. Eine **leicht** positive Selbstverzerrung ist normal und gesund (Durchhaltevermögen, Leistungsbereitschaft, besseres Coping); ein **übertriebener** Selbstwert wirkt negativ auf andere, kann Aggression fördern und zu riskantem Verhalten führen."},
 ]},
 {h:"Neid: gutartig und bösartig", b:[
  "**Neid** entsteht durch einen **Aufwärtsvergleich** in einem Bereich, der einem **wichtig** ist: Jemand hat etwas, das man selbst gern hätte. Das fühlt sich schmerzhaft an.",
  "**Gutartiger Neid**: Man will **selbst aufholen** („leveling up“) → mehr Anstrengung, **Leistungssteigerung**. Eher, wenn der Vorteil des anderen als **verdient** erlebt wird und man glaubt, ihn selbst erreichen zu können.",
  "**Bösartiger Neid**: Man will den anderen **herunterziehen** („leveling down“) → man wünscht der Person Schlechtes, wertet sie ab, Schadenfreude. Eher, wenn der Vorteil als **unverdient** erlebt wird.",
  "**Zusammenhang**: Die beiden Formen sind **eigenständig** und hängen nur **gering** zusammen – sie sind **nicht** einfach Gegensätze (nicht „gegenläufig“).",
  {warn:"Neid steht nicht im Lehrbuch, kam aber in den Prüfungen der letzten Termine mehrfach vor."}
 ]}
]},
{id:7, s:'Einstellungen', t:'Einstellungen: Struktur, Entstehung, Änderung, Messung', sec:[
 {h:'Definition, Komponenten, Funktionen', b:[
  '**Einstellung** = mentale Repräsentation mit zusammenfassender **Bewertung** eines Einstellungsobjekts (Valenz, Intensität, Zugänglichkeit).',
  '**ABC-Modell**: **A**ffektiv (Gefühle), **B**ehavioral (Verhalten/Absichten), **C**ognitiv (Gedanken, Überzeugungen) – also affektive, behaviorale und kognitive Komponente. Einstellungen basieren oft schwerpunktmäßig auf einer Komponente.',
  {vid:"Video-Beispiel **Lerngruppen**: kognitiv „Arbeitsteilung“ (+) vs. „Koordinationsaufwand“ (−), affektiv „genervt“ vs. „motivierend“, behavioral „ich bin in einer Lerngruppe“ → zusammenfassend positiv. Jede Einstellung hat **Valenz**, **Intensität** und **Zugänglichkeit** (sofort klar oder erst nachdenken?)."},
  {warn:'„Ich kaufe das Auto, weil es umweltfreundlich ist“ = kognitiv. Schokopralinen → affektiver Slogan („schmelzend-zarte Verführung“), weil Genussmittel affektiv basiert sind.'},
  '**Explizit** (bewusst, deliberativ, direkt äußerbar) vs. **implizit** (automatisch, oft unbewusst, steuert spontanes/impulsives Verhalten) – können **voneinander abweichen**.',
  '**Gespeichert** (stabil) vs. **situativ konstruiert** (aus aktueller Info, Stimmung, Bedürfnissen).',
  {vid:"Implizit = wie das Objekt im **assoziativen Netzwerk** verknüpft ist (vgl. Zwei-Prozess-Modelle); explizit = verbalisierbares Urteil. Situativ konstruierte Einstellungen werden erst im Moment der Frage gebildet – gespeicherte nur abgerufen (Zugänglichkeit)."},
  '**Ambivalente Einstellung**: gleichzeitig stark positive UND negative Bewertungen; positiv und negativ als **getrennte Dimensionen** – innerhalb oder zwischen Komponenten.',
  'Funktionen: **kognitiv** (Wissens-/Strukturfunktion) und **motivational** (Annäherung/Vermeidung, Identität, soziale Identität, Selbstwert).',
  {vid:"Identität/Selbstwert: Was zu uns gehört, bewerten wir positiver (wer Psychologie studiert, sollte das Fach mögen – sonst leidet der Selbstwert). Soziale Identität: Gruppen bilden sich über geteilte Einstellungen (**Fanclub**)."},
 ]},
 {h:'Entstehung: Gene, Lernen, Selbstwahrnehmung, Mere Exposure', b:[
  '**Genetik**: Zwillingsstudien; v. a. affektive Einstellungen; genetisch beeinflusste sind zugänglicher, änderungsresistenter, verhaltensleitender.',
  {vid:"Laut Corcoran wirkt Genetik eher **indirekt** über Temperament (z. B. Anregungssuche, Risikobereitschaft) und **nicht objektspezifisch**; **Lernprozesse** sind viel entscheidender."},
  '**Evaluative Konditionierung**: neutraler Reiz A + positiver/negativer Reiz B → A übernimmt die Bewertung (auch subliminal: Olson & Fazio, 2006; Förderer & Unkelbach, 2013). **Spreading-Attitude-Effekt** (Walther, 2002): auch ein mit A assoziierter Reiz C ändert sich.',
  {warn:'Restaurant riecht schlecht + unbekanntes Lied → später ungutes Gefühl beim Lied = evaluatives Lernen/Konditionieren.'},
  '**Operante Konditionierung** (Lob, Tadel), **Modelllernen**.',
  '**Selbstwahrnehmung** (Bem) und **Bodyfeedback**: **Pen-Study** (Strack et al., 1988): Stift zwischen den **Zähnen** (Lächeln) → Cartoons **lustiger** als zwischen den Lippen. Replikation (Noah et al., 2018): Effekt verschwindet, wenn man sich gefilmt fühlt. Olson (1992): Lachkonserven.',
  {vid:"Bodyfeedback umfasst **Facial Feedback** (Mimik) und **Postural Feedback** (Körperhaltung). Operante Konditionierung: belohntes Annäherungsverhalten → positive Einstellung, bestraftes → negative. Modelllernen wirkt **stellvertretend**, ohne eigene Erfahrung. Corcoran betont die Verzahnung: Einstellungen = Valenz (Kap. 4), Selbstwahrnehmung (Kap. 6), Mere Exposure/Sympathie (Kap. 5)."},
  '**Mere Exposure**: wiederholte Darbietung → positivere Bewertung (Moreland & Beach, 1992: Frauen in der Vorlesung) – wenn anfangs neutral/positiv.'
 ]},
 {h:'Konsistenz: Balance & kognitive Dissonanz', b:[
  '**Balance-Theorie** (Heider, 1958): Triade Person–Person–Objekt; unbalanciert → Einstellungsänderung.',
  {vid:"Video-Beispiel: Du (+) Game of Thrones, du (+) dein Freund, Freund (−) Game of Thrones → Vorzeichen multiplizieren: + · + · − = **−** → **unbalanciert**. Ausgleich: GoT abwerten (− · + · − = +) oder den Freund abwerten. Einstellungen hängen also auch davon ab, wie andere, die wir mögen, zum Objekt stehen."},
  '**Kognitive Dissonanz** (Festinger, 1957): unangenehmer Zustand durch inkonsistente Kognitionen oder Handlungen gegen das positive Selbstkonzept.',
  'Reduktion: **direkt** – Verhalten ändern, Verhaltenswahrnehmung ändern, Wahlfreiheit herunterspielen, **konsonante Kognitionen hinzufügen**, **dissonante abmildern/Relevanz senken**; **indirekt** – Selbstwert erhöhen (Self-Affirmation).',
  {vid:"Dissonanz ist besonders stark, wenn eine Handlung dem **positiven Selbstkonzept** widerspricht. „Verhaltenswahrnehmung ändern“ = z. B. sich einreden, man tue es nur selten; „Wahlfreiheit herunterspielen“ = das Verhalten external attribuieren → keine Inkonsistenz mehr. Menschen mit **hohem Selbstwert** erleben weniger Dissonanz."},
  'Auslöser für Einstellungsänderung: **irreversible Entscheidungen** (gewählte Alternative aufwerten), **unzureichende Rechtfertigung**.',
  {vid:"Bei **irreversiblem** Verhalten bleibt nur die Kognition zum Ändern (Kaufentscheidung: Gekauftes aufwerten, nicht Gekauftes abwerten). Einstellungsänderung braucht **unzureichende Rechtfertigung** auf drei Ebenen: für das **Bemühen**, für das **Verhalten** (bzw. das Unterlassen – Spielzeugverbot) und für das **unangenehme Gefühl** selbst (sonst Zanna & Cooper). Festinger & Carlsmith: eine Stunde monotone Steck- und Wickelaufgaben, danach Lüge an die „nächste Versuchsperson“, Befragung im Feedbackbogen."},
  '**Festinger & Carlsmith (1959)**: Lüge für **1 $** → Aufgabe später **interessanter** als für 20 $ (keine ausreichende externe Rechtfertigung → Dissonanz).',
  '**Aronson & Mills (1959)**: harte Aufnahme → Gruppe attraktiver (**Anstrengungsrechtfertigung**). Aronson & Carlsmith (1963): milde Strafandrohung → verbotenes Spielzeug abgewertet.',
  '**Zanna & Cooper (1974)**: Placebo „erregend“ → Erregung auf Pille attribuiert → kaum Einstellungsänderung; „entspannend“ → Erregung unerklärlich → **stärkste** Dissonanz/Änderung.',
  '**Stone et al. (1994)**: Heuchelei bewusst machen → mehr Kondome gekauft.',
  'Dissonanz durch Beziehungen: Wer mit der Person, die einen Film empfohlen hat, eng befreundet ist und den Film schlecht findet, erlebt die stärkste Dissonanz.',
  {warn:'Pia mag dich nicht, tut dir aber einen Gefallen → PIA erlebt Dissonanz und wertet DICH auf (Ben-Franklin-Effekt).'},
  'Praxis (Präsenz): Inkonsistenz bewusst machen, Verhalten öffentlich und unwiderruflich, externe Begründungen minimieren, Verhalten aufwendig gestalten.'
 ]},
 {h:'Persuasion', b:[
  '**Yale-Ansatz** (Hovland): „**Wer** sagt **was** zu **wem**?“ – **Kommunikator** (Glaubwürdigkeit, Expertise, paraverbal: tiefe Stimme, **schnelles** Sprechtempo; Attraktivität, Sympathie, offensichtliche Beeinflussungsabsicht), **Botschaft** (Reihenfolge, **Zweiseitigkeit**, Framing), **Rezipient** (Ablenkung, Intelligenz/Bildung, Alter, Kultur, Need for Cognition).',
  {vid:"**Persuasion** = Versuch, Einstellungen durch Botschaften gezielt zu ändern (direkt; Dissonanz wirkt eher indirekt). **Füllwörter, Zögern, leises Sprechen** wirken unsicher → weniger überzeugend. Offensichtliche **Beeinflussungsabsicht** erschwert die Überzeugung; Zweiseitigkeit wirkt ausgewogener und glaubwürdiger."},
  {vid:"**Reihenfolge**: Primacy (zuerst Gehörtes färbt den Rest) vs. Recency (Letztes wird nicht mehr überschrieben) – hängt u. a. von Pausen und Relevanz ab. **Framing**: „80 % Heilungschance“ vs. „20 % Risiko, nicht zu genesen“. Rezipient: Ablenkung wirkt je nach Botschaft unterschiedlich; Bildung (verstehen, sichere eigene Meinung), **junge Erwachsene** sind beeinflussbarer, Kultur."},
  '**Elaboration-Likelihood-Model / Heuristic-Systematic-Model**: **zentrale Route** (Argumentqualität) vs. **periphere Route** (Hinweisreize: Expertenstatus, Attraktivität). Welcher Weg, hängt von **Motivation** (Relevanz) und **Fähigkeit** (Kapazität, keine Ablenkung) ab.',
  {vid:"Periphere Hinweisreize: Expertise, Glaubwürdigkeit, Attraktivität, **Länge der Rede**, **Anzahl der Argumente**. Einstellungsänderung über die **zentrale Route** ist **stabiler**, über die periphere Route **fragil** (Kognitionen wurden nicht verändert). HSM: systematisch ≈ zentral, heuristisch ≈ peripher; Parallele zum RIM (reflektiv braucht Fähigkeit + Motivation)."},
  '**Petty, Cacioppo & Goldman (1981)**: Abschlussprüfung bald (hohe Relevanz) → **Argumentqualität** entscheidet; in 10 Jahren (niedrige Relevanz) → **Expertise der Quelle** entscheidet.',
  'Bless et al. (1990): negative Stimmung → nur starke Argumente überzeugen; positive Stimmung → wenig Differenzierung.'
 ]},
 {h:'Resistenz gegen Änderung', b:[
  '**Einstellungsimpfung**: eine **kleine Dosis schwacher Gegenargumente** → eigene Gegenargumente werden entwickelt.',
  {vid:"Impfung im **pädagogischen** Kontext z. B. per Rollenspiel üben. **Vorwarnung** in der Praxis: Kennzeichnungspflicht für **Werbung** (auch Social Media) – ob das reicht, ist offen. **Reaktanz** = innerer Widerstand gegen die **empfundene** Einschränkung der Handlungsfreiheit; Verbote im **Jugendschutz** (Filme, Substanzen) können das Verbotene erst attraktiv machen."},
  '**Vorwarnung**: Zeit für Gegenargumente; besonders wirksam bei hohem Involvement.',
  '**Reaktanz**: wahrgenommene Einschränkung der Freiheit (Verbote, Drohung, Druck) → Gegenteil tun/Einstellung festigen (Bumerang). Bushman & Stack (1996): Warnhinweise → mehr Interesse an Gewaltfilmen; Pennebaker & Sanders (1976): strenges Verbot → mehr Graffiti.'
 ]},
 {h:'Einstellung & Verhalten', b:[
  'Zusammenhang oft schwach – besser bei: **Korrespondenzprinzip** (Einstellung und Verhalten gleich spezifisch), **Aggregationsprinzip** (globale Einstellung → Verhaltensindex), **Stärke & Zugänglichkeit** (persönliche Erfahrung – Regan & Fazio, 1977; Fazio: Zugänglichkeit), wenig Ambivalenz.',
  {vid:"**Attitude-Behavior-Gap**. Gründe: Person (**hohe Selbstüberwachung** → schwächerer Zusammenhang), **situative Zwänge** (starke externe Rechtfertigung, Strafe), Merkmale der Einstellung (Zugänglichkeit; **Stärke** = extrem, durchdacht, aus persönlicher Erfahrung → zugänglicher und stabiler; **Salienz** der gerade relevanten Komponente – beim Schokolade-Essen zählt das Affektive)."},
  {vid:"Beispielstudie Verhütung/**Pille**: „Wie stehen Sie zur Verhütung?“ sagt die Pilleneinnahme in den nächsten zwei Jahren kaum vorher (r ≈ .08); je spezifischer gefragt („die Pille in den nächsten zwei Jahren nehmen“), desto höher die Korrelation (**Korrespondenzprinzip**). Globale Einstellung zum Umweltschutz → aggregiertes Verhalten (Mülltrennung, Plastik vermeiden, zu Fuß gehen, regional kaufen) (**Aggregation**)."},
  '**Einstellungsstärke**: Starke Einstellungen sind häufig auch hoch zugänglich; beide sagen Verhalten besser vorher. Hoch zugängliche Einstellungen steuern **spontanes** Verhalten.',
  '**Theory of Planned Behavior** (Ajzen): **Einstellung zum Verhalten** + **subjektive Norm** (was wichtige andere erwarten) + **wahrgenommene Verhaltenskontrolle** → **Intention** → Verhalten. Einstellungen wirken nur **indirekt** über die Intention; Verhaltenskontrolle wirkt auch direkt.',
  {vid:"Bei Ajzen ist die Einstellung = Bewertung des **spezifischen Verhaltens** und seiner **wahrscheinlichen Konsequenzen**; **subjektive Norm** = Annahme, wie **mir wichtige Personen** das Verhalten beurteilen; **wahrgenommene Verhaltenskontrolle** = wie leicht ich das Verhalten ausführen kann. Auch zwischen Intention und Verhalten gibt es eine Lücke (**Intention-Behavior-Gap**), u. a. weil die TPB das **impulsive** System nicht berücksichtigt. Sehr starke empirische Basis (Feld- und Interventionsstudien)."},
  {warn:'TPB und das reflektive System haben gemeinsam: geplante, bewusste, durchdachte Verhaltenssteuerung. Subjektive Norm ≠ „wie viele andere es tun“.'},
  'Shavitt & Fazio (1991): Salienz von Geschmack vs. sozialer Wirkung steuert die Produktwahl (v. a. bei hoher Selbstüberwachung).'
 ]},
 {h:'Messung', b:[
  '**Direkt/explizit**: **Likert-Skala** (Zustimmung zu Aussagen – kann alle drei Komponenten erfassen), **semantisches Differenzial** (gut–schlecht; oft für die affektive Komponente). Probleme: mangelnde Introspektion, **soziale Erwünschtheit**.',
  {vid:"Laut Video: **Likert-Fragebögen** können **alle drei** ABC-Komponenten erfassen (Beispiel Sterbehilfe: „Der Gedanke ist mir unangenehm“ = affektiv, „kann zu Missbrauch führen“ = kognitiv, „würde beim Bürgerbegehren dafür stimmen“ = behavioral; auch umgepolte Items); das **semantische Differenzial** erfasst **nur die affektive** Komponente. Weitere Grenzen direkter Messung: begrenzte Introspektion, Täuschungsmotivation/soziale Erwünschtheit, Verzerrungen durch die **Fragebogengestaltung** (Reihenfolge, Skalen). Bogus Pipeline gehört zur **direkten** Messung."},
  '**Bogus Pipeline**: angeblicher Lügendetektor → ehrlichere **explizite** Antworten (Sigall & Page, 1971).',
  '**Indirekt/implizit**: physiologisch (EMG), Verhaltensmaße (Sitzabstand, Lost-Letter-Technik), **IAT** (kombinierte Kategorisierung mit gemeinsamen Reaktionstasten; Reaktionszeiten), **Go/No-Go (GNAT)**, affektives Priming, **AMP**, Annäherung/Vermeidung (Neumann et al., 2004: Mausbewegungen, Einstellung zu Aidskranken).',
  {vid:"Indirekte Maße erfassen meist die **affektive** Komponente. **Lost-Letter-Technik** liefert Gruppen-/Gebietsdaten, keine Einzelpersonen. **Affektives Priming**: Einstellungsobjekt (Schlange) → Wort mit klarer Valenz (Krieg/Frieden) einordnen; passende Valenz → schneller. **Go/No-Go** wie IAT, aber nur **eine** Taste (drücken oder nicht). **Mausbewegung**: zu sich ziehen = Armbeuger (Annäherung). **AMP**: Einstellungsobjekt → **neutrales** Zeichen (z. B. chinesisches Schriftzeichen) bewerten; der Affekt wird fehlattribuiert."},
  {vid:"Explizite und implizite Einstellungen korrelieren oft **kaum**. Implizit ist **nicht** automatisch die „wahrere“ Messung – welche besser ist, hängt davon ab, welches **Verhalten** man vorhersagen will (spontan/affektiv → implizit; überlegt/Selbstdarstellung → explizit). Die Sozialpsychologie interessiert v. a. Gruppenmittelwerte, nicht individuelle Diagnostik."},
  'Implizite Einstellungen sind nicht per Fragebogen erfassbar, weil automatisch/unbewusst.'
 ]},
 {h:"Verhalten vorhersagen: COM-B & Value-Belief-Norm", b:[
  "**Theorie des geplanten Verhaltens** (Ajzen): **Einstellung** + **subjektive Norm** + **wahrgenommene Verhaltenskontrolle** → **Intention** → Verhalten. Subjektive Norm = was **wichtige andere** von mir erwarten (sozialer Druck, nach außen gerichtet).",
  "**Value-Belief-Norm-Theorie** (Stern): **Werte** (v. a. biosphärisch/altruistisch) → **ökologisches Weltbild** → **Problembewusstsein** (Folgen erkennen) → **Verantwortungsgefühl** → **persönliche Norm** (moralische Verpflichtung) → umweltfreundliches Verhalten.",
  "**Unterschied der Normen**: Bei der TPB ist die Norm **sozial** – auf die Erwartungen **anderer** gerichtet. Bei der VBN ist sie **persönlich** – eine **innere moralische Verpflichtung**, auf **mich selbst** gerichtet („Ich sollte …“), ausgelöst durch Werte und Überzeugungen.",
  "**COM-B-Modell** (Michie): Verhalten (**B**ehaviour) braucht drei Dinge: **C**apability (Fähigkeit – körperlich und psychisch), **O**pportunity (Gelegenheit – physisch und sozial) und **M**otivation (reflektiv und automatisch). Fehlt eines, kommt das Verhalten nicht zustande.",
  {warn:"COM-B und Value-Belief-Norm stehen nicht im Lehrbuch, wurden aber in den Prüfungen der letzten Termine gefragt (als Transfer zur Theorie des geplanten Verhaltens)."}
 ]}
]}

];

{c:PQ,k:7,t:'mc',q:'Eine Kampagne lässt Studierende öffentlich für Mülltrennung werben und erinnert sie danach an eigene Versäumnisse. Was ist zu erwarten?',o:['Sie trennen danach mehr Müll','Sie trennen aus Reaktanz weniger','Sie werten Mülltrennung ab','Es passiert gar nichts'],a:0,e:'Heuchelei-Paradigma wie Stone et al. (1994): Dissonanz → Verhaltensänderung.'},
{"c": 1, "t": "mc", "q": "Was besagt die Nullhypothese (H0)?", "o": ["Zwischen den untersuchten Variablen gibt es einen Zusammenhang", "Es gibt keinen Effekt bzw. keinen Zusammenhang", "Der gefundene Effekt ist praktisch bedeutsam", "Das Ergebnis lässt sich sicher replizieren"], "a": 1, "e": "**H0** = kein Effekt. Die **Alternativhypothese H1** behauptet den Effekt. Signifikanztests prüfen, wie wahrscheinlich das Ergebnis wäre, wenn H0 stimmt."},
{"c": 1, "t": "mc", "q": "Was ist ein Fehler 2. Art?", "o": ["Man verwirft H0, obwohl sie stimmt", "Man nimmt einen Effekt an, den es gar nicht gibt", "Man behält H0 bei, obwohl es den Effekt tatsächlich gibt", "Man wählt ein zu strenges Signifikanzniveau"], "a": 2, "e": "**Fehler 2. Art (β)** = echter Effekt wird **übersehen** (falsch negativ). Fehler 1. Art (α) = Effekt „gefunden“, den es nicht gibt (falsch positiv). Power = 1 − β."},
{"c": 1, "t": "ms", "q": "Was stimmt über den Fehler 1. Art bei α = .05?", "o": ["Er bedeutet, H0 zu verwerfen, obwohl sie in Wahrheit stimmt", "Die Wahrscheinlichkeit dafür wird auf höchstens 5 % begrenzt", "Er heißt, dass 5 % aller signifikanten Befunde falsch sind", "Er heißt, dass ein signifikanter Effekt zu 95 % echt ist"], "a": [0, 1], "e": "α begrenzt das Risiko, **unter der Annahme H0** fälschlich zu verwerfen. Daraus folgt **nicht**, wie viele signifikante Befunde falsch sind oder wie sicher ein Effekt echt ist."},
{"c": 1, "t": "ms", "q": "Die Einstellung zum Klimawandel korreliert mit politischen Werten zu r = .20 und mit hedonischen Werten zu r = −.21. Was stimmt?", "o": ["Beide Werte sagen zumindest teilweise etwas über die Einstellung zum Klimawandel aus", "Beide Zusammenhänge sind etwa gleich stark, nur in entgegengesetzter Richtung", "Der negative Wert bedeutet, dass es keinen Zusammenhang gibt", "Politische Werte verursachen die Einstellung zum Klimawandel"], "a": [0, 1], "e": "Der **Betrag** zeigt die Stärke (.20 ≈ .21, beide klein), das **Vorzeichen** die Richtung. Negativ heißt gegenläufig, nicht „kein Zusammenhang“. Kausal ist aus Korrelationen nichts ableitbar."},
{"c": 1, "t": "mc", "q": "Was trifft auf Labor- und Feldstudien am ehesten zu?", "o": ["Feldstudien haben immer die höhere interne Validität", "Laborstudien sichern eher die interne, Feldstudien eher die externe Validität", "Laborstudien haben automatisch keine externe Validität", "Interne und externe Validität schließen sich gegenseitig aus"], "a": 1, "e": "Im Labor lässt sich besser kontrollieren (**intern**), im Feld ist die Situation alltagsnäher (**extern**). Laborbefunde können aber durchaus übertragbar sein."},
{"c": 2, "t": "mc", "q": "Personen lesen eine Geschichte über ein Date von Barbara und Jack, die entweder mit einem Heiratsantrag oder mit einer Vergewaltigung endet. Was zeigt der Gedächtnistest zwei Wochen später?", "o": ["Die Heiratsgruppe erinnert insgesamt mehr Details", "Alle erinnern vor allem Positives über Jack", "Personen erinnern fälschlich Details, die zum gelesenen Ende passen", "Das Ende hat keinen Einfluss auf die Erinnerung"], "a": 2, "e": "**Carli (1999)**: Die Erinnerung wird **passend zum Ausgang rekonstruiert** – inklusive Details, die nie vorkamen. Das Ende wirkt im Nachhinein vorhersehbar (**Rückschaufehler**)."},
{"c": 2, "t": "mc", "q": "Wie lief der klassische Versuch zum Cocktailparty-Effekt ab?", "o": ["Personen hörten auf beiden Ohren Verschiedenes, sprachen ein Ohr nach und sollten merken, ob ihr Name fiel", "Personen lasen Wortlisten und sollten den eigenen Namen darin möglichst schnell finden", "Personen führten auf einer Party Gespräche und notierten danach, worüber gesprochen wurde", "Personen sahen Gesichter und sollten bekannte Personen benennen"], "a": 0, "e": "**Dichotisches Hören** (Moray, 1959): Ein Ohr wird beschattet, vom anderen bleibt kaum etwas hängen – der **eigene Name** wird aber oft bemerkt (persönliche Relevanz)."},
{"c": 2, "t": "ms", "q": "Ein Dozent hat einen Fridays-for-Future-Sticker am Laptop. Anna bekommt FFF-Benachrichtigungen, Rudolf macht bei FFF mit, Max ist einfach nur da. Was ist zu erwarten?", "o": ["Anna und Rudolf haben das Konzept eher chronisch zugänglich", "Anna und Rudolf bemerken den Sticker eher und ordnen den Dozenten danach ein", "Max nimmt den Sticker genauso stark wahr wie die anderen", "Zugänglichkeit spielt bei der Einordnung von Personen keine Rolle"], "a": [0, 1], "e": "Häufiger Kontakt mit einem Thema bzw. persönliche Relevanz machen Konzepte **chronisch zugänglich** → sie lenken Aufmerksamkeit und Interpretation (Top-down)."},
{"c": 2, "t": "mc", "q": "Wodurch wird ein Konzept chronisch zugänglich?", "o": ["Durch einmaliges, unbewusstes Priming kurz vor einer Aufgabe", "Durch häufige Aktivierung bzw. hohe persönliche Bedeutung über längere Zeit", "Nur durch bewusstes Auswendiglernen", "Durch eine negative Stimmung"], "a": 1, "e": "**Chronisch** = dauerhaft leicht abrufbar durch **häufigen Gebrauch**/Relevanz. Kurz vorher aktiviert = **situative** (temporäre) Zugänglichkeit."},
{"c": 3, "t": "mc", "q": "Wie lässt sich ein Ankereffekt am ehesten verringern?", "o": ["Indem man sich bewusst Gründe überlegt, die gegen den Ankerwert sprechen", "Indem man eine Belohnung für genaue Schätzungen verspricht", "Indem man nur Expertinnen und Experten schätzen lässt", "Indem man den Anker möglichst extrem wählt"], "a": 0, "e": "**Consider the opposite**: Gegengründe machen anderes Wissen zugänglich und schwächen die selektive Zugänglichkeit ankerpassender Informationen. Anreize und Expertise helfen kaum."},
{"c": 3, "t": "mc", "q": "Eine Fabrik wird verkauft. Wann ist der erzielte Preis eher höher?", "o": ["Wenn die Käuferseite das erste Gebot macht", "Wenn die Verkäuferseite das erste Gebot macht", "Wenn beide gleichzeitig ein Gebot abgeben", "Die Reihenfolge der Gebote spielt keine Rolle"], "a": 1, "e": "Das **erste Gebot** wirkt als **Anker** und zieht die weitere Verhandlung in seine Richtung (Galinsky & Mussweiler, 2001)."},
{"c": 3, "t": "mc", "q": "Eine Lehrerin bewertet dieselbe Arbeit besser, wenn sie von einer bisher guten Schülerin stammt. Was ist hier der Anker?", "o": ["Die Bewertungsskala der Schule", "Die Stimmung der Lehrerin", "Die früheren Leistungen der Schülerin", "Die Länge der Arbeit"], "a": 2, "e": "Die **bekannte Vorleistung** dient als Ausgangswert, von dem aus die neue Note nur unzureichend angepasst wird."},
{"c": 3, "t": "mc", "q": "Was ist eine Basisrate?", "o": ["Die Grundhäufigkeit, mit der etwas in einer Population vorkommt", "Der erste Wert, den man in einer Schätzung nennt", "Die Wahrscheinlichkeit, dass ein Effekt repliziert wird", "Die durchschnittliche Reaktionszeit in einem Experiment"], "a": 0, "e": "**Basisrate** = allgemeine Häufigkeit (z. B. 70 % Juristen). Bei der Repräsentativitätsheuristik wird sie oft **vernachlässigt**."},
{"c": 4, "t": "mc", "q": "Wie hängen kognitive und affektive Prozesse zusammen?", "o": ["Sie laufen völlig unabhängig voneinander ab", "Kognitionen folgen immer erst auf Gefühle", "Sie beeinflussen sich gegenseitig", "Gefühle entstehen ausschließlich durch körperliche Erregung"], "a": 2, "e": "**Wechselseitig**: Bewertungen und Attributionen formen Emotionen – Stimmungen und Emotionen beeinflussen Wahrnehmung, Gedächtnis und Urteile."},
{"c": 4, "t": "mc", "q": "Wofür ist die Ausdifferenzierung von Emotionen über Attributionen vor allem wichtig?", "o": ["Damit Emotionen möglichst lange anhalten", "Damit man passend auf die jeweilige Situation reagieren kann", "Damit die körperliche Erregung sinkt", "Damit Stimmungen zu Emotionen werden"], "a": 1, "e": "Je nachdem, **wer** verantwortlich ist und ob es **kontrollierbar** war, entsteht z. B. Schuld, Ärger, Scham oder Mitleid – und damit eine passende Handlung (Weiner)."},

/* ================== Hilfen ================== */
let EXAM = new Date(...CFG.exam);
const LS = {get(k,d){try{const v=localStorage.getItem(CFG.key+'.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(CFG.key+'.'+k,JSON.stringify(v))}catch(e){}}};
{const v=LS.get('exam',null);if(v)EXAM=new Date(v[0],v[1],v[2])} /* eigener Prüfungstermin */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>').replace(/-&gt;/g,'→').replace(/=&gt;/g,'⇒');
const hash = s => {let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return 'q'+(h>>>0).toString(36)};
Q.forEach(q=>q.id=q.id||hash(q.q));
const CHNAME = Object.fromEntries(CH.map(c=>[c.id,c.s])); CFG.bonus.forEach(b=>CHNAME[b.id]=b.s); CHNAME[PQ]='Prüfungsfragen';
const CHM = CH.filter(c=>!c.x); const MAIN = new Set(CHM.map(c=>c.id)); const RANGE = CHM.length>1?CHM[0].id+'–'+CHM[CHM.length-1].id:String(CHM[0].id);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const solText = q => q.t==='mc'?q.o[q.a]:q.t==='ms'?q.a.map(i=>q.o[i]).join(' · '):q.t==='tf'?(q.a?'Stimmt':'Stimmt nicht'):q.a[0];
const withOrd = q => (q.t==='mc'||q.t==='ms')?{...q,ord:shuffle(q.o.map((_,i)=>i))}:q;
let stats = LS.get('stats',{});
const saveStats = ()=>LS.set('stats',stats);
/* Nochmals wiederholen: war falsch, jetzt richtig → rep=REP; jede weitere richtige Antwort zählt runter, bei 0 ist sie raus, falsch → zurück zu „Zuletzt falsch“ */
const REP = 2;
const FHINT = {all:'Alle Fragen der gewählten Kapitel.', alt:'Nur Fragen, die so oder ähnlich schon in Prüfungen gekommen sind.', wrong:'Fragen, die du zuletzt falsch beantwortet hast – also noch nicht kannst.', rep:'Fragen, die du schon einmal falsch und dann richtig hattest (müssen noch '+REP+'× richtig sein) plus die, die du selbst gemerkt hast.', new:'Fragen, die du noch nie beantwortet hast.'};
const isRep = id => stats[id]&&((stats[id].last==='r'&&stats[id].rep>0)||stats[id].pin);
/* Selbst gemerkt (pin): bleibt in „Nochmals wiederholen“, bis man es selbst wieder entfernt */
const pinBtn = id => {const on=!!(stats[id]&&stats[id].pin);return `<button class="btn ghost pin" data-pin="${id}" aria-pressed="${on}" title="Taste M">${on?'✓ Gemerkt · tippen zum Entfernen':'↻ Nochmals wiederholen merken'}</button>`};
function togglePin(id){const s=stats[id]||{r:0,w:0,rep:0};s.pin=!s.pin;stats[id]=s;saveStats();document.querySelectorAll(`[data-pin="${id}"]`).forEach(b=>b.outerHTML=pinBtn(id))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b)togglePin(b.dataset.pin)});
const isOpen = id => stats[id]&&(stats[id].last==='w'||isRep(id)); /* offene Fehler = zuletzt falsch + nochmals wiederholen */
Object.values(stats).forEach(s=>{if(s.rep===undefined) s.rep = (s.w>0&&s.last==='r') ? REP : 0}); saveStats();

renderCount();

const TABS=['learn','cards','quiz','plan','prog','pet'];
function show(tab){
  if(tab==='pet'&&!petTabVisible()) tab='learn';
  if(tab!=='pet') gameStop();
  if(tab==='plan'&&typeof plan!=='undefined'&&plan.off) tab='learn';
  TABS.forEach(t=>{document.getElementById('v-'+t).hidden = t!==tab; document.getElementById('t-'+t).setAttribute('aria-selected', t===tab)});
  LS.set('tab',tab);
  if(tab==='prog') renderProg();
  if(tab==='learn') renderChapter();
  if(tab==='pet') renderPet();
  if(tab==='plan') renderPlan();

let curCh = LS.get('ch',1);
function renderRail(){
  document.getElementById('rail').innerHTML = CH.map(c=>`<button data-c="${c.id}" aria-current="${c.id===curCh}"><span class="mono">K${c.id}</span><span class="t">${esc(c.s)}</span></button>`).join('');

function renderItem(x){
  if(typeof x==='string'){
    if(x.startsWith('§')) return `<li class="sub">${esc(x.slice(1))}</li>`;
    return `<li>${fmt(x)}</li>`;
  }
  if(x.warn) return `<li class="warn"><b>Achtung</b>${fmt(x.warn)}</li>`;
  if(x.vid) return `<li class="vid">${fmt(x.vid)}</li>`;
  if(x.neu) return `<li class="neu"><b>Neu</b>${fmt(x.neu)}</li>`;
  if(x.tbl){const [h,...rows]=x.tbl;return `<li class="tbl"><table><thead><tr>${h.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></li>`}
  return '';
}
function renderChapter(){
  const c=CH.find(x=>x.id===curCh);
  const n=Q.filter(q=>q.c===c.id).length;
  document.getElementById('chapter').innerHTML = `<div class="chap-head"><div><span class="mono">Kapitel ${c.id}${(()=>{const k=c.sec.reduce((a,s)=>a+s.b.filter(x=>x&&x.neu).length,0);return k?` · <span style="color:var(--accent)">${k} neu</span>`:''})()}</span><h2>${esc(c.t)}</h2></div><div class="actions" style="margin:0">${(()=>{const ev=Q.filter(q=>q.c===c.id&&isOpen(q.id)).length;return ev?`<button class="btn" id="chw">${ev} Fehler aus K${c.id} wiederholen</button>`:''})()}<button class="btn accent" id="chq">${n} Fragen zu K${c.id} üben</button></div></div>`+
   (c.sec.some(s=>s.b.some(x=>x&&x.vid))?`<p class="vidnote"><span class="vidbar"></span>Zeilen mit einem Strich links stammen aus den <b>Vorlesungsvideos</b> zu diesem Kapitel.</p>`:'')+
c.sec.map(s=>`<article class="sec"><h3>${esc(s.h)}</h3><ul>${s.b.map(renderItem).join('')}</ul></article>`).join('');
  document.getElementById('chq').onclick=()=>{setup.ch=[c.id];setup.filter='all';setup.n=20;show('quiz');startQuiz()};
  const chw=document.getElementById('chw'); if(chw) chw.onclick=()=>{setup.ch=[c.id];setup.filter='ever';setup.n=0;show('quiz');startQuiz()};
}

function buildDeck(){card.deck = shuffle(CARDS.filter(c=>!card.ch||c[0]===card.ch)); card.i=0; card.flipped=false}
function renderCards(){

  v.innerHTML = `<div class="label">Kapitel</div>
   <div class="chips" id="cchips"><button class="chip" data-c="0" aria-pressed="${!card.ch}">Alle <span class="mono">${CARDS.length}</span></button>${CH.map(x=>`<button class="chip" data-c="${x.id}" aria-pressed="${card.ch===x.id}"><span class="mono">K${x.id}</span>${esc(x.s)}</button>`).join('')}</div>
   <div class="cardbox"><button class="flip ${card.flipped?'on':''}" id="flip" aria-label="Karte umdrehen">
     <div class="face front"><span class="mono">K${c[0]} · ${esc(CHNAME[c[0]])}</span><div class="term">${esc(k)}</div><span class="mono">Tippen oder Leertaste zum Umdrehen</span></div>
     <div class="face back"><span class="mono">${esc(k)}</span><div class="def">${fmt(c[2])}</div><span class="mono">${card.known[k]?'Als gewusst markiert':'Noch offen'}</span></div>
   </button></div>
   <div class="cardnav">
     <button class="btn ghost" id="cprev">← Zurück</button>
     <button class="btn ghost" id="cno">Nochmal</button>
     <button class="btn" id="cyes">Gewusst →</button>
     <span class="mono" style="color:var(--muted)">${card.i+1} / ${card.deck.length} · ${knownN} gewusst</span>
     <button class="btn ghost" id="cshuf">Mischen</button>
   </div>`;
  v.querySelectorAll('#cchips button').forEach(b=>b.onclick=()=>{card.ch=+b.dataset.c;LS.set('cardch',card.ch);buildDeck();renderCards()});
  document.getElementById('flip').onclick=()=>{card.flipped=!card.flipped;document.getElementById('flip').classList.toggle('on',card.flipped)};
  document.getElementById('cprev').onclick=()=>{card.i=(card.i-1+card.deck.length)%card.deck.length;card.flipped=false;renderCards()};
  document.getElementById('cno').onclick=()=>{delete card.known[k];LS.set('known',card.known);const x=card.deck.splice(card.i,1)[0];card.deck.splice(Math.min(card.i+4,card.deck.length),0,x);card.flipped=false;if(card.i>=card.deck.length)card.i=0;renderCards()};
  document.getElementById('cyes').onclick=()=>{card.known[k]=1;LS.set('known',card.known);card.i=(card.i+1)%card.deck.length;card.flipped=false;renderCards()};
  document.getElementById('cshuf').onclick=()=>{buildDeck();renderCards()};
}

/* ================== Quiz ================== */
let setup = {ch:[], filter:'all', n:20};
let quiz = {active:false, list:[], i:0, right:0, wrong:[], answered:false};
function pool(){
  let p = Q.filter(q=>!setup.ch.length || setup.ch.includes(q.c));
  if(!setup.ch.length) p = p.filter(q=>MAIN.has(q.c));
  if(setup.filter==='alt') p=p.filter(q=>q.alt);
  if(setup.filter==='wrong') p=p.filter(q=>stats[q.id]&&stats[q.id].last==='w');
  if(setup.filter==='rep') p=p.filter(q=>isRep(q.id));
  if(setup.filter==='ever') p=p.filter(q=>isOpen(q.id));
  if(setup.filter==='new') p=p.filter(q=>!stats[q.id]);
  /* Fragetyp ist eigener Filter und kombiniert sich mit der Auswahl (z. B. Zuletzt falsch + Lückentext) */
  if(setup.type==='ms') p=p.filter(q=>q.t==='ms');
  if(setup.type==='gap') p=p.filter(q=>q.t==='gap');
  return p;
}
function renderSetup(){
  const v=document.getElementById('v-quiz');
  const p=pool();
  const cnt=f=>{const o=setup.filter;setup.filter=f;const k=pool().length;setup.filter=o;return k};
  const wrongN=cnt('wrong'), repN=cnt('rep');
  const sh=LS.get('simhist',[]);
  v.innerHTML = petInvite()+planStrip()+`<div class="qtiles">${lmTile()}${Q.some(q=>q.c===PQ)?`<div class="panel simcard"><div><span class="label">Prüfungssimulation</span><h2>${SIM_N} Fragen · ${SIM_MIN} Minuten · wie in der Prüfung</h2><p class="hint">Zufällig aus ${Q.filter(q=>q.c===PQ).length} neuen Prüfungsfragen. Keine Rückmeldung während der Simulation – du kannst vor- und zurückspringen und Antworten ändern. Auswertung mit Lösungen am Ende.${sh.length?` Letzter Versuch: <b>${sh[sh.length-1].r}/${sh[sh.length-1].n}</b> · bester: <b>${Math.max(...sh.map(x=>x.r))}/${SIM_N}</b>`:''}</p></div><button class="btn accent" id="simgo">Simulation starten</button></div>`:''}
  <div class="panel simcard"><div><span class="label">Fragenkatalog</span><h2>Alle ${Q.length} Fragen zum Durchlesen</h2><p class="hint">Einfach durchscrollen, ohne zu antworten: Alle Fragen nach Kapitel, die richtige Antwort ist grün markiert, die Erklärung steht gleich darunter. Mit „Antworten verdecken“ kannst du dich dabei auch selbst abfragen.</p></div><button class="btn" id="brgo">Alle Fragen ansehen</button></div></div>
  <div class="panel setup">
   <div><h2>Quiz</h2></div>
   <div><div class="label">Kapitel (mehrere möglich)</div><div class="chips" id="qch">
     <button class="chip" data-c="0" aria-pressed="${!setup.ch.length}">Alle ${RANGE}</button>
     ${CH.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${setup.ch.includes(c.id)}"><span class="mono">K${c.id}</span>${esc(c.s)}</button>`).join('')}
     ${CFG.bonus.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${setup.ch.includes(c.id)}"><span class="mono">K${c.id}</span>${esc(c.s)}</button>`).join('')}
     ${Q.some(q=>q.c===PQ)?`<button class="chip" data-c="${PQ}" aria-pressed="${setup.ch.includes(PQ)}"><span class="mono">P</span>Prüfungsfragen</button>`:''}
   </div></div>
   <div><div class="label">Auswahl</div><div class="seg" id="qf">
     ${[['all','Alle Fragen'],['alt','Nur Altfragen'],['wrong','Zuletzt falsch ('+wrongN+')'],['rep','Nochmals wiederholen ('+repN+')'],['new','Noch nie beantwortet']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${setup.filter===k}">${l}</button>`).join('')}
   </div>
   <p class="hint fhint">${FHINT[setup.filter]||''}</p>
   <details class="hint fhelp"><summary>So funktionieren „Zuletzt falsch“ und „Nochmals wiederholen“</summary>
    <ol>
     <li>Du beantwortest eine Frage <b>falsch</b> → sie landet in <b>Zuletzt falsch</b>.</li>
     <li>Du übst „Zuletzt falsch“ und hast sie jetzt <b>richtig</b> → sie wandert nach <b>Nochmals wiederholen</b>. Dort muss sie noch ${REP}× richtig sein, damit du sicher bist, dass es kein Glückstreffer war – dann ist sie fertig.</li>
     <li>Ist sie in „Nochmals wiederholen“ wieder <b>falsch</b> → zurück zu „Zuletzt falsch“.</li>
     <li>Mit <b>↻ Nochmals wiederholen merken</b> (Taste M) legst du auch Fragen dorthin, die du zwar richtig hattest, bei denen du aber unsicher warst. Die bleiben drin, bis du sie selbst wieder entfernst.</li>
    </ol>
    <p>Kurz: <b>Zuletzt falsch</b> = noch nicht gekonnt. <b>Nochmals wiederholen</b> = schon einmal richtig, aber noch nicht gefestigt. Dein Fortschritt wird nur in deinem eigenen Browser gespeichert.</p>
   </details></div>
   <div><div class="label">Fragetyp</div><div class="seg" id="qt">

function bkDump(){const o={},p=CFG.key+'.';try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p)&&k!==p+'bk'&&k!==p+'tab')o[k.slice(p.length)]=localStorage.getItem(k)}}catch(e){}return o}
const b64u=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};

async function bkRead(code){

  if(!m) throw new Error('format'); if(m[2]!==CFG.key) throw new Error('key');
  let bytes=ub64(m[3]);
  if(m[1]==='LB1'){if(typeof DecompressionStream==='undefined')throw new Error('browser');const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer())}

  const is=P(d.stats)||{}; for(const id in is){const a=stats[id],b=is[id];if(!b)continue;const na=a?(a.r||0)+(a.w||0):-1,nb=(b.r||0)+(b.w||0);if(nb>na){stats[id]=b;n++}} saveStats();

  const ip=P(d.pet);

  const ifo=P(d.focus);
  if(ifo&&typeof foc!=='undefined'){foc.rounds=Math.max(foc.rounds||0,ifo.rounds||0);foc.cycles=Math.max(foc.cycles||0,ifo.cycles||0);Object.entries(ifo.byDay||{}).forEach(([k,m])=>{foc.byDay[k]=Math.max(foc.byDay[k]||0,m)});if(!LS.get('focus',null))foc.mode=ifo.mode||foc.mode,foc.custom=ifo.custom||foc.custom;LS.set('focus',{...foc,run:foc.run})}
  /* Abzeichen: alles behalten, was einer der beiden Stände hat */
  const iac=P(d.ach);
  if(iac&&typeof ach!=='undefined'){Object.entries(iac.got||{}).forEach(([id,ts])=>{if(!ach.got[id]||ts<ach.got[id])ach.got[id]=ts});const c=iac.c||{};Object.keys(c).forEach(k=>{if(typeof c[k]==='number')ach.c[k]=Math.max(ach.c[k]||0,c[k]);else if(k==='days')ach.c.days={...c.days,...(ach.c.days||{})};else if(!ach.c[k])ach.c[k]=c[k]});LS.set('ach',ach)}

  const ifl=P(d.flags); if(ifl){LS.set('flags',{...ifl,...LS.get('flags',{})})}
  for(const k in d){if(['stats','known','simhist','pet','tab','bk','plan','focus','ach','lmdays','flags'].includes(k))continue;try{if(localStorage.getItem(CFG.key+'.'+k)==null)localStorage.setItem(CFG.key+'.'+k,d[k])}catch(e){}}
  {const v=LS.get('exam',null);if(v)EXAM=new Date(v[0],v[1],v[2])}

}

  const b=LS.get('bk',null), n=bkTotal(), since=b?Math.max(0,n-b.n):n;

  return `<div class="panel bk" id="bkpanel"><span class="label">Fortschritt speichern</span><p class="bkst">${st}</p><div class="bknote"><b>⚠️ Wichtig: Der Code ist nur eine Momentaufnahme!</b> Er speichert deinen Stand von <u>genau jetzt</u>. Alles, was du danach lernst, ist <u>nicht</u> drin – generier nach dem Lernen einfach einen neuen Code und ersetz den alten.</div><p class="hint">Dein Fortschritt liegt nur in diesem Browser. Mit dem Code holst du ihn auf ein anderes Gerät oder zurück, falls er mal weg ist. Beim Einfügen wird nichts gelöscht – pro Frage zählt immer der weitere Stand.</p><div class="actions"><button class="btn accent" data-bk="make">Code generieren, um Fortschritt zu speichern</button><button class="btn ghost" data-bk="load">Code einfügen</button></div><div id="bkbox"></div></div>`;
}
function bkNudge(){const b=LS.get('bk',null),n=bkTotal();return (!b&&n>=20)||(b&&n-b.n>=40)?'<p class="hint">💾 Tipp: Unter <b>Fortschritt</b> kannst du deinen Stand als Code sichern.</p>':''}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-bk]'); if(!b) return; const box=document.getElementById('bkbox'); const a=b.dataset.bk;
  if(a==='make'){
    box.innerHTML='<p class="hint">Code wird erstellt …</p>';
    const code=await bkMake(); LS.set('bk',{d:Date.now(),n:bkTotal()});
    box.innerHTML=`<textarea class="bkcode" id="bkcode" readonly rows="4">${code}</textarea><div class="actions"><button class="btn" data-bk="copy">Kopieren</button><span class="hint" id="bkmsg">Speicher ihn z. B. in deinen Notizen oder schick ihn dir in WhatsApp selbst.</span></div><p class="bkstamp">📸 Momentaufnahme vom ${new Date().toLocaleString('de-AT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} – was du danach lernst, ist nicht enthalten.</p>`;
    const s=document.querySelector('#bkpanel .bkst'); if(s) s.innerHTML='Zuletzt gesichert heute · alles aktuell ✓'; const hs=document.querySelector('.bkhead small'); if(hs) hs.innerHTML='zuletzt heute ✓';
    return}
  if(a==='copy'){
    const ta=document.getElementById('bkcode'), msg=document.getElementById('bkmsg'); let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true}catch(err){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(e2){}}
    if(!ok){ta.focus();ta.select()}
    msg.textContent=ok?'Kopiert ✓ – jetzt irgendwo speichern, wo du ihn wiederfindest.':'Kopieren ging hier nicht automatisch – der Code ist markiert, kopier ihn mit Strg/⌘ C bzw. lange drücken.';
    return}
  if(a==='load'){
    box.innerHTML=`<textarea class="bkcode" id="bkin" rows="4" placeholder="Code hier einfügen (darf auch die ganze WhatsApp-Nachricht sein)"></textarea><div class="actions"><button class="btn accent" data-bk="apply">Fortschritt laden</button><span class="hint" id="bkmsg"></span></div>`;
    document.getElementById('bkin').focus(); return}
  if(a==='apply'){
    const msg=document.getElementById('bkmsg');
    try{const o=await bkRead(document.getElementById('bkin').value);const n=bkMerge(o.d);
      msg.innerHTML=`Geladen ✓ – Stand vom ${new Date(o.t).toLocaleDateString('de-AT')}, ${n} ${n===1?'Frage':'Fragen'} übernommen. Nichts wurde gelöscht.`;
      if(typeof renderCount==='function')renderCount(); if(typeof petHeader==='function')petHeader(); if(typeof focRender==='function')focRender();
      setTimeout(()=>{renderProg();const m2=document.getElementById('bkbox');if(m2)m2.innerHTML=`<p class="hint">Geladen ✓ – ${n} ${n===1?'Frage':'Fragen'} übernommen.</p>`},1200);
    }catch(err){msg.textContent=err.message==='key'?'Dieser Code gehört zu einem anderen Lerntool.':err.message==='browser'?'Dieser Browser kann den Code nicht öffnen – probier Chrome oder ein aktuelles Safari.':'Das sieht nicht wie ein gültiger Code aus. Bitte komplett kopieren.'}
    return}
});

function petFace(m,f){
  const L=100-f.ex,R=100+f.ex,y=f.ey,ec=f.ec||PI,hc=f.hc||'#fff',my=f.my;
  const dot=(x,r=6.5)=>ci(x,y,r,ec,0)+ci(x+2.2,y-2.4,2.2,hc,0);
  const arc=x=>ln(`M${x-7},${y+2} q7,-10 14,0`,ec,3.8);
  const brow=k=>ln(`M${L-9},${y-10-k} L${L+6},${y-14-2*k}`,PI,3)+ln(`M${R-6},${y-14-2*k} L${R+9},${y-10-k}`,PI,3);
  let eyes='',mouth='',extra='';
  if(m==='sleep') eyes=ln(`M${L-7},${y-1} q7,7 14,0`,ec,3.5)+ln(`M${R-7},${y-1} q7,7 14,0`,ec,3.5);
  else if(m==='happy'||m==='yay'||m==='eat') eyes=arc(L)+arc(R);
  else if(m==='oops') eyes=ln(`M${L-6},${y-5} l10,5 l-10,5`,ec,3.5)+ln(`M${R+6},${y-5} l-10,5 l10,5`,ec,3.5);
  else if(m==='sad') eyes=dot(L,5.5)+dot(R,5.5)+brow(1);
  else if(m==='hungry') eyes=dot(L,7)+dot(R,7)+brow(0);
  else eyes=dot(L)+dot(R);
  if(!f.nomouth){
    if(m==='happy'||m==='yay') mouth=pa(`M${f.wide?86:91},${my-1} q${f.wide?14:9},${f.wide?16:13} ${f.wide?28:18},0 z`,'#B8394E',3);
    else if(m==='eat') mouth=`<g class="pchew" style="transform-origin:100px ${my+2}px">${el(100,my+2,6,5,'#B8394E',3)}</g>`;
    else if(m==='hungry') mouth=el(100,my+3,4,5,PI,0);
    else if(m==='sad') mouth=ln(`M93,${my+5} q7,-6 14,0`);
    else if(m==='oops') mouth=ln(`M90,${my+2} q5,-4 10,0 q5,4 10,0`);
    else mouth=f.wide?ln(`M86,${my} q14,11 28,0`):ln(`M93,${my} q3.5,5 7,0 q3.5,5 7,0`);
  }
  if(m==='sad') extra=`<g class="ptear">${pa(`M${R+5},${y+7} q-5,8 0,11 q5,-3 0,-11z`,'#8FD3F4',2.5)}</g>`;
  const cy=f.cy||y+17, cx=f.ex+12;
  return `<g class="peyes" style="transform-origin:100px ${y}px">${eyes}</g>`+el(100-cx,cy,9,5.5,'#FF8FA3',0,` opacity="${m==='sad'?.3:.55}"`)+el(100+cx,cy,9,5.5,'#FF8FA3',0,` opacity="${m==='sad'?.3:.55}"`)+mouth+extra;
}

/* ================== Lern-Haustier · Logik ================== */
/* pet = null (noch nicht entschieden) | {on, sp, name, goal, snacks (Futter gefuttert), stars (⭐ = Geld), owned:[], born, log:{datum:{a,r}}, eq:{head,eyes,neck}, sty:{}, best, sim, seen:[], qhide, gday:{d,s}, hi:{}} */
let pet = LS.get('pet', null);
const savePet = ()=>{if(pet)pet.t=Date.now();LS.set('pet', pet)};
window.lbPetStar=()=>{if(!pet||!pet.on||!pet.sp)return false;pet.stars=(pet.stars||0)+1;savePet();if(typeof petHeader==='function')petHeader();return true};
const petOn = ()=>!!(pet&&pet.on&&pet.sp&&SP[pet.sp]);
const petTabVisible = ()=>!(pet&&pet.on===false);
let petUI = {slot:'head', picking:false, pickSp:null, pickGoal:20, buy:null, game:null};
const dkey = (d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dshift = n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return dkey(d)};
const tlog = ()=>{const k=dkey();pet.log[k]=pet.log[k]||{a:0,r:0};return pet.log[k]};
const pday = k=>(pet.log[k]||{a:0,r:0});
const starVal = q=>(q.alt||q.c===PQ)?2:1;
const petRetro = ()=>Q.reduce((s,q)=>s+((stats[q.id]&&stats[q.id].r)||0)*starVal(q),0);
const GCAP = Infinity; /* kein Tageslimit für ⭐ aus Spielen (Maximas Wunsch) */
/* Umstellung von der ersten Version (ohne Sterne) */
if(pet&&pet.sp&&pet.stars==null){pet.stars=petRetro();pet.owned=[...new Set([...ACC.filter(a=>a.pr===0).map(a=>a.id),...Object.values(pet.eq||{}).filter(Boolean).map(e=>e.id)])];pet.hi={};savePet()}
if(pet&&pet.sp){pet.hi=pet.hi||{};pet.owned=pet.owned||[];pet.sty=pet.sty||{}}
/* Preise passen sich ans Fach an: Fragenanzahl + Tage bis zur (eigenen) Prüfung, festgelegt beim Start bzw. beim Ändern des Prüfungstermins */
const petNQ = ()=>Q.filter(q=>MAIN.has(q.c)||q.c===PQ).length;
function petScale(){const d=Math.max(1,examDays());const budget=Math.min(d*20,petNQ()*2)*1.05;return Math.max(.25,Math.min(1.5,+(budget/400).toFixed(2)))}
const petStreakReqCalc = ()=>Math.max(2,Math.min(5,Math.round(Math.max(1,examDays())/2)));
const petStreakReq = ()=>pet&&pet.streakReq||5;
const accPr = a=>a.pr==null?null:a.pr===0?0:Math.max(5,Math.round(a.pr*((pet&&pet.scale)||1)/5)*5);
function petStreak(){let s=0,i=pday(dshift(0)).a>=pet.goal?0:1;for(;i<400;i++){if(pday(dshift(i)).a>=pet.goal)s++;else break}return s}
function petMood(){
  /* setzt sich jeden Tag zurück: morgens hungrig, ab halbem Tagesziel zufrieden, Ziel geschafft = glücklich; 2+ Tage gar nix gelernt = traurig */
  const a=pday(dshift(0)).a, t=a/pet.goal; if(t>=1) return 'happy'; if(t>=.5) return 'content';
  if(a>0) return 'hungry';
  let i=1; for(;i<60;i++){const k=dshift(i);if(pday(k).a>0||k<pet.born)break}
  return i>=3?'sad':'hungry';
}
const examDays = ()=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((EXAM-t)/864e5)};
function petBaseMood(){if(typeof focusPhase==='function'){const fp=focusPhase();if(fp==='break'||fp==='long')return 'sleep'}const d=examDays();return d<=0&&d>-3?'happy':petMood()}
const pick = a=>a[Math.floor(Math.random()*a.length)];
const goalVal = id=>{const e=document.getElementById(id);const n=e?parseInt(e.value,10):NaN;return n>0?Math.max(1,Math.min(200,n)):null};
function petLine(){
  const S=SP[pet.sp], m=petMood(), d=examDays(), left=Math.max(0,pet.goal-pday(dshift(0)).a), st=petStreak();
  if(d===0) return 'Heute ist Prüfung! Tief durchatmen – du kannst das. Ich drück dir alle Daumen.';
  if(d<0) return 'Prüfung vorbei – ich bin so stolz auf dich! 🎉';
  if(d===1) return 'Morgen ist Prüfung! Heute nur noch wiederholen und früh schlafen gehen.';
  const L={
    happy:['Tagesziel geschafft! Ich bin kugelrund.',`So viele ${S.foods}! Heute läuft’s richtig gut bei dir.`,'Ich bin satt und mega stolz auf dich.',`Noch ${d} Tage bis zur Prüfung – mit so einem Tag kein Problem.`,'Lust auf eine Runde Begriff-Blitz?'],
    content:[`Schon halb satt! Noch ${left} Fragen bis zum Tagesziel.`,'Eine kleine Quizrunde? Ich hätte Appetit.',`${S.foods} wären jetzt fein. Nur so als Idee.`,`Noch ${d} Tage bis zur Prüfung. Wir schaffen das.`],
    hungry:[`Guten Morgen … mein Bauch knurrt! ${left} Fragen und ich bin satt.`,`Mein Bauch knurrt … ${left} Fragen und ich bin satt.`,`Hast du ein paar ${S.foods} für mich? Jede richtige Antwort zählt.`,'Ich warte schon auf dich. Nur ein paar Fragen?'],
    sad:['Ich hab dich vermisst. Magst du mit 5 Fragen anfangen?','Schon ein paar Tage nix gelernt … ich bin ein bisschen traurig.','Komm, gemeinsam schaffen wir das. Eine Runde?']
  }[m];
  if(st>=2&&Math.random()<.35) return `${st} Tage am Stück geschafft! 🔥 Weiter so.`;
  return pick(L);
}

/* Lückenfüller – aus Lückentext-Fragen + markierten Begriffen in den Karteikarten */
function gapItems(){
  const out=[], gq=Q.filter(q=>q.t==='gap'&&(MAIN.has(q.c)||q.c===PQ)), ga=[...new Set(gq.map(q=>q.a[0]))];
  gq.forEach(q=>{const d=shuffle(ga.filter(a=>norm(a)!==norm(q.a[0]))).slice(0,3);if(d.length===3)out.push({h:fmt(q.q).replace('___','<span class="gblank">____</span>'),a:q.a[0],o:shuffle([q.a[0],...d]),e:fmt(q.e||'')})});
  const bolds=[]; CARDS.forEach(c=>{(c[2].match(/\*\*(.+?)\*\*/g)||[]).forEach(m=>{const w=m.slice(2,-2);if(w.length>=2&&w.length<=40)bolds.push({c,w})})});
  shuffle(bolds).slice(0,40).forEach(({c,w})=>{
    const isNum=/\d/.test(w), pool=bolds.filter(x=>x.w!==w&&norm(x.w)!==norm(w)&&/\d/.test(x.w)===isNum&&Math.abs(x.w.length-w.length)<16);
    const same=pool.filter(x=>x.c[0]===c[0]), d=[...new Set([...shuffle(same),...shuffle(pool)].map(x=>x.w))].slice(0,3); if(d.length<3) return;
    const h=fmt(c[2].replace('**'+w+'**','§§')).replace('§§','<span class="gblank">____</span>');
    out.push({h:`<b class="gterm">${esc(c[1])}</b>${h}`,a:w,o:shuffle([w,...d]),e:fmt(c[2])});
  });
  return shuffle(out).slice(0,10);
}

function planOrd(id){const m=id.match(/^([rqf])(\d+)$/);if(m)return +m[2]*10+'rqf'.indexOf(m[1]);const g={alt:9000,pq:9001,sim:9002,lm:9003,sp:9004}[id];return g!=null?g:9100}

/* Pflicht im Vorschlag / „Noch nicht eingeplant“: nur Lernzettel + Quiz je Kapitel. Fehler wiederholen, Altfragen, Prüfungsfragen sind optional (nur per ✎) */
function planCatalog(){return CHM.flatMap(c=>['r'+c.id,'q'+c.id])}
function planRange(){const t=dkey(),ex=dkey(EXAM),days=[];for(let k=t;k<ex;k=dAdd(k,1))days.push(k);return {today:t,ex,days}}

/* Vorschlag: füllt alle nicht selbst bearbeiteten Tage ab heute */
/* „Rest automatisch verteilen“: alles Offene in die bestehenden Tage einsortieren (auch selbst bearbeitete), nach Kapiteln in Reihenfolge, gleichmäßig nach Zeit */
function planRest(){

function lmPool(){
  const weak=Q.filter(q=>(MAIN.has(q.c)||q.c===PQ)&&stats[q.id]&&stats[q.id].w>0).sort((a,b)=>(stats[b.id].w-stats[b.id].r)-(stats[a.id].w-stats[a.id].r)).slice(0,15);
  const alt=Q.filter(q=>q.alt&&MAIN.has(q.c)).sort((a,b)=>((stats[b.id]&&stats[b.id].last==='w')?1:0)-((stats[a.id]&&stats[a.id].last==='w')?1:0));
  const pq=Q.filter(q=>q.c===PQ&&!(stats[q.id]&&stats[q.id].r>0)).slice(0,15);
  const seen=new Set(), out=[]; [...weak,...alt,...pq].forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);out.push(q)}});
  return out.slice(0,45);
}

const ACHT={b:'Bronze',s:'Silber',g:'Gold',x:'Spezial'}, ACHR={b:3,s:6,g:12,x:10};
function achOnAnswer(ok,q){
  const c=ach.c, h=new Date().getHours(), k=dkey();
  c.rowBefore=c.row||0; c.row=ok?(c.row||0)+1:0; c.best=Math.max(c.best||0,c.row);
  c.wrow=ok?0:(c.wrow||0)+1; c.worst=Math.max(c.worst||0,c.wrow);
  if(h>=4&&h<7)c.early=1; if(h>=23||h<4)c.night=1; if(h<3)c.midnight=1;
  c.days=c.days||{}; c.days[k]=(c.days[k]||0)+1; const ks=Object.keys(c.days).sort(); if(ks.length>60)delete c.days[ks[0]];
  if(ok&&quiz.prev&&quiz.prev.last==='w') c.fixed=(c.fixed||0)+1;
  saveAch();
}

let achT=null; function achSoon(){clearTimeout(achT);achT=setTimeout(achCheck,350)}
function achCheck(){
  if(petHas()&&pet.on){const m=petMood();if(m==='sad')ach.c.wasSad=1;if(ach.c.wasSad&&m==='happy')ach.c.comeback=1}
  if(examDays()===0) ach.c.examday=1;
  const neu=ACH.filter(a=>!ach.got[a.id]&&(()=>{try{return a.f()}catch(e){return false}})());
  if(!neu.length){saveAch();return}
  let st=0; neu.forEach(a=>{ach.got[a.id]=Date.now();st+=Math.max(1,Math.round(ACHR[a.t]*((petHas()&&pet.scale)||1)))});
  saveAch();
  const withPet=typeof petOn==='function'&&petOn();
  if(withPet){pet.stars+=st;savePet()}
  const t=document.getElementById('ptoast'); if(!t) return;
  t.innerHTML=`<span class="achst t-${neu[0].t}"><span>${neu[0].ic}</span></span><span>${neu.length===1?`Neues Abzeichen: <b>${esc(neu[0].n)}</b>`:`<b>${neu.length} neue Abzeichen</b>: ${neu.slice(0,4).map(a=>esc(a.n)).join(', ')}${neu.length>4?' …':''}`}${withPet?` · +${st} ⭐`:''}</span>`;
  t.hidden=false; t.classList.remove('in'); void t.offsetWidth; t.classList.add('in');
  clearTimeout(petTT); petTT=setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.hidden=true,300)},4800);
  if(LS.get('tab')==='pet'&&typeof petUI!=='undefined'&&!petUI.game&&!petUI.picking&&document.activeElement?.tagName!=='INPUT') renderPet();
}
function achSticker(a,got){return `<span class="achst t-${a.t}${got?'':' off'}" title="${esc(a.n)}"><span>${got||!a.sec?a.ic:'?'}</span></span>`}
function badgeRow(){

  return `<div class="panel achp"><div class="achhead"><h3>Abzeichen</h3><span class="achcount"><b>${got}</b> von ${ACH.length} gesammelt</span></div><span class="bar achbar"><i style="width:${Math.round(got/ACH.length*100)}%"></i></span>

   ${groups.map(g=>`<div class="achg"><span class="mono">${g}</span><div class="achgrid">${ACH.filter(a=>a.g===g).map(a=>{const ok=!!ach.got[a.id];return `<div class="achi${ok?'':' off'}">${achSticker(a,ok)}<b>${ok||!a.sec?esc(a.n):'Geheim'}</b><small>${ok||!a.sec?esc(a.d):'Wird erst beim Freischalten verraten.'}</small><em>${ACHT[a.t]}${ok?' · '+new Date(ach.got[a.id]).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'}):''}</em></div>`}).join('')}</div></div>`).join('')}</div>`;
}

function bkHead(){const b=LS.get('bk',null),n=bkTotal(),since=b?Math.max(0,n-b.n):n;

  return `<div class="proghead"><span class="label">Dein Fortschritt</span><div class="bkhead"><small>${st}</small><button class="btn ghost" data-bkt="1">💾 Code generieren, um Fortschritt zu speichern</button></div></div><div id="bkwrap" hidden>${backupRow()}</div>`}

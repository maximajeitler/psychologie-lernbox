  v.innerHTML = petInvite()+planStrip()+`<div class="qtiles">${lmTile()}${Q.some(q=>q.c===PQ)?`<div class="panel simcard"><div><span class="label">Prüfungssimulation</span><h2>${SIM_N} Fragen · ${SIM_MIN} Minuten · wie in der Prüfung</h2><p class="hint">Zufällig aus ${Q.filter(q=>q.c===PQ).length} neuen Prüfungsfragen. Keine Rückmeldung während der Simulation – du kannst vor- und zurückspringen und Antworten ändern. Auswertung mit Lösungen am Ende.${sh.length?` Letzter Versuch: <b>${sh[sh.length-1].r}/${sh[sh.length-1].n}</b> · bester: <b>${Math.max(...sh.map(x=>x.r))}/${SIM_N}</b>`:''}</p></div><button class="btn accent" id="simgo">Simulation starten</button></div>`:''}
  <div class="panel simcard"><div><span class="label">Fragenkatalog</span><h2>Alle ${Q.length} Fragen zum Durchlesen</h2><p class="hint">Einfach durchscrollen, ohne zu antworten: Alle Fragen nach Kapitel, die richtige Antwort ist grün markiert, die Erklärung steht gleich darunter. Mit „Antworten verdecken“ kannst du dich dabei auch selbst abfragen.</p></div><button class="btn" id="brgo">Alle Fragen ansehen</button></div></div>
  <div class="panel setup">
   <div><h2>Quiz</h2></div>
   <div><div class="label">Kapitel (mehrere möglich)</div><div class="chips" id="qch">
     <button class="chip" data-c="0" aria-pressed="${!setup.ch.length}">Alle ${RANGE}</button>
     ${CH.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${setup.ch.includes(c.id)}"><span class="mono">K${c.id}</span>${esc(c.s)}</button>`).join('')}
     ${CFG.bonus.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${setup.ch.includes(c.id)}"><span class="mono">K${c.id}</span>${esc(c.s)}</button>`).join('')}
     ${Q.some(q=>q.c===PQ)?`<button class="chip" data-c="${PQ}" aria-pressed="${setup.ch.includes(PQ)}"><span class="mono">P</span>Prüfungsfragen</button>`:''}
   </div></div>
   <div><div class="label">Auswahl</div><div class="seg" id="qf">
     ${[['all','Alle Fragen'],['alt','Nur Altfragen'],['wrong','Zuletzt falsch ('+wrongN+')'],['rep','Nochmals wiederholen ('+repN+')'],['new','Noch nie beantwortet']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${setup.filter===k}">${l}</button>`).join('')}
   </div>
   <p class="hint fhint">${FHINT[setup.filter]||''}</p>
   <details class="hint fhelp"><summary>So funktionieren „Zuletzt falsch“ und „Nochmals wiederholen“</summary>
    <ol>
     <li>Du beantwortest eine Frage <b>falsch</b> → sie landet in <b>Zuletzt falsch</b>.</li>
     <li>Du übst „Zuletzt falsch“ und hast sie jetzt <b>richtig</b> → sie wandert nach <b>Nochmals wiederholen</b>. Dort muss sie noch ${REP}× richtig sein, damit du sicher bist, dass es kein Glückstreffer war – dann ist sie fertig.</li>
     <li>Ist sie in „Nochmals wiederholen“ wieder <b>falsch</b> → zurück zu „Zuletzt falsch“.</li>
     <li>Mit <b>↻ Nochmals wiederholen merken</b> (Taste M) legst du auch Fragen dorthin, die du zwar richtig hattest, bei denen du aber unsicher warst. Die bleiben drin, bis du sie selbst wieder entfernst.</li>

  </div>`;
  v.querySelectorAll('#qch button').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(!c)setup.ch=[];else setup.ch=setup.ch.includes(c)?setup.ch.filter(x=>x!==c):[...setup.ch,c];renderSetup()});
  v.querySelectorAll('#qf button').forEach(b=>b.onclick=()=>{setup.filter=b.dataset.f;renderSetup()});
  v.querySelectorAll('#qt button').forEach(b=>b.onclick=()=>{setup.type=b.dataset.t;renderSetup()});
  v.querySelectorAll('#qn button').forEach(b=>b.onclick=()=>{setup.n=+b.dataset.n;renderSetup()});
  document.getElementById('qgo').onclick=startQuiz;

let browse = {on:false, ch:[], f:'all', s:'', hide:LS.get('bhide',false)};
const isUnsure = q => /nicht in deinen Unterlagen|abgeleitet|ohne Lösung/.test(q.e||'');
const BF = [['all','Alle'],['alt','Nur Altfragen'],['pq','Nur Prüfungsfragen'],['wrong','Schon mal falsch'],['unsure','Unsichere Lösung']];
function browsePool(){

  if(s.length>=2) p=p.filter(q=>fold(plain([q.q,...(q.o||[]),...(Array.isArray(q.a)&&q.t==='gap'?q.a:[]),q.e||''].join(' '))).includes(s));
  return p;
}
function renderBQ(q,n){
  const st=stats[q.id];

  if(q.t==='tf') body=`<div class="tf">${[true,false].map(v=>`<div class="opt${q.a===v?' ok':''}">${v?'Stimmt':'Stimmt nicht'}${q.a===v?'<span class="why">✓ Richtig</span>':''}</div>`).join('')}</div>`;
  if(q.t==='gap') body=`<p class="bsol">Lösung: ${q.a.map(esc).join(' / ')}</p>`;
  const typ={mc:'Multiple Choice',ms:'Mehrere richtig',tf:'Stimmt / Stimmt nicht',gap:'Lückentext'}[q.t];
  const stl=st?`<span class="tag st" title="Deine bisherigen Antworten">${st.r}× richtig · ${st.w}× falsch${st.last==='w'?' · zuletzt falsch':''}</span>`:'';
  return `<article class="bq" data-id="${q.id}">
    <div class="qmeta"><span class="mono" style="color:var(--muted)">${n}</span>${q.c===PQ?`<span class="tag">Prüfungsfrage · K${q.k}</span>`:''}${q.alt?'<span class="tag alt">Altfrage</span>':''}${isUnsure(q)?'<span class="tag unsure">Lösung unsicher</span>':''}<span class="tag">${typ}</span>${stl}</div>
    <p class="qtext">${fmt(q.q)}</p>${body}
    ${q.e?`<p class="bexp">${fmt(q.e)}</p>`:''}
    <div class="bfoot"><button class="btn breveal" type="button" data-rev="${q.id}">Lösung zeigen</button>${pinBtn(q.id)}</div>
  </article>`;
}
function renderBList(){

function renderBrowse(){

  v.innerHTML=`<div class="browse">

function feedback(ok,q,extra){

  const sol = solText(q);
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Richtig':'Leider falsch'}</strong>${ok?'':`<p>Lösung: <b>${fmt(sol)}</b></p>`}<p>${fmt(q.e)}</p>${repNote()}${extra||''}${!ok&&q.t!=='gap'?'<p><button class="btn ghost" id="override" type="button" title="Taste R">Ich hatte eigentlich recht (verdrückt)</button></p>':''}</div>`;

  document.getElementById('qnext').focus({preventScroll:true});

function toggleMS(b){if(quiz.answered)return;const on=!b.classList.contains('sel');b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on)}
function answerMS(){if(quiz.answered)return;const q=quiz.list[quiz.i];let ok=true;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const bi=+b.dataset.i,sel=b.classList.contains('sel'),right=(q.t==='mc'?[q.a]:q.a).includes(bi);b.classList.remove('sel');if(right&&sel)b.classList.add('ok');else if(right){b.classList.add('miss');b.lastElementChild.insertAdjacentHTML('beforeend','<span class="why">Nicht angekreuzt – wäre richtig</span>');ok=false}else if(sel){b.classList.add('no');b.lastElementChild.insertAdjacentHTML('beforeend','<span class="why">Falsch angekreuzt</span>');ok=false}});const ms=document.getElementById('mscheck');if(ms)ms.remove();feedback(ok,q)}

function answerGap(val){if(quiz.answered)return;const q=quiz.list[quiz.i];const n=norm(val);const ok=!!n&&q.a.some(a=>norm(a)===n);const inp=document.getElementById('gin');inp.disabled=true;inp.classList.add(ok?'ok':'no');document.querySelectorAll('#gf button').forEach(b=>b.disabled=true);feedback(ok,q,(!ok&&n)?'<p><button class="btn ghost" id="override" type="button">Meine Antwort war richtig</button></p>':'')}
function next(){quiz.i++; if(quiz.i>=quiz.list.length) finish(); else renderQ(); window.scrollTo({top:0})}

let sim=null, simTimer=null;
const SIM_N=(CFG.sim&&CFG.sim.n)||30, SIM_MIN=(CFG.sim&&CFG.sim.min)||30;
function startSim(){
  browse.on=false;

const simLeft=()=>Math.max(0,sim.end-Date.now());
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const simAnswered=i=>{const a=sim.ans[i];return Array.isArray(a)?a.length>0:a!==null};
function simTick(){
  if(!sim||sim.done){clearInterval(simTimer);return}
  const el=document.getElementById('simclock'); const left=simLeft();
  if(el){el.textContent=mmss(left);el.classList.toggle('low',left<5*60000)}
  if(left<=0) simFinish(true);

function renderSim(){
  const v=document.getElementById('v-quiz'); const q=sim.list[sim.i]; const a=sim.ans[sim.i];

  if(q.t==='tf') body=`<div class="tf"><button class="opt${a===true?' sel':''}" data-v="1" aria-pressed="${a===true}">Stimmt</button><button class="opt${a===false?' sel':''}" data-v="0" aria-pressed="${a===false}">Stimmt nicht</button></div>`;
  v.innerHTML=`<div class="stage panel">
    <div class="qmeta"><span class="tag alt">Prüfungssimulation</span><span class="tag">${q.t==='tf'?'Stimmt / Stimmt nicht':'Multiple Choice'}</span><span class="simclock" id="simclock">${mmss(simLeft())}</span><span class="mono" style="color:var(--muted)">Frage ${sim.i+1}/${sim.list.length} · ${n} beantwortet</span></div>
    <p class="qtext">${fmt(q.q)}</p>${body}
    <div class="actions"><button class="btn ghost" id="simprev" ${sim.i?'':'disabled'}>← Zurück</button><button class="btn" id="simnext">${sim.i+1<sim.list.length?'Weiter →':'Zur Übersicht'}</button><button class="btn accent" id="simsubmit">${sim.confirm?`Wirklich abgeben? ${sim.list.length-n} offen – nochmal tippen`:'Abgeben'}</button><span class="hint">${q.t==='tf'?'Tasten J / N':'Kreuz an, was stimmt (eine oder mehrere) · Tasten A–'+'ABCDEF'[q.o.length-1]} · ← → blättern</span></div>
    <div class="simgrid">${sim.list.map((_,i)=>`<button data-j="${i}" class="${simAnswered(i)?'done':''}${i===sim.i?' cur':''}">${i+1}</button>`).join('')}</div>
  </div>`;
  if(q.t==='tf') v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>simTF(b.dataset.v==='1'));
  else v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>simToggle(+b.dataset.i));

function simGo(i){if(i<0||i>=sim.list.length)return;sim.i=i;sim.confirm=false;renderSim()}
function simToggle(oi){const a=sim.ans[sim.i];const k=a.indexOf(oi);if(k>=0)a.splice(k,1);else a.push(oi);sim.confirm=false;renderSim()}
function simTF(v){sim.ans[sim.i]=sim.ans[sim.i]===v?null:v;sim.confirm=false;renderSim()}
function simCorrect(q,a){

function simFinish(timeout){

   <div class="chips">${Object.keys(byK).sort().map(k=>`<span class="chip"><span class="mono">K${k}</span>${esc(CHNAME[k])} · ${byK[k][0]}/${byK[k][1]}</span>`).join('')}</div>
   <div class="actions"><button class="btn accent" id="simagain">Neue Simulation</button><button class="btn" id="simwrong" ${right<res.length?'':'disabled'}>Falsche als Quiz üben</button><button class="btn ghost" id="simback">Zum Quiz</button></div>
   <div class="simreview">${res.map((r,i)=>`<div class="${r.ok?'ok':'no'}"><span class="mono">${i+1} · ${r.ok?'richtig':r.open?'nicht beantwortet':'falsch'} · K${r.q.k}</span><div class="sq">${fmt(r.q.q)}</div>${r.ok?'':`<div class="ya">Deine Antwort: ${fmt(yours(r))}</div>`}<div class="a">Lösung: ${fmt(solText(r.q))}</div><div class="hint">${fmt(r.q.e)}</div><div>${pinBtn(r.q.id)}</div></div>`).join('')}</div></div>`;
  const wr=res.filter(r=>!r.ok).map(r=>r.q);
  document.getElementById('simagain').onclick=startSim;
  document.getElementById('simback').onclick=renderSetup;

const fold = s => String(s).split('').map(c=>{const d=c.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();return d.length===1?d:c}).join('');
const plain = s => String(s).replace(/\*\*/g,'').replace(/^§/,'');
const itemText = x => typeof x==='string'?plain(x):x.warn?plain(x.warn):x.neu?plain(x.neu):x.tbl?x.tbl.map(r=>r.map(plain).join(' · ')).join(' / '):'';
const qSol = q => q.t==='mc'?q.o[q.a]:q.t==='ms'?q.a.map(i=>q.o[i]).join(' · '):q.t==='tf'?(q.a?'Stimmt':'Stimmt nicht'):q.a[0];
const SIDX = [];
CH.forEach(c=>c.sec.forEach((s,si)=>{SIDX.push({k:'l',c:c.id,si,h:s.h,t:s.h});s.b.forEach(x=>{const t=itemText(x);if(t)SIDX.push({k:'l',c:c.id,si,h:s.h,t})})}));
CARDS.forEach(x=>SIDX.push({k:'k',c:x[0],h:x[1],t:plain(x[2])}));
Q.filter(q=>q.c!==PQ).forEach(q=>SIDX.push({k:'q',c:q.c,h:plain(q.q),t:plain(q.q)+' '+plain(qSol(q)),q}));
SIDX.forEach(r=>{r.f=fold(r.t);r.hf=fold(r.h)});
function hl(t,qf){const f=fold(t);let out='',last=0,i=f.indexOf(qf);while(i>=0){out+=esc(t.slice(last,i))+'<span class="hit">'+esc(t.slice(i,i+qf.length))+'</span>';last=i+qf.length;i=f.indexOf(qf,last)}return out+esc(t.slice(last))}
function snip(t,qf){const i=fold(t).indexOf(qf);if(i<0||t.length<=200)return hl(t,qf);const a=Math.max(0,i-70),b=Math.min(t.length,i+qf.length+120);return (a?'… ':'')+hl(t.slice(a,b),qf)+(b<t.length?' …':'')}
const sq=document.getElementById('sq'), sres=document.getElementById('sres');
document.getElementById('skbd').textContent=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘F':'Strg F';
let lastHits=[];
function runSearch(){
  const raw=sq.value.trim(), qf=fold(raw);
  if(qf.length<2){sres.hidden=true;sres.innerHTML='';lastHits=[];clearHits();return}
  const hits=SIDX.filter(r=>r.f.includes(qf)||r.hf.includes(qf));
  lastHits=hits;
  const lim={l:40,k:20,q:20};
  const grp=[['l','Lernzettel'],['k','Karteikarten'],['q','Quizfragen']].map(([k,l])=>{
    const g=hits.filter(r=>r.k===k); if(!g.length) return '';
    const items=g.slice(0,lim[k]).map(r=>{
      if(k==='l') return `<button class="shit" data-c="${r.c}" data-si="${r.si}"><span class="mono">K${r.c} · ${esc(r.h)}</span><span>${snip(r.t,qf)}</span></button>`;
      if(k==='k') return `<div class="shit"><span class="mono">Karte · K${r.c}</span><span><b>${hl(r.h,qf)}</b> – ${hl(r.t,qf)}</span></div>`;
      return `<div class="shit"><span class="mono">Quiz · K${r.c}${r.q.alt?' · Altfrage':''}</span><span>${hl(plain(r.q.q),qf)}</span><span class="sol">Lösung: ${hl(plain(qSol(r.q)),qf)}</span></div>`;
    }).join('');
    return `<div class="sgrp"><span class="label">${l} · ${g.length}</span>${items}${g.length>lim[k]?`<p class="smore">… und ${g.length-lim[k]} weitere. Genauer suchen grenzt ein.</p>`:''}</div>`;
  }).join('');
  sres.innerHTML = grp || `<p class="sempty">Nichts gefunden für „${esc(raw)}“.</p>`;
  sres.hidden=false;
  sres.querySelectorAll('button.shit').forEach(b=>b.onclick=()=>jumpTo(+b.dataset.c,+b.dataset.si,raw));
}
function clearHits(){const r=document.getElementById('chapter');r.querySelectorAll('.hit').forEach(s=>s.replaceWith(s.textContent));r.normalize()}
function markHits(raw){
  clearHits();
  const qf=fold(raw); if(qf.length<2) return;
  const root=document.getElementById('chapter'); const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue,f=fold(t);let i=f.indexOf(qf);if(i<0)return;const frag=document.createDocumentFragment();let last=0;
    while(i>=0){frag.append(t.slice(last,i));const s=document.createElement('span');s.className='hit';s.textContent=t.slice(i,i+qf.length);frag.append(s);last=i+qf.length;i=f.indexOf(qf,last)}
    frag.append(t.slice(last));n.replaceWith(frag)});
}
function jumpTo(c,si,raw){

/* ================== Fortschritt sichern (Code zum Abspeichern, nur Schnappschuss) ================== */
function bkDump(){const o={},p=CFG.key+'.';try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p)&&k!==p+'bk'&&k!==p+'tab')o[k.slice(p.length)]=localStorage.getItem(k)}}catch(e){}return o}
const b64u=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
async function bkMake(){
  const raw=new TextEncoder().encode(JSON.stringify({k:CFG.key,t:Date.now(),d:bkDump()}));
  if(typeof CompressionStream!=='undefined'){try{const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'LB1.'+CFG.key+'.'+b64u(await new Response(st).arrayBuffer())}catch(e){}}
  return 'LB0.'+CFG.key+'.'+b64u(raw);
}
async function bkRead(code){
  const m=String(code).replace(/\s+/g,'').match(/(LB[01])\.([A-Za-z0-9_-]+?)\.([A-Za-z0-9_-]{8,})/);
  if(!m) throw new Error('format'); if(m[2]!==CFG.key) throw new Error('key');
  let bytes=ub64(m[3]);
  if(m[1]==='LB1'){if(typeof DecompressionStream==='undefined')throw new Error('browser');const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer())}
  const o=JSON.parse(new TextDecoder().decode(bytes)); if(!o||o.k!==CFG.key||!o.d) throw new Error('format'); return o;
}
/* Zusammenführen: nie etwas löschen – pro Frage zählt der weitere Stand */
function bkMerge(d){
  const P=x=>{try{return JSON.parse(x)}catch(e){return null}}; let n=0;
  const is=P(d.stats)||{}; for(const id in is){const a=stats[id],b=is[id];if(!b)continue;const na=a?(a.r||0)+(a.w||0):-1,nb=(b.r||0)+(b.w||0);if(nb>na){stats[id]=b;n++}} saveStats();
  const ik=P(d.known)||{}; card.known={...ik,...card.known}; LS.set('known',card.known);
  const ih=P(d.simhist)||[], lh=LS.get('simhist',[]); LS.set('simhist',[...lh,...ih.filter(x=>!lh.some(y=>y.d===x.d))].sort((a,b)=>a.d-b.d).slice(-20));
  const ip=P(d.pet);
  if(ip&&typeof pet!=='undefined'){const lp=pet; if(!lp||!lp.sp||(ip.sp&&((ip.t||lp.t)?(ip.t||0)>(lp.t||0):((ip.stars||0)+(ip.snacks||0))>((lp.stars||0)+(lp.snacks||0))))){pet=ip;LS.set('pet',ip);if(typeof petHeader==='function')petHeader()}}
  /* Lernplan: bei leerem Plan übernehmen, sonst zusammenführen (Erledigtes, Tage, eigene Aufgaben) */
  const ipl=P(d.plan);
  if(ipl&&typeof plan!=='undefined'){
    /* Der Code ist der gespeicherte Stand: sein Lernplan wird komplett übernommen, Erledigtes aus beiden bleibt erhalten */
    if(ipl.v2&&ipl.made){const loc=plan||{};plan={...ipl,done:{...(loc.done||{}),...(ipl.done||{})},ok:{...(loc.ok||{}),...(ipl.ok||{})},custom:{...(loc.custom||{}),...(ipl.custom||{})}};if(typeof planEdit!=='undefined')planEdit=null}
    if(ipl.off&&!plan.made)plan.off=true;
    LS.set('plan',plan); if(typeof planTabSync==='function')planTabSync();
  }
  /* Fokus-Timer: Runden/Minuten zusammenführen, Einstellungen behalten */
  const ifo=P(d.focus);
  if(ifo&&typeof foc!=='undefined'){foc.rounds=Math.max(foc.rounds||0,ifo.rounds||0);foc.cycles=Math.max(foc.cycles||0,ifo.cycles||0);Object.entries(ifo.byDay||{}).forEach(([k,m])=>{foc.byDay[k]=Math.max(foc.byDay[k]||0,m)});if(!LS.get('focus',null))foc.mode=ifo.mode||foc.mode,foc.custom=ifo.custom||foc.custom;LS.set('focus',{...foc,run:foc.run})}
  /* Abzeichen: alles behalten, was einer der beiden Stände hat */
  const iac=P(d.ach);
  if(iac&&typeof ach!=='undefined'){Object.entries(iac.got||{}).forEach(([id,ts])=>{if(!ach.got[id]||ts<ach.got[id])ach.got[id]=ts});const c=iac.c||{};Object.keys(c).forEach(k=>{if(typeof c[k]==='number')ach.c[k]=Math.max(ach.c[k]||0,c[k]);else if(k==='days')ach.c.days={...c.days,...(ach.c.days||{})};else if(!ach.c[k])ach.c[k]=c[k]});LS.set('ach',ach)}
  /* Last-Minute-Tage + Flags vereinigen */
  const ilm=P(d.lmdays); if(Array.isArray(ilm)){LS.set('lmdays',[...new Set([...LS.get('lmdays',[]),...ilm])].sort().slice(-30))}
  const ifl=P(d.flags); if(ifl){LS.set('flags',{...ifl,...LS.get('flags',{})})}
  for(const k in d){if(['stats','known','simhist','pet','tab','bk','plan','focus','ach','lmdays','flags'].includes(k))continue;try{if(localStorage.getItem(CFG.key+'.'+k)==null)localStorage.setItem(CFG.key+'.'+k,d[k])}catch(e){}}
  {const v=LS.get('exam',null);if(v)EXAM=new Date(v[0],v[1],v[2])}
  return n;
}

function petFace(m,f){
  const L=100-f.ex,R=100+f.ex,y=f.ey,ec=f.ec||PI,hc=f.hc||'#fff',my=f.my;
  const dot=(x,r=6.5)=>ci(x,y,r,ec,0)+ci(x+2.2,y-2.4,2.2,hc,0);
  const arc=x=>ln(`M${x-7},${y+2} q7,-10 14,0`,ec,3.8);
  const brow=k=>ln(`M${L-9},${y-10-k} L${L+6},${y-14-2*k}`,PI,3)+ln(`M${R-6},${y-14-2*k} L${R+9},${y-10-k}`,PI,3);
  let eyes='',mouth='',extra='';
  const star=x=>{const p=[];for(let i=0;i<10;i++){const r=i%2?4.2:10,an=-Math.PI/2+i*Math.PI/5;p.push((x+r*Math.cos(an)).toFixed(1)+','+(y+r*Math.sin(an)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="#FFD23F" stroke="${PI}" stroke-width="2.2" stroke-linejoin="round"/>`};
  const heart=x=>pa(`M${x},${y+8} C${x-13},${y-1} ${x-8},${y-12} ${x},${y-5} C${x+8},${y-12} ${x+13},${y-1} ${x},${y+8} Z`,'#F2557A',2.4);
  const spiral=x=>ln(`M${x},${y} m-1,0 a1.5,1.5 0 1,1 3,0 a3.5,3.5 0 1,1 -6.5,0.5 a5.5,5.5 0 1,1 11,-1 a7.5,7.5 0 1,1 -14,1.5`,ec,2.6);
  const big=x=>ci(x,y,9.5,'#fff',2.6)+ci(x,y+1,3.8,ec,0);
  const lid=x=>ci(x,y+1,6,ec,0)+pa(`M${x-8},${y-1} L${x+8},${y-1} L${x+8},${y-9} L${x-8},${y-9} Z`,f.lid||'transparent',0)+ln(`M${x-8},${y-1} L${x+8},${y-1}`,ec,3.2);
  const shut=x=>ln(`M${x-7},${y+2} L${x+7},${y+2}`,ec,3.6);
  if(m==='star') eyes=star(L)+star(R);
  else if(m==='love') eyes=heart(L)+heart(R);
  else if(m==='dizzy') eyes=spiral(L)+spiral(R);
  else if(m==='wink') eyes=dot(L)+arc(R);
  else if(m==='shock') eyes=big(L)+big(R);
  else if(m==='sleepy') eyes=shut(L)+shut(R);
  else if(m==='cry') eyes=arc(L)+arc(R);
  else if(m==='smug') eyes=lid(L)+lid(R)+ln(`M${L-9},${y-12} L${L+6},${y-9}`,PI,3)+ln(`M${R-6},${y-9} L${R+9},${y-12}`,PI,3);
  else if(m==='focus') eyes=dot(L,6)+dot(R,6)+ln(`M${L-9},${y-15} L${L+7},${y-10}`,PI,3.4)+ln(`M${R-7},${y-10} L${R+9},${y-15}`,PI,3.4);
  else if(m==='happy'||m==='yay'||m==='eat'||m==='party') eyes=arc(L)+arc(R);
  else if(m==='oops') eyes=ln(`M${L-6},${y-5} l10,5 l-10,5`,ec,3.5)+ln(`M${R+6},${y-5} l-10,5 l10,5`,ec,3.5);
  else if(m==='sad') eyes=dot(L,5.5)+dot(R,5.5)+brow(1);
  else if(m==='hungry') eyes=dot(L,7)+dot(R,7)+brow(0);
  else eyes=dot(L)+dot(R);
  if(!f.nomouth){
    if(m==='star'||m==='love'||m==='cry'||m==='party') mouth=pa(`M${f.wide?84:89},${my-1} q${f.wide?16:11},${f.wide?19:16} ${f.wide?32:22},0 z`,'#B8394E',3)+(m==='love'?'':el(100,my+(f.wide?9:7),f.wide?6:4.5,2.6,'#FF8FA3',0));
    else if(m==='dizzy') mouth=ln(`M89,${my+2} q3.7,-4 7.3,0 q3.7,4 7.3,0 q3.7,-4 7.3,0`);
    else if(m==='wink') mouth=pa(`M${f.wide?86:91},${my-1} q${f.wide?14:9},${f.wide?16:13} ${f.wide?28:18},0 z`,'#B8394E',3)+el(f.wide?106:104,my+(f.wide?8:6),4,3.4,'#FF8FA3',0);
    else if(m==='shock') mouth=el(100,my+4,5.5,7,'#B8394E',3);
    else if(m==='sleepy') mouth=el(100,my+3,3.5,3,'#B8394E',2.5);
    else if(m==='smug') mouth=ln(`M92,${my+1} q8,6 15,-3`);
    else if(m==='focus') mouth=ln(`M93,${my+2} L107,${my+2}`);
    else if(m==='happy'||m==='yay') mouth=pa(`M${f.wide?86:91},${my-1} q${f.wide?14:9},${f.wide?16:13} ${f.wide?28:18},0 z`,'#B8394E',3);
    else if(m==='eat') mouth=`<g class="pchew" style="transform-origin:100px ${my+2}px">${el(100,my+2,6,5,'#B8394E',3)}</g>`;
    else if(m==='hungry') mouth=el(100,my+3,4,5,PI,0);
    else if(m==='sad') mouth=ln(`M93,${my+5} q7,-6 14,0`);
    else if(m==='oops') mouth=ln(`M90,${my+2} q5,-4 10,0 q5,4 10,0`);
    else mouth=f.wide?ln(`M86,${my} q14,11 28,0`):ln(`M93,${my} q3.5,5 7,0 q3.5,5 7,0`);
  }
  if(m==='cry') extra=`<g class="ptear">${pa(`M${L-9},${y+5} q-6,9 0,13 q6,-4 0,-13z`,'#8FD3F4',2.3)+pa(`M${R+9},${y+5} q-6,9 0,13 q6,-4 0,-13z`,'#8FD3F4',2.3)}</g>`;
  if(m==='shock') extra=pa(`M${R+22},${y-22} q-6,9 0,12 q6,-3 0,-12z`,'#8FD3F4',2.3);
  if(m==='sleepy') extra=`<text x="${R+18}" y="${y-14}" font-family="Bricolage Grotesque,Arial" font-weight="800" font-size="17" fill="${PI}">z</text><text x="${R+30}" y="${y-28}" font-family="Bricolage Grotesque,Arial" font-weight="800" font-size="12" fill="${PI}">z</text>`;
  if(m==='star') extra=pa(`M${L-24},${y-20} l2,5 l5,2 l-5,2 l-2,5 l-2,-5 l-5,-2 l5,-2 z`,'#FFD23F',1.6)+pa(`M${R+24},${y-26} l1.6,4 l4,1.6 l-4,1.6 l-1.6,4 l-1.6,-4 l-4,-1.6 l4,-1.6 z`,'#FFD23F',1.6);
  if(m==='party') extra=[[L-26,y-26,'#F2557A'],[R+24,y-30,'#72CEF2'],[R+30,y-6,'#FFD23F'],[L-30,y-2,'#7BD389']].map(([x,yy,c],i)=>`<rect x="${x}" y="${yy}" width="6" height="10" rx="2" fill="${c}" stroke="${PI}" stroke-width="1.6" transform="rotate(${[20,-30,45,-15][i]} ${x+3} ${yy+5})"/>`).join('');
  if(m==='sad') extra=`<g class="ptear">${pa(`M${R+5},${y+7} q-5,8 0,11 q5,-3 0,-11z`,'#8FD3F4',2.5)}</g>`;
  const cy=f.cy||y+17, cx=f.ex+12;
  return `<g class="peyes" style="transform-origin:100px ${y}px">${eyes}</g>`+el(100-cx,cy,9,5.5,'#FF8FA3',0,` opacity="${m==='sad'?.3:.55}"`)+el(100+cx,cy,9,5.5,'#FF8FA3',0,` opacity="${m==='sad'?.3:.55}"`)+mouth+extra;
}

/* ================== Lern-Haustier · Logik ================== */
/* pet = null (noch nicht entschieden) | {on, sp, name, goal, snacks (Futter gefuttert), stars (⭐ = Geld), owned:[], born, log:{datum:{a,r}}, eq:{head,eyes,neck}, sty:{}, best, sim, seen:[], qhide, gday:{d,s}, hi:{}} */
let pet = LS.get('pet', null);
const savePet = ()=>{if(pet)pet.t=Date.now();LS.set('pet', pet)};
window.lbPetStar=()=>{if(!pet||!pet.on||!pet.sp)return false;pet.stars=(pet.stars||0)+1;savePet();if(typeof petHeader==='function')petHeader();return true};
const petOn = ()=>!!(pet&&pet.on&&pet.sp&&SP[pet.sp]);
const petTabVisible = ()=>!(pet&&pet.on===false);
let petUI = {slot:'head', picking:false, pickSp:null, pickGoal:20, buy:null, game:null};
const dkey = (d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dshift = n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return dkey(d)};
const tlog = ()=>{const k=dkey();pet.log[k]=pet.log[k]||{a:0,r:0};return pet.log[k]};
const pday = k=>(pet.log[k]||{a:0,r:0});
const starVal = q=>(q.alt||q.c===PQ)?2:1;
const petRetro = ()=>Q.reduce((s,q)=>s+((stats[q.id]&&stats[q.id].r)||0)*starVal(q),0);
const GCAP = Infinity; /* kein Tageslimit für ⭐ aus Spielen (Maximas Wunsch) */
/* Umstellung von der ersten Version (ohne Sterne) */
if(pet&&pet.sp&&pet.stars==null){pet.stars=petRetro();pet.owned=[...new Set([...ACC.filter(a=>a.pr===0).map(a=>a.id),...Object.values(pet.eq||{}).filter(Boolean).map(e=>e.id)])];pet.hi={};savePet()}
if(pet&&pet.sp){pet.hi=pet.hi||{};pet.owned=pet.owned||[];pet.sty=pet.sty||{}}
/* Preise passen sich ans Fach an: Fragenanzahl + Tage bis zur (eigenen) Prüfung, festgelegt beim Start bzw. beim Ändern des Prüfungstermins */
const petNQ = ()=>Q.filter(q=>MAIN.has(q.c)||q.c===PQ).length;
function petScale(){const d=Math.max(1,examDays());const budget=Math.min(d*20,petNQ()*2)*1.05;return Math.max(.25,Math.min(1.5,+(budget/400).toFixed(2)))}
const petStreakReqCalc = ()=>Math.max(2,Math.min(5,Math.round(Math.max(1,examDays())/2)));
const petStreakReq = ()=>pet&&pet.streakReq||5;
const accPr = a=>a.pr==null?null:a.pr===0?0:Math.max(5,Math.round(a.pr*((pet&&pet.scale)||1)/5)*5);
function petStreak(){let s=0,i=pday(dshift(0)).a>=pet.goal?0:1;for(;i<400;i++){if(pday(dshift(i)).a>=pet.goal)s++;else break}return s}
function petMood(){
  /* setzt sich jeden Tag zurück: morgens hungrig, ab halbem Tagesziel zufrieden, Ziel geschafft = glücklich; 2+ Tage gar nix gelernt = traurig */
  const a=pday(dshift(0)).a, t=a/pet.goal; if(t>=1) return 'happy'; if(t>=.5) return 'content';
  if(a>0) return 'hungry';
  let i=1; for(;i<60;i++){const k=dshift(i);if(pday(k).a>0||k<pet.born)break}
  return i>=3?'sad':'hungry';
}
const examDays = ()=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((EXAM-t)/864e5)};
function petBaseMood(){if(typeof focusPhase==='function'){const fp=focusPhase();if(fp==='break'||fp==='long')return 'sleep'}const d=examDays();return d<=0&&d>-3?'happy':petMood()}
const pick = a=>a[Math.floor(Math.random()*a.length)];
const goalVal = id=>{const e=document.getElementById(id);const n=e?parseInt(e.value,10):NaN;return n>0?Math.max(1,Math.min(200,n)):null};
function petLine(){
  const S=SP[pet.sp], m=petMood(), d=examDays(), left=Math.max(0,pet.goal-pday(dshift(0)).a), st=petStreak();
  if(d===0) return 'Heute ist Prüfung! Tief durchatmen – du kannst das. Ich drück dir alle Daumen.';
  if(d<0) return 'Prüfung vorbei – ich bin so stolz auf dich! 🎉';
  if(d===1) return 'Morgen ist Prüfung! Heute nur noch wiederholen und früh schlafen gehen.';
  const L={
    happy:['Tagesziel geschafft! Ich bin kugelrund.',`So viele ${S.foods}! Heute läuft’s richtig gut bei dir.`,'Ich bin satt und mega stolz auf dich.',`Noch ${d} Tage bis zur Prüfung – mit so einem Tag kein Problem.`,'Lust auf eine Runde Begriff-Blitz?'],
    content:[`Schon halb satt! Noch ${left} Fragen bis zum Tagesziel.`,'Eine kleine Quizrunde? Ich hätte Appetit.',`${S.foods} wären jetzt fein. Nur so als Idee.`,`Noch ${d} Tage bis zur Prüfung. Wir schaffen das.`],
    hungry:[`Guten Morgen … mein Bauch knurrt! ${left} Fragen und ich bin satt.`,`Mein Bauch knurrt … ${left} Fragen und ich bin satt.`,`Hast du ein paar ${S.foods} für mich? Jede richtige Antwort zählt.`,'Ich warte schon auf dich. Nur ein paar Fragen?'],
    sad:['Ich hab dich vermisst. Magst du mit 5 Fragen anfangen?','Schon ein paar Tage nix gelernt … ich bin ein bisschen traurig.','Komm, gemeinsam schaffen wir das. Eine Runde?']
  }[m];
  if(st>=2&&Math.random()<.35) return `${st} Tage am Stück geschafft! 🔥 Weiter so.`;
  return pick(L);
}
/* Accessoires: kaufen (pr) oder Spezial-Bedingung */
const allRight = ()=>Q.filter(q=>MAIN.has(q.c)||q.c===PQ).every(q=>stats[q.id]&&stats[q.id].r>0);
const accSpecial = a=>a.sim?!!pet.sim:a.streak?(pet.best||0)>=petStreakReq():a.all?allRight():a.ach?(typeof ach!=='undefined'&&Object.keys(ach.got).length>=a.ach):false;
const accHas = a=>a.pr===0||(a.pr!=null?pet.owned.includes(a.id):accSpecial(a));
const accReq = a=>a.sim?'Prüfungssimulation mit mind. 50 % bestehen':a.streak?petStreakReq()+' Tage am Stück das Tagesziel schaffen':a.all?'alle Fragen mind. 1× richtig (ohne Extra-Kapitel)':a.ach?a.ach+' Abzeichen sammeln':'⭐ '+accPr(a);
function petCheck(){
  pet.best=Math.max(pet.best||0,petStreak());
  const neu=ACC.filter(a=>a.pr==null&&accSpecial(a)&&!pet.seen.includes(a.id));
  neu.forEach(a=>pet.seen.push(a.id));
  const lg={};for(let i=0;i<70;i++){const k=dshift(i);if(pet.log[k])lg[k]=pet.log[k]}pet.log=lg;
  savePet();
  if(neu.length) setTimeout(()=>petToast(`Verdient: <b>${neu.map(a=>a.n).join(', ')}</b>! Gibt’s nicht zu kaufen – im Tab Haustier anziehen.`,'happy'),900);

/* Lückenfüller – aus Lückentext-Fragen + markierten Begriffen in den Karteikarten */
function gapItems(){
  const out=[], gq=Q.filter(q=>q.t==='gap'&&(MAIN.has(q.c)||q.c===PQ)), ga=[...new Set(gq.map(q=>q.a[0]))];
  gq.forEach(q=>{const d=shuffle(ga.filter(a=>norm(a)!==norm(q.a[0]))).slice(0,3);if(d.length===3)out.push({h:fmt(q.q).replace('___','<span class="gblank">____</span>'),a:q.a[0],o:shuffle([q.a[0],...d]),e:fmt(q.e||'')})});
  const bolds=[]; CARDS.forEach(c=>{(c[2].match(/\*\*(.+?)\*\*/g)||[]).forEach(m=>{const w=m.slice(2,-2);if(w.length>=2&&w.length<=40)bolds.push({c,w})})});
  shuffle(bolds).slice(0,40).forEach(({c,w})=>{
    const isNum=/\d/.test(w), pool=bolds.filter(x=>x.w!==w&&norm(x.w)!==norm(w)&&/\d/.test(x.w)===isNum&&Math.abs(x.w.length-w.length)<16);
    const same=pool.filter(x=>x.c[0]===c[0]), d=[...new Set([...shuffle(same),...shuffle(pool)].map(x=>x.w))].slice(0,3); if(d.length<3) return;
    const h=fmt(c[2].replace('**'+w+'**','§§')).replace('§§','<span class="gblank">____</span>');
    out.push({h:`<b class="gterm">${esc(c[1])}</b>${h}`,a:w,o:shuffle([w,...d]),e:fmt(c[2])});
  });
  return shuffle(out).slice(0,10);
}

/* ================== Lernplan (Kalender, jeder Tag selbst bearbeitbar) ================== */
let plan = LS.get('plan',{});
if(!plan.v2){plan={v2:1,off:!!plan.off,days:plan.days||{},items:{},edited:{},done:{},custom:{},ok:plan.ok||{},made:false}}
const savePlan=()=>{Object.keys(plan.items||{}).forEach(k=>plan.items[k]=(plan.items[k]||[]).map((id,i)=>[id,i]).sort((a,b)=>planOrd(a[0])-planOrd(b[0])||a[1]-b[1]).map(x=>x[0]));LS.set('plan',plan)};
function planTabSync(){const b=document.getElementById('t-plan');if(b)b.hidden=!!plan.off}
const dAdd=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n,12))};
const dDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const dLabel=k=>dDate(k).toLocaleDateString('de-AT',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.,',',');
const dayType=k=>plan.days[k]||'normal';
const dayCap=k=>({free:0,low:.45,normal:1})[dayType(k)];
const pctOf=(a,b)=>b?a/b:1;
const chQ=c=>Q.filter(q=>q.c===c);
/* Bausteine: global = erledigt sobald der Stand passt, day = pro Tag (Simulation, Last-Minute, Spickzettel, eigene) */
function itemMeta(id){
  let m;
  if(m=id.match(/^r(\d+)$/)){const c=+m[1],ch=CHNAME[c];return {n:`K${c} Lernzettel lesen`,s:ch,w:1.2,g:1,manual:1,prog:()=>plan.done['r'+c]?1:0,go:()=>{curCh=c;LS.set('ch',c);show('learn');renderRail();renderChapter();window.scrollTo({top:0})}}}
  if(m=id.match(/^q(\d+)$/)){const c=+m[1],qs=chQ(c);return {n:`K${c} Quiz`,s:`alle ${qs.length} Fragen 1× beantworten`,w:Math.max(.6,qs.length/12),g:1,prog:()=>pctOf(qs.filter(q=>stats[q.id]).length,qs.length),go:()=>{setup={ch:[c],filter:'new',n:20};show('quiz');startQuiz()}}}
  if(m=id.match(/^f(\d+)$/)){const c=+m[1],qs=chQ(c);return {n:`K${c} Fehler wiederholen`,s:'offene Fehler ausbessern',w:.6,g:1,prog:()=>{const s=qs.filter(q=>stats[q.id]).length;if(!s)return 0;const o=qs.filter(q=>isOpen(q.id)).length;return o?0:(s>=qs.length*.8?1:.5)},go:()=>{setup={ch:[c],filter:'ever',n:0};show('quiz');startQuiz()}}}
  if(id==='alt'){const a=Q.filter(q=>q.alt&&MAIN.has(q.c));return {n:'Altfragen',s:`alle ${a.length} mind. 1× richtig`,w:Math.max(1,a.length/15),g:1,prog:()=>pctOf(a.filter(q=>stats[q.id]&&stats[q.id].r>0).length,a.length),go:()=>{setup={ch:[],filter:'alt',n:20};show('quiz');startQuiz()}}}
  if(id==='pq'){const a=Q.filter(q=>q.c===PQ);return {n:'Prüfungsfragen',s:`alle ${a.length} 1× beantworten`,w:Math.max(1,a.length/15),g:1,prog:()=>pctOf(a.filter(q=>stats[q.id]).length,a.length),go:()=>{setup={ch:[PQ],filter:'new',n:20};show('quiz');startQuiz()}}}
  if(id==='sim') return {n:'Prüfungssimulation',s:'einmal unter Prüfungsbedingungen',w:1,day:1,prog:k=>LS.get('simhist',[]).some(h=>dkey(new Date(h.d))===k)?1:0,go:()=>{show('quiz');startSim()}};
  if(id==='lm') return {n:'Last-Minute-Runde',s:'Altfragen + hartnäckigste Fehler',w:1,day:1,prog:k=>LS.get('lmdays',[]).includes(k)?1:0,go:()=>{show('quiz');startLM()}};
  if(id==='sp') return {n:'Spickzettel lesen',s:'alle Kernbegriffe',w:.5,day:1,manual:1,prog:k=>plan.done[k+'|sp']?1:0,go:()=>{show('quiz');openSpick()}};
  if(m=id.match(/^c([0-9a-z]+)$/)){return {n:plan.custom[id]||'Eigene Aufgabe',s:'eigene Aufgabe',w:.5,day:1,manual:1,own:1,prog:k=>plan.done[k+'|'+id]?1:0,go:null}}
  return null;
}
/* feste, logische Reihenfolge innerhalb eines Tages: Kapitel aufsteigend (Lernzettel → Quiz → Fehler), dann Altfragen, Prüfungsfragen, Simulation, Last-Minute, Spickzettel, eigene Aufgaben */
function planOrd(id){const m=id.match(/^([rqf])(\d+)$/);if(m)return +m[2]*10+'rqf'.indexOf(m[1]);const g={alt:9000,pq:9001,sim:9002,lm:9003,sp:9004}[id];return g!=null?g:9100}
const planItems=k=>(plan.items[k]||[]).map((id,i)=>[id,i]).sort((a,b)=>planOrd(a[0])-planOrd(b[0])||a[1]-b[1]).map(x=>x[0]);
const iProg=(k,id)=>{const m=itemMeta(id);return m?Math.min(1,m.prog(k)):1};
const iDone=(k,id)=>iProg(k,id)>=1;
/* Pflicht im Vorschlag / „Noch nicht eingeplant“: nur Lernzettel + Quiz je Kapitel. Fehler wiederholen, Altfragen, Prüfungsfragen sind optional (nur per ✎) */
function planCatalog(){return CHM.flatMap(c=>['r'+c.id,'q'+c.id])}
function planRange(){const t=dkey(),ex=dkey(EXAM),days=[];for(let k=t;k<ex;k=dAdd(k,1))days.push(k);return {today:t,ex,days}}
/* „Fertig mit Durcharbeiten bis“: selbst gewählt oder Standard (ca. 60 % der Lerntage) */
function planEndDays(days){const avail=days.filter(k=>dayCap(k)>0);return avail.length>=6?avail.slice(-2):avail.length>=3?avail.slice(-1):[]}
function planFinDefault(){const {today,days}=planRange();const e=planEndDays(days),tg=days.filter(k=>dayCap(k)>0&&!e.includes(k));return tg[Math.max(0,Math.ceil(tg.length*.6)-1)]||today}
function planFin(){const {today,ex}=planRange();return plan.finish&&plan.finish>=today&&plan.finish<ex?plan.finish:planFinDefault()}
/* Vorschlag: füllt alle nicht selbst bearbeiteten Tage ab heute */
/* „Rest automatisch verteilen“: alles Offene in die bestehenden Tage einsortieren (auch selbst bearbeitete), nach Kapiteln in Reihenfolge, gleichmäßig nach Zeit */
function planRest(){
  const {today,days}=planRange(); const endDays=planEndDays(days), fin=planFin();
  const todo=planUnplanned(); if(!todo.length) return 0;
  let ds=days.filter(k=>dayCap(k)>0&&!endDays.includes(k)); if(!ds.length) ds=days.filter(k=>dayCap(k)>0); if(!ds.length) return 0;
  const pre=ds.filter(k=>k<=fin); if(pre.length) ds=pre;
  const caps=ds.map(dayCap), C=caps.reduce((s,c)=>s+c,0), W=todo.reduce((s,id)=>s+itemMeta(id).w,0); let cum=0;
  todo.forEach(id=>{const w=itemMeta(id).w,f=(cum+w/2)/W*C;let acc=0,j=0;for(;j<ds.length;j++){acc+=caps[j];if(acc>=f)break}const k=ds[Math.min(j,ds.length-1)];(plan.items[k]=plan.items[k]||[]).push(id);cum+=w});
  plan.made=true; savePlan(); return todo.length;
}
function planMsg(html){const t=document.getElementById('ptoast');if(!t)return;t.innerHTML=`<span class="pt-pet" style="display:grid;place-items:center;font-size:1.5rem">📅</span><span>${html}</span>`;t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');clearTimeout(petTT);petTT=setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.hidden=true,300)},3600)}
function planSuggest(onlyRest){
  const {today,days}=planRange(); const free=days.filter(k=>!plan.edited[k]);
  if(!onlyRest) free.forEach(k=>delete plan.items[k]);
  const endDays=planEndDays(days), fin=planFin();
  const planned=new Set(days.flatMap(k=>plan.items[k]||[]));
  const todo=planCatalog().filter(id=>!iDone(today,id)&&!planned.has(id));
  const target=free.filter(k=>dayCap(k)>0&&!endDays.includes(k));
  const p1=todo.filter(id=>/^[rq]\d/.test(id)), p2=todo.filter(id=>!/^[rq]\d/.test(id));
  let t1=target.filter(k=>k<=fin), t2=target.filter(k=>k>fin); if(!t1.length){t1=target.slice(0,1);t2=target.slice(1)}
  const fill=(ids,ds)=>{if(!ds.length)ds=target.slice(-1);if(!ds.length)return;const caps=ds.map(dayCap),C=caps.reduce((a,b)=>a+b,0),W=ids.reduce((a,id)=>a+itemMeta(id).w,0);let cum=0;
    ids.forEach(id=>{const f=(cum+itemMeta(id).w/2)/W*C;let acc=0,j=0;for(;j<ds.length;j++){acc+=caps[j];if(acc>=f)break}const k=ds[Math.min(j,ds.length-1)];(plan.items[k]=plan.items[k]||[]).push(id);cum+=itemMeta(id).w})};
  fill(p1,t1); fill(p2,t2.length?t2:t1);
  if(!onlyRest) endDays.forEach((k,i)=>{if(plan.edited[k])return;plan.items[k]=[...(plan.items[k]||[]),...(endDays.length===1?['sim','lm','sp']:i===0?['sim']:['lm','sp'])]});
  plan.made=true; savePlan();
}
function planLeft(){const {today}=planRange();const out=[];Object.keys(plan.items).filter(k=>k<today).sort().forEach(k=>(plan.items[k]||[]).forEach(id=>{if(!iDone(k,id)&&!out.some(x=>x.id===id))out.push({k,id})}));
  const ahead=new Set(Object.keys(plan.items).filter(k=>k>=today).flatMap(k=>plan.items[k]));return out.filter(x=>!(itemMeta(x.id).g&&ahead.has(x.id)))}
function planUnplanned(){const {today,days}=planRange();const planned=new Set(days.flatMap(k=>plan.items[k]||[]));return planCatalog().filter(id=>!planned.has(id)&&!iDone(today,id))}
function planTodayState(){if(plan.off||!plan.made)return null;const {today}=planRange();const ts=planItems(today);const d=ts.filter(id=>iDone(today,id)).length;if(ts.length&&d===ts.length&&!plan.ok[today]){plan.ok[today]=1;savePlan()}return {ts,d,today}}
const elsewhere=(k,id)=>{const {today,days}=planRange();return days.filter(d=>d!==k&&(plan.items[d]||[]).includes(id))};
function chipHtml(k,id,live){const m=itemMeta(id);if(!m)return '';const p=iProg(k,id),dn=p>=1;return `<span class="pchip${dn?' dn':''}${m.own?' own':''}">${dn?'✓ ':''}${esc(m.n)}</span>`}
function taskRow(k,id){const m=itemMeta(id),p=iProg(k,id),dn=p>=1;return `<div class="ptask${dn?' done':''}"><button class="pchk" ${m.manual?`data-plan="tick" data-d="${k}" data-t="${id}"`:'disabled'} title="${m.manual?'Abhaken':'Hakt sich selbst ab, sobald erledigt'}">${dn?'✓':''}</button><div><b>${esc(m.n)}</b><small>${esc(m.s||'')}</small>${!m.manual&&!dn&&p>0?`<span class="bar"><i style="width:${Math.round(p*100)}%"></i></span>`:''}</div>${m.go&&!dn?`<button class="btn ghost" data-plan="go" data-t="${id}">Los</button>`:''}</div>`}
let planEdit=null;
function renderPlan(){
  const v=document.getElementById('v-plan'); const {today,ex,days}=planRange();

  const finEl=()=>{const fi=document.getElementById('plfin');if(fi)fi.onchange=()=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(fi.value))return;plan.finish=fi.value;savePlan();if(plan.made)planSuggest(false);renderPlan()}};
  if(!plan.made){v.innerHTML=`<div class="panel plstart"><span class="label">Lernplan</span><h2 class="plh">Noch ${days.length} ${days.length===1?'Tag':'Tage'} bis zur Prüfung</h2><p class="plsub">Prüfung am <b>${dLabel(ex)}</b> · ändern beim ✎ oben</p><p>Das Tool macht dir einen Vorschlag, welches Kapitel du an welchem Tag lernst. Danach kannst du <b>jeden Tag selbst bearbeiten</b> – Inhalte dazugeben, wegnehmen, Tage frei machen. Was du änderst, bleibt so.</p><label class="pfield plfin"><span>Mit dem Durcharbeiten fertig bis</span><input type="date" id="plfin" min="${today}" max="${dAdd(ex,-1)}" value="${planFin()}"></label><p class="hint">Bis dahin sind alle Kapitel einmal gelesen und das Quiz gemacht – danach kommt Wiederholen, vor der Prüfung der Endspurt.</p><div class="actions"><button class="btn accent" data-plan="suggest">Vorschlag erstellen</button><button class="btn ghost" data-plan="off">Ohne Lernplan</button></div></div>`;finEl();return}
  const st=planTodayState(), ts=st.ts, dn=st.d, left=planLeft(), un=planUnplanned();
  /* Kalender: ab Montag dieser Woche bis zur Prüfung */
  const start=dAdd(today,-((dDate(today).getDay()+6)%7)); const cells=[]; for(let k=start;k<=ex;k=dAdd(k,1)) cells.push(k); while(cells.length%7) cells.push(null);
  const wd=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const cal=cells.map(k=>{if(!k)return '<div class="pcal empty"></div>';
    if(k<today) return `<div class="pcal past"><span class="pcd">${dLabel(k)}</span></div>`;
    if(k===ex) return `<div class="pcal exam"><span class="pcd">${dLabel(k)}</span><b>Prüfung 🎓</b></div>`;
    const it=planItems(k), ty=dayType(k);
    return `<button class="pcal${k===today?' today':''} t-${ty}" data-plan="edit" data-d="${k}"><span class="pcd">${k===today?'Heute':dLabel(k)}${ty==='free'?' · frei':ty==='low'?' · wenig Zeit':''}</span><span class="pcis">${ty==='free'&&!it.length?'<span class="pfree">🌿</span>':it.map(id=>chipHtml(k,id)).join('')||'<span class="pnone2">nichts geplant</span>'}</span><span class="pced">✎ bearbeiten</span></button>`}).join('');
  v.innerHTML=`<div class="plgrid">
   <div class="panel pltop"><span class="label">Dein Lernplan</span><h2 class="plh">Noch ${days.length} ${days.length===1?'Tag':'Tage'} bis zur Prüfung</h2><p class="plsub">Prüfung am <b>${dLabel(ex)}</b> · ändern beim ✎ oben neben dem Countdown</p>
     <label class="pfield plfin"><span>Mit dem Durcharbeiten fertig bis</span><input type="date" id="plfin" min="${today}" max="${dAdd(ex,-1)}" value="${planFin()}"></label><p class="hint">Datum ändern = der Plan rechnet neu. Tage, die du selbst bearbeitet hast, bleiben so.</p>
     <p class="hint">Tipp einen Tag an, um ihn zu bearbeiten: Kapitel, Quiz, Altfragen, eigene Aufgaben oder „frei“. Quiz und Simulation haken sich selbst ab, den Lernzettel hakst du ab oder scrollst ihn bis ganz unten.</p>
     <div class="actions">${un.length?`<button class="btn accent" data-plan="rest">Rest automatisch verteilen (${un.length})</button>`:''}<button class="btn ghost" data-plan="redo">${plan.redo?'Wirklich alles neu? Nochmal tippen':'Neuer Vorschlag'}</button><button class="btn ghost" data-plan="off">Lernplan ausschalten</button></div></div>
   <div class="panel pltoday"><div class="pdh"><span class="label">Heute · ${dLabel(today)}</span><button class="btn ghost" data-plan="edit" data-d="${today}">✎ Heute bearbeiten</button></div>
     ${left.length?`<div class="pleft"><b>Von früheren Tagen übrig:</b> ${left.map(x=>`<span class="pchip">${esc(itemMeta(x.id).n)} <button data-plan="totoday" data-d="${x.k}" data-t="${x.id}" title="Auf heute verschieben">→ heute</button></span>`).join('')}</div>`:''}
     ${dayType(today)==='free'&&!ts.length?'<p class="hint">Heute ist frei. 🌿</p>':ts.length?`<div class="ptasks">${ts.map(id=>taskRow(today,id)).join('')}</div><p class="plsum">${dn===ts.length?'Alles erledigt für heute 🎉':`${dn} von ${ts.length} erledigt`}</p>`:'<p class="hint">Für heute ist nichts geplant – tipp auf „✎ Heute bearbeiten“, um etwas dazuzugeben.</p>'}
   </div>
   <div class="panel plcal"><div class="pcalh">${wd.map(x=>`<span>${x}</span>`).join('')}</div><div class="pcalg">${cal}</div></div>
   ${un.length?`<div class="panel plun"><span class="label">Noch nicht eingeplant</span><div class="plunl">${un.map(id=>`<span class="pchip">${esc(itemMeta(id).n)}</span>`).join('')}</div><p class="hint">Tipp auf einen Tag, um es dort anzuhaken – oder „Rest automatisch verteilen“.</p></div>`:''}

function planEditor(k){

   <div class="pedg"><span class="mono">Kapitel</span>${CHM.map(c=>`<div class="pedr"><b><span class="mono">K${c.id}</span> ${esc(c.s)}</b><div>${['r','q','f'].map(x=>chip(x+c.id)).join('')}</div></div>`).join('')}</div>
   <div class="pedg"><span class="mono">Allgemein</span><div>${[...(Q.some(q=>q.alt&&MAIN.has(q.c))?['alt']:[]),...(Q.some(q=>q.c===PQ)?['pq','sim']:[]),'lm','sp'].map(chip).join('')}</div></div>
   <div class="pedg"><span class="mono">Eigene Aufgaben</span>${own.map(id=>`<div class="pown">${esc(plan.custom[id])}<button data-plan="cdel" data-d="${k}" data-t="${id}" aria-label="Löschen">×</button></div>`).join('')}<div class="pownadd"><input id="plcin" maxlength="80" placeholder="z. B. Ethik-Folien nochmal anschauen"><button class="btn ghost" data-plan="cadd" data-d="${k}">Hinzufügen</button></div></div>
   <div class="actions"><button class="btn accent" data-plan="close">Fertig</button></div></div>`;

function planStrip(){if(plan.off)return '';const s=planTodayState();if(!s||!s.ts.length)return '';const p=Math.round(s.d/s.ts.length*100);return `<div class="panel planstrip"><span class="label">Heute laut Plan</span><span class="bar"><i style="width:${p}%"></i></span><b>${s.d}/${s.ts.length}</b><button class="btn ghost" data-plan="open">Plan ansehen</button></div>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-plan]');if(!b)return;const a=b.dataset.plan,k=b.dataset.d,id=b.dataset.t;

function lmPool(){
  const weak=Q.filter(q=>(MAIN.has(q.c)||q.c===PQ)&&stats[q.id]&&stats[q.id].w>0).sort((a,b)=>(stats[b.id].w-stats[b.id].r)-(stats[a.id].w-stats[a.id].r)).slice(0,15);
  const alt=Q.filter(q=>q.alt&&MAIN.has(q.c)).sort((a,b)=>((stats[b.id]&&stats[b.id].last==='w')?1:0)-((stats[a.id]&&stats[a.id].last==='w')?1:0));
  const pq=Q.filter(q=>q.c===PQ&&!(stats[q.id]&&stats[q.id].r>0)).slice(0,15);
  const seen=new Set(), out=[]; [...weak,...alt,...pq].forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);out.push(q)}});
  return out.slice(0,45);
}

const ACHT={b:'Bronze',s:'Silber',g:'Gold',x:'Spezial'}, ACHR={b:3,s:6,g:12,x:10};
function achOnAnswer(ok,q){
  const c=ach.c, h=new Date().getHours(), k=dkey();
  c.rowBefore=c.row||0; c.row=ok?(c.row||0)+1:0; c.best=Math.max(c.best||0,c.row);
  c.wrow=ok?0:(c.wrow||0)+1; c.worst=Math.max(c.worst||0,c.wrow);
  if(h>=4&&h<7)c.early=1; if(h>=23||h<4)c.night=1; if(h<3)c.midnight=1;
  c.days=c.days||{}; c.days[k]=(c.days[k]||0)+1; const ks=Object.keys(c.days).sort(); if(ks.length>60)delete c.days[ks[0]];
  if(ok&&quiz.prev&&quiz.prev.last==='w') c.fixed=(c.fixed||0)+1;
  saveAch();
}

let achT=null; function achSoon(){clearTimeout(achT);achT=setTimeout(achCheck,350)}
function achCheck(){
  if(petHas()&&pet.on){const m=petMood();if(m==='sad')ach.c.wasSad=1;if(ach.c.wasSad&&m==='happy')ach.c.comeback=1}
  if(examDays()===0) ach.c.examday=1;
  const neu=ACH.filter(a=>!ach.got[a.id]&&(()=>{try{return a.f()}catch(e){return false}})());
  if(!neu.length){saveAch();return}
  let st=0; neu.forEach(a=>{ach.got[a.id]=Date.now();st+=Math.max(1,Math.round(ACHR[a.t]*((petHas()&&pet.scale)||1)))});
  saveAch();
  const withPet=typeof petOn==='function'&&petOn();
  if(withPet){pet.stars+=st;savePet()}
  const t=document.getElementById('ptoast'); if(!t) return;
  t.innerHTML=`<span class="achst t-${neu[0].t}"><span>${neu[0].ic}</span></span><span>${neu.length===1?`Neues Abzeichen: <b>${esc(neu[0].n)}</b>`:`<b>${neu.length} neue Abzeichen</b>: ${neu.slice(0,4).map(a=>esc(a.n)).join(', ')}${neu.length>4?' …':''}`}${withPet?` · +${st} ⭐`:''}</span>`;
  t.hidden=false; t.classList.remove('in'); void t.offsetWidth; t.classList.add('in');
  clearTimeout(petTT); petTT=setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.hidden=true,300)},4800);
  if(LS.get('tab')==='pet'&&typeof petUI!=='undefined'&&!petUI.game&&!petUI.picking&&document.activeElement?.tagName!=='INPUT') renderPet();
}
function achSticker(a,got){return `<span class="achst t-${a.t}${got?'':' off'}" title="${esc(a.n)}"><span>${got||!a.sec?a.ic:'?'}</span></span>`}

}

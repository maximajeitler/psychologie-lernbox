<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0A1428">
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2611171345">
<link rel="icon" type="image/png" href="../favicon-32.png?v=2611171345">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Tätigkeitsbereiche Lernbox</title>
<style>.hubback{display:inline-block;margin:0 0 10px;font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--paper)}.hubback:hover{color:var(--ink);border-color:var(--ink)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Psychologie-Style: Lernheft mit Textmarker. Fach-Tinte (--accent), Neon-Marker (--hl) für Fachbegriffe, Kapitel-Reiter links.
   FARBEN PRO FACH: nur die mit [FACH] markierten Tokens aus farben.md tauschen, Rest bleibt. */
:root{ --find:#A6E35A;
  --bg:#EAF1F3; --paper:#FDFEFE; --ink:#0F292E; --muted:#51757B; --line:#D2E0E2;
  --accent:#0E6E7E; --accent-ink:#FFFFFF; --hl:#FFC6A5; --hl-ink:#0F292E;
  --good:#0F7A55; --good-bg:#DDF3EA; --bad:#C2361F; --bad-bg:#FBE3DE; --warn-bg:#FFF6CC; --warn-line:#E1C23A;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1719; --paper:#172628; --ink:#E8F1F3; --muted:#A1B7BA; --line:#2B4145;
  --accent:#7DE1F2; --accent-ink:#0D1719; --hl:#FFB388; --hl-ink:#0F292E;
  --good:#5BD3A2; --good-bg:#12302A; --bad:#FF8A75; --bad-bg:#3A1C1A; --warn-bg:#2E2A12; --warn-line:#8A7A22;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1719; --paper:#172628; --ink:#E8F1F3; --muted:#A1B7BA; --line:#2B4145;
  --accent:#7DE1F2; --accent-ink:#0D1719; --hl:#FFB388; --hl-ink:#0F292E;
  --good:#5BD3A2; --good-bg:#12302A; --bad:#FF8A75; --bad-bg:#3A1C1A; --warn-bg:#2E2A12; --warn-line:#8A7A22;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);color:var(--hl-ink);padding:0 .15em;border-radius:2px;font-weight:600}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em}

/* Kopf */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:.95;letter-spacing:-.03em;margin:0;text-wrap:balance}
.brand h1 span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 .18em;border-radius:8px;transform:rotate(-2deg);margin-left:.08em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.count{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px}
.count b{font-family:var(--display);font-weight:800;font-size:1.6rem;background:var(--hl);color:var(--hl-ink);border-radius:999px;min-width:48px;height:48px;display:grid;place-items:center;padding:0 10px}
.count div{font-size:.85rem;line-height:1.3}
.count small{display:block;color:var(--muted);font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:18px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs > button{background:none;border:0;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--muted)}
nav.tabs > button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs > button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--paper)}

/* Kapitel-Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip .mono{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .mono{color:inherit;opacity:.8}

/* Lernen */
/* Suche */
.search{margin-left:auto;position:relative;display:flex;align-items:center;flex:0 1 300px;min-width:0}
.search svg{position:absolute;left:10px;width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;font:inherit;font-size:.92rem;padding:8px 56px 8px 34px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input:focus{outline:none;border-color:var(--accent)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{position:absolute;right:8px;font-family:var(--mono);font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;pointer-events:none}
.search input:not(:placeholder-shown)~kbd{display:none}
.sres{position:absolute;top:calc(100% + 6px);right:0;width:min(680px,100%);max-height:min(70vh,640px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 44px rgba(0,0,0,.18);padding:10px;z-index:30}
.sgrp+.sgrp{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.sgrp>.label{display:block;padding:4px 10px 4px}
.shit{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit;font-size:.93rem;line-height:1.45}
button.shit{cursor:pointer}
button.shit:hover,button.shit:focus-visible{background:var(--bg);outline:none}
.shit .mono{font-size:.68rem;color:var(--muted);letter-spacing:.04em}
.shit .sol{color:var(--muted)}
.smore,.sempty{margin:6px 10px;color:var(--muted);font-size:.88rem}
.hit{background:var(--find,#FFB547);color:#1A1A1A;border-radius:3px;box-shadow:0 0 0 2px var(--find,#FFB547);font-weight:600}
mark .hit{box-shadow:0 0 0 2px var(--find,#FFB547),0 0 0 3px var(--ink)}
/* --find = Farbe der Suchtreffer; muss sich vom Marker --hl klar abheben (bei orangem/pfirsich --hl z. B. --find:#A6E35A setzen) */
.sec{scroll-margin-top:90px}
.sec.flash{outline:2px solid var(--accent);outline-offset:3px}

.learn{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px}
.rail button{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px}
.rail button .mono{color:var(--muted)}
.rail button[aria-current="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--accent)}
.rail button[aria-current="true"] .mono{color:var(--accent)}
.rail button:hover{background:var(--paper)}
.chap-head{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:14px}
.chap-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.chap-head .mono{color:var(--accent);display:block;margin-bottom:6px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.sec h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 10px;letter-spacing:-.01em}
.sec ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.sec li{max-width:72ch}
.sec li::marker{color:var(--accent)}
.sec p{margin:0 0 8px;max-width:72ch}
.sub{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;list-style:none;margin-left:-1.1em}
.warn{background:var(--warn-bg);border-left:4px solid var(--warn-line);border-radius:8px;padding:10px 14px;margin:6px 0;list-style:none;margin-left:-1.1em;font-size:.95rem}
.warn b{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.neu{background:color-mix(in srgb,var(--accent) 9%,var(--paper));border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin:6px 0;list-style:none;margin-left:-1.1em;font-size:.95rem}
.neu b{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px;color:var(--accent)}
.tbl{overflow-x:auto;margin:6px 0 4px;list-style:none;margin-left:-1.1em}
.tbl table{border-collapse:collapse;font-size:.88rem;min-width:520px;width:100%}
.tbl th{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;text-align:left;color:var(--muted);border-bottom:2px solid var(--ink);padding:6px 10px 6px 0}
.tbl td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;vertical-align:top}
.tbl td:first-child{font-weight:600}

/* Quiz */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.setup{display:grid;gap:20px;max-width:820px}
.setup h2,.stage h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em;margin:0;line-height:1.05}
.label{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.setup-foot{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.setup-foot .mono{color:var(--muted)}
.stage{max-width:820px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.tag.alt{border-color:var(--ink);color:var(--ink);background:var(--hl);color:var(--hl-ink)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.25;letter-spacing:-.01em;margin:4px 0 18px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px}
.opt .k{font-family:var(--mono);font-weight:600;font-size:.8rem;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:var(--paper)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);color:var(--paper)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.sel .k{background:var(--ink);color:var(--paper)}
.ms .opt .k{border-radius:4px;border:1.5px solid var(--line)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt.miss .k{background:var(--good-bg);color:var(--good)}
.opt .why{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.opt.miss .why{color:var(--good)}.opt.no .why{color:var(--bad)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{grid-template-columns:1fr;text-align:center;font-weight:600;font-size:1.05rem;padding:16px}
.gap{display:flex;gap:8px;flex-wrap:wrap}
.gap input{flex:1;min-width:200px;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.gap input.ok{border-color:var(--good);background:var(--good-bg)}
.gap input.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.btn.pin[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb strong{font-family:var(--display);font-size:1.15rem;display:block;margin-bottom:4px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb p{margin:4px 0 0;max-width:70ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.hint{color:var(--muted);font-size:.82rem}
.fhint{margin:8px 2px 0}
.fhelp{margin:6px 2px 0}
.fhelp summary{cursor:pointer;color:var(--accent);font-weight:600}
.fhelp ol{margin:8px 0 6px;padding-left:1.3em}
.fhelp li{margin:4px 0}
.fhelp b{color:var(--ink)}
.simcard{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px;border-left:4px solid var(--accent)}
.simcard h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:4px 0}
.simcard .hint{margin:0;max-width:60ch}
.simclock{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 8px;margin-left:auto}
.simclock.low{background:var(--bad)}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px}
.simgrid button{font-family:var(--mono);font-size:.8rem;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 0}
.simgrid button.done{background:var(--bg);border-color:var(--muted)}
.simgrid button.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.simreview{display:grid;gap:10px;margin-top:18px}
.simreview>div{border-left:4px solid var(--line);padding:6px 0 6px 12px;display:grid;gap:4px}
.simreview>div.ok{border-left-color:var(--good)}.simreview>div.no{border-left-color:var(--bad)}
.simreview .mono{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.simreview .ya{color:var(--bad)}.simreview .a{color:var(--good);font-weight:600}
.result-big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,5rem);line-height:1;letter-spacing:-.04em}
.wrong-list{display:grid;gap:8px;margin-top:16px}
.wrong-list div{border-top:1px solid var(--line);padding-top:8px}
.wrong-list .a{color:var(--good);font-weight:600}
/* Fragenkatalog */
.browse{display:grid;gap:16px;max-width:860px}
.browse .setup{max-width:none}
.bsearch{width:100%;font:inherit;font-size:.95rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.bsearch:focus{outline:none;border-color:var(--accent)}
.btoggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:.92rem}
.btoggle input{width:18px;height:18px;accent-color:var(--accent)}
.blist{display:grid;gap:10px}
.bhead{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin:14px 0 2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bhead .mono{color:var(--accent)}
.bhead small{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:400}
.bq{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.bq .qmeta{margin:0}
.bq .qtext{font-size:clamp(1.05rem,2.4vw,1.2rem);margin:0}
.bq .opt{padding:9px 12px;cursor:default}
.bq .opt:hover{border-color:var(--line)}
.bq .opt.ok:hover{border-color:var(--good)}
.bq .opt.ok .why{color:var(--good)}
.bq .tf{grid-template-columns:1fr 1fr}
.bq .tf .opt{padding:10px;font-size:.98rem}
.bsol{color:var(--good);font-weight:600;margin:0}
.bexp{color:var(--muted);font-size:.93rem;margin:0;max-width:72ch}
.bfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bfoot .btn{padding:7px 12px;font-size:.88rem}
.tag.unsure{border-color:var(--warn-line);background:var(--warn-bg);color:var(--ink)}
.tag.st{border-style:dashed}
.breveal{display:none}
.blist.hide .bq:not(.rev) .opt.ok{border-color:var(--line);background:var(--paper)}
.blist.hide .bq:not(.rev) .opt.ok .k{background:var(--bg);color:var(--muted)}
.blist.hide .bq:not(.rev) .why,.blist.hide .bq:not(.rev) .bsol,.blist.hide .bq:not(.rev) .bexp{display:none}
.blist.hide .bq:not(.rev) .breveal{display:inline-block}
.bempty{color:var(--muted);padding:12px 2px}


/* Karten */
.cards{max-width:760px}
.cardbox{perspective:1400px;margin:16px 0}
.flip{position:relative;width:100%;min-height:280px;border:0;background:none;padding:0;text-align:left}
.face{position:absolute;inset:0;border-radius:18px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1);border:1px solid var(--line)}
.front{background:var(--paper)}
.back{background:var(--ink);color:var(--bg);transform:rotateY(180deg)}
.flip.on .front{transform:rotateY(-180deg)}
.flip.on .back{transform:rotateY(0)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.face .def{font-size:1.08rem;line-height:1.5;max-width:60ch}
.face .mono{opacity:.7}
.cardnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion: reduce){.face,.bar i{transition:none}}

/* Fortschritt */
.prog{display:grid;gap:14px;max-width:860px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi b{font-family:var(--display);font-weight:800;font-size:2rem;display:block;line-height:1;font-variant-numeric:tabular-nums}

.pet{display:block;overflow:visible}
.pet .pbody{transform-origin:100px 184px;animation:pbreath 3.4s ease-in-out infinite}
.pet .peyes{animation:pblink 5s infinite}
.pet .ptail{animation:pwag 1.8s ease-in-out infinite}
.pet .pears{animation:pear 4s ease-in-out infinite}
.pet .pflop{transform-origin:100px 60px;animation:pear 4.6s ease-in-out infinite}

.pet .ptear{animation:ptear 2.4s ease-in infinite}

.pet.m-sad .pbody{animation-duration:6s}
.pet.m-sad .ptail{animation:none}
.pet.hop{animation:phop .6s cubic-bezier(.3,.7,.3,1)}

@keyframes pblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  '**Psychologengesetz 2013** (BGBl. I Nr. 182/2013) = Bundesgesetz über die **Führung der Bezeichnung „Psychologin“ oder „Psychologe“** und über die **Ausübung der Gesundheitspsychologie und der Klinischen Psychologie**.',

{id:2, s:'Klinische Psychologie', t:'Klinische Psychologin / Klinischer Psychologe', sec:[
 {h:'Tätigkeitsbereiche (§ 22 Psychologengesetz 2013)', b:[

{id:4, s:'Psychotherapie', t:'Psychotherapeut:in – ALT (Übergang) und NEU (Psychotherapiegesetz 2024)', sec:[
 {h:'ALT – Psychotherapiegesetz („2018“), Übergang bis 30.09.2038', b:[
  '**Tätigkeit (§ 1)**: **umfassende, bewusste und geplante Behandlung** von **psychosozial oder auch psychosomatisch bedingten** Verhaltensstörungen und Leidenszuständen – Symptome **mildern oder beseitigen**, gestörte Verhaltensweisen und Einstellungen **ändern**, **Reifung, Entwicklung und Gesundheit** fördern; mit wissenschaftlich-psychotherapeutischen Methoden in einer **Interaktion** zwischen Behandelten und Psychotherapeut:innen.',
  {warn:'Altfrage „Wer behandelt psychosozial bedingte Störungen?“ → Psychotherapeut:in.'},
  '§Ausbildung ALT (§ 2): zweistufig',
  '**Psychotherapeutisches Propädeutikum** = **allgemeine** Ausbildung (**Angebot endet 2030**).',
  '**Fachspezifikum** = **besondere** Ausbildung (**Abschluss bis 2038**).',
  '§Voraussetzung Propädeutikum (§ 10)',
  '**Handlungsfähigkeit** bzgl. Berufsausübung UND (**Reifeprüfung** AHS/BHS oder äquivalent ODER Ausbildung im **Krankenpflegefachdienst** oder **medizinisch-technischen Dienst** ODER **Gutachten des Psychotherapiebeirates** mit Bescheid des Bundeskanzlers).',
  '§Propädeutikum (§ 3)',
  '**Theoretischer Teil mind. 765 Stunden** – tiefenpsychologische, systemische, lerntheoretische, kommunikationstheoretische Konzepte; **Anerkennungen aus dem Psychologiestudium möglich!**',
  '**Praktischer Teil mind. 550 Stunden**: mind. **50 h Selbsterfahrung**, mind. **480 h Praktikum**, mind. **20 h Supervision**.',
  '§Voraussetzung Fachspezifikum (§ 10)',
  '**Mind. 24 Jahre** (ab 1.1.2025 **nur noch als Selbstbeschränkung** einer Fachgesellschaft) · Handlungsfähigkeit · **abgeschlossenes Propädeutikum** · bestätigte Ausbildungs- und Praktikumsstelle · abgeschlossene Ausbildung/Studium in einem Quellberuf (Krankenpflege, MTD, Medizin, Pädagogik, Philosophie, **Psychologie**, Publizistik, Theologie, Lehramt, Musiktherapie, Sozialarbeit …) – **entfällt ab 1.1.2025**.',
  {warn:'Altfragen: „Propädeutikum & Fachspezifikum – Mindestalter?“ → 24 Jahre (Fachspezifikum). „Ausbildungsvoraussetzung Psychotherapeut?“ → kein Psychologiestudium zwingend, aber Propädeutikum + Fachspezifikum.'},
  '§Fachspezifikum (§ 6)',
  '**Theoretischer Teil mind. 300 Stunden** · **Praktischer Teil mind. 1600 Stunden**: mind. **200 h Lehrtherapie/-analyse/Selbsterfahrung**, mind. **550 h Praktikum + 30 h Supervision**, mind. **600 h psychotherapeutische Tätigkeit** mit mind. **120 h begleitender Supervision**.',
  '§Voraussetzung Berufsausübung (§ 10)',
  '**Mind. 28 Jahre** · Handlungsfähigkeit · Propädeutikum + Fachspezifikum · **gesundheitliche Eignung, Vertrauenswürdigkeit, Deutschkenntnisse** · **Eintrag in die Psychotherapeutenliste** (Stichtag 1.10.2026; Aufnahme, wenn man noch unter Supervision arbeitet).',
  '§Berufsbezeichnung (§ 13, § 23)',
  '**„Psychotherapeut“ / „Psychotherapeutin“**; jede Bezeichnung, die die Berechtigung zur selbständigen Ausübung **vortäuscht**, ist untersagt; unbefugtes Führen = **strafbare Handlung oder Verwaltungsübertretung**.'
 ]},
 {h:'NEU – Psychotherapiegesetz 2024', b:[
  '**Definition (§ 6)**: Psychotherapie ist die **erlernte, bewusste, geplante und umfassende Anwendung** wissenschaftlicher Methoden der psychotherapiewissenschaftlichen Ausrichtungen (**Cluster**) **in einer therapeutischen Beziehung**.',
  '§Die 4 Cluster',
  '1. **Humanistische** Therapie · 2. **Psychoanalytisch-Psychodynamische** Therapie · 3. **Systemische** Therapie · 4. **Verhaltenstherapie**.',
  '§Tätigkeitsbereiche (§ 6)',
  '**Eigenverantwortliche** psychotherapeutische **Diagnostik, Behandlung, Beratung, Betreuung oder Begleitung** von Personen **aller Altersstufen**.',
  '**Krankenbehandlung** bei akuten und chronischen Krankheitszuständen (emotional, psychosomatisch, intellektuell oder sozial bedingte Verhaltensstörungen und Leidenszustände).',
  'Förderung **personaler und sozialer Kompetenzen** (Selbsterfahrung & Supervision) · **psychotherapeutische Gutachten** · **Ausbildung, Lehre und Forschung**.',
  '§Ausbildung NEU (§ 10): dreistufig',
  {tbl:[['Stufe','Umfang / Inhalt'],['1. **BA-Studium**','**180 ECTS** (z. B. Psychologie, Psychotherapie …)'],['2. **MA-Studium Psychotherapie**','**120 ECTS**'],['3. **Postgraduelle Fachausbildung**','bei einer **Fachgesellschaft**, Abschluss mit **Approbationsprüfung**']]},
  '**Inhalte BA Psychotherapie**: Kernfächer und Grundlagen inkl. **Einführung in die vier Cluster**, interdisziplinäre Fächer, Forschungsmethoden und wissenschaftliches Arbeiten, praktische psychosoziale Erfahrungen, Supervision und Selbsterfahrung.',
  '**Voraussetzung MA**: facheinschlägiges Studium bzw. Berufsberechtigung – Psychotherapie (BA), **Psychologie (BA)**, Medizin (BA&MA, Dipl.), Soziale Arbeit (BA, MA & 60 ECTS), Sozialpädagogik (MA & 60 ECTS Soziale Arbeit), Musiktherapie, Psychosoziale Beratung, MTD, dipl. Gesundheits- und Krankenpflege, Hebammen.',
  '**Inhalte MA**: Fächer mit Bezug zur psychotherapeutischen Tätigkeit und Wissenschaft, **Methoden der Psychotherapieforschung**, Theorie und Methodik der Behandlungspraxis, Praktika und Übungen (Selbsterfahrung, Praktikum, Praktikumssupervision: **20–40 ECTS**).',
  '**BA & MA zusammen**: **clusterspezifische Grundlagen mind. 40 ECTS**; biopsychosoziale Grundlagen und Psychopathologie = **mind. 40 vH** (Prozent) der interdisziplinären Fächer.',
  '§Fachausbildung',
  '**Voraussetzung**: **MA Psychotherapie** ODER **Klinische Psychologie (Listeneintrag)** ODER **Gesundheitspsychologie (Listeneintrag)** ODER Psychotherapie nach PThG 1990 ODER Musiktherapie (Listeneintrag) ODER Fach-/Allgemeinärzt:innen.',
  '**Inhalte (§ 13)**: theoretische Ausbildung, psychotherapeutische Tätigkeit unter **Lehrsupervision** (= praktische Ausbildung), begleitende Lehrsupervision (Mindestverhältnis **1:5**), psychotherapeutische Selbsterfahrung, individuelle Schwerpunktsetzung, **Vorbereitung zur Approbationsprüfung**.',
  '**Praktische Ausbildung (§ 14)**: in **psychiatrisch-psychosomatischen Einrichtungen** und psychotherapeutischen Versorgungseinrichtungen, inkl. Krankenbehandlungen **mittel- bis schwergradiger** psychischer Erkrankungen; teilweise im **niedergelassenen Bereich** möglich (Lehrsupervision **1:4**).',
  '§Listeneintrag (§ 17, § 22)',
  '**Psychotherapeut:in in Fachausbildung unter Lehrsupervision**: in eine Fachgesellschaft aufgenommen; laut Folie „5 000 Stunden“ cluster- und methodenspezifische Theorie, Selbsterfahrung und Supervision absolviert.',
  '**Psychotherapeut:in**: **absolvierte Approbationsprüfung** (…).',
  '§Berufsbezeichnung (§ 8)',
  '**Psychotherapeut, Psychotherapeutin, Psychotherapeut:in** – die **Ausrichtung/der Cluster kann angefügt** werden. Vortäuschende Bezeichnungen untersagt; unbefugtes Führen = **strafbare Handlung oder Verwaltungsübertretung**.',
  {tbl:[['','ALT (bis 2038)','NEU (PThG 2024)'],['Ausbildung','Propädeutikum + Fachspezifikum','BA (180) + MA Psychotherapie (120) + Fachausbildung'],['Abschluss','Fachspezifikum, Eintrag Liste','**Approbationsprüfung**, Eintrag Liste'],['Studium nötig?','nein (Matura o. Ä. reicht fürs Propädeutikum)','ja – BA + MA'],['Alter','Fachspezifikum 24 (ab 2025 nur Selbstbeschränkung), Berufsausübung 28','keine Altersgrenze auf den Folien'],['Paragraphen Berufsbezeichnung','§ 13, § 23','§ 8']]}
 ]}
]},
{id:5, s:'Ethik: Grundlagen', t:'Ethik in der Psychologie: Teilgebiete, Theorien, Geschichte', sec:[
 {h:'Teilgebiete der Ethik (Felnhofer et al., 2011)', b:[
  '**Philosophische Ethik** gliedert sich in **Allgemeine Ethik** und **Angewandte Ethik**.',
  '**Allgemeine Ethik** = Suche nach der **„richtigen“ Moral** → entwickelt (allgemeine, formale) **Kriterien zur moralischen Beurteilung von Handlungen**. Teilgebiete: **Normative Ethik**, **Metaethik**, **Deskriptive Ethik**.',
  '**Angewandte Ethik**: Die Anwendung allgemeiner ethischer Theorien auf besondere Einzelfälle ist **nicht möglich** → **Bereichsethiken** (bereichsspezifische Ethiken): Jeder Bereich hat **spezifische moralische Probleme**, **Konfliktlösung im Vordergrund**, **eigene ethische Prinzipien**.',
  '§Stammbaum der angewandten Ethik',
  '**Bioethik** → **Medizinethik** → **Psychologische Ethik**. Daneben: **Sozialethik** → **Rechtsethik/Wirtschaftsethik**.',
  {warn:'Psychologische Ethik ist ein Teil der ANGEWANDTEN Ethik (unter Bio- und Medizinethik) – nicht der allgemeinen Ethik.'}
 ]},
 {h:'Normative Ethik: drei Theorien', b:[
  {tbl:[['Theorie','Vertreter','Ziel','Kernprinzip'],['**Tugendethik**','**Aristoteles**','**Tugend** (Charakter und Verstand)','**Weg des Mittleren** (Balance zwischen Affekt und Vernunft)'],['**Pflichtethik**','**Kant**','**Vernunft**','**Kategorischer Imperativ** (subjektive Maxime auf Verallgemeinerbarkeit prüfen)'],['**Utilitarismus**','**Mill**','**Glück** = Lust und Freisein von Unlust','**Nützlichkeitsprinzip** (Förderung von Glück für alle Betroffenen)']]},
  {warn:'Altfragen: Mill → Nützlichkeitsprinzip · Aristoteles → Weg des Mittleren · Kant → Vernunft/kategorischer Imperativ. Die Zuordnungen werden gern vertauscht.'}
 ]},
 {h:'Geschichte der psychologischen Ethik', b:[
  '**Eid des Hippokrates** (um 460–370 v. Chr.): nach **bestem Wissen und Gewissen**, Patienten vor **Schaden und willkürlichem Unrecht** bewahren, **Verschwiegenheit**.',
  '**Nürnberger Kodex (1946/47)** – nach dem 2. Weltkrieg: **Informed consent** (freiwillige Zustimmung nach Aufklärung), **Abbruch möglich**, für das **Wohl der Gesellschaft**, **wissenschaftliche Basis**, **wissenschaftliches Personal**.',
  '**Deklaration von Helsinki (1964/2013)**: **Forschung am Menschen** (zeitlich nach dem Nürnberger Kodex, baut darauf auf).',
  {warn:'Altfragen: „Informed consent erstmals festgelegt in?“ / „Forschung am Menschen nur freiwillig – erstmals?“ / „Dokument nach dem 2. Weltkrieg zur Forschungsethik?“ → jeweils Nürnberger Kodex. Helsinki = Weiterentwicklung (1964).'},
  '§Ethikrichtlinien der Berufsverbände',
  {tbl:[['Verband','Jahr(e)'],['**American Psychological Association (APA)**','**1952**/2010 – die erste'],['**European Federation of Psychologists’ Associations (EFPA)**','**1995/2005**'],['DGPs & BDP (Deutschland)','1998/2016'],['**BÖP** und **Bundesministerium** für Soziales, Gesundheit, Pflege und Konsumentenschutz (Österreich)','**2002/2020**']]},
  {warn:'Altfragen: erstes Ethikregelwerk eines Berufsverbands = APA (1952). Österreichische Ethikrichtlinie: 2002 beschlossen, 2020 erneuert (Ministerium, gemeinsam mit BÖP).'}
 ]},
 {h:'Warum psychologische Ethik?', b:[
  'Charakteristische Eigenschaften der Psychologie:',
  '1. **Spezielle Methoden** für Diagnostik, Behandlung, Forschung.',
  '2. Arbeit mit **vulnerablen Populationen** – z. B. Kinder, ältere Menschen, psychisch Kranke, **Studierende**.',
  '3. **Entwicklung neuer Techniken und Anwendungen** – z. B. Internet bei Forschung, Behandlung.',
  '4. **Berufsethos**.',
  '§Untersuchungsscheine im Psychologiestudium',
  'Die Teilnahme an Studien und Experimenten soll Studierende mit **Paradigmen und Methoden** vertraut machen und diese **aus der Perspektive der Untersuchungsteilnehmer:innen** kennenlernen lassen (Curriculum BA 2016, § 3).',
  {warn:'Altfrage „Versuchsscheine & Ethik“ → fördern das Verständnis für die Perspektive der Teilnehmer:innen.'}
 ]}
]},
{id:6, s:'Ethikrichtlinie & Meta-Code', t:'Ethikrichtlinie für Psycholog:innen in Österreich · EFPA Meta-Code of Ethics', sec:[
 {h:'Ethikrichtlinie Österreich (bmasgk, 2020)', b:[
  '§1 Präambel – wozu?',
  'Zum **Schutz** der zu behandelnden/betreuenden Personen vor **unethischen Praktiken**.',
  'Als **Orientierung** für Berufsangehörige der **Klinischen Psychologie und Gesundheitspsychologie**.',
  '**Ergänzung und Konkretisierung der Berufspflichten** gem. **Psychologengesetz 2013**.',
  {warn:'Altfrage „Zusammenhang Ethik & Gesetz“ → Ethik(richtlinie) ergänzt und konkretisiert die gesetzlichen Berufspflichten.'},
  '**Basis = Meta-Code of Ethics (EFPA)** → Prinzipien: **Achtung vor der Würde und den Rechten der Person**, **Kompetenz**, **Verantwortung**, **Integrität**.',
  'Weitere Präambel-Punkte: ethisches Handeln muss **ideologiefrei** sein · Grundhaltungen und Handlungen **selbstverantwortlich reflektieren** · über **Qualifikationen, Ausbildung, eigene Ziele und Ziele der Organisation aufklären**, gegen irreführende Infos durch Dritte verwahren · **Grenzen** des eigenen Wissens, der Kompetenz und Methoden berücksichtigen · **besondere Verpflichtung zur Fortbildung**.',
  '§2 Grundsätze zur Berufsausübung',
  'a. **Arbeitsbeziehung** (klinisch-/gesundheitspsychologisch) · b. **Setting und Gestaltung eines Therapieraumes** · c. **Verschwiegenheit** · d. Beziehung zum **Auftrag-/Arbeitgeber** · e. Erstellung von **Gutachten**.'
 ]},
 {h:'EFPA Meta-Code of Ethics (1995, 2005)', b:[
  'Psycholog:innen bemühen sich, die **Öffentlichkeit** bei fundierten Beurteilungen und Entscheidungen über menschliches Verhalten zu unterstützen, und ihr Wissen zur **Verbesserung der Lebensbedingungen** Einzelner und der Gesellschaft einzusetzen.',
  'Gilt als gemeinsame Basis der Ethikrichtlinien der **europäischen** Psycholog:innen-Verbände; wird ergänzt durch den **Model Code of Ethics**.',
  '§Die 4 ethischen Prinzipien – und ihre wechselseitigen Beziehungen!',
  '1. **Achtung vor den Rechten und der Würde des Menschen** · 2. **Kompetenz** · 3. **Verantwortung** · 4. **Integrität**.'
 ]},
 {h:'1 Achtung vor Rechten und Würde', b:[
  '**1. Allgemeiner Respekt**: Wissen, Einsicht, Erfahrung und Fachkenntnisse von Klient:innen, Dritten, Kolleg:innen, Studierenden und Öffentlichkeit anerkennen; individuelle, kulturelle und rollenspezifische Unterschiede anerkennen (Geschlecht, Sprache, Alter …); **unfaire Handlungen und Diskriminierung vermeiden**.',
  '**2. Privatsphäre und Vertraulichkeit**: Informationen nur für **professionelle Zwecke** beschaffen/weitergeben · **Recht auf Einsicht** (inkl. Unterstützung/Beratung) · **Vertraulichkeit** bei Ablage/Bearbeitung aller Informationen · **gesetzliche Einschränkungen** der Vertraulichkeit müssen **vermittelt** werden · bei gesetzlicher Informationspflicht **nur erforderliche Angaben** weitergeben · Anerkennung des **Spannungsverhältnisses** zwischen Vertraulichkeit und Schutz des Klienten oder anderer.',
  '**3. Informiertes Einverständnis und Freiheit der Zustimmung**: **Aufklärung und fortlaufende Besprechung** des Vorgehens und der wahrscheinlichen Auswirkungen; Aufklärung über **Aktenführung und Berichterstattung**.',
  '**4. Selbstbestimmung**: **Autonomie maximieren** – inkl. Recht, die Beziehung zu **beginnen und zu beenden**; **Grenzen** der Selbstbestimmung beachten (Entwicklungsalter, psychischer Gesundheitszustand, Rechtsnormen).',
  '§Spannungsverhältnis im Psychologengesetz → ethisches Dilemma',
  '**Verschwiegenheitspflicht (§ 37)**: Verschwiegenheit über alle in Ausübung des Berufes oder in der Ausbildung anvertrauten/bekannt gewordenen Geheimnisse. **Entbindung** nur durch die **entscheidungsfähige Patientin / den Patienten selbst** (höchstpersönliches Recht).',
  '**Berufsausübung nach bestem Wissen und Gewissen (§ 32)**: das **Wohl der Kranken** und den **Schutz der Gesunden** wahren.',
  'Frage: **Wann darf Vertraulichkeit (Berufsgeheimnis) verletzt werden?** → **ethisches Dilemma** zwischen § 37 und § 32.',
  {warn:'Altfrage „Dokument, das Ausnahmen der Verschwiegenheit regelt“ → Psychologengesetz (§ 37 / § 32). Die genaue Ausnahme („unmittelbare Gefahr“) steht nicht auf den Folien → siehe Kapitel 7.'}
 ]},
 {h:'2 Kompetenz', b:[
  '1. **Ethisches Bewusstsein** · 2. **Grenzen der Kompetenz** · 3. **Grenzen von Vorgehensweisen** · 4. **Kontinuierliche berufliche Weiterentwicklung** · 5. **Berufsunfähigkeit**.',
  {warn:'Altfrage „Wann ist die Berufsausübung untersagt?“ → bei Beeinträchtigung (psychisch/körperlich) – auf den Folien als Unterpunkt „Berufsunfähigkeit“ beim Prinzip Kompetenz.'}
 ]},
 {h:'3 Verantwortung', b:[
  '**1. Allgemeine Verantwortung**: für **Qualität und Auswirkungen** der eigenen professionellen Tätigkeit; dem **Ansehen des Berufsstandes** keinen Schaden zufügen.',
  '**2. Förderung hoher Standards** im wissenschaftlichen und beruflichen Handeln; Tätigkeiten in Übereinstimmung mit den Ethischen Richtlinien.',
  '**3. Vermeidung von Schaden**: **Missbrauch** psychologischer Kenntnisse/Praktiken vermeiden; **vorhersehbares und unvermeidbares Leid minimieren**; **besondere Vorsicht** bei Forschung oder fachlichen Bewertungen **ohne Zustimmung** der Betroffenen.',
  '**4. Nachsorge**: Verantwortung für notwendige **Weiterbetreuung**, wenn Betreuung unterbrochen oder beendet wird.',
  '**5. Erweiterte Verantwortung**: auch für ethische Standards von **Angestellten, Assistent:innen, Supervisand:innen und Studierenden**.',
  '**6. Lösung von Dilemmata**: anerkennen, dass Dilemmata auftreten; Psycholog:in ist **selbst verantwortlich**, sie zu klären; **Kolleg:innen und/oder nationalen Verband konsultieren**; Betroffene über die Ethischen Richtlinien informieren.'
 ]},
 {h:'4 Integrität', b:[
  '1. **Anerkennung beruflicher Grenzen** · 2. **Ehrlichkeit und Korrektheit** · 3. **Aufrichtigkeit und Offenheit** · 4. **Interessenskonflikte und Ausnutzung** · 5. **Handlungen von Kolleg:innen**.',
  '**Ehrlichkeit und Korrektheit**: **Qualifikationen und finanzielle Rahmenbedingungen** korrekt darstellen; **alternative Hypothesen** und entgegenstehende Sachverhalte erwähnen, nicht unterschlagen; **Einschränkungen** bei Schlussfolgerungen in Berichten genau darstellen.',
  '**Aufrichtigkeit und Offenheit**: Informationen offenlegen und **Täuschung vermeiden**; **hat Täuschung stattgefunden** → Pflicht, darüber **aufzuklären** und das **Vertrauen wiederherzustellen**.',
  '**Interessenskonflikte und Ausnutzung**: um Probleme durch **Doppelrollen** wissen und sie **vermeiden**; berufliche Beziehung nicht für andere (persönliche, religiöse …) Interessen ausnutzen; Machtungleichgewicht kann **auch nach Ende** der Beziehung nachwirken.',
  '**Handlungen von Kolleg:innen**: bei unethischen Handlungen Pflicht zu **angemessener Kritik**, **Information der Kolleg:innen** und – wenn angebracht – Information der **zuständigen Berufsverbände und Aufsichtsorgane**.',
  {warn:'Altfrage „Verpflichtung bei unethischem Verhalten eines Kollegen“ → Kurzantwort: Meldung an Aufsichtsorgan/Berufsverband. Laut Folie gestuft: zuerst angemessene Kritik und Info an den Kollegen, wenn angebracht auch an Berufsverband/Aufsichtsorgane.'}
 ]},
 {h:'Fazit', b:[
  '**Große Verantwortung** durch Arbeit mit und am Menschen · **weitreichende Einflussmöglichkeiten** bei teilweise vulnerablen Menschen · **kein Regelwerk** kann allen Einzelfällen gerecht werden · **ethisches Bewusstsein und reflektives Abwägen** (ggf. mit Unterstützung) sind notwendig.'
 ]}
]},
{id:7, x:1, s:'Extra · nicht auf Folien', t:'Extra: Altfragen-Antworten, die NICHT auf deinen Folien stehen', sec:[
 {h:'Wozu dieses Kapitel?', b:[
  {warn:'Diese Punkte kommen in den Altfragen-Kurzantworten vor, stehen aber nicht auf den 7 Foliensätzen für den 30.11. Laut Moodle sind nur die Folien Stoff. Trotzdem kurz anschauen, weil sie schon einmal gefragt wurden. Die Fragen dazu sind NICHT in „Alle“ und nicht in der Simulation.'}
 ]},
 {h:'Ethik-Theorie', b:[
  '**Metaethik** beschäftigt sich mit den **Grundlagen und der Bedeutung moralischer Aussagen** (auf der Folie nur als Begriff genannt).',
  '**Vier Prinzipien nach Beauchamp & Childress** (Medizinethik): **Selbstbestimmung (Autonomie), Nichtschaden, Wohltun, Gerechtigkeit**.',
  '**„Slippery slope“**: schleichendes Abrutschen durch **gut gemeinte, aber schlecht reflektierte Beweggründe**.',
  'Eid des Hippokrates: Die Kurzantwort nennt zusätzlich das **Verbot von Sterbehilfe** (Folie: bestes Wissen und Gewissen, vor Schaden bewahren, Verschwiegenheit).'
 ]},
 {h:'Verschwiegenheit, Täuschung, Daten', b:[
  '**Bruch der Verschwiegenheit** laut Kurzantwort nur bei **sicherer oder höchstwahrscheinlicher, unmittelbarer Gefahr für andere** (Folie: nur das Dilemma § 37 vs. § 32).',
  '**Täuschung in Experimenten** laut Kurzantwort nur, wenn die Forschung **ohne Täuschung nicht möglich** ist und **danach aufgeklärt** wird (Folie: Täuschung vermeiden, wenn sie stattfand → aufklären).',
  '**Besondere Kategorien personenbezogener Daten** (DSGVO): z. B. Gesundheit, ethnische Herkunft, Religion – **Geschlecht zählt NICHT** dazu.',
  'Unethisches Handeln von Psycholog:innen kann eine **Verwaltungsstrafe / ein Aufsichtsverfahren** nach sich ziehen.'
 ]},
 {h:'Strafen', b:[
  'Unbefugte Titelführung **Psychotherapeut:in**: Kurzantwort nennt **Geldstrafe bis 3.600 €** (veraltet; auf der Folie steht nur „strafbare Handlung oder Verwaltungsübertretung“). Psycholog:in: **bis 15 000 €** – das steht auf der Folie.'
 ]}
]}
];

[3,'Beratung (Gesundheitspsychologie)','Personen: Förderung der Gesundheit, Vermeidung von Risiken (Lebens-, Freizeit-, Arbeitswelt). **Organisationen**: Gesundheitsförderung, -vorsorge, **Rehabilitation**.'],

[3,'Praktisch-fachlich Gesundheit (§ 15)','Mind. **1553 h**, je mind. **500 h** Grund-/Aufbaumodul, **Supervision 100 EH**, **Selbsterfahrung 76 EH**.'],

[4,'Voraussetzung Fachspezifikum','**24 Jahre** (ab 1.1.2025 nur Selbstbeschränkung), Handlungsfähigkeit, **Propädeutikum**, bestätigte Ausbildungs-/Praktikumsstelle; Quellberuf **entfällt ab 1.1.2025**.'],

[4,'Die 4 Cluster','**Humanistisch** · **Psychoanalytisch-Psychodynamisch** · **Systemisch** · **Verhaltenstherapie**.'],

[4,'NEU: Voraussetzung MA','U. a. Psychotherapie (BA), **Psychologie (BA)**, Medizin, Soziale Arbeit (+60 ECTS), Sozialpädagogik, Musiktherapie, Gesundheits-/Krankenpflege, Hebammen.'],

[4,'NEU: Lehrsupervision','Begleitend im Verhältnis **1:5**; im **niedergelassenen** Bereich **1:4**.'],

[5,'Philosophische Ethik','Teilt sich in **Allgemeine Ethik** und **Angewandte Ethik** (Felnhofer et al., 2011).'],
[5,'Allgemeine Ethik','Suche nach der **„richtigen“ Moral** → **Kriterien zur moralischen Beurteilung** von Handlungen. Teile: **normativ, Meta-, deskriptiv**.'],
[5,'Angewandte Ethik','Allgemeine Theorien sind nicht direkt auf Einzelfälle anwendbar → **Bereichsethiken**: spezifische Probleme, **Konfliktlösung**, eigene Prinzipien.'],
[5,'Einordnung psychologische Ethik','Angewandte Ethik → **Bioethik** → **Medizinethik** → **Psychologische Ethik**.'],

[5,'Informed consent','**Freiwillige Zustimmung nach Aufklärung** – erstmals im **Nürnberger Kodex**.'],

[5,'EFPA','European Federation of Psychologists’ Associations: Ethik **1995/2005** → **Meta-Code of Ethics**.'],
[5,'Ethikrichtlinie Österreich','**BÖP + Bundesministerium** (Soziales, Gesundheit, Pflege, Konsumentenschutz): **2002**, erneuert **2020**.'],
[5,'Warum psychologische Ethik? (4)','**Spezielle Methoden**, **vulnerable Populationen**, **neue Techniken** (Internet), **Berufsethos**.'],
[5,'Vulnerable Populationen','Z. B. **Kinder**, ältere Menschen, psychisch Kranke – und **Studierende**.'],
[5,'Untersuchungsscheine','Studierende lernen Paradigmen und Methoden **aus der Perspektive der Teilnehmer:innen** kennen (Curriculum BA 2016).'],
[6,'Ethikrichtlinie: Zweck','**Schutz** vor unethischen Praktiken, **Orientierung** für Klinische & Gesundheitspsycholog:innen, **Ergänzung/Konkretisierung** der Berufspflichten nach PG 2013.'],
[6,'Basis der österr. Ethikrichtlinie','**Meta-Code of Ethics (EFPA)**.'],
[6,'Präambel: weitere Punkte','**Ideologiefrei**, selbstverantwortlich reflektieren, über Qualifikation/Ziele aufklären, **Grenzen** beachten, **Fortbildungspflicht**.'],
[6,'Grundsätze zur Berufsausübung','a) Arbeitsbeziehung · b) **Setting/Therapieraum** · c) **Verschwiegenheit** · d) Auftrag-/Arbeitgeber · e) **Gutachten**.'],
[6,'4 Prinzipien Meta-Code','**Achtung vor Rechten und Würde** · **Kompetenz** · **Verantwortung** · **Integrität** (+ deren Wechselbeziehungen).'],
[6,'Achtung vor Rechten und Würde (4)','Allgemeiner Respekt · **Privatsphäre & Vertraulichkeit** · **Informiertes Einverständnis** & Freiheit der Zustimmung · **Selbstbestimmung**.'],
[6,'Privatsphäre & Vertraulichkeit','Infos nur für **professionelle Zwecke**; Recht auf **Einsicht**; gesetzliche Grenzen **vermitteln**; bei Informationspflicht **nur Erforderliches** weitergeben.'],
[6,'Informiertes Einverständnis (EFPA)','**Fortlaufende** Aufklärung über Vorgehen und Auswirkungen; auch über **Aktenführung und Berichterstattung**.'],
[6,'Selbstbestimmung (EFPA)','**Autonomie maximieren**, Recht Beziehung zu **beginnen und zu beenden**; Grenzen: Entwicklungsalter, psychischer Zustand, Rechtsnormen.'],
[6,'§ 37 Psychologengesetz','**Verschwiegenheitspflicht**; Entbindung nur durch die **entscheidungsfähige Patientin/den Patienten** selbst.'],
[6,'§ 32 Psychologengesetz','Berufsausübung nach **bestem Wissen und Gewissen**: **Wohl der Kranken** und **Schutz der Gesunden**.'],
[6,'Ethisches Dilemma Verschwiegenheit','Spannung zwischen **§ 37** (Verschwiegenheit) und **§ 32** (Schutz der Gesunden): Wann darf das Berufsgeheimnis verletzt werden?'],
[6,'Kompetenz (5)','**Ethisches Bewusstsein**, **Grenzen der Kompetenz**, **Grenzen von Vorgehensweisen**, **Weiterentwicklung**, **Berufsunfähigkeit**.'],
[6,'Verantwortung (6)','Allgemeine Verantwortung · hohe Standards · **Vermeidung von Schaden** · **Nachsorge** · **erweiterte Verantwortung** · **Lösung von Dilemmata**.'],
[6,'Vermeidung von Schaden','Kein **Missbrauch**; vorhersehbares, unvermeidbares **Leid minimieren**; Vorsicht bei Forschung/Bewertung **ohne Zustimmung**.'],
[6,'Nachsorge','Verantwortung für **Weiterbetreuung**, wenn die Betreuung unterbrochen oder beendet wird.'],
[6,'Erweiterte Verantwortung','Auch für ethische Standards von **Angestellten, Assistent:innen, Supervisand:innen, Studierenden**.'],
[6,'Lösung von Dilemmata','Selbst verantwortlich klären; **Kolleg:innen/nationalen Verband konsultieren**; Betroffene über Richtlinien informieren.'],
[6,'Integrität (5)','**Berufliche Grenzen** · **Ehrlichkeit & Korrektheit** · **Aufrichtigkeit & Offenheit** · **Interessenskonflikte & Ausnutzung** · **Handlungen von Kolleg:innen**.'],

[6,'Unethische Kolleg:innen','**Angemessene Kritik**, **Information der Kolleg:innen**, wenn angebracht **Berufsverband/Aufsichtsorgane** informieren.'],
[6,'Model Code of Ethics','**Ergänzt** den Meta-Code of Ethics (EFPA).'],
[6,'Fazit Ethik','Kein Regelwerk deckt alle Einzelfälle → **ethisches Bewusstsein und reflektives Abwägen** (ggf. mit Unterstützung).'],
[7,'Beauchamp & Childress','**Autonomie (Selbstbestimmung), Nichtschaden, Wohltun, Gerechtigkeit** – nicht auf deinen Folien.'],
[7,'Slippery slope','Gut gemeinte, aber **schlecht reflektierte** Beweggründe – nicht auf deinen Folien.'],
[7,'Metaethik','Grundlagen und **Bedeutung moralischer Aussagen** (Definition nicht auf der Folie).']

{c:5,t:'ms',alt:1,q:'Welche Teilbereiche gehören zur allgemeinen Ethik?',o:['Normative Ethik','Metaethik','Deskriptive Ethik','Bioethik','Medizinethik'],a:[0,1,2],e:'Allgemeine Ethik = normativ, Meta-, deskriptiv. Bio- und Medizinethik gehören zur **angewandten** Ethik.'},
{c:5,t:'mc',alt:1,q:'Worauf beruht der Utilitarismus nach Mill?',o:['Nützlichkeitsprinzip','Weg des Mittleren','Kategorischer Imperativ','Prinzip der Gerechtigkeit'],a:0,e:'Mill: Ziel Glück (Lust, Freisein von Unlust) → **Nützlichkeitsprinzip** (Glück für alle Betroffenen fördern).'},
{c:5,t:'mc',alt:1,q:'Was kennzeichnet die Tugendethik nach Aristoteles?',o:['Weg des Mittleren','Nützlichkeitsprinzip','Kategorischer Imperativ','Informed consent'],a:0,e:'Ziel Tugend (Charakter und Verstand), **Weg des Mittleren** = Balance zwischen Affekt und Vernunft.'},
{c:5,t:'mc',alt:1,q:'Worauf baut Kants Ethik auf?',o:['Vernunft und kategorischer Imperativ','Glück und Nützlichkeitsprinzip','Tugend und Weg des Mittleren','Wohltun und Nichtschaden'],a:0,e:'Pflichtethik: Ziel **Vernunft**, **kategorischer Imperativ** (subjektive Maxime auf Verallgemeinerbarkeit prüfen).'},
{c:7,t:'ms',alt:1,q:'Welche vier Prinzipien formulieren Beauchamp & Childress?',o:['Selbstbestimmung (Autonomie)','Nichtschaden','Wohltun','Gerechtigkeit','Integrität'],a:[0,1,2,3],e:'Achtung: nicht in deinen Unterlagen (Folien) – nur in der Altfragen-Kurzantwort. Integrität ist ein Prinzip des EFPA Meta-Codes.'},

{c:7,t:'mc',alt:1,q:'Womit beschäftigt sich die Metaethik?',o:['Mit Grundlagen und Bedeutung moralischer Aussagen','Mit der Beschreibung tatsächlich gelebter Moral','Mit konkreten Regeln für einzelne Berufsfelder','Mit Kriterien für Ethikkommissionen'],a:0,e:'Auf der Folie steht nur der Begriff „Metaethik“ als Teil der allgemeinen Ethik; die Definition ist nicht in deinen Unterlagen, sondern aus der Kurzantwort.'},
{c:5,t:'mc',alt:1,q:'Welcher Berufsverband hat als erster ein Ethikregelwerk veröffentlicht?',o:['APA (American Psychological Association), 1952','EFPA, 1995','BÖP, 2002','DGPs & BDP, 1998'],a:0,e:'Folie „Geschichte“: APA 1952/2010, EFPA 1995/2005, DGPs/BDP 1998/2016, BÖP & Ministerium 2002/2020.'},

{c:5,t:'mc',alt:1,q:'Wann wurden in Österreich die Ethikrichtlinien für Psycholog:innen beschlossen und wann erneuert?',o:['2002 beschlossen, 2020 erneuert','1952 beschlossen, 2010 erneuert','1995 beschlossen, 2005 erneuert','1998 beschlossen, 2016 erneuert'],a:0,e:'BÖP und Bundesministerium (Soziales, Gesundheit, Pflege, Konsumentenschutz): **2002/2020**. Die anderen Jahreszahlen gehören zu APA, EFPA und DGPs/BDP.'},
{c:5,t:'mc',alt:1,q:'Wer hat die aktuelle österreichische Ethikrichtlinie (2020) herausgegeben?',o:['Das Bundesministerium für Soziales, Gesundheit, Pflege und Konsumentenschutz','Die American Psychological Association','Die Deutsche Gesellschaft für Psychologie','Die Universität Graz'],a:0,e:'Folie: „Ethikrichtlinie – bmasgk (2020)“, gemeinsam mit dem BÖP.'},

{c:6,t:'ms',alt:1,q:'Welche vier Grundsätze enthält der Meta-Code of Ethics?',o:['Achtung vor Rechten und Würde','Kompetenz','Verantwortung','Integrität','Wohltun'],a:[0,1,2,3],e:'Die 4 ethischen Prinzipien der EFPA – und deren wechselseitige Beziehungen. Wohltun gehört zu Beauchamp & Childress.'},
{c:6,t:'mc',alt:1,q:'Worauf basiert die Ethikrichtlinie des Ministeriums (bmasgk)?',o:['Auf dem Meta-Code of Ethics','Auf dem Psychotherapiegesetz 2024','Auf dem Nürnberger Kodex','Auf der Deklaration von Helsinki'],a:0,e:'Präambel der Ethikrichtlinie 2020.'},
{c:5,t:'mc',alt:1,q:'Wo wurde der informed consent erstmals festgelegt?',o:['Im Nürnberger Kodex','In der Deklaration von Helsinki','Im Eid des Hippokrates','In der APA-Richtlinie 1952'],a:0,e:'Nürnberger Kodex: informed consent = freiwillige Zustimmung nach Aufklärung, Abbruch möglich.'},

{c:7,t:'mc',alt:1,q:'Wann ist Täuschung in Experimenten erlaubt?',o:['Nur wenn die Forschung ohne Täuschung nicht möglich ist und danach aufgeklärt wird','Immer, solange die Versuchspersonen volljährig sind','Nie, Täuschung ist ausnahmslos verboten','Wenn die Ethikkommission nachträglich zustimmt'],a:0,e:'Antwort aus der Kurzantwort, nicht in deinen Unterlagen. Auf der Folie (Integrität, Aufrichtigkeit) steht nur: Täuschung vermeiden; wenn sie stattfand, aufklären und Vertrauen wiederherstellen.'},
{c:5,t:'mc',alt:1,q:'Welches Dokument verlangte erstmals die freiwillige Teilnahme (informed consent)?',o:['Nürnberger Kodex','Meta-Code of Ethics','Psychologengesetz 2013','Ethikrichtlinie 2002'],a:0,e:'Nürnberger Kodex 1946/47.'},
{c:7,t:'mc',alt:1,q:'Wann ist eine Verletzung der Verschwiegenheitspflicht zulässig?',o:['Nur bei sicherer oder höchstwahrscheinlicher, unmittelbarer Gefahr für andere','Immer, wenn Angehörige danach fragen','Wenn der Arbeitgeber es verlangt','Wenn die Therapie abgeschlossen ist'],a:0,e:'Kurzantwort, die Formulierung ist nicht in deinen Unterlagen. Auf der Folie: Spannungsverhältnis § 37 (Verschwiegenheit) vs. § 32 (Schutz der Gesunden) → ethisches Dilemma; Entbindung nur durch die entscheidungsfähige Patientin selbst.'},
{c:6,t:'ms',alt:1,q:'Wozu sind Psycholog:innen bei unethischem Verhalten eines Kollegen verpflichtet?',o:['Zu angemessener Kritik','Zur Information des Kollegen','Wenn angebracht: Information von Berufsverband/Aufsichtsorganen','Zur sofortigen Anzeige bei der Polizei'],a:[0,1,2],e:'Integrität 5 „Handlungen von KollegInnen“. Die Kurzantwort sagt kurz „Meldung an Aufsichtsorgan/Berufsverband“ – laut Folie aber nur „wenn angebracht“, zuerst Kritik und Information des Kollegen.'},
{c:1,t:'mc',alt:1,q:'Wann darf man sich in Österreich „Psychologin“ bzw. „Psychologe“ nennen?',o:['Nach abgeschlossenem Psychologiestudium mit mind. 300 ECTS (also Bachelor + Master)','Nach abgeschlossenem Bachelorstudium Psychologie','Nach Abschluss einer Psychotherapieausbildung','Nach zwei Semestern Masterstudium'],a:0,e:'§ 4 Abs. 1 Psychologengesetz 2013: mind. **300 ECTS**.'},

{c:7,t:'mc',alt:1,q:'Welche Geldstrafe nennt die Altfragen-Kurzantwort für unbefugtes Führen der Bezeichnung Psychotherapeut:in?',o:['Bis 3 600 €','Bis 15 000 €','Bis 500 €','Bis 50 000 €'],a:0,e:'Nicht in deinen Unterlagen und veraltet. Auf den Folien (ALT § 13/§ 23, NEU § 8) steht nur: strafbare Handlung oder Verwaltungsübertretung.'},
{c:3,t:'mc',alt:1,q:'Bei welcher Ausbildung ist die praktisch-fachliche Ausbildung aufwendiger?',o:['Klinische Psychologie (mind. 2098 h)','Gesundheitspsychologie (mind. 1553 h)','Beide sind gleich aufwendig','Psychotherapeutisches Propädeutikum (480 h)'],a:0,e:'Laut Folien: Klinische mind. **2098 h** (Supervision 120 EH), Gesundheit mind. **1553 h** (Supervision 100 EH). Die Kurzantwort nennt alte Zahlen (2.194 bzw. 1.729 h).'},
{c:3,t:'mc',alt:1,q:'Wie viele Stunden Fachausbildungstätigkeit umfasst die praktisch-fachliche Ausbildung in Gesundheitspsychologie mindestens?',o:['1553 Stunden','2098 Stunden','1729 Stunden','2194 Stunden'],a:0,e:'§ 15: mind. **1553 h**. 1729/2194 h = alte Zahlen aus der Kurzantwort, 2098 h = Klinische Psychologie.'},
{c:4,t:'mc',alt:1,q:'Was ist (nach altem Recht) Ausbildungsvoraussetzung für Psychotherapeut:innen?',o:['Kein bestimmtes Studium zwingend, aber Propädeutikum und Fachspezifikum','Ein abgeschlossenes Psychologiestudium (300 ECTS)','Ein Medizinstudium mit Facharzt','Ein Bachelor in Psychotherapie'],a:0,e:'ALT: Propädeutikum (Matura o. Ä. reicht) + Fachspezifikum; die Quellberufs-Voraussetzung fürs Fachspezifikum entfällt ab 1.1.2025.'},
{c:4,t:'mc',alt:1,q:'Welches Mindestalter gilt (alt) für das Fachspezifikum?',o:['24 Jahre','18 Jahre','28 Jahre','21 Jahre'],a:0,e:'Mind. **24 Jahre** – ab 1.1.2025 nur noch als Selbstbeschränkung einer Fachgesellschaft. 28 Jahre = Berufsausübung.'},
{c:1,t:'tf',alt:1,q:'Wer einen Bachelor Psychologie (180 ECTS) und 60 ECTS aus einem Master hat, darf sich „Psychologin“ nennen.',a:false,e:'Nein: 180 + 60 = 240 ECTS – nötig sind **mind. 300 ECTS** (§ 4 Abs. 1). Abgebrochener Master = keine Berechtigung.'},
{c:1,t:'ms',alt:1,q:'Wofür gilt das Psychologengesetz 2013?',o:['Für die Führung der Bezeichnung „Psychologin/Psychologe“','Für die Ausübung der Klinischen Psychologie','Für die Ausübung der Gesundheitspsychologie','Für die Ausübung der Psychotherapie'],a:[0,1,2],e:'Titel des Gesetzes. Psychotherapie ist im **Psychotherapiegesetz** geregelt.'},
{c:6,t:'mc',alt:1,q:'Wann ist die Berufsausübung untersagt bzw. die Kompetenz nicht mehr gegeben?',o:['Bei psychischer oder körperlicher Beeinträchtigung (Berufsunfähigkeit)','Wenn man keine Fortbildung besucht hat','Wenn ein Klient die Behandlung beendet','Wenn man im Ausland arbeitet'],a:0,e:'Kompetenz Punkt 5 „Berufsunfähigkeit“ (EFPA).'},
{c:2,t:'mc',alt:1,q:'Wer darf klinisch-psychologische Befunde erstellen?',o:['Nur Klinische Psycholog:innen','Alle Psycholog:innen mit Master','Auch Gesundheitspsycholog:innen','Psychotherapeut:innen nach altem Recht'],a:0,e:'Tätigkeitsvorbehalt § 22: berufsmäßige Ausübung klinisch-psychologischer Tätigkeiten nur Klinischen Psycholog:innen.'},
{c:3,t:'mc',alt:1,q:'Darf eine Gesundheitspsychologin diagnostizieren?',o:['Ja, aber im Bereich Gesundheitsverhalten/Risikoverhalten (Analyse, Befunde)','Ja, auch psychische Störungen (klinische Diagnostik)','Nein, überhaupt nicht','Nur mit ärztlicher Zuweisung'],a:0,e:'§ 13: Analyse von Gesundheitsverhalten, Befunde/Gutachten zu gesundheitsbezogenem Risikoverhalten. Klinische Diagnostik ist Klinischen Psycholog:innen vorbehalten.'},
{c:1,t:'mc',alt:1,q:'Was muss gegeben sein, damit eine Praxis im Bachelor angerechnet wird?',o:['An der Einrichtung ist eine berufserfahrene Psychologin/ein berufserfahrener Psychologe tätig','Die Einrichtung ist eine Klinik','Die Praxis dauert mindestens 6 Monate','Die Praxis wird im Ausland absolviert'],a:0,e:'Folie „Praxis während des BA“ (bis zu 50 % als Ausnahme in anderen Einrichtungen).'},
{c:1,t:'mc',alt:1,q:'Wer muss vor Ort sein, damit ein BA-Praktikum anerkannt wird?',o:['Ein Psychologe/eine Psychologin mit Berufserfahrung','Eine Ärztin oder ein Arzt','Ein Psychotherapeut in Ausbildung','Eine Lehrende der Universität'],a:0,e:'Berufserfahrene Psychologin/berufserfahrener Psychologe an der Einrichtung.'},
{c:1,t:'ms',alt:1,q:'Welche Lehrveranstaltungen sollen laut Folie VOR dem Praktikum absolviert werden?',o:['VO Tätigkeitsbereiche','VO Statistik I + II','VO Psychologische Diagnostik I','VO Sozialpsychologie I','VO Klinische Psychologie'],a:[0,1,2],e:'Pinnwand-Folie: u. a. Statistik I+II, Tätigkeitsbereiche, Diagnostik I, Allgemeine I, Bio I, Entwicklung I, Messtheorie … Sozial- und Klinische Psychologie stehen dort NICHT (die Kurzantwort nennt sie fälschlich).'},
{c:3,t:'ms',alt:1,q:'Welche Inhalte gehören zum Grundmodul der Gesundheitspsychologie?',o:['Gesprächsführung und Kommunikation','Strategien, Methoden und Techniken der Diagnostik','Psychologische Behandlungsmaßnahmen (Intervention)','Befund- und Gutachtenerstellung','Patientenmanagement und Schnittstellenmanagement'],a:[0,1,2,3],e:'Patienten-/Schnittstellenmanagement ist im **Aufbaumodul der Klinischen Psychologie**.'},
{c:4,t:'mc',alt:1,q:'Wer behandelt psychosozial bedingte Verhaltensstörungen und Leidenszustände umfassend?',o:['Psychotherapeut:innen','Gesundheitspsycholog:innen','Psycholog:innen mit Bachelor','Trainer:innen und Coaches'],a:0,e:'Psychotherapie ALT § 1: umfassende, bewusste, geplante Behandlung psychosozial/psychosomatisch bedingter Störungen.'},
{c:2,t:'mc',alt:1,q:'Wer erstellt klinisch-psychologische Gutachten und Diagnosen?',o:['Klinische Psycholog:innen','Gesundheitspsycholog:innen','Alle Psycholog:innen','Psychotherapeut:innen in Ausbildung'],a:0,e:'§ 22 + Tätigkeitsvorbehalt.'},
{c:3,t:'ms',alt:1,q:'Was gehört zu den Tätigkeiten von Gesundheitspsycholog:innen?',o:['Gesundheitsfördernde Maßnahmen und Projekte entwickeln','Prävention (Krankheitsverhütung)','Beratung zu Gesundheitsverhalten','Klinisch-psychologische Behandlung von Störungen'],a:[0,1,2],e:'§ 13. Behandlung von Störungen = Klinische Psychologie (§ 22).'},
{c:7,t:'mc',alt:1,q:'Welche Daten zählen NICHT zu den besonderen Kategorien personenbezogener Daten?',o:['Geschlecht','Gesundheitsdaten','Religiöse Überzeugung','Ethnische Herkunft'],a:0,e:'DSGVO-Wissen aus der Kurzantwort – nicht in deinen Unterlagen.'},
{c:7,t:'mc',alt:1,q:'Wann darf die Verschwiegenheitspflicht laut Kurzantwort gebrochen werden?',o:['Bei sicherer oder unmittelbar drohender Gefahr für andere','Wenn die Eltern eines Erwachsenen nachfragen','Wenn die Krankenkasse Details verlangt','Nach Ende der Behandlung'],a:0,e:'Nicht in deinen Unterlagen. Auf der Folie nur das Dilemma § 37 vs. § 32.'},
{c:6,t:'mc',alt:1,q:'Welches Dokument regelt die Verschwiegenheit und das Spannungsverhältnis dazu?',o:['Das Psychologengesetz (§ 37, § 32)','Der Nürnberger Kodex','Die Deklaration von Helsinki','Das Curriculum für das Bachelorstudium'],a:0,e:'Folie „Spannungsverhältnis im Psychologengesetz“.'},
{c:6,t:'mc',alt:1,q:'Welche Verhaltensregel gilt laut Ethikcode für personenbezogene Daten?',o:['Vertraulicher Umgang – Weitergabe nur für professionelle Zwecke','Freie Weitergabe an Kolleg:innen','Veröffentlichung nach 5 Jahren erlaubt','Daten müssen den Angehörigen offengelegt werden'],a:0,e:'Privatsphäre & Vertraulichkeit: nur professionelle Zwecke, Vertraulichkeit bei Ablage/Bearbeitung.'},
{c:6,t:'mc',alt:1,q:'Für wen gilt der Meta-Code of Ethics?',o:['Als Basis für Psycholog:innen-Verbände in ganz Europa','Nur für Psycholog:innen in Österreich','Nur für Psychotherapeut:innen','Nur für Forschung an Universitäten'],a:0,e:'EFPA = europäische Föderation; Meta-Code = gemeinsame Basis, in Österreich Grundlage der Ethikrichtlinie.'},
{c:5,t:'mc',alt:1,q:'In welchem Dokument wurde festgelegt, dass Forschung am Menschen nur auf freiwilliger Basis stattfinden darf?',o:['Nürnberger Kodex','Eid des Hippokrates','Meta-Code of Ethics','Psychotherapiegesetz'],a:0,e:'Nürnberger Kodex 1946/47.'},
{c:7,t:'mc',alt:1,q:'Was kann unethisches Handeln von Psycholog:innen nach sich ziehen?',o:['Verwaltungsstrafe bzw. Aufsichtsverfahren','Automatischen Entzug des Studienabschlusses','Keine Folgen, Ethik ist unverbindlich','Nur eine Rüge durch die Universität'],a:0,e:'Aus der Kurzantwort; auf der Folie nur, dass Aufsichtsorgane informiert werden können.'},
{c:6,t:'mc',alt:1,q:'Wie hängen Ethik(richtlinie) und Gesetz zusammen?',o:['Die Ethikrichtlinie ergänzt und konkretisiert die gesetzlichen Berufspflichten','Die Ethikrichtlinie ersetzt das Psychologengesetz','Das Gesetz ist nur eine Empfehlung der Ethikrichtlinie','Beide sind voneinander unabhängig'],a:0,e:'Präambel: Ergänzung und Konkretisierung der Berufspflichten gem. Psychologengesetz 2013.'},
{c:5,t:'mc',alt:1,q:'Welchen Zweck haben Untersuchungsscheine (Versuchsscheine) im Psychologiestudium?',o:['Methoden aus der Perspektive der Teilnehmer:innen kennenlernen','Den Forschenden günstige Versuchspersonen verschaffen','Die Note in Statistik verbessern','Die Praxis im Bachelor ersetzen'],a:0,e:'Curriculum BA 2016 § 3: Paradigmen und Methoden aus Sicht der Untersuchungsteilnehmer:innen kennenlernen.'},
/* ---------- Übungsfragen zu den Folien ---------- */
{c:1,t:'mc',q:'Welche Ausrichtung hat das Bachelorstudium Psychologie in Graz laut Curriculum?',o:['Empirisch, mit starker biologischer und psychophysiologischer Orientierung','Geisteswissenschaftlich-hermeneutisch','Vor allem psychotherapeutisch-praktisch','Sozialwissenschaftlich mit Schwerpunkt Soziologie'],a:0,e:'Curriculum BA § 1 Abs. 2.'},
{c:1,t:'mc',q:'Welches Fach hat im Grazer Bachelor den größten Fächeranteil?',o:['Statistik & Forschungsmethoden','Allgemeine Psychologie','Diagnostik','Biologische Psychologie'],a:0,e:'Ca. 22 % – weit vor Allgemeiner Psychologie und Diagnostik (je ca. 7 %).'},
{c:1,t:'tf',q:'Im Grazer Bachelor haben Allgemeine Psychologie und Diagnostik etwa gleich große Fächeranteile.',a:true,e:'Beide ca. 7 %.'},
{c:1,t:'mc',q:'Wie viele ECTS umfasst die facheinschlägige Praxis im Bachelor?',o:['10 ECTS (240 Echtstunden)','9 ECTS (240 Arbeitsstunden)','15 ECTS (360 Stunden)','6 ECTS (150 Stunden)'],a:0,e:'BA 10 ECTS = 240 Echtstunden; MA 9 ECTS = 240 Arbeitsstunden.'},
{c:1,t:'gap',q:'Die Bachelor-Praxis wird im ___. Semester empfohlen.',a:['5','fünften','5.'],e:'Empfohlen im **5. Semester**.'},
{c:1,t:'mc',q:'Wie viel der BA-Praxis darf ausnahmsweise in Einrichtungen ohne berufserfahrene Psychologin absolviert werden?',o:['Bis zu 50 %','Bis zu 25 %','Bis zu 75 %','Gar nichts'],a:0,e:'„bis zu 50 % als Ausnahme in anderen Einrichtungen“.'},
{c:1,t:'mc',q:'Welche Alternative zur BA-Praxis nennt die Folie?',o:['Mitarbeit an Forschungsprojekten des Institutes (max. 120 h)','Ein Auslandssemester','Ein zusätzliches Seminar in Klinischer Psychologie','Eine schriftliche Hausarbeit'],a:0,e:'Max. **120 h** Mitarbeit an laufenden Forschungsprojekten.'},
{c:1,t:'gap',q:'Zusätzliche Praxis ist als freies Wahlfach im Umfang von max. ___ Wochen möglich.',a:['8','acht'],e:'Max. **8 Wochen**.'},
{c:1,t:'mc',q:'Welche Lehrveranstaltung läuft parallel zur Master-Praxis?',o:['Supervision der facheinschlägigen Praxis','Einführung in die Praxisfelder','Tätigkeitsbereiche','Psychologische Diagnostik I'],a:0,e:'Folie „Praxis im Masterstudium“.'},
{c:1,t:'ms',q:'Was stimmt über das Masterstudium Psychologie in Graz?',o:['Es vermittelt vertiefte Kenntnisse der natur- und sozialwissenschaftlich orientierten Psychologie','Es vermittelt berufsrelevante praktische Fertigkeiten','Die Praxis umfasst 9 ECTS','Die Praxis darf nur außerhalb der Universität stattfinden'],a:[0,1,2],e:'Praxisstellen am **Institut** können angeboten und anerkannt werden.'},
{c:1,t:'mc',q:'Wer bietet laut Folie Vorträge mit Gästen aus der Praxis an?',o:['Die Steirische Gesellschaft für Psychologie','Der Psychotherapiebeirat','Die EFPA','Das Bundesministerium'],a:0,e:'Folie „Praxis kennen lernen“.'},
{c:1,t:'mc',q:'Was regelt das Psychologengesetz 2013 laut seinem vollen Titel?',o:['Die Führung der Bezeichnung „Psychologin/Psychologe“ und die Ausübung von Gesundheitspsychologie und Klinischer Psychologie','Die Ausbildung zur Psychotherapeutin','Das Curriculum des Psychologiestudiums','Die Forschung am Menschen'],a:0,e:'Bundesgesetz, BGBl. I Nr. 182/2013.'},
{c:1,t:'gap',q:'Für die Bezeichnung „Psychologin“ braucht man ein Psychologiestudium mit mind. ___ ECTS.',a:['300'],e:'§ 4 Abs. 1.'},
{c:1,t:'ms',q:'An welchen Bildungseinrichtungen kann das 300-ECTS-Studium laut § 4 Abs. 1 absolviert werden?',o:['Anerkannte inländische postsekundäre Einrichtung','Anerkannte Einrichtung eines anderen EU-Mitgliedstaates','Einrichtung einer EWR-Vertragspartei','Einrichtung der Schweizerischen Eidgenossenschaft'],a:[0,1,2,3],e:'Alle vier stehen in § 4 Abs. 1. Abschlüsse von anderswo brauchen eine **Nostrifizierung** (Abs. 3).'},
{c:1,t:'mc',q:'Wer ist nach § 4 Abs. 2 ebenfalls berechtigt, sich Psychologin zu nennen?',o:['Wer in Österreich Psychologie mit Mag. phil. oder Mag. rer. nat. abgeschlossen hat','Wer ein Lehramt mit Psychologie abgeschlossen hat','Wer eine Ausbildung zum Coach hat','Wer das Propädeutikum absolviert hat'],a:0,e:'Auch: Doktorat der Philosophie mit Psychologie als erstem Fach (Rigorosenordnung 1945).'},
{c:1,t:'mc',q:'Was regelt § 4 Abs. 3 Psychologengesetz?',o:['Nostrifizierte Abschlüsse aus Drittstaaten','Das Verbot vortäuschender Bezeichnungen','Die Strafe bei unbefugter Titelführung','Die Ausbildung zur Klinischen Psychologin'],a:0,e:'Abs. 3 = Nostrifizierung, Abs. 4 = Vortäuschung untersagt, § 5 = Strafe.'},
{c:1,t:'tf',q:'Auch eine Bezeichnung, die nur geeignet ist, die Berechtigung „Psychologin“ vorzutäuschen, ist untersagt.',a:true,e:'§ 4 Abs. 4.'},
{c:1,t:'mc',q:'Was ist unbefugtes Führen der Bezeichnung „Psychologe“ rechtlich – sofern keine gerichtlich strafbare Handlung vorliegt?',o:['Eine Verwaltungsübertretung','Ein Verbrechen','Eine Ordnungswidrigkeit ohne Strafe','Ein Disziplinarvergehen der Universität'],a:0,e:'§ 5: Verwaltungsübertretung, Geldstrafe bis 15 000 €.'},
{c:1,t:'ms',q:'Wer darf sich NICHT „Psychologin“ nennen (wenn § 4 nicht anderweitig erfüllt ist)?',o:['Absolventin des Bachelorstudiums Psychologie','Jemand mit abgebrochenem Master Psychologie','Eine ausgebildete Psychotherapeutin','Ein Coach','Eine Absolventin mit Mag. rer. nat. in Psychologie'],a:[0,1,2,3],e:'Mag. rer. nat. in Psychologie ist nach § 4 Abs. 2 berechtigt.'},
{c:1,t:'tf',q:'Eine Psychotherapeutin darf sich automatisch auch „Psychologin“ nennen.',a:false,e:'Nur wenn sie gleichzeitig die Bedingungen nach § 4 erfüllt (Psychologiestudium mit 300 ECTS).'},
{c:2,t:'mc',q:'In welchem Paragraphen des Psychologengesetzes stehen die Tätigkeitsbereiche der Klinischen Psychologie?',o:['§ 22','§ 13','§ 4','§ 37'],a:0,e:'§ 22 Klinische Psychologie, § 13 Gesundheitspsychologie, § 4 Bezeichnung, § 37 Verschwiegenheit.'},
{c:2,t:'ms',q:'Welche Merkmale hat die klinisch-psychologische Behandlung laut § 22?',o:['Fokussiert','Zielorientiert','Lösungsorientiert','Aufbauend auf klinisch-psychologischer Diagnostik','Nur bei Erwachsenen'],a:[0,1,2,3],e:'Bei Personen **aller** Altersstufen und Gruppen.'},
{c:2,t:'ms',q:'Wozu erstellen Klinische Psycholog:innen Befunde und Gutachten?',o:['Leistungsfähigkeit','Persönlichkeitsmerkmale','Verhaltensformen bei psychischen Störungen','Gesundheitsbezogenes Risikoverhalten von Organisationen'],a:[0,1,2],e:'Risikoverhalten-Gutachten = Gesundheitspsychologie.'},
{c:2,t:'mc',q:'Was bedeutet der Tätigkeitsvorbehalt in der Klinischen Psychologie?',o:['Die berufsmäßige Ausübung ist Klinischen Psycholog:innen vorbehalten, allen anderen verboten','Klinische Psycholog:innen dürfen nur im Krankenhaus arbeiten','Klinische Tätigkeiten brauchen eine ärztliche Zuweisung','Klinische Psycholog:innen dürfen keine Gutachten erstellen'],a:0,e:'§ 22 Psychologengesetz 2013.'},
{c:2,t:'tf',q:'Klinisch-psychologische Begleitung von Angehörigen in Krisensituationen gehört zu den Tätigkeitsbereichen der Klinischen Psychologie.',a:true,e:'§ 22: Begleitung von Betroffenen **und Angehörigen** in Krisensituationen.'},
{c:2,t:'mc',q:'Wie viele ECTS empirisch-wissenschaftliche Psychologie muss man für die Ausbildung zur Klinischen Psychologin mitbringen?',o:['180 ECTS','75 ECTS','300 ECTS','120 ECTS'],a:0,e:'§ 7: dabei 180 ECTS empirisch-wiss. Psychologie; insgesamt mind. 75 ECTS in vier Fächergruppen.'},
{c:2,t:'ms',q:'In welchen Bereichen müssen insgesamt mind. 75 ECTS nachgewiesen werden (§ 7)?',o:['Psychopathologie, Psychopharmakologie, Psychiatrie und Neurologie','Psychologische Diagnostik','Gesundheitsförderung, Krankheitsprävention, Rehabilitation','Psychologische Interventionen','Statistik und Forschungsmethoden'],a:[0,1,2,3],e:'Statistik zählt nicht zu den vier Fächergruppen.'},
{c:2,t:'ms',q:'Welche weiteren Voraussetzungen nennt § 7 für die Ausbildung?',o:['Allgemeinärztliches Gesundheitszeugnis','Klinisch-psychologisches oder psychiatrisches Gutachten','Persönliche Eignung (Aufnahmegespräch)','Mindestalter 24 Jahre'],a:[0,1,2],e:'Das Mindestalter 24 gehört zum psychotherapeutischen Fachspezifikum (alt).'},
{c:2,t:'mc',q:'Wie lange darf die postgraduelle Ausbildung zur Klinischen Psychologin höchstens dauern?',o:['5 Jahre','3 Jahre','12 Monate','10 Jahre'],a:0,e:'Max. 5 Jahre; die Theorie dauert mind. 12 Monate.'},
{c:2,t:'mc',q:'Wie viele Einheiten umfasst die theoretisch-fachliche Ausbildung mindestens?',o:['340 Einheiten in mind. 12 Monaten','220 Einheiten in mind. 6 Monaten','2098 Einheiten in 5 Jahren','120 Einheiten in mind. 12 Monaten'],a:0,e:'340 EH = 220 (Grundmodul) + 120 (Aufbaumodul).'},
{c:2,t:'mc',q:'Wie oft darf man während der praktisch-fachlichen Ausbildung höchstens die Stelle wechseln?',o:['3-mal','1-mal','5-mal','Gar nicht'],a:0,e:'Muss in Arbeitsverhältnissen erfolgen, max. 3× wechseln.'},
{c:2,t:'tf',q:'Die praktisch-fachliche Ausbildung muss im Rahmen von Arbeitsverhältnissen erfolgen.',a:true,e:'§ 24.'},
{c:2,t:'mc',q:'Welche Grundmodul-Inhalte haben je 30 Einheiten?',o:['Akut-/Krisenintervention · Beratungsmethoden · Gesprächsführung und Kommunikation','Ethik · Befunde · Diagnostik','Psychopharmakologie · Evaluation · Rahmenbedingungen','Behandlungsmaßnahmen · Gesundheitsförderung · Ethik'],a:0,e:'Die drei 30-EH-Blöcke des Grundmoduls.'},
{c:2,t:'gap',q:'Ethik umfasst im Grundmodul ___ Einheiten.',a:['15'],e:'Ethik 15 EH.'},
{c:2,t:'ms',q:'Was gehört zum Aufbaumodul der Klinischen Psychologie?',o:['Differentialdiagnostische Abklärung','Patienten- und Schnittstellenmanagement','Befunde und Sachverständigentätigkeit','Gesundheitsmanagement und Öffentlichkeitsarbeit'],a:[0,1,2],e:'Gesundheitsmanagement & Öffentlichkeitsarbeit = Aufbaumodul **Gesundheitspsychologie**.'},
{c:2,t:'mc',q:'Wie viele Stunden Fachausbildungstätigkeit braucht die Klinische Psychologie mindestens?',o:['2098','1553','2194','500'],a:0,e:'§ 24: mind. 2098 h, davon je mind. 500 h in Grund- und Aufbaumodul.'},
{c:2,t:'mc',q:'Wie viel begleitende Supervision ist in der Klinischen Psychologie vorgeschrieben?',o:['Mind. 120 Einheiten','Mind. 100 Einheiten','Mind. 76 Einheiten','Mind. 30 Einheiten'],a:0,e:'Klinisch 120, Gesundheit 100; Selbsterfahrung jeweils 76.'},
{c:2,t:'gap',q:'Selbsterfahrung umfasst in beiden Ausbildungen (Klinische und Gesundheitspsychologie) ___ Einheiten.',a:['76'],e:'76 Einheiten.'},
{c:2,t:'ms',q:'Was stimmt über den Universitätskurs Klinische Psychologie an der Uni Graz?',o:['3 Semester berufsbegleitend','54 ECTS','Abschluss mit Universitätszertifikat, das zum Listeneintrag berechtigt','Kosten inkl. Selbsterfahrung und Supervision'],a:[0,1,2],e:'EUR 4.960 inkl. Zulassungs-/Prüfungsgebühren, **exkl.** Selbsterfahrung und Supervision.'},
{c:2,t:'mc',q:'Was ist Voraussetzung zur selbständigen Berufsausübung als Klinische Psychologin?',o:['Eintrag in die Liste des Bundesministeriums','Mitgliedschaft im BÖP','Ein Doktorat','Eine eigene Praxis mit Kassenvertrag'],a:0,e:'§ 26, § 29.'},
{c:3,t:'mc',q:'In welchem Paragraphen stehen die Tätigkeitsbereiche der Gesundheitspsychologie?',o:['§ 13','§ 22','§ 7','§ 32'],a:0,e:'§ 13 Psychologengesetz 2013.'},
{c:3,t:'ms',q:'Welche Beispiele für gesundheitsbezogenes Risikoverhalten nennt die Folie?',o:['Ernährung','Bewegung','Rauchen','Schlafstörungen'],a:[0,1,2],e:'Folie: Ernährung, Bewegung, Rauchen.'},
{c:3,t:'mc',q:'Wen analysieren Gesundheitspsycholog:innen bezüglich gesundheitsbezogener Rahmenbedingungen?',o:['Organisationen, Institutionen und Systeme','Nur Einzelpersonen mit Störungen','Nur Kinder und Jugendliche','Nur Patient:innen im Krankenhaus'],a:0,e:'Neben Personen/Gruppen aller Altersstufen (Gesundheitsverhalten).'},

{c:PQ,k:1,t:'mc',q:'Sara hat den Master Psychologie nach 60 ECTS abgebrochen (insgesamt 240 ECTS). Sie nennt sich „Psychologische Beraterin“. Was ist das Problem?',o:['Die Bezeichnung kann „Psychologin“ vortäuschen','Gar keines, sie hat ja studiert','Nur die fehlende Gewerbeberechtigung','Sie braucht dafür nur einen Listeneintrag'],a:0,e:'§ 4 Abs. 4: Jede Bezeichnung, die geeignet ist, die Führung vorzutäuschen, ist untersagt. (Ob „Psychologische Beraterin“ konkret darunter fällt, ist eine Rechtsfrage – im Sinne der Folie ist die Vortäuschung das Problem.)'},

{c:PQ,k:2,t:'mc',q:'Ben arbeitet in der praktisch-fachlichen Ausbildung und wechselt zum vierten Mal die Stelle. Was gilt?',o:['Nicht erlaubt – max. 3 Wechsel','Erlaubt, solange er unter 5 Jahren bleibt','Erlaubt, wenn Supervision weiterläuft','Nur erlaubt mit Zustimmung des BÖP'],a:0,e:'Max. 3× wechseln.'},

{const v=LS.get('exam',null);if(v)EXAM=new Date(v[0],v[1],v[2])} /* eigener Prüfungstermin */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>').replace(/-&gt;/g,'→').replace(/=&gt;/g,'⇒');
const hash = s => {let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return 'q'+(h>>>0).toString(36)};
Q.forEach(q=>q.id=hash(q.q));
const CHNAME = Object.fromEntries(CH.map(c=>[c.id,c.s])); CFG.bonus.forEach(b=>CHNAME[b.id]=b.s); CHNAME[PQ]='Prüfungsfragen';
const CHM = CH.filter(c=>!c.x); const MAIN = new Set(CHM.map(c=>c.id)); const RANGE = CHM.length>1?CHM[0].id+'–'+CHM[CHM.length-1].id:String(CHM[0].id);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const solText = q => q.t==='mc'?q.o[q.a]:q.t==='ms'?q.a.map(i=>q.o[i]).join(' · '):q.t==='tf'?(q.a?'Stimmt':'Stimmt nicht'):q.a[0];

let stats = LS.get('stats',{});
const saveStats = ()=>LS.set('stats',stats);
/* Nochmals wiederholen: war falsch, jetzt richtig → rep=REP; jede weitere richtige Antwort zählt runter, bei 0 ist sie raus, falsch → zurück zu „Zuletzt falsch“ */
const REP = 2;
const FHINT = {all:'Alle Fragen der gewählten Kapitel.', alt:'Nur Fragen, die so oder ähnlich schon in Prüfungen gekommen sind.', wrong:'Fragen, die du zuletzt falsch beantwortet hast – also noch nicht kannst.', rep:'Fragen, die du schon einmal falsch und dann richtig hattest (müssen noch '+REP+'× richtig sein) plus die, die du selbst gemerkt hast.', new:'Fragen, die du noch nie beantwortet hast.'};
const isRep = id => stats[id]&&((stats[id].last==='r'&&stats[id].rep>0)||stats[id].pin);
/* Selbst gemerkt (pin): bleibt in „Nochmals wiederholen“, bis man es selbst wieder entfernt */
const pinBtn = id => {const on=!!(stats[id]&&stats[id].pin);return `<button class="btn ghost pin" data-pin="${id}" aria-pressed="${on}" title="Taste M">${on?'✓ Gemerkt · tippen zum Entfernen':'↻ Nochmals wiederholen merken'}</button>`};
function togglePin(id){const s=stats[id]||{r:0,w:0,rep:0};s.pin=!s.pin;stats[id]=s;saveStats();document.querySelectorAll(`[data-pin="${id}"]`).forEach(b=>b.outerHTML=pinBtn(id))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b)togglePin(b.dataset.pin)});
const isOpen = id => stats[id]&&(stats[id].last==='w'||isRep(id)); /* offene Fehler = zuletzt falsch + nochmals wiederholen */
Object.values(stats).forEach(s=>{if(s.rep===undefined) s.rep = (s.w>0&&s.last==='r') ? REP : 0}); saveStats();

/* ================== Quiz ================== */
let setup = {ch:[], filter:'all', n:20};
let quiz = {active:false, list:[], i:0, right:0, wrong:[], answered:false};
function pool(){
  let p = Q.filter(q=>!setup.ch.length || setup.ch.includes(q.c));
  if(!setup.ch.length) p = p.filter(q=>MAIN.has(q.c));
  if(setup.filter==='alt') p=p.filter(q=>q.alt);
  if(setup.filter==='wrong') p=p.filter(q=>stats[q.id]&&stats[q.id].last==='w');
  if(setup.filter==='rep') p=p.filter(q=>isRep(q.id));
  if(setup.filter==='ever') p=p.filter(q=>isOpen(q.id));
  if(setup.filter==='new') p=p.filter(q=>!stats[q.id]);
  /* Fragetyp ist eigener Filter und kombiniert sich mit der Auswahl (z. B. Zuletzt falsch + Lückentext) */
  if(setup.type==='ms') p=p.filter(q=>q.t==='ms');
  if(setup.type==='gap') p=p.filter(q=>q.t==='gap');
  return p;
}
function renderSetup(){

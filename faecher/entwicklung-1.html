{c:3,t:'ms',alt:1,q:'Die zentralen Elemente bei der Vererbung sind …',o:['der Genotyp','der Phänotyp','die Umwelt','die Reaktionszeit'],a:[0,1,2],e:'Im Katalog war eine vierte Option unklar (#). Sicher sind Genotyp, Phänotyp und Umwelt.'},
{c:3,t:'mc',alt:1,q:'Wie lässt sich „Umwelt“ beschreiben?',o:['Die materiellen und sozialen Umgebungen, die unsere Entwicklung beeinflussen','Nur die Erziehung durch die Eltern','Unsere biologische Grundausstattung','Die von den Eltern geerbten Gene'],a:0,e:'Gegenbegriff Anlage = biologische Grundausstattung, also die Gene.'},
{c:3,t:'mc',alt:1,q:'Was ist geteilte Umwelt?',o:['Die gemeinsame Umwelt von Geschwistern, z. B. dasselbe Zuhause','Erfahrungen, die sich zwischen Geschwistern unterscheiden','Die Gene, die Geschwister teilen','Die Umwelt im Mutterleib'],a:0,e:'Nicht geteilte Umwelt = was sich unterscheidet, z. B. erfahrenere Eltern beim jüngeren Kind.'},
{c:3,t:'tf',alt:1,q:'Je ähnlicher die Genotypen, desto ähnlicher sind sich Menschen auch im Phänotyp.',a:true,e:'Annahme hinter Familien-, Zwillings- und Adoptionsstudien. Gemeinsam Aufgewachsene sollten sich zusätzlich ähnlicher sein.'},
{c:3,t:'tf',alt:1,q:'Die Unterschiede im Phänotyp von Zwillingen nehmen mit dem Alter zu, bei eineiigen weniger stark als bei zweieiigen.',a:true,e:'Die IQ-Korrelation eineiiger Zwillinge steigt mit dem Alter, die zweieiiger sinkt. Im Katalog war die Frage als „komisch“ markiert.'},
{c:3,t:'mc',alt:1,q:'Welche drei Arten von Genotyp-Umwelt-Wirkungen unterscheidet Scarr?',o:['Passiv, evozierend, aktiv','Passiv, aktiv, evaluativ','Geteilt, nicht geteilt, gemischt','Direkt, indirekt, reziprok'],a:0,e:'Passiv: Kind wächst bei leiblichen Eltern auf. Evozierend: Kind ruft Verhalten anderer hervor. Aktiv: Kind wählt sich Umgebungen (Nischen). Im Katalog ist „evaluativ“ nur ungenau erinnert, im Buch heißt es evozierend. Mit dem Alter wird der passive Anteil kleiner, der aktive größer.'},
{c:3,t:'ms',alt:1,q:'Was gehört zu einem Neuron?',o:['Zellkörper','Dendriten','Axon','Blastozyste','Plazenta'],a:[0,1,2],e:'Die Verbindung zwischen Axonende und Dendriten ist die Synapse.'},
{c:3,t:'ms',alt:1,q:'Was stimmt über Gliazellen?',o:['Sie bilden die Myelinscheide um Axone','Sie unterstützen die Kommunikation im Gehirn','Sie sind etwa 10-mal so häufig wie Neuronen','Sie leiten als einzige Zellen elektrische Signale weiter'],a:[0,1,2],e:'Gliazellen sind Stützzellen. Signale leiten die Neuronen weiter.'},
{c:3,t:'mc',alt:1,q:'Was versteht man unter erfahrungserwartender Plastizität?',o:['Die normale Verschaltung des Gehirns durch Erfahrungen, die jeder Mensch in einer halbwegs normalen Umgebung macht','Neue Verbindungen durch individuelle Erfahrung, z. B. jahrelanges Geigenspiel','Das Absterben überflüssiger Synapsen','Die Bildung der Myelinscheide'],a:0,e:'Bleibt die erwartete Erfahrung aus (z. B. Katarakt), entwickelt sich der Bereich nicht normal. Geigenspiel = erfahrungsabhängig.'},
{"id": "q8lm4da", "c": 3, "t": "ms", "alt": 1, "q": "Welche dieser Merkmale sind polygenetisch bedingt?", "o": ["Empathie", "Rot-Grün-Blindheit", "Sensationssuche", "Aggressivität", "Schüchternheit"], "a": [0, 2, 3, 4], "e": "Viele Persönlichkeitsmerkmale hängen von **vielen Genen** ab. Rot-Grün-Blindheit beruht auf **einem** Gen auf dem X-Chromosom."},
{c:4,t:'ms',alt:1,q:'Wie wird Piagets Theorie eingeordnet?',o:['Diskontinuierlich (Stufen in invarianter Abfolge)','Konstruktivistisch','Universell (bis auf die formal-operationale Stufe)','Bild: Kind als Wissenschaftler','Kontinuierlich ohne Stufen'],a:[0,1,2,3],e:'Nicht alle Menschen erreichen die formal-operationale Stufe. Kontinuierlich sind bei Piaget nur die Mechanismen Assimilation, Akkommodation und Äquilibration.'},
{"id": "qbml08y", "c": 4, "t": "ms", "alt": 1, "q": "Welche Theorien beschreiben Entwicklung als kontinuierlich?", "o": ["Soziokulturelle Theorie", "Piaget", "Dynamische Systeme", "Kernwissenstheorie", "Informationsverarbeitung"], "a": [0, 2, 3, 4], "e": "Nur **Piaget** beschreibt **Stufen** (diskontinuierlich). Dynamische Systeme: kontinuierlich, aber mit Rückschritten."},
{c:4,t:'mc',alt:1,q:'Welches Bild des Kindes passt zu welcher Theorie?',o:['Piaget: Wissenschaftler · Informationsverarbeitung: Verarbeitungssystem · Kernwissen: gut ausgestattetes Evolutionsprodukt · Soziokulturell: soziales Wesen','Piaget: Computer · Informationsverarbeitung: Wissenschaftler · Kernwissen: soziales Wesen · Soziokulturell: Evolutionsprodukt','Piaget: soziales Wesen · Informationsverarbeitung: Evolutionsprodukt · Kernwissen: Computer · Soziokulturell: Wissenschaftler','Piaget: Evolutionsprodukt · Informationsverarbeitung: soziales Wesen · Kernwissen: Wissenschaftler · Soziokulturell: Computer'],a:0,e:'Dynamische Systeme: Handeln formt das Denken und umgekehrt.'},
{c:4,t:'tf',alt:1,q:'Die Theorie der überlappenden Wellen beschreibt Entwicklung als kontinuierlich.',a:true,e:'Mehrere Strategien bestehen nebeneinander, bessere werden allmählich häufiger. Es gibt keinen Stufensprung.'},
{c:4,t:'ms',alt:1,q:'Was kennzeichnet das sensomotorische Stadium (0–2)?',o:['Objektpermanenz wird erworben','A-nicht-B-Suchfehler','Zeitlich verzögerte Nachahmung','Das Kind experimentiert wie ein kleiner Wissenschaftler','Invarianzaufgaben werden gelöst'],a:[0,1,2,3],e:'Invarianz gelingt erst im konkret-operationalen Stadium.'},
{c:4,t:'ms',alt:1,q:'Was kennzeichnet das präoperationale Stadium (2–7)?',o:['Symbolische Repräsentation (z. B. Banane als Telefon)','Egozentrismus','Zentrierung','Probleme bei Invarianzaufgaben','Systematisches hypothetisches Denken'],a:[0,1,2,3],e:'Hypothetisches Denken kommt erst formal-operational (ab ca. 12).'},
{c:4,t:'ms',alt:1,q:'Was kennzeichnet das konkret-operationale Stadium (7–12)?',o:['Logisches Denken über konkrete Dinge','Überwindung der Zentrierung','Objekte in Klassen gruppieren','Das Pendelproblem wird systematisch gelöst','Abstraktes Denken fällt noch schwer'],a:[0,1,2,4],e:'Beim Pendel beachten konkret-operationale Kinder nur das Gewicht. Systematisch lösen es erst formal-operationale Jugendliche.'},
{c:4,t:'ms',alt:1,q:'Welche Kritikpunkte an Piaget stimmen?',o:['Das Denken innerhalb einer Stufe ist variabler als dargestellt','Säuglinge sind kompetenter, als Piaget dachte','Der Beitrag der sozialen Umwelt wird unterschätzt','Die Mechanismen der Entwicklung sind nur vage beschrieben','Er überschätzte die Kompetenzen von Säuglingen'],a:[0,1,2,3],e:'Er hat Säuglinge unterschätzt, z. B. zeigt sich Objektpermanenz schon mit etwa 3 Monaten.'},
{"id": "q1vdd0tt", "c": 4, "t": "mc", "alt": 1, "q": "Wie erklärt Case, dass Kinder mit dem Alter mehr im Gedächtnis behalten können?", "o": ["Die Sinnesorgane reifen nach.", "Die Motivation der Kinder steigt.", "Das Gehirn bildet laufend neue Neuronen.", "Denkprozesse laufen automatischer und schneller ab, dadurch wird Speicherplatz frei."], "a": 3, "e": "Durch **Automatisierung** braucht die Verarbeitung weniger Platz (Operating Space ↓) → mehr Platz zum Speichern (Storage Space ↑)."},
{c:4,t:'mc',alt:1,q:'Case: Was wird mit dem Alter mehr?',o:['Storage Space (Speicherplatz)','Operating Space (Verarbeitungsplatz)','Beides bleibt gleich','Beides nimmt ab'],a:0,e:'Effizientere Prozesse brauchen weniger Verarbeitungsplatz, also bleibt mehr Platz zum Speichern.'},
{c:4,t:'ms',alt:1,q:'Wodurch verbessert sich laut Informationsverarbeitungstheorie das Gedächtnis?',o:['Basisprozesse (z. B. Enkodieren, Assoziieren, Wiedererkennen)','Strategien (z. B. Rehearsal, selektive Aufmerksamkeit)','Inhaltswissen','Neue Neuronen nach der Geburt'],a:[0,1,2],e:'Basisprozesse, Strategien und Inhaltswissen, z. B. beim Schach.'},

{c:7,t:'ms',alt:1,q:'Welche Erklärungen für die Entwicklung der Theory of Mind gibt es?',o:['Ein angeborenes ToM-Modul reift in den ersten 5 Lebensjahren','Sie erwächst aus Interaktionen mit anderen (z. B. Geschwistern)','Allgemeine Informationsverarbeitung (Hemmung, logisches Denken)','Sie entsteht erst im Jugendalter durch Unterricht'],a:[0,1,2],e:'Modul: Belege aus Hirnforschung und Autismus. Interaktion: Kinder mit älteren oder andersgeschlechtlichen Geschwistern sind besser.'},
{c:7,t:'ms',alt:1,q:'Autistische Kinder – was stimmt?',o:['Sie haben Schwierigkeiten, andere Menschen zu verstehen','False-Belief-Aufgaben bleiben oft bis ins Teenageralter schwer','Sie verstehen, wie Wünsche das Verhalten beeinflussen, aber kaum Überzeugungen','Sie lösen False-Belief-Aufgaben früher als andere'],a:[0,1,2],e:'Aus dem ToM-Lückentext der Altfragen.'},
{c:7,t:'ms',alt:1,q:'Als-ob-Spiel – was stimmt?',o:['Kinder behandeln einen Gegenstand als etwas anderes (Objektsubstitution)','Das Ausmaß hängt mit dem Verständnis von Gedanken und Gefühlen anderer zusammen','Soziales Als-ob-Spiel fördert dieses Verständnis besonders','Es tritt erst ab 6 Jahren auf'],a:[0,1,2],e:'Als-ob-Spiel beginnt ab etwa 18 Monaten.'},
{c:8,t:'tf',alt:1,q:'Bei Familien in Armut geht ein großer Teil der IQ-Varianz (ca. 60 %) auf die gemeinsame Umwelt zurück, kaum etwas auf die Gene. Bei wohlhabenden Familien ist es umgekehrt.',a:true,e:'Turkheimer et al. 2003.'},
{c:8,t:'tf',alt:1,q:'Die IQ-Korrelation eineiiger Zwillinge ist hoch und steigt bis ins Erwachsenenalter, die zweieiiger sinkt.',a:true,e:'Unter anderem, weil ältere Kinder sich ihre Umgebung zunehmend selbst wählen.'},

{"id": "qxeoure", "c": 8, "t": "tf", "alt": 1, "q": "Bei Adoptivkindern hängen IQ und HOME-Werte schwächer zusammen als bei leiblichen Kindern.", "a": true, "e": "Ein Teil des HOME-IQ-Zusammenhangs ist **genetisch** vermittelt – der fällt bei Adoptivkindern weg."},
{c:8,t:'ms',alt:1,q:'Was bot das Head-Start-Projekt?',o:['Nährstoffreiche Ernährung','Medizinische Versorgung','Eine sichere, anregende Tagesstätte','Berufliche und emotionale Unterstützung für Eltern','Privatunterricht bis zum Schulabschluss'],a:[0,1,2,3],e:'Für 3- bis 5-Jährige. Die IQ-Gewinne verblassen, aber es gibt weniger Sitzenbleiben und mehr Abschlüsse.'},
{c:8,t:'mc',alt:1,q:'Mathe-Intervention bei Kindergartenkindern aus einkommensschwachen Familien (Case et al. 1999): Ergebnis?',o:['Ihre Rechenfähigkeiten erreichten das Niveau von Kindern aus Mittelschichtfamilien','Es gab keinen Effekt','Sie lagen danach unter dem Ausgangsniveau','Nur die Eltern profitierten'],a:0,e:'Die Altfrage fragte auch, ob sich die Erblichkeit ändert. Laut Katalog „bleibt gleich“, im Buch ist das nicht eindeutig belegt.'},

{c:PQ,k:1,t:'mc',q:'Eine Forscherin testet dieselben 6-Jährigen acht Wochen lang dreimal pro Woche, weil sie erwartet, dass sich ihre Additionsstrategie in dieser Zeit ändert. Welches Design ist das?',o:['Mikrogenetisches Design','Längsschnittdesign','Sequenzielles Design','Querschnittdesign'],a:0,e:'Dieselben Kinder, kurzer Zeitraum, sehr dichte Messungen, während eine Veränderung erwartet wird. Ein Längsschnitt läuft über viel längere Zeit mit wenigen Messzeitpunkten.'},
{c:PQ,k:1,t:'ms',q:'Eine Studie findet: Kinder, die viel lesen, haben einen größeren Wortschatz. Welche Schlüsse sind zulässig?',o:['Lesen und Wortschatz hängen zusammen','Viel Lesen verursacht einen größeren Wortschatz','Ein großer Wortschatz könnte auch dazu führen, dass Kinder mehr lesen','Eine dritte Variable (z. B. Bildung der Eltern) könnte beides erklären','Die Richtung des Effekts ist durch die Korrelation geklärt'],a:[0,2,3],e:'Korrelation ≠ Kausalität: Problem der Verursachungsrichtung und Problem der dritten Variable.'},
{c:PQ,k:1,t:'mc',q:'Zwei Beobachterinnen kodieren dasselbe Video eines Spielplatzstreits und kommen zu sehr unterschiedlichen Aggressionswerten. Welches Kriterium ist verletzt?',o:['Interrater-Reliabilität','Test-Retest-Reliabilität','Interne Validität','Externe Validität'],a:0,e:'Mehrere Beurteiler, dasselbe Verhalten, geringe Übereinstimmung → Interrater-Reliabilität.'},
{c:PQ,k:1,t:'mc',q:'Ein „Intelligenztest“ liefert bei Wiederholung immer fast dieselben Werte, misst aber eigentlich nur die Lesegeschwindigkeit. Der Test ist …',o:['reliabel, aber nicht valide','valide, aber nicht reliabel','weder reliabel noch valide','reliabel und intern valide'],a:0,e:'Gleiche Ergebnisse = zuverlässig (Reliabilität). Misst nicht, was er messen soll = nicht gültig (Validität).'},
{c:PQ,k:1,t:'tf',q:'Eltern dürfen selbst entscheiden, ob ihr Kind an einem neuen Leseprogramm teilnimmt. Die Teilnehmenden lesen danach besser. Damit ist ein kausaler Effekt des Programms gut belegt.',a:false,e:'Ohne Randomisierung gibt es Selbstselektion: Engagierte Eltern melden eher an. Kausalschlüsse erlaubt erst die Zufallszuweisung.'},

{c:PQ,k:1,t:'mc',q:'„Eltern sollen ihrem Kind zuerst Disziplin und Verstand vermitteln und erst später die Zügel lockern.“ Wessen Position ist das?',o:['John Locke','Jean-Jacques Rousseau','Platon','Aristoteles'],a:0,e:'Rousseau dagegen: maximale Freiheit von Anfang an, keine formale Erziehung bis 12.'},

{c:PQ,k:1,t:'mc',q:'Welche Aussage über die Kauai-Studie von Emmy Werner stimmt?',o:['Sie begleitete den Jahrgang 1955 (698 Kinder) bis ins Alter von 30 Jahren','Sie begleitete 698 Risikokinder des Jahrgangs 1965 bis zum 18. Lebensjahr','Sie untersuchte ausschließlich biologische Risikofaktoren','Sie verglich 698 Kinder verschiedenen Alters zu einem Zeitpunkt'],a:0,e:'Längsschnitt über den ganzen Jahrgang 1955 mit Interviews bis 30; Risiko- UND Schutzfaktoren (Resilienz).'},
{c:PQ,k:1,t:'mc',q:'Welche Beschreibung des WISC-IV stimmt?',o:['10 Untertests + 5 optionale; Gesamt-IQ und Werte für 5 Skalen','5 Untertests + 10 optionale; Gesamt-IQ und Werte für 4 Skalen','12 Untertests + 3 optionale; nur ein Gesamt-IQ','10 Untertests + 5 optionale; Werte für 10 Skalen, kein Gesamt-IQ'],a:0,e:'Beispiele für Untertests: Mosaiktest, Symbolsuche, Zahlen-Symbol-Test.'},
{c:PQ,k:1,t:'mc',q:'Zwischen täglicher Fernsehzeit und Schulnoten (höhere Note = besser) findet man r = −.80. Was ist die richtige Interpretation?',o:['Starker negativer Zusammenhang','Schwacher negativer Zusammenhang','Starker positiver Zusammenhang','Fernsehen verursacht schlechtere Noten'],a:0,e:'Vorzeichen = Richtung, Nähe zu ±1 = Stärke. Eine Kausalaussage erlaubt die Korrelation nicht.'},
{c:PQ,k:1,t:'mc',q:'Man möchte erfassen, wie oft Kinder einander auf dem Spielplatz helfen, ohne selbst einzugreifen. Welche Methode passt am besten?',o:['Naturalistische Beobachtung','Strukturierte Beobachtung','Strukturiertes Interview','Experiment mit Kontrollgruppe'],a:0,e:'Verhalten in der üblichen Umgebung ohne Einflussnahme. Bei der strukturierten Beobachtung wird die Situation gezielt gestaltet.'},
{c:PQ,k:2,t:'mc',q:'Wann ist das Risiko am größten, dass ein Teratogen eine Fehlbildung der Organe verursacht?',o:['In der Embryonalphase (3.–8. Woche)','In der Zygotenphase (1.–2. Woche)','In der frühen Fetalphase (9.–12. Woche)','In den letzten drei Schwangerschaftsmonaten'],a:0,e:'In der Embryonalphase entstehen alle Organe und Körpersysteme – das ist die sensible Phase für Strukturschäden.'},
{c:PQ,k:2,t:'ms',q:'Welche Aussagen über die Plazenta stimmen?',o:['Sie ist semipermeabel','Sie bildet Progesteron, das Kontraktionen unterdrückt','Sie hält Alkohol zuverlässig vom Fetus fern','Sie transportiert CO₂ und Harnstoff vom Fetus weg','Sie bildet Östrogen, das den Blutzufluss zum Uterus verringert'],a:[0,1,3],e:'Alkohol überwindet die Plazentaschranke. Östrogen ERHÖHT den Blutzufluss zum Uterus.'},

{c:PQ,k:2,t:'mc',q:'Welcher Befund ist ein Beispiel für transnatales Lernen?',o:['Neugeborene saugen stärker, um eine Geschichte zu hören, die ihnen in der Schwangerschaft vorgelesen wurde','Neugeborene hören nach einigen Wiederholungen auf, auf denselben Ton im Kreißsaal zu reagieren','3 Monate alte Säuglinge lernen in wenigen Minuten, durch Strampeln ein Mobile zu bewegen','Neugeborene schauen kontrastreiche Schwarz-Weiß-Muster länger an als einfarbige Flächen'],a:0,e:'Transnatal = pränatal gelernt, nachgeburtlich gezeigt. Die anderen Beispiele sind Habituation, operante Konditionierung und Blickpräferenz.'},

{c:PQ,k:2,t:'ms',q:'Welche Folgen werden mit Nikotin in der Schwangerschaft in Verbindung gebracht?',o:['Weniger Atembewegungen des Fetus','Geringeres Geburtsgewicht','Höheres Risiko für plötzlichen Kindstod','Hörschäden und geringerer IQ','Kein Risiko bei bloßem Passivrauchen'],a:[0,1,2,3],e:'Auch Passivrauchen reduziert die Sauerstoffversorgung. E-Zigaretten gelten ebenfalls als riskant.'},
{c:PQ,k:2,t:'tf',q:'Pränataler Stress hängt bei Jungen später eher mit Störungen des Sozialverhaltens, bei Mädchen eher mit Hyperaktivität zusammen.',a:false,e:'Umgekehrt: Jungen eher Hyperaktivität, Mädchen eher Störungen des Sozialverhaltens; emotionale Probleme bei beiden.'},
{c:PQ,k:2,t:'mc',q:'Ein Baby kommt in der 36. SSW mit 2400 g zur Welt. Wie ist es einzuordnen?',o:['Frühgeboren und untergewichtig','Frühgeboren, aber normalgewichtig','Termingerecht, aber untergewichtig','Frühgeboren und stark untergewichtig'],a:0,e:'Frühgeburt = vor der 37. Woche; untergewichtig = unter 2500 g; stark untergewichtig = unter 1500 g.'},
{c:PQ,k:2,t:'ms',q:'Was stimmt über den Tag eines Neugeborenen (westliche Durchschnittswerte)?',o:['Insgesamt rund 16 Stunden Schlaf','Nur etwa 2,5 Stunden wach und aufmerksam','Der REM-Anteil am Schlaf liegt bei etwa 20 %','Das Schreien erreicht sein Maximum mit etwa 6 Wochen','Das Schreien hat seinen Tageshöhepunkt am Morgen'],a:[0,1,3],e:'Neugeborene: ~50 % REM (20 % erst mit 3–4 Jahren). Schrei-Höhepunkt am späten Nachmittag/Abend.'},
{c:PQ,k:2,t:'tf',q:'Laut Autostimulationstheorie gleicht der hohe REM-Anteil fehlende äußere Reize aus und unterstützt so die Entwicklung des visuellen Systems.',a:true,e:'REM-Aktivität liefert Stimulation, die von außen noch fehlt.'},
{c:PQ,k:2,t:'mc',q:'Eltern lassen ihr Baby zum Einschlafen allein und schauen in immer längeren Abständen kurz nach. Wie heißt diese Methode?',o:['Checking – abgestufte Extinktion','Belohnungssystem','Ignorieren und Löschen','Einschlafritual mit klaren Signalen'],a:0,e:'Checking = schrittweise längere Kontrollintervalle. Komplettes Ignorieren wäre die reine Löschung.'},
{c:PQ,k:2,t:'mc',q:'Welche Reihenfolge der frühesten Entwicklung stimmt?',o:['Zygote → Blastozyste (ca. 4. Tag) → Einnistung (Ende 1. Woche) → Embryo (ab 3. Woche)','Zygote → Einnistung (ca. 4. Tag) → Blastozyste (Ende 1. Woche) → Embryo (ab 3. Woche)','Blastozyste → Zygote (ca. 4. Tag) → Einnistung (Ende 2. Woche) → Embryo (ab 9. Woche)','Zygote → Blastozyste (Ende 2. Woche) → Embryo (ab 3. Woche) → Einnistung'],a:0,e:'Aus der inneren Zellmasse der Blastozyste entsteht der Embryo.'},
{c:PQ,k:2,t:'mc',q:'Wie hoch ist die Kaiserschnittrate in Österreich ungefähr?',o:['Etwa 31,5 %','Etwa 50 %','Etwa 15 %','Etwa 5 %'],a:0,e:'In Brasilien kommt jedes 2. Kind per Kaiserschnitt. Gründe für den Anstieg: Angst vor Schmerzen, Alter der Frauen, Mehrlinge, Planbarkeit und Rechtssicherheit.'},
{c:PQ,k:2,t:'mc',q:'Menschen, die pränatal unterversorgt waren, haben als Erwachsene häufiger Stoffwechselprobleme. Welches Konzept beschreibt das?',o:['Fetale Programmierung','Transnatales Lernen','Dosis-Reaktions-Beziehung','Epigenese nach Aristoteles'],a:0,e:'Pränatale Erfahrungen programmieren physiologische Eckdaten fürs Erwachsenenalter.'},
{c:PQ,k:3,t:'mc',q:'Bei Phenylketonurie verhindert eine spezielle Diät die geistige Behinderung. Welche der fünf Beziehungen zeigt das am deutlichsten?',o:['Umwelt des Kindes → Phänotyp des Kindes','Genotyp der Eltern → Genotyp des Kindes','Phänotyp des Kindes → Umwelt des Kindes','Umwelt des Kindes → Genotyp des Kindes'],a:0,e:'Derselbe Genotyp führt je nach Umwelt (Ernährung) zu unterschiedlichem Phänotyp – Reaktionsnorm.'},
{c:PQ,k:3,t:'mc',q:'Ein schüchternes Kind meidet Feste und sucht sich ruhige Hobbys. Welche Gen-Umwelt-Korrelation liegt vor?',o:['Aktive','Passive','Evokative','Reziproke'],a:0,e:'Aktiv = das Kind sucht sich selbst Umwelten, die zu seinen Anlagen passen.'},
{c:PQ,k:3,t:'mc',q:'Lehrkräfte reagieren auf ein besonders fröhliches Kind wärmer als auf andere. Welche Gen-Umwelt-Korrelation ist das?',o:['Evokative','Aktive','Passive','Epigenetische'],a:0,e:'Evokativ = das genetisch beeinflusste Verhalten ruft bestimmte Reaktionen der Umwelt hervor.'},
{c:PQ,k:3,t:'tf',q:'Mit zunehmendem Alter gewinnt die passive Gen-Umwelt-Korrelation an Bedeutung.',a:false,e:'Passiv nimmt ab (Eltern gestalten die Umwelt weniger), aktiv nimmt zu, evokativ bleibt etwa gleich.'},
{c:PQ,k:3,t:'ms',q:'Was stimmt über Methylierung?',o:['Sie blockiert die Transkription und schaltet so Gene ab','Sie verändert die Basenabfolge der DNA','Frühkindlicher Stress kann die Methylierung von Glukokortikoidrezeptorgenen verändern','Sie kann erklären, warum sich eineiige Zwillinge unterschiedlich entwickeln','Erhöhte Methylierung senkt das Depressionsrisiko'],a:[0,2,3],e:'Die DNA-Struktur bleibt gleich; verändert wird nur, wie Gene funktionieren. Erhöhte Methylierung → ERHÖHTES Depressionsrisiko.'},
{c:PQ,k:3,t:'mc',q:'Die Disposition zu Alkoholsucht wirkt über Besonderheiten des Nervensystems indirekt auf das Verhalten. Wie nennt man ein solches Merkmal?',o:['Endophänotyp','Reaktionsnorm','Regulatorgen','Allel'],a:0,e:'Endophänotyp = genetischer Phänotyp, der Gehirn/Nervensystem und so indirekt das Verhalten beeinflusst.'},
{c:PQ,k:3,t:'tf',q:'Eine Heritabilität von .50 für den IQ bedeutet, dass bei jedem einzelnen Menschen die Hälfte seiner Intelligenz genetisch bedingt ist.',a:false,e:'Erblichkeit beschreibt den Anteil an der VARIANZ in einer bestimmten Population, Zeit und Umgebung – keine Aussage über Einzelpersonen.'},
{c:PQ,k:3,t:'mc',q:'Welcher Entwicklungsprozess des Gehirns ist am frühesten weitgehend abgeschlossen?',o:['Neurogenese','Myelinisierung','Synapsenreduktion im frontalen Cortex','Synaptogenese im Cortex'],a:0,e:'Neurogenese nach ca. 18 Wochen praktisch abgeschlossen; Myelinisierung bis ins frühe Erwachsenenalter; frontale Synapsenreduktion bis Anfang 30.'},
{c:PQ,k:3,t:'mc',q:'Wann sind Hirnschädigungen am folgenschwersten – und wann ist die Erholung am besten?',o:['Am schwersten pränatal/im 1. LJ; Erholung am besten in der frühen Kindheit','Am schwersten in der frühen Kindheit; Erholung am besten pränatal','Am schwersten in der Pubertät; Erholung am besten im 1. LJ','Am schwersten im 1. LJ; Erholung am besten im Jugendalter'],a:0,e:'Pränatal/1. LJ läuft die Neurogenese. In der frühen Kindheit laufen Synaptogenese und Reduktion → hohe Plastizität.'},
{c:PQ,k:3,t:'mc',q:'Kinder mit angeborenem grauem Star (Katarakt) behalten trotz früher Operation visuelle Defizite. Welches Konzept erklärt das?',o:['Erfahrungserwartende Plastizität','Erfahrungsabhängige Plastizität','Synästhesie','Myelinisierung'],a:0,e:'Das Gehirn „erwartet“ normale visuelle Erfahrung in einer sensiblen Phase. Erfahrungsabhängig = individuelle Erfahrungen (z. B. Geiger).'},
{c:PQ,k:3,t:'mc',q:'Aus welchem Primärbläschen entsteht der Hirnstamm (Metencephalon und Myelencephalon)?',o:['Hinterhirnbläschen','Vorderhirnbläschen','Mittelhirnbläschen','Aus allen drei gleichermaßen'],a:0,e:'Vorderhirn → Tel- und Diencephalon; Mittelhirn → Mesencephalon (Reflexe); Hinterhirn → Met- und Myelencephalon.'},
{c:PQ,k:3,t:'tf',q:'Wenn Eltern die Essmenge ihres Kleinkinds streng kontrollieren, verbessert das dessen Selbstregulation beim Essen.',a:false,e:'Kleinkinder regulieren ihre Essmenge gut – elterliche Kontrolle verschlechtert das.'},
{c:PQ,k:3,t:'ms',q:'Welche Aussagen über körperliches Wachstum stimmen?',o:['Am schnellsten wächst man in den ersten 2 Jahren und in der Pubertät','Mädchen erreichen ihre volle Größe mit etwa 15,5 Jahren, Jungen mit 17,5','Der Körperfettanteil ist im Säuglingsalter am höchsten','In der Pubertät steigt der Körperfettanteil bei Jungen','Stress fördert das Wachstum über das Wachstumshormon'],a:[0,1,2],e:'In der Pubertät sinkt der Fettanteil bei Jungen und steigt bei Mädchen. Stress HEMMT das Wachstum.'},
{c:PQ,k:3,t:'mc',q:'Eineiige Zwillinge werden einander mit zunehmendem Alter in ihrer Genexpression unähnlicher. Was erklärt das am besten?',o:['Epigenetische Veränderungen wie Methylierung','Veränderungen der DNA-Basenabfolge durch Crossing-over','Unterschiedliche dominante Allele','Unterschiedliche Anzahl an Chromosomen'],a:0,e:'Die DNA bleibt gleich; Umwelteinflüsse verändern, welche Gene aktiv sind.'},
{c:PQ,k:3,t:'mc',q:'Was versteht man unter Crossing-over?',o:['DNA-Abschnitte wechseln bei der Meiose zwischen den Chromosomen eines Paares','Ein Gen wird durch Anlagerung von Methylgruppen dauerhaft abgeschaltet','Ein rezessives Allel setzt sich bei Heterozygotie gegen ein dominantes durch','Die Chromosomenzahl verdoppelt sich vor der Zellteilung der Zygote'],a:0,e:'Neben zufälliger Kombination und Mutationen eine Quelle genetischer Vielfalt.'},
{c:PQ,k:4,t:'mc',q:'Ein Kind glaubt „Alle Vögel fliegen“. Im Zoo sieht es Pinguine und ändert daraufhin sein Konzept von Vögeln. Welcher Prozess ist das?',o:['Akkommodation','Assimilation','Äquilibrium','Zentrierung'],a:0,e:'Die bestehende Wissensstruktur wird an die neue Erfahrung angepasst. Assimilation wäre: Neues ins bestehende Konzept einfügen.'},
{c:PQ,k:4,t:'mc',q:'Ein Kind, das nur Hunde kennt, nennt eine Kuh beim ersten Anblick „großer Hund“. Welcher Prozess ist das nach Piaget?',o:['Assimilation','Akkommodation','Äquilibration','Objektpermanenz'],a:0,e:'Die neue Information wird in das bestehende Konzept eingefügt, ohne das Konzept zu ändern.'},
{c:PQ,k:4,t:'mc',q:'Ein 5-Jähriger soll vorhersagen, auf welche Seite eine Balkenwaage kippt, und beachtet nur die Zahl der Gewichte, nicht deren Abstand zum Drehpunkt. Das ist ein Beispiel für …',o:['Zentrierung','Egozentrismus','Animismus','den A-nicht-B-Fehler'],a:0,e:'Fokus auf ein einzelnes auffälliges Merkmal – typisch für das präoperationale Stadium.'},
{c:PQ,k:4,t:'mc',q:'Welches Beispiel spricht dafür, dass das Denken weniger konsistent ist, als Piagets Stufen nahelegen?',o:['Zahlinvarianz wird mit etwa 6, Masseninvarianz erst mit etwa 8 Jahren verstanden','Kinder lösen Zahl-, Masse- und Volumeninvarianz meist im selben Monat','Säuglinge suchen versteckte Objekte erst gegen Ende des 1. Lebensjahres','Egozentrismus verschwindet bei fast allen Kindern recht genau mit 7 Jahren'],a:0,e:'Innerhalb derselben Stufe werden verwandte Aufgaben zu ganz verschiedenen Zeitpunkten gelöst.'},
{c:PQ,k:4,t:'mc',q:'Kinder, die gut Schach spielen, merken sich Schachstellungen besser als erwachsene Schachanfänger. Welche Quelle der Gedächtnisentwicklung zeigt das?',o:['Inhaltswissen','Basisprozesse','Rehearsal','Kapazität des Arbeitsgedächtnisses'],a:0,e:'Vorwissen in einem Bereich verbessert das Gedächtnis für diesen Bereich – unabhängig vom Alter.'},
{c:PQ,k:4,t:'tf',q:'Laut Informationsverarbeitungsansatz verändert sich die grundlegende Organisation des Arbeitsgedächtnisses im Kindesalter stark, während die Kapazität gleich bleibt.',a:false,e:'Umgekehrt: Die Organisation ist von früh an konstant, Kapazität und Geschwindigkeit wachsen.'},
{c:PQ,k:4,t:'ms',q:'Welche Theorien beschreiben Entwicklung als universell bzw. invariant?',o:['Piaget','Theorie des Kernwissens','Informationsverarbeitung','Soziokulturelle Theorie (Wygotski)','Dynamische Systeme'],a:[0,1],e:'Bei Piaget mit Einschränkung: Das formal-operationale Stadium erreicht nicht jeder.'},
{c:PQ,k:4,t:'mc',q:'Eine Mutter erklärt ihrem Kind beim Puzzeln ausdrücklich jeden Schritt und nimmt ihre Hilfe dann nach und nach zurück. Welcher Mechanismus ist das?',o:['Scaffolding','Gelenkte Partizipation','Soziales Referenzieren','Geteilte Aufmerksamkeit'],a:0,e:'Scaffolding enthält mehr explizite Anleitung als die gelenkte Partizipation.'},
{c:PQ,k:4,t:'mc',q:'Wie entsteht Veränderung laut Theorien dynamischer Systeme?',o:['Durch Variation und Selektion','Durch Assimilation und Akkommodation','Durch Reifung eines angeborenen Moduls','Durch Arbeit in der Zone der proximalen Entwicklung'],a:0,e:'Verschiedene Wege zum Ziel (Variation); bewährte werden häufiger (Selektion) – nach Erfolg, Effizienz und Neuartigkeit.'},
{c:PQ,k:4,t:'tf',q:'Piaget und die Theorie des Kernwissens sind sich einig, dass Säuglinge ohne domänenspezifisches Vorwissen zur Welt kommen.',a:false,e:'Die Kernwissenstheorie nimmt angeborenes, domänenspezifisches Wissen an (Physik, Psychologie, Biologie, Zahl).'},
{c:PQ,k:4,t:'ms',q:'Ein Kind sagt nach dem Umschütten, im hohen schmalen Glas sei mehr Saft – und kann den Vorgang gedanklich nicht rückgängig machen. Welche Merkmale zeigen sich?',o:['Fehlendes Invarianzkonzept','Fehlende Reversibilität','Zentrierung auf die Höhe','Animismus','Fehlende Objektpermanenz'],a:[0,1,2],e:'Alles typische Grenzen des präoperationalen Denkens; Objektpermanenz ist längst vorhanden.'},
{c:PQ,k:4,t:'mc',q:'Ein Kind zerlegt das Ziel „Keksdose vom Schrank holen“ in Teilschritte: Stuhl holen, hinaufsteigen, Deckel öffnen. Welches Konzept ist das?',o:['Mittel-Ziel-Analyse','Aufgabenanalyse','Rationales Lernen','Äquilibration'],a:0,e:'Aufgabenanalyse macht der Forscher (Ziele, Infos, Strategien bestimmen). Die Mittel-Ziel-Analyse ist die Strategie des Kindes.'},
{c:PQ,k:5,t:'mc',q:'Ein Säugling sieht zehnmal dasselbe Gesicht, bis seine Blickzeit sinkt. Bei einem neuen Gesicht schaut er wieder länger. Was ist damit gezeigt?',o:['Er kann die beiden Gesichter unterscheiden','Er bevorzugt fremde Gesichter dauerhaft','Er erkennt das erste Gesicht als seine Mutter','Er besitzt bereits Objektpermanenz'],a:0,e:'Habituation–Dishabituation zeigt Diskrimination, aber keine Präferenz oder Bedeutung.'},
{c:PQ,k:5,t:'ms',q:'Welche Aussagen über das Sehen von Säuglingen stimmen?',o:['Mit etwa 8 Monaten nähert sich die Sehschärfe der von Erwachsenen an','Farben werden ab etwa 2–3 Monaten wahrgenommen','Stereopsis entwickelt sich mit etwa 4 Monaten','Monokulare Tiefenhinweise werden schon mit 1 Monat genutzt','Größenkonstanz muss erst durch visuelle Erfahrung gelernt werden'],a:[0,1,2],e:'Monokulare Tiefenhinweise erst mit 6–7 Monaten. Größenkonstanz gibt es schon bei Neugeborenen.'},
{c:PQ,k:5,t:'mc',q:'Ein 1 Monat altes Baby betrachtet ein Gesicht. Wohin schaut es vor allem?',o:['Auf die Außenkanten (Kinn, Haaransatz)','Vor allem auf Augen und Mund','Fast nur auf den Mund, weil er sich bewegt','Auf die Augenpartie und die Nase'],a:0,e:'Ab 2 Monaten auch innere Details wie Augen und Mund.'},
{c:PQ,k:5,t:'mc',q:'Ein Ball bewegt sich direkt auf das Gesicht eines 1 Monat alten Babys zu – es blinzelt abwehrend. Welcher Tiefenhinweis wird genutzt?',o:['Objektausdehnung','Binokulare Disparität','Monokulare Bildindikatoren','Wahrnehmungskonstanz'],a:0,e:'Ein näherkommendes Objekt verdeckt immer mehr Hintergrund. Stereopsis kommt erst mit ~4, Bildindikatoren mit 6–7 Monaten.'},
{c:PQ,k:5,t:'mc',q:'Was zeigte Spelke (1976) zur intermodalen Wahrnehmung?',o:['4-Monatige schauen auf den Film, der zum gehörten Ton passt','Neugeborene schauen länger auf den Schnuller, an dem sie gesaugt haben','5–7-Monatige ordnen Stimmen emotionalen Gesichtern zu','1-Monatige drehen den Kopf zur Schallquelle'],a:0,e:'Guck-guck-Spiel vs. Trommeln: auditiv-visuelle Integration mit 4 Monaten.'},
{c:PQ,k:5,t:'ms',q:'Was stimmt über kulturelle Einflüsse auf die Motorik?',o:['Kipsigi-Kinder, die das Sitzen in Erdgruben üben, sitzen früher als US-Kinder','Aché-Kinder werden 3 Jahre am Körper getragen und laufen deshalb früher','Kissenburgen in China gehen mit einer langsameren motorischen Entwicklung einher','Kultur hat keinen messbaren Einfluss, weil Motorik reifungsbedingt ist'],a:[0,2],e:'Wenig Übung (Aché) verlangsamt. Heute gilt der dynamische Ansatz statt reiner Reifung.'},
{c:PQ,k:5,t:'mc',q:'Ein Erwachsener schaltet eine Lampe mit der Stirn ein, weil seine Hände eingewickelt sind. Die Kinder schalten sie danach mit der Hand ein. Wie heißt das?',o:['Rationale Imitation','Verzögerte Nachahmung','Operante Konditionierung','Statistisches Lernen'],a:0,e:'Kinder überlegen, WARUM das Modell so handelt, und ahmen nur nach, was sinnvoll ist.'},
{c:PQ,k:5,t:'mc',q:'Welche Zusammenhänge mit dem späteren IQ sind belegt?',o:['Habituationstempo im Säuglingsalter ↔ IQ 18 Jahre später; visuelle Erwartung mit 3½ Monaten ↔ IQ mit 4 Jahren','Habituationstempo im Säuglingsalter ↔ IQ mit 4 Jahren; visuelle Erwartung mit 3½ Monaten ↔ IQ 18 Jahre später','Habituationstempo im Säuglingsalter ↔ IQ 18 Jahre später; visuelle Erwartung mit 8 Monaten ↔ IQ mit 18 Jahren','Nur das Alter beim ersten freien Laufen sagt den IQ im Erwachsenenalter vorher'],a:0,e:'Das Habituationstempo spiegelt die Effektivität der Informationsverarbeitung.'},
{c:PQ,k:5,t:'mc',q:'Der Kopf eines Babys sinkt plötzlich nach hinten; es streckt die Arme auseinander und zieht sie dann klammernd zusammen. Welcher Reflex ist das?',o:['Moro-Reflex','Tonischer Halsreflex','Suchreflex','Greifreflex'],a:0,e:'Moro- und tonischer Halsreflex haben keinen klaren Nutzen; Such-, Saug- und Greifreflex sind überlebenswichtig.'},
{c:PQ,k:6,t:'mc',q:'Japanische Babys unterscheiden /l/ und /r/ mit 6 Monaten, mit 12 Monaten nicht mehr. Wie erklärt man das?',o:['Wahrnehmungsverengung auf die Muttersprache ab ca. 8 Monaten','Reifung des Hörsystems erst mit 12 Monaten','Kategoriale Wahrnehmung entwickelt sich erst mit 1 Jahr','Fehlende Übung durch zu wenig kindzentrierte Sprache'],a:0,e:'Säuglinge unterscheiden anfangs alle ~600 Kontraste, dann spezialisieren sie sich auf die Muttersprache.'},
{c:PQ,k:6,t:'mc',q:'Die Grenze zwischen /b/ und /p/ liegt bei ca. 25 ms Stimmeinsatzzeit. Wie werden Laute mit 35 ms und 55 ms wahrgenommen?',o:['Beide als dasselbe Phonem /p/','Als zwei verschiedene Phoneme','Beide als /b/','Als Übergangslaut zwischen /b/ und /p/'],a:0,e:'Kategoriale Wahrnehmung: Gleich große Unterschiede werden nur über die Phonemgrenze hinweg bemerkt.'},
{c:PQ,k:6,t:'ms',q:'Was kennzeichnet kindzentrierte Sprache?',o:['Langsameres Sprechen','Hohe Tonvariabilität','Mehr Fragen und Wiederholungen','Längere, grammatisch komplexere Sätze','Weniger Mimik, damit das Kind sich auf die Wörter konzentriert'],a:[0,1,2],e:'Kürzere Sätze, deutliche Vokale, übertriebene Mimik.'},
{c:PQ,k:6,t:'mc',q:'Vor einem Kind liegen eine Tasse und ein unbekanntes Objekt. „Zeig mir das Blicket!“ – das Kind wählt das unbekannte Objekt. Welches Prinzip nutzt es?',o:['Wechselseitige Exklusivität','Prinzip des Objekts als Ganzes','Syntaktische Selbsthilfe','Überdehnung'],a:0,e:'Ein Objekt hat nur einen Namen – die Tasse heißt schon „Tasse“.'},
{c:PQ,k:6,t:'mc',q:'„Das ist ein Sib“ vs. „Das ist etwas Sib“: Kinder deuten das Fantasiewort je nach Satz als Gegenstand oder als Masse. Welches Prinzip ist das?',o:['Syntaktische Selbsthilfe','Wechselseitige Exklusivität','Fast Mapping','Pragmatische Hinweise'],a:0,e:'Die grammatische Form/Satzstruktur wird genutzt, um die Bedeutung zu erschließen.'},
{c:PQ,k:6,t:'tf',q:'Fehler wie „gegangt“ zeigen, dass das Kind eine grammatische Regel erworben hat.',a:true,e:'Übergeneralisierung: Die regelmäßige Form wird auf unregelmäßige Verben angewandt.'},
{c:PQ,k:6,t:'mc',q:'Warum lässt der Fall Genie keine klaren Schlüsse über die kritische Phase zu?',o:['Unklar ist, ob fehlender Sprachinput oder allgemeine Deprivation die Ursache war','Genie war bei ihrer Befreiung erst 18 Monate alt und damit zu jung','Genie lernte danach Grammatik und Wortschatz vollständig nach','Genie war von Geburt an gehörlos und hatte nie Gebärdensprache'],a:0,e:'Genie war von 18 Monaten bis 13 Jahren eingesperrt – Sprachmangel und schwere Vernachlässigung fallen zusammen.'},
{c:PQ,k:6,t:'ms',q:'Was stimmt über die Weniger-ist-mehr-Hypothese?',o:['Sie stammt von Elissa Newport','Begrenztes Gedächtnis erleichtert Kindern das Erfassen der Grundstrukturen','Sie beschreibt einen Mechanismus, der nur für Sprache gilt','Sie spricht dafür, Fremdsprachen früh anzubieten'],a:[0,1,3],e:'Weniger-ist-mehr ist wie statistisches Lernen NICHT sprachspezifisch.'},
{c:PQ,k:6,t:'mc',q:'Wie unterscheidet sich bei Erwachsenen die Sprachverarbeitung je nach Erwerbsbeginn der Zweitsprache?',o:['Erwerb nach dem 5. Geburtstag: stärker bilateral und mehr Frontallappen','Erwerb nach dem 5. Geburtstag: ausschließlich linkshemisphärisch','Erwerb vor dem 5. Geburtstag: stärker rechtshemisphärisch','Der Erwerbsbeginn spielt keine Rolle'],a:0,e:'Early-exposed (vor 5): beide Sprachen in den bekannten linkshemisphärischen Arealen.'},

let EXAM = new Date(...CFG.exam);
const LS = {get(k,d){try{const v=localStorage.getItem(CFG.key+'.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(CFG.key+'.'+k,JSON.stringify(v))}catch(e){}}};
{const v=LS.get('exam',null);if(v)EXAM=new Date(v[0],v[1],v[2])} /* eigener Prüfungstermin */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>').replace(/-&gt;/g,'→').replace(/=&gt;/g,'⇒');
const hash = s => {let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return 'q'+(h>>>0).toString(36)};
Q.forEach(q=>q.id=q.id||hash(q.q));
const CHNAME = Object.fromEntries(CH.map(c=>[c.id,c.s])); CFG.bonus.forEach(b=>CHNAME[b.id]=b.s); CHNAME[PQ]='Prüfungsfragen';
const CHM = CH.filter(c=>!c.x); const MAIN = new Set(CHM.map(c=>c.id)); const RANGE = CHM.length>1?CHM[0].id+'–'+CHM[CHM.length-1].id:String(CHM[0].id);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const solText = q => q.t==='mc'?q.o[q.a]:q.t==='ms'?q.a.map(i=>q.o[i]).join(' · '):q.t==='tf'?(q.a?'Stimmt':'Stimmt nicht'):q.a[0];
const withOrd = q => (q.t==='mc'||q.t==='ms')?{...q,ord:shuffle(q.o.map((_,i)=>i))}:q;
let stats = LS.get('stats',{});
const saveStats = ()=>LS.set('stats',stats);
/* Nochmals wiederholen: war falsch, jetzt richtig → rep=REP; jede weitere richtige Antwort zählt runter, bei 0 ist sie raus, falsch → zurück zu „Zuletzt falsch“ */
const REP = 2;
const FHINT = {all:'Alle Fragen der gewählten Kapitel.', alt:'Nur Fragen, die so oder ähnlich schon in Prüfungen gekommen sind.', wrong:'Fragen, die du zuletzt falsch beantwortet hast – also noch nicht kannst.', rep:'Fragen, die du schon einmal falsch und dann richtig hattest (müssen noch '+REP+'× richtig sein) plus die, die du selbst gemerkt hast.', new:'Fragen, die du noch nie beantwortet hast.'};
const isRep = id => stats[id]&&((stats[id].last==='r'&&stats[id].rep>0)||stats[id].pin);
/* Selbst gemerkt (pin): bleibt in „Nochmals wiederholen“, bis man es selbst wieder entfernt */
const pinBtn = id => {const on=!!(stats[id]&&stats[id].pin);return `<button class="btn ghost pin" data-pin="${id}" aria-pressed="${on}" title="Taste M">${on?'✓ Gemerkt · tippen zum Entfernen':'↻ Nochmals wiederholen merken'}</button>`};
function togglePin(id){const s=stats[id]||{r:0,w:0,rep:0};s.pin=!s.pin;stats[id]=s;saveStats();document.querySelectorAll(`[data-pin="${id}"]`).forEach(b=>b.outerHTML=pinBtn(id))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b)togglePin(b.dataset.pin)});
const isOpen = id => stats[id]&&(stats[id].last==='w'||isRep(id)); /* offene Fehler = zuletzt falsch + nochmals wiederholen */
Object.values(stats).forEach(s=>{if(s.rep===undefined) s.rep = (s.w>0&&s.last==='r') ? REP : 0}); saveStats();

const TABS=['learn','cards','quiz','plan','prog','pet'];
function show(tab){
  if(tab==='pet'&&!petTabVisible()) tab='learn';
  if(tab!=='pet') gameStop();
  if(tab==='plan'&&typeof plan!=='undefined'&&plan.off) tab='learn';
  TABS.forEach(t=>{document.getElementById('v-'+t).hidden = t!==tab; document.getElementById('t-'+t).setAttribute('aria-selected', t===tab)});
  LS.set('tab',tab);
  if(tab==='prog') renderProg();
  if(tab==='learn') renderChapter();
  if(tab==='pet') renderPet();
  if(tab==='plan') renderPlan();
  if(tab==='quiz' && !quiz.active) (browse.on?renderBrowse():renderSetup());
}

function renderItem(x){
  if(typeof x==='string'){

function feedback(ok,q,extra){

const fold = s => String(s).split('').map(c=>{const d=c.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();return d.length===1?d:c}).join('');

const SIDX = [];
CH.forEach(c=>c.sec.forEach((s,si)=>{SIDX.push({k:'l',c:c.id,si,h:s.h,t:s.h});s.b.forEach(x=>{const t=itemText(x);if(t)SIDX.push({k:'l',c:c.id,si,h:s.h,t})})}));

function hl(t,qf){const f=fold(t);let out='',last=0,i=f.indexOf(qf);while(i>=0){out+=esc(t.slice(last,i))+'<span class="hit">'+esc(t.slice(i,i+qf.length))+'</span>';last=i+qf.length;i=f.indexOf(qf,last)}return out+esc(t.slice(last))}

  const grp=[['l','Lernzettel'],['k','Karteikarten'],['q','Quizfragen']].map(([k,l])=>{
    const g=hits.filter(r=>r.k===k); if(!g.length) return '';
    const items=g.slice(0,lim[k]).map(r=>{
      if(k==='l') return `<button class="shit" data-c="${r.c}" data-si="${r.si}"><span class="mono">K${r.c} · ${esc(r.h)}</span><span>${snip(r.t,qf)}</span></button>`;

/* ================== Fortschritt sichern (Code zum Abspeichern, nur Schnappschuss) ================== */
function bkDump(){const o={},p=CFG.key+'.';try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p)&&k!==p+'bk'&&k!==p+'tab')o[k.slice(p.length)]=localStorage.getItem(k)}}catch(e){}return o}
const b64u=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
async function bkMake(){
  const raw=new TextEncoder().encode(JSON.stringify({k:CFG.key,t:Date.now(),d:bkDump()}));
  if(typeof CompressionStream!=='undefined'){try{const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'LB1.'+CFG.key+'.'+b64u(await new Response(st).arrayBuffer())}catch(e){}}
  return 'LB0.'+CFG.key+'.'+b64u(raw);
}
async function bkRead(code){
  const m=String(code).replace(/\s+/g,'').match(/(LB[01])\.([A-Za-z0-9_-]+?)\.([A-Za-z0-9_-]{8,})/);
  if(!m) throw new Error('format'); if(m[2]!==CFG.key) throw new Error('key');
  let bytes=ub64(m[3]);
  if(m[1]==='LB1'){if(typeof DecompressionStream==='undefined')throw new Error('browser');const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer())}
  const o=JSON.parse(new TextDecoder().decode(bytes)); if(!o||o.k!==CFG.key||!o.d) throw new Error('format'); return o;
}
/* Zusammenführen: nie etwas löschen – pro Frage zählt der weitere Stand */
function bkMerge(d){
  const P=x=>{try{return JSON.parse(x)}catch(e){return null}}; let n=0;
  const is=P(d.stats)||{}; for(const id in is){const a=stats[id],b=is[id];if(!b)continue;const na=a?(a.r||0)+(a.w||0):-1,nb=(b.r||0)+(b.w||0);if(nb>na){stats[id]=b;n++}} saveStats();
  const ik=P(d.known)||{}; card.known={...ik,...card.known}; LS.set('known',card.known);
  const ih=P(d.simhist)||[], lh=LS.get('simhist',[]); LS.set('simhist',[...lh,...ih.filter(x=>!lh.some(y=>y.d===x.d))].sort((a,b)=>a.d-b.d).slice(-20));
  const ip=P(d.pet);
  if(ip&&typeof pet!=='undefined'){const lp=pet; if(!lp||!lp.sp||(ip.sp&&((ip.t||lp.t)?(ip.t||0)>(lp.t||0):((ip.stars||0)+(ip.snacks||0))>((lp.stars||0)+(lp.snacks||0))))){pet=ip;LS.set('pet',ip);if(typeof petHeader==='function')petHeader()}}
  /* Lernplan: bei leerem Plan übernehmen, sonst zusammenführen (Erledigtes, Tage, eigene Aufgaben) */
  const ipl=P(d.plan);
  if(ipl&&typeof plan!=='undefined'){
    /* Der Code ist der gespeicherte Stand: sein Lernplan wird komplett übernommen, Erledigtes aus beiden bleibt erhalten */
    if(ipl.v2&&ipl.made){const loc=plan||{};plan={...ipl,done:{...(loc.done||{}),...(ipl.done||{})},ok:{...(loc.ok||{}),...(ipl.ok||{})},custom:{...(loc.custom||{}),...(ipl.custom||{})}};if(typeof planEdit!=='undefined')planEdit=null}
    if(ipl.off&&!plan.made)plan.off=true;
    LS.set('plan',plan); if(typeof planTabSync==='function')planTabSync();
  }
  /* Fokus-Timer: Runden/Minuten zusammenführen, Einstellungen behalten */
  const ifo=P(d.focus);
  if(ifo&&typeof foc!=='undefined'){foc.rounds=Math.max(foc.rounds||0,ifo.rounds||0);foc.cycles=Math.max(foc.cycles||0,ifo.cycles||0);Object.entries(ifo.byDay||{}).forEach(([k,m])=>{foc.byDay[k]=Math.max(foc.byDay[k]||0,m)});if(!LS.get('focus',null))foc.mode=ifo.mode||foc.mode,foc.custom=ifo.custom||foc.custom;LS.set('focus',{...foc,run:foc.run})}
  /* Abzeichen: alles behalten, was einer der beiden Stände hat */
  const iac=P(d.ach);
  if(iac&&typeof ach!=='undefined'){Object.entries(iac.got||{}).forEach(([id,ts])=>{if(!ach.got[id]||ts<ach.got[id])ach.got[id]=ts});const c=iac.c||{};Object.keys(c).forEach(k=>{if(typeof c[k]==='number')ach.c[k]=Math.max(ach.c[k]||0,c[k]);else if(k==='days')ach.c.days={...c.days,...(ach.c.days||{})};else if(!ach.c[k])ach.c[k]=c[k]});LS.set('ach',ach)}
  /* Last-Minute-Tage + Flags vereinigen */
  const ilm=P(d.lmdays); if(Array.isArray(ilm)){LS.set('lmdays',[...new Set([...LS.get('lmdays',[]),...ilm])].sort().slice(-30))}
  const ifl=P(d.flags); if(ifl){LS.set('flags',{...ifl,...LS.get('flags',{})})}
  for(const k in d){if(['stats','known','simhist','pet','tab','bk','plan','focus','ach','lmdays','flags'].includes(k))continue;try{if(localStorage.getItem(CFG.key+'.'+k)==null)localStorage.setItem(CFG.key+'.'+k,d[k])}catch(e){}}
  {const v=LS.get('exam',null);if(v)EXAM=new Date(v[0],v[1],v[2])}
  return n;
}
const bkTotal=()=>Object.values(stats).reduce((s,x)=>s+(x.r||0)+(x.w||0),0);
const bkAgo=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<=0?'heute':d===1?'gestern':'vor '+d+' Tagen'};

/* ================== Lern-Haustier · Logik ================== */
/* pet = null (noch nicht entschieden) | {on, sp, name, goal, snacks (Futter gefuttert), stars (⭐ = Geld), owned:[], born, log:{datum:{a,r}}, eq:{head,eyes,neck}, sty:{}, best, sim, seen:[], qhide, gday:{d,s}, hi:{}} */
let pet = LS.get('pet', null);
const savePet = ()=>{if(pet)pet.t=Date.now();LS.set('pet', pet)};
window.lbPetStar=()=>{if(!pet||!pet.on||!pet.sp)return false;pet.stars=(pet.stars||0)+1;savePet();if(typeof petHeader==='function')petHeader();return true};
const petOn = ()=>!!(pet&&pet.on&&pet.sp&&SP[pet.sp]);
const petTabVisible = ()=>!(pet&&pet.on===false);
let petUI = {slot:'head', picking:false, pickSp:null, pickGoal:20, buy:null, game:null};
const dkey = (d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dshift = n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return dkey(d)};
const tlog = ()=>{const k=dkey();pet.log[k]=pet.log[k]||{a:0,r:0};return pet.log[k]};
const pday = k=>(pet.log[k]||{a:0,r:0});
const starVal = q=>(q.alt||q.c===PQ)?2:1;
const petRetro = ()=>Q.reduce((s,q)=>s+((stats[q.id]&&stats[q.id].r)||0)*starVal(q),0);
const GCAP = Infinity; /* kein Tageslimit für ⭐ aus Spielen (Maximas Wunsch) */
/* Umstellung von der ersten Version (ohne Sterne) */
if(pet&&pet.sp&&pet.stars==null){pet.stars=petRetro();pet.owned=[...new Set([...ACC.filter(a=>a.pr===0).map(a=>a.id),...Object.values(pet.eq||{}).filter(Boolean).map(e=>e.id)])];pet.hi={};savePet()}
if(pet&&pet.sp){pet.hi=pet.hi||{};pet.owned=pet.owned||[];pet.sty=pet.sty||{}}
/* Preise passen sich ans Fach an: Fragenanzahl + Tage bis zur (eigenen) Prüfung, festgelegt beim Start bzw. beim Ändern des Prüfungstermins */
const petNQ = ()=>Q.filter(q=>MAIN.has(q.c)||q.c===PQ).length;
function petScale(){const d=Math.max(1,examDays());const budget=Math.min(d*20,petNQ()*2)*1.05;return Math.max(.25,Math.min(1.5,+(budget/400).toFixed(2)))}
const petStreakReqCalc = ()=>Math.max(2,Math.min(5,Math.round(Math.max(1,examDays())/2)));
const petStreakReq = ()=>pet&&pet.streakReq||5;
const accPr = a=>a.pr==null?null:a.pr===0?0:Math.max(5,Math.round(a.pr*((pet&&pet.scale)||1)/5)*5);
function petStreak(){let s=0,i=pday(dshift(0)).a>=pet.goal?0:1;for(;i<400;i++){if(pday(dshift(i)).a>=pet.goal)s++;else break}return s}
function petMood(){
  /* setzt sich jeden Tag zurück: morgens hungrig, ab halbem Tagesziel zufrieden, Ziel geschafft = glücklich; 2+ Tage gar nix gelernt = traurig */
  const a=pday(dshift(0)).a, t=a/pet.goal; if(t>=1) return 'happy'; if(t>=.5) return 'content';
  if(a>0) return 'hungry';
  let i=1; for(;i<60;i++){const k=dshift(i);if(pday(k).a>0||k<pet.born)break}
  return i>=3?'sad':'hungry';
}
const examDays = ()=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((EXAM-t)/864e5)};
function petBaseMood(){if(typeof focusPhase==='function'){const fp=focusPhase();if(fp==='break'||fp==='long')return 'sleep'}const d=examDays();return d<=0&&d>-3?'happy':petMood()}
const pick = a=>a[Math.floor(Math.random()*a.length)];
const goalVal = id=>{const e=document.getElementById(id);const n=e?parseInt(e.value,10):NaN;return n>0?Math.max(1,Math.min(200,n)):null};
function petLine(){
  const S=SP[pet.sp], m=petMood(), d=examDays(), left=Math.max(0,pet.goal-pday(dshift(0)).a), st=petStreak();
  if(d===0) return 'Heute ist Prüfung! Tief durchatmen – du kannst das. Ich drück dir alle Daumen.';
  if(d<0) return 'Prüfung vorbei – ich bin so stolz auf dich! 🎉';
  if(d===1) return 'Morgen ist Prüfung! Heute nur noch wiederholen und früh schlafen gehen.';
  const L={
    happy:['Tagesziel geschafft! Ich bin kugelrund.',`So viele ${S.foods}! Heute läuft’s richtig gut bei dir.`,'Ich bin satt und mega stolz auf dich.',`Noch ${d} Tage bis zur Prüfung – mit so einem Tag kein Problem.`,'Lust auf eine Runde Begriff-Blitz?'],
    content:[`Schon halb satt! Noch ${left} Fragen bis zum Tagesziel.`,'Eine kleine Quizrunde? Ich hätte Appetit.',`${S.foods} wären jetzt fein. Nur so als Idee.`,`Noch ${d} Tage bis zur Prüfung. Wir schaffen das.`],
    hungry:[`Guten Morgen … mein Bauch knurrt! ${left} Fragen und ich bin satt.`,`Mein Bauch knurrt … ${left} Fragen und ich bin satt.`,`Hast du ein paar ${S.foods} für mich? Jede richtige Antwort zählt.`,'Ich warte schon auf dich. Nur ein paar Fragen?'],
    sad:['Ich hab dich vermisst. Magst du mit 5 Fragen anfangen?','Schon ein paar Tage nix gelernt … ich bin ein bisschen traurig.','Komm, gemeinsam schaffen wir das. Eine Runde?']
  }[m];
  if(st>=2&&Math.random()<.35) return `${st} Tage am Stück geschafft! 🔥 Weiter so.`;
  return pick(L);
}
/* Accessoires: kaufen (pr) oder Spezial-Bedingung */
const allRight = ()=>Q.filter(q=>MAIN.has(q.c)||q.c===PQ).every(q=>stats[q.id]&&stats[q.id].r>0);
const accSpecial = a=>a.sim?!!pet.sim:a.streak?(pet.best||0)>=petStreakReq():a.all?allRight():a.ach?(typeof ach!=='undefined'&&Object.keys(ach.got).length>=a.ach):false;
const accHas = a=>a.pr===0||(a.pr!=null?pet.owned.includes(a.id):accSpecial(a));
const accReq = a=>a.sim?'Prüfungssimulation mit mind. 50 % bestehen':a.streak?petStreakReq()+' Tage am Stück das Tagesziel schaffen':a.all?'alle Fragen mind. 1× richtig (ohne Extra-Kapitel)':a.ach?a.ach+' Abzeichen sammeln':'⭐ '+accPr(a);
function petCheck(){
  pet.best=Math.max(pet.best||0,petStreak());
  const neu=ACC.filter(a=>a.pr==null&&accSpecial(a)&&!pet.seen.includes(a.id));
  neu.forEach(a=>pet.seen.push(a.id));
  const lg={};for(let i=0;i<70;i++){const k=dshift(i);if(pet.log[k])lg[k]=pet.log[k]}pet.log=lg;
  savePet();
  if(neu.length) setTimeout(()=>petToast(`Verdient: <b>${neu.map(a=>a.n).join(', ')}</b>! Gibt’s nicht zu kaufen – im Tab Haustier anziehen.`,'happy'),900);
}

const SPRUCH=['Nicht schlimm! Sogar Freud hat sich manchmal geirrt. Ziemlich oft eigentlich.','Kleiner Freudscher Versprecher – passiert den Besten.','Pawlows Hund hat auch ein paar Versuche gebraucht. 🔔','Fehler sind Lernchancen, sagt Skinner. Und ich sag: Snack-Chance! 🍪','Piaget würde sagen: Du bist gerade mitten in der Akkommodation.','Das war kognitive Dissonanz in Echtzeit. Geht vorbei!','Ebbinghaus hat’s auch nicht beim ersten Mal gekonnt. Wiederholung macht’s.','Kurz verwirrt? Willkommen in der Psychologie. 🙃','Fun Fact: Fehler merkt sich das Gehirn besonders gut. Also eigentlich ein Gewinn!','Selbst Wundt hat mal klein angefangen. Mit einem Labor und viel Geduld.','Kein Stress – Yerkes und Dodson sagen, ein bissl Spannung hilft sogar.','Das nennt man Lernkurve. Und die geht gleich wieder rauf. 📈','Ich hätte das auch geraten. Ich bin aber auch ein Tier.','Maslow sagt: zuerst Snacks, dann Selbstverwirklichung. Kurze Pause?','Das war nur ein Test, ob ich aufpasse. Hab ich! 👀','Fehler gemacht, Erfahrung gesammelt – Bandura wäre stolz aufs Beobachten.','Die Antwort war gut versteckt. Sogar das Unbewusste hat sie nicht gefunden.','Atmen, weiterklicken, weiterlernen. Du machst das super.','Das kommt nächstes Mal ganz sicher – Wiederholung wirkt Wunder.','Rorschach hätte da sicher auch was Spannendes reininterpretiert. 🖤'];

function petSpruch(){if(pet.nosp)return;sprN++;if(sprN-sprLast<4||Math.random()>.32)return;sprLast=sprN;petToast(esc(pick(SPRUCH)),'happy',true)}
function petAnswer(ok,q){
  if(!petOn()) return; const g0=pday(dshift(0)).a>=pet.goal;
  const l=tlog(); l.a++; let st=0; if(ok){l.r++;pet.snacks++;st=starVal(q);pet.stars+=st}
  savePet(); petReact(ok?'yay':'oops',st); petCheck(); petHeader();
  if(!ok) petSpruch();
  if(!g0&&l.a>=pet.goal) petToast(`Tagesziel geschafft! ${esc(pet.name)} ist pappsatt.`,'happy');
}
function petOverride(q){if(!petOn())return;tlog().r++;pet.snacks++;const st=starVal(q);pet.stars+=st;savePet();petReact('yay',st);petCheck();petHeader()}
function petSim(res){
  if(!petOn()) return; const r=res.filter(x=>x.ok).length, l=tlog(), st=res.filter(x=>x.ok).reduce((s,x)=>s+starVal(x.q),0);
  l.a+=res.length; l.r+=r; pet.snacks+=r; pet.stars+=st; let bonus=0;
  if(r/res.length>=.5){bonus=10;pet.stars+=10;pet.sim=1}
  savePet(); petCheck(); petHeader();
  petToast(`${esc(pet.name)} hat ${r} ${SP[pet.sp].foods} gefuttert und du hast ⭐ ${st+bonus} verdient${bonus?' (inkl. 10 Bonus fürs Bestehen)':''}.`, bonus?'happy':'content');
}
function gameStar(n){
  const k=dkey(); if(!pet.gday||pet.gday.d!==k) pet.gday={d:k,s:0};
  const g=Math.max(0,Math.min(n,GCAP-pet.gday.s)); pet.gday.s+=g; pet.stars+=g; savePet(); return g;
}
const gameToday = ()=>pet.gday&&pet.gday.d===dkey()?pet.gday.s:0;

function petMini(){if(!petOn()||pet.qhide)return '';return `<div class="petmini" id="petmini"><button class="pmgo" data-petact="go" title="${esc(pet.name)} · Haustier ansehen" aria-label="Haustier ansehen">${petSVG({sp:pet.sp,mood:petBaseMood(),eq:petEq()})}</button><button class="pmx" data-petact="qhide" title="Im Quiz ausblenden" aria-label="Haustier im Quiz ausblenden">×</button><span class="pbub" id="pbub" hidden></span></div>`}

function petShowEq(){const e=(typeof petEq==='function'?petEq():pet.eq);const x=petUI.tryId&&ACCI[petUI.tryId];return x?{...e,[x.s]:{id:x.id,c:x.c,p:x.p}}:e}
function petReact(m,st){
  const box=document.getElementById('petmini'); if(!box) return;
  const S=SP[pet.sp], go=box.querySelector('.pmgo');
  go.innerHTML=petSVG({sp:pet.sp,mood:m==='yay'?'eat':'oops',eq:petEq(),cls:m==='yay'?'hop':'shake'});
  const b=document.getElementById('pbub'); b.hidden=false;
  b.textContent=m==='yay'?pick(['Mjam!','Lecker!','Richtig!','Yes!','Genau!']):pick(['Hoppla.','Knapp daneben.','Nächstes Mal!','Macht nix.']);

  clearTimeout(petRT); petRT=setTimeout(()=>{const x=document.querySelector('#petmini .pmgo');if(!x)return;x.innerHTML=petSVG({sp:pet.sp,mood:m==='yay'?'happy':petBaseMood(),eq:petEq()});document.getElementById('pbub').hidden=true},1700);
}

function petHeader(){
  const b=document.getElementById('petav'), tb=document.getElementById('t-pet');
  if(tb) tb.hidden=!petTabVisible();
  if(!b) return; b.hidden=!petOn(); if(!petOn()) return;
  const a=pday(dshift(0)).a, p=Math.min(100,Math.round(a/pet.goal*100));

function memStart(){
  gameStop(); const pool=shuffle(CARDS.filter(c=>cardPlain(c[2]).length<=110)).filter((c,i,a)=>a.findIndex(x=>x[1]===c[1])===i).slice(0,6);

function memRender(){
  const S=SP[pet.sp];
  document.getElementById('gbox').innerHTML=`<div class="gtop"><span class="mono">Züge: <b id="gmoves">${G.moves}</b></span><span class="mono">Paare: ${G.done.size}/6</span></div><div class="gmem">${G.tiles.map((t,i)=>{const up=G.open.includes(i)||G.done.has(t.id);return `<button class="gtile${up?' up':''}${G.done.has(t.id)?' got':''}${t.t==='t'?' term':''}" data-petact="mem" data-i="${i}" ${G.done.has(t.id)?'disabled':''}>${up?esc(t.x):`<span>${S.food}</span>`}</button>`}).join('')}</div><p class="hint">Immer ein Begriff + die passende Erklärung. Jedes Paar 1 ⭐, höchstens 10 Züge = 2 ⭐ Bonus.</p>`;

function memFlip(i){
  if(!G||G.k!=='memory'||G.lock||G.open.includes(i)||G.done.has(G.tiles[i].id)) return;
  G.open.push(i);
  if(G.open.length===2){
    G.moves++; const [a,b]=G.open.map(j=>G.tiles[j]);
    if(a.id===b.id){G.done.add(a.id);G.open=[];G.earned+=gameStar(1);gWallet()}
    else{G.lock=true;setTimeout(()=>{if(!G||G.dead)return;G.open=[];G.lock=false;memRender()},1100)}
  }
  memRender();
  if(G.done.size===6){
    const bonus=G.moves<=10?gameStar(2):0; G.earned+=bonus; const rec=!pet.hi.memory||G.moves<pet.hi.memory; if(rec)pet.hi.memory=G.moves; savePet();
    setTimeout(()=>gameEnd(`<div class="result-big">${G.moves}</div><p>Züge für 6 Paare${rec?' · <b>Neuer Rekord!</b>':` · Rekord: ${pet.hi.memory}`} · ⭐ +${G.earned}${bonus?' (inkl. Bonus)':''}</p>`),700);
  }
}

function gapItems(){

  gq.forEach(q=>{const d=shuffle(ga.filter(a=>norm(a)!==norm(q.a[0]))).slice(0,3);if(d.length===3)out.push({h:fmt(q.q).replace('___','<span class="gblank">____</span>'),a:q.a[0],o:shuffle([q.a[0],...d]),e:fmt(q.e||'')})});
  const bolds=[]; CARDS.forEach(c=>{(c[2].match(/\*\*(.+?)\*\*/g)||[]).forEach(m=>{const w=m.slice(2,-2);if(w.length>=2&&w.length<=40)bolds.push({c,w})})});
  shuffle(bolds).slice(0,40).forEach(({c,w})=>{
    const isNum=/\d/.test(w), pool=bolds.filter(x=>x.w!==w&&norm(x.w)!==norm(w)&&/\d/.test(x.w)===isNum&&Math.abs(x.w.length-w.length)<16);
    const same=pool.filter(x=>x.c[0]===c[0]), d=[...new Set([...shuffle(same),...shuffle(pool)].map(x=>x.w))].slice(0,3); if(d.length<3) return;
    const h=fmt(c[2].replace('**'+w+'**','§§')).replace('§§','<span class="gblank">____</span>');
    out.push({h:`<b class="gterm">${esc(c[1])}</b>${h}`,a:w,o:shuffle([w,...d]),e:fmt(c[2])});
  });
  return shuffle(out).slice(0,10);
}

/* feste, logische Reihenfolge innerhalb eines Tages: Kapitel aufsteigend (Lernzettel → Quiz → Fehler), dann Altfragen, Prüfungsfragen, Simulation, Last-Minute, Spickzettel, eigene Aufgaben */
function planOrd(id){const m=id.match(/^([rqf])(\d+)$/);if(m)return +m[2]*10+'rqf'.indexOf(m[1]);const g={alt:9000,pq:9001,sim:9002,lm:9003,sp:9004}[id];return g!=null?g:9100}
const planItems=k=>(plan.items[k]||[]).map((id,i)=>[id,i]).sort((a,b)=>planOrd(a[0])-planOrd(b[0])||a[1]-b[1]).map(x=>x[0]);
const iProg=(k,id)=>{const m=itemMeta(id);return m?Math.min(1,m.prog(k)):1};
const iDone=(k,id)=>iProg(k,id)>=1;
/* Pflicht im Vorschlag / „Noch nicht eingeplant“: nur Lernzettel + Quiz je Kapitel. Fehler wiederholen, Altfragen, Prüfungsfragen sind optional (nur per ✎) */
function planCatalog(){return CHM.flatMap(c=>['r'+c.id,'q'+c.id])}
function planRange(){const t=dkey(),ex=dkey(EXAM),days=[];for(let k=t;k<ex;k=dAdd(k,1))days.push(k);return {today:t,ex,days}}
/* „Fertig mit Durcharbeiten bis“: selbst gewählt oder Standard (ca. 60 % der Lerntage) */
function planEndDays(days){const avail=days.filter(k=>dayCap(k)>0);return avail.length>=6?avail.slice(-2):avail.length>=3?avail.slice(-1):[]}
function planFinDefault(){const {today,days}=planRange();const e=planEndDays(days),tg=days.filter(k=>dayCap(k)>0&&!e.includes(k));return tg[Math.max(0,Math.ceil(tg.length*.6)-1)]||today}
function planFin(){const {today,ex}=planRange();return plan.finish&&plan.finish>=today&&plan.finish<ex?plan.finish:planFinDefault()}
/* Vorschlag: füllt alle nicht selbst bearbeiteten Tage ab heute */
/* „Rest automatisch verteilen“: alles Offene in die bestehenden Tage einsortieren (auch selbst bearbeitete), nach Kapiteln in Reihenfolge, gleichmäßig nach Zeit */
function planRest(){
  const {today,days}=planRange(); const endDays=planEndDays(days), fin=planFin();
  const todo=planUnplanned(); if(!todo.length) return 0;
  let ds=days.filter(k=>dayCap(k)>0&&!endDays.includes(k)); if(!ds.length) ds=days.filter(k=>dayCap(k)>0); if(!ds.length) return 0;
  const pre=ds.filter(k=>k<=fin); if(pre.length) ds=pre;
  const caps=ds.map(dayCap), C=caps.reduce((s,c)=>s+c,0), W=todo.reduce((s,id)=>s+itemMeta(id).w,0); let cum=0;
  todo.forEach(id=>{const w=itemMeta(id).w,f=(cum+w/2)/W*C;let acc=0,j=0;for(;j<ds.length;j++){acc+=caps[j];if(acc>=f)break}const k=ds[Math.min(j,ds.length-1)];(plan.items[k]=plan.items[k]||[]).push(id);cum+=w});
  plan.made=true; savePlan(); return todo.length;
}
function planMsg(html){const t=document.getElementById('ptoast');if(!t)return;t.innerHTML=`<span class="pt-pet" style="display:grid;place-items:center;font-size:1.5rem">📅</span><span>${html}</span>`;t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');clearTimeout(petTT);petTT=setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.hidden=true,300)},3600)}
function planSuggest(onlyRest){
  const {today,days}=planRange(); const free=days.filter(k=>!plan.edited[k]);
  if(!onlyRest) free.forEach(k=>delete plan.items[k]);
  const endDays=planEndDays(days), fin=planFin();
  const planned=new Set(days.flatMap(k=>plan.items[k]||[]));
  const todo=planCatalog().filter(id=>!iDone(today,id)&&!planned.has(id));
  const target=free.filter(k=>dayCap(k)>0&&!endDays.includes(k));
  const p1=todo.filter(id=>/^[rq]\d/.test(id)), p2=todo.filter(id=>!/^[rq]\d/.test(id));
  let t1=target.filter(k=>k<=fin), t2=target.filter(k=>k>fin); if(!t1.length){t1=target.slice(0,1);t2=target.slice(1)}
  const fill=(ids,ds)=>{if(!ds.length)ds=target.slice(-1);if(!ds.length)return;const caps=ds.map(dayCap),C=caps.reduce((a,b)=>a+b,0),W=ids.reduce((a,id)=>a+itemMeta(id).w,0);let cum=0;
    ids.forEach(id=>{const f=(cum+itemMeta(id).w/2)/W*C;let acc=0,j=0;for(;j<ds.length;j++){acc+=caps[j];if(acc>=f)break}const k=ds[Math.min(j,ds.length-1)];(plan.items[k]=plan.items[k]||[]).push(id);cum+=itemMeta(id).w})};
  fill(p1,t1); fill(p2,t2.length?t2:t1);
  if(!onlyRest) endDays.forEach((k,i)=>{if(plan.edited[k])return;plan.items[k]=[...(plan.items[k]||[]),...(endDays.length===1?['sim','lm','sp']:i===0?['sim']:['lm','sp'])]});
  plan.made=true; savePlan();
}
function planLeft(){const {today}=planRange();const out=[];Object.keys(plan.items).filter(k=>k<today).sort().forEach(k=>(plan.items[k]||[]).forEach(id=>{if(!iDone(k,id)&&!out.some(x=>x.id===id))out.push({k,id})}));
  const ahead=new Set(Object.keys(plan.items).filter(k=>k>=today).flatMap(k=>plan.items[k]));return out.filter(x=>!(itemMeta(x.id).g&&ahead.has(x.id)))}
function planUnplanned(){const {today,days}=planRange();const planned=new Set(days.flatMap(k=>plan.items[k]||[]));return planCatalog().filter(id=>!planned.has(id)&&!iDone(today,id))}
function planTodayState(){if(plan.off||!plan.made)return null;const {today}=planRange();const ts=planItems(today);const d=ts.filter(id=>iDone(today,id)).length;if(ts.length&&d===ts.length&&!plan.ok[today]){plan.ok[today]=1;savePlan()}return {ts,d,today}}
const elsewhere=(k,id)=>{const {today,days}=planRange();return days.filter(d=>d!==k&&(plan.items[d]||[]).includes(id))};
function chipHtml(k,id,live){const m=itemMeta(id);if(!m)return '';const p=iProg(k,id),dn=p>=1;return `<span class="pchip${dn?' dn':''}${m.own?' own':''}">${dn?'✓ ':''}${esc(m.n)}</span>`}
function taskRow(k,id){const m=itemMeta(id),p=iProg(k,id),dn=p>=1;return `<div class="ptask${dn?' done':''}"><button class="pchk" ${m.manual?`data-plan="tick" data-d="${k}" data-t="${id}"`:'disabled'} title="${m.manual?'Abhaken':'Hakt sich selbst ab, sobald erledigt'}">${dn?'✓':''}</button><div><b>${esc(m.n)}</b><small>${esc(m.s||'')}</small>${!m.manual&&!dn&&p>0?`<span class="bar"><i style="width:${Math.round(p*100)}%"></i></span>`:''}</div>${m.go&&!dn?`<button class="btn ghost" data-plan="go" data-t="${id}">Los</button>`:''}</div>`}

/* ================== Last-Minute ================== */
function lmPool(){
  const weak=Q.filter(q=>(MAIN.has(q.c)||q.c===PQ)&&stats[q.id]&&stats[q.id].w>0).sort((a,b)=>(stats[b.id].w-stats[b.id].r)-(stats[a.id].w-stats[a.id].r)).slice(0,15);
  const alt=Q.filter(q=>q.alt&&MAIN.has(q.c)).sort((a,b)=>((stats[b.id]&&stats[b.id].last==='w')?1:0)-((stats[a.id]&&stats[a.id].last==='w')?1:0));
  const pq=Q.filter(q=>q.c===PQ&&!(stats[q.id]&&stats[q.id].r>0)).slice(0,15);
  const seen=new Set(), out=[]; [...weak,...alt,...pq].forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);out.push(q)}});
  return out.slice(0,45);
}

{const _po=petOverride; petOverride=function(q){ach.c.row=(ach.c.rowBefore||0)+1;ach.c.best=Math.max(ach.c.best||0,ach.c.row);ach.c.wrow=0;if(quiz.prev&&quiz.prev.last==='w')ach.c.fixed=(ach.c.fixed||0)+1;saveAch();_po(q);achSoon()}}
{const _fi=finish; finish=function(){const perfect=quiz.list.length>=10&&quiz.i>=quiz.list.length-1&&quiz.answered&&!quiz.wrong.length;if(perfect){ach.c.perfect=1;saveAch()}_fi();achSoon()}}

document.addEventListener('click',e=>{if(e.target.closest('[data-petact="pat"]')){ach.c.pats=(ach.c.pats||0)+1;saveAch();achSoon()}},true);
let achT=null; function achSoon(){clearTimeout(achT);achT=setTimeout(achCheck,350)}
function achCheck(){
  if(petHas()&&pet.on){const m=petMood();if(m==='sad')ach.c.wasSad=1;if(ach.c.wasSad&&m==='happy')ach.c.comeback=1}
  if(examDays()===0) ach.c.examday=1;
  const neu=ACH.filter(a=>!ach.got[a.id]&&(()=>{try{return a.f()}catch(e){return false}})());
  if(!neu.length){saveAch();return}
  let st=0; neu.forEach(a=>{ach.got[a.id]=Date.now();st+=Math.max(1,Math.round(ACHR[a.t]*((petHas()&&pet.scale)||1)))});
  saveAch();
  const withPet=typeof petOn==='function'&&petOn();
  if(withPet){pet.stars+=st;savePet()}
  const t=document.getElementById('ptoast'); if(!t) return;
  t.innerHTML=`<span class="achst t-${neu[0].t}"><span>${neu[0].ic}</span></span><span>${neu.length===1?`Neues Abzeichen: <b>${esc(neu[0].n)}</b>`:`<b>${neu.length} neue Abzeichen</b>: ${neu.slice(0,4).map(a=>esc(a.n)).join(', ')}${neu.length>4?' …':''}`}${withPet?` · +${st} ⭐`:''}</span>`;
  t.hidden=false; t.classList.remove('in'); void t.offsetWidth; t.classList.add('in');
  clearTimeout(petTT); petTT=setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.hidden=true,300)},4800);
  if(LS.get('tab')==='pet'&&typeof petUI!=='undefined'&&!petUI.game&&!petUI.picking&&document.activeElement?.tagName!=='INPUT') renderPet();
}
function achSticker(a,got){return `<span class="achst t-${a.t}${got?'':' off'}" title="${esc(a.n)}"><span>${got||!a.sec?a.ic:'?'}</span></span>`}
function badgeRow(){
  const got=ACH.filter(a=>ach.got[a.id]).length, groups=[...new Set(ACH.map(a=>a.g))];
  return `<div class="panel achp"><div class="achhead"><h3>Abzeichen</h3><span class="achcount"><b>${got}</b> von ${ACH.length} gesammelt</span></div><span class="bar achbar"><i style="width:${Math.round(got/ACH.length*100)}%"></i></span>
   <p class="hint">Bronze ${ACHR.b} ⭐ · Silber ${ACHR.s} ⭐ · Gold ${ACHR.g} ⭐ · Spezial ${ACHR.x} ⭐ (Sterne nur mit Haustier). Graue sind noch offen, „?“ sind geheim.</p>
   ${groups.map(g=>`<div class="achg"><span class="mono">${g}</span><div class="achgrid">${ACH.filter(a=>a.g===g).map(a=>{const ok=!!ach.got[a.id];return `<div class="achi${ok?'':' off'}">${achSticker(a,ok)}<b>${ok||!a.sec?esc(a.n):'Geheim'}</b><small>${ok||!a.sec?esc(a.d):'Wird erst beim Freischalten verraten.'}</small><em>${ACHT[a.t]}${ok?' · '+new Date(ach.got[a.id]).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'}):''}</em></div>`}).join('')}</div></div>`).join('')}</div>`;
}
function achMini(){const got=ACH.filter(a=>ach.got[a.id]);return `<button class="achmini" data-achgo="1">${got.slice(-5).map(a=>achSticker(a,1)).join('')||'🏅'} <span>Abzeichen ${got.length}/${ACH.length} ↓</span></button>`}
document.addEventListener('click',e=>{if(e.target.closest('[data-achgo]')){document.querySelector('#v-pet .achp')?.scrollIntoView({behavior:'smooth'})}});

function planProgRow(){return plan.off?`<div class="panel pprog"><div><b>Lernplan</b> · ausgeschaltet (alles gespeichert)</div><button class="btn ghost" data-plan="on">Wieder einschalten</button></div>`:''}
/* Fortschritt sichern: Knopf rechts oben im Fortschritt-Tab */
function bkHead(){const b=LS.get('bk',null),n=bkTotal(),since=b?Math.max(0,n-b.n):n;
  const st=!b?(n?'<span class="bkwarn">noch nie gesichert</span>':''):since>0?`zuletzt ${bkAgo(b.d)} · <span class="bkwarn">${since} neu</span>`:`zuletzt ${bkAgo(b.d)} ✓`;
  return `<div class="proghead"><span class="label">Dein Fortschritt</span><div class="bkhead"><small>${st}</small><button class="btn ghost" data-bkt="1">💾 Code generieren, um Fortschritt zu speichern</button></div></div><div id="bkwrap" hidden>${backupRow()}</div>`}
document.addEventListener('click',e=>{if(e.target.closest('[data-bkt]')){const w=document.getElementById('bkwrap');if(w)w.hidden=!w.hidden}});

/* Start */
petHeader();
planTabSync();focRender();setInterval(focTick,1000);achSoon();
renderRail(); renderChapter(); renderCards();
show(LS.get('tab','learn'));

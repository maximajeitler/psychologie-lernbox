{id:2, s:'Pränatal & Geburt', t:'Pränatale Entwicklung, Geburt und das Neugeborene', sec:[
 {h:'Befruchtung', b:[
  'Feten nehmen schon im Mutterleib viele Reize wahr und lernen aus Erfahrung.',
  '**Aristoteles** lehnte die Präformation ab → **Epigenese:** neue Strukturen und Funktionen bilden sich im Verlauf der Entwicklung heraus (er öffnete befruchtete Hühnereier).',
  '**Gameten:** Keimzellen mit der Hälfte des Erbguts, entstehen durch **Meiose** → je 23 Chromosomen.',
  'Samenerguss ~500 Mio. Spermien, ~200 erreichen die Eizelle. Ein Spermium dringt ein, die Membran wird versiegelt. Die **Zygote** (befruchtete Eizelle) hat den vollständigen Satz Erbgut (½ Mutter, ½ Vater).',
  'Auf **100 weibliche** kommen ca. **120–150 männliche Zygoten**; die Geburtsquote beträgt nur noch 106 Jungen auf 100 Mädchen. Jungen haben ein höheres Risiko, auch bei der Geburt (Kaiserschnitt um 50 % wahrscheinlicher).',
  '**Geschlechterverhältnis:** bei Zygoten **120–150 männliche auf 100 weibliche**, bei der Geburt nur noch **106 Buben auf 100 Mädchen**.']},
 {h:'Phasen der pränatalen Entwicklung', b:[
  {tbl:[['Zeit','Phase','Was passiert'],
   ['Befruchtung bis 2 Wochen','Zygote','Bis zur Einnistung in die Gebärmutterwand, schnelle Zellteilung'],
   ['3. bis 8. Woche','Embryo','Alle Organe und Körpersysteme entwickeln sich: Zellteilung, Migration, Differenzierung, Zelltod, Hormone'],
   ['9. Woche bis Geburt','Fetus','Körperstrukturen reifen, schnelles Wachstum, mehr Verhalten, sensorische Erfahrung, Lernen']]},
  '**Mitose:** Zellteilung in zwei identische Tochterzellen. **Zellmigration:** neue Zellen wandern zu anderen Stellen. **Zelldifferenzierung:** embryonale Stammzellen haben anfangs keine Funktion; welche Gene angeschaltet werden und wo die Zelle landet, bestimmt die Funktion.',
  '**Phylogenetische Kontinuität:** Evolution von Mensch und Tier verläuft kontinuierlich, daher viele gemeinsame Eigenschaften (besonders mit Säugern). **Apoptose:** genetisch programmierter Zelltod.',
  'Geschlecht: **Androgene** (Testosteron-Klasse) vorhanden → männlich. Quelle ist der männliche Fetus selbst – ab der 8. Woche bilden die Hoden Androgene.']},
 {h:'Früheste Entwicklung', b:[
  'Zygote verdoppelt ihre Zellen etwa zweimal täglich; am 4. Tag → **Blastozyste** (Keimblase). Aus der **inneren Zellmasse** entsteht der Embryo.',
  '**Eineiige Zwillinge:** innere Zellmasse teilt sich → identische Gene. **Zweieiige Zwillinge:** zwei Eizellen werden befruchtet → nur ~½ der Gene gleich, wie normale Geschwister.',
  'Ende der 1. Woche **Nidation** (Einnistung). Restliche Zellen → Fruchtblase und Plazenta.',
  '**Fruchtblase:** schützender Puffer, gleichbleibende Temperatur. **Plazenta:** semipermeabel; Sauerstoff, Nährstoffe, Antikörper zum Fetus, CO₂ und Harnstoff zurück; bildet Hormone: Östrogen (↑ Blutzufluss zum Uterus), **Progesteron** (unterdrückt Kontraktionen). **Nabelschnur:** verbindet Fetus und Plazenta.',
  'In der 2. Woche faltet sich die innere Zellmasse in 3 Schichten: **oben** → Nervensystem, Nägel, Zähne, Innenohr, Augenlinse, äußere Haut · **Mitte** → Muskeln, Knochen, Kreislauf, innere Hautschichten, innere Organe · **unten** → Verdauung, Lunge, Harntrakt, Drüsen.',
  '**Neuralrohr:** U-förmige Furche der oberen Schicht → Gehirn und Rückenmark.',
  '**Cephalocaudal:** Kopfbereiche entwickeln sich vor weiter entfernten. **Proximodistal:** Körpermitte vor Extremitäten.']},
 {h:'Zeitstrahl Embryo & Fetus', b:[
  {tbl:[['Woche','Meilensteine'],
   ['4–5','Stark gekrümmt; Gesicht aus 4 Falten; primitives Herz schlägt und pumpt Blut'],
   ['5–6','Schwimmt frei im Fruchtwasser; schnelle Gehirnentwicklung; Augen und Nase; erste spontane Bewegungen (Mutter spürt nichts)'],
   ['9','Alle inneren Organe vorhanden; Geschlechtsdifferenzierung beginnt; Reaktion auf Berührung'],
   ['11–12','Atembewegungen der Brust; Reflexe: greifen, schlucken, saugen; ständige Bewegung'],
   ['16','Mutter spürt Bewegungen; äußere Genitalien weitgehend entwickelt'],
   ['18','Daumensaugen bei zufälliger Berührung; feine Behaarung und Fettschicht'],
   ['20','Meist Kopf nach unten; Komponenten des Gesichtsausdrucks (Stirn runzeln …)'],
   ['28','Lebensfähig (Gehirn, Lunge); Augen öffnen sich, REM-Phasen; Hörsystem funktioniert'],
   ['letzte 3 Monate','Gewicht verdreifacht sich; lernfähig']]}]},
 {h:'Erleben und Verhalten des Fetus', b:[
  '§Bewegung',
  'Ab der **5./6. Woche** spontane Bewegungen; mit ca. **7 Wochen Schluckauf**. Ab der **10. Woche** Zyklen von Ruhe und Aktivität und **fetales Atmen**. In der **12. Woche** sind die meisten Bewegungen, die bei Geburt zu sehen sind, schon aufgetreten.',
  '**Kontinuität:** aktivere Feten werden aktivere Kleinkinder; auch Schlaf-Wach-Rhythmen setzen sich fort.',
  'Schlucken von Fruchtwasser fördert die Entwicklung von Gaumen und Verdauungssystem. Zirkadiane Rhythmen.',
  '§Sinne',
  '**Sehen:** visuelle Erfahrungen vernachlässigbar. **Berührung:** entwickelt sich **als erstes**; Daumenlutschen kann spätere Händigkeit vorhersagen. Wiegen auf mütterliche Bewegung → **vestibuläres System** funktioniert schon vor der Geburt.',
  '**Schmecken:** Präferenz für Süßes (süße Substanz → Fetus trinkt mehr). **Riechen:** Fruchtwasser nimmt Gerüche der Nahrung der Mutter an.',
  '**Hören:** Herzschlag, Blut, Atmung, Verdauung der Mutter; die **Mutterstimme** ist besonders prägnant – Herzrate des Fetus **verlangsamt** sich (Interesse). Spätestens ab dem **6. Monat** Reaktion auf Außengeräusche.',
  '§Lernen',
  '**Habituation:** Abnahme der Reaktion auf wiederholte Reize. **Dishabituation:** neuer Reiz → Interesse steigt wieder.',
  'Frühester Zeitpunkt fetaler Habituation: **32. SSW** – ab da ist das ZNS so weit entwickelt, dass Lern- und Gedächtnisleistungen möglich sind.',
  '**Transnatales Lernen:** Effekte pränatalen Lernens zeigen sich nach der Geburt (Mutterstimme, Geruch des eigenen Fruchtwassers, Geschmackspräferenzen).',
  '**Sehen:** Frühgeborene unterscheiden schon mit **26 Wochen** Licht und Dunkel und zeigen bald visuelles Tracking. **Hören:** ab ca. **24 Wochen** Reaktion auf **tiefe (niederfrequente) Geräusche**; sehr laute Geräusche → hoher Herzschlag, teils Erstarren und Entleeren der Blase.',
  '**Karottensaft-Studie:** Mütter tranken gegen Ende der Schwangerschaft **3 Wochen lang 4× pro Woche** Karottensaft → ihre Babys bevorzugten mit **5½ Monaten** Karottensaft.',
  '**Vestibuläres System:** 3 flüssigkeitsgefüllte, rechtwinkelig zueinander stehende Kanäle im Innenohr. Das Kind bewegt sich am meisten, wenn die **Mutter ruhig** ist.',
  {vid:"Das **Gehör** arbeitet in den letzten **6–8 Wochen** vor der Geburt richtig. Die Mutterstimme kommt über **Knochen und Gewebe** (Wirbelsäule) fast ungedämpft an, Außengeräusche dagegen gedämpft → nach der Geburt erkennt das Baby die **Mutterstimme** am besten, die des Vaters kaum."},
  {vid:"Messgröße beim Fetus ist die **Herzfrequenz** (etwa doppelt so schnell wie unsere), am besten gemessen im **Tiefschlaf**. Auch im Schlaf sind seine Sinne aktiv."},
  {vid:"Ab der **35. Woche** unterscheidet der Fetus **Tonhöhen** und Lautstärken, mit Wiederholung auch Sprachlaute. Schon vor der Geburt beginnt er, den **Rhythmus von Sprachen** zu erkennen (Versuch: Satz auf Isländisch vs. Geräusch mit gleichen Frequenzen → Habituation und Dishabituation der Herzrate)."},
  {vid:"**Geschmack** ab dem **6. Monat**: Das Fruchtwasser ist eine „Suppe“ aus den Aromen der mütterlichen Mahlzeiten. Geschmack und Geruch sind beim Fetus noch **nicht getrennt** – das passiert erst nach der Geburt. Die Ernährung der Mutter prägt spätere Vorlieben."},
  {vid:"Sehen: Eine **Taschenlampe** auf dem Bauch löst eine Reaktion aus, klare Bilder gibt es im Uterus aber nicht. Kaltes Wasser im Fruchtwasser → starker Anstieg der Herzrate (Tastsinn funktioniert)."},
  {vid:"Bewegung der Mutter: Beim **Aufstehen** schlägt das Herz des Fetus schneller, beim normalen Herumgehen kaum noch – er lernt, welche Bewegungen zum Alltag gehören (Vestibularorgan im Innenohr + Bewegungsapparat)."},
  {vid:"Harfe: Spielte eine Harfenistin ihr Stück, wurde die Herzrate ihres Fetus **ruhig und gleichmäßig** und er blieb im Tiefschlaf – trotz 100–110 dB im Bauch. Gewohntes beruhigt, **Neues** löst Reaktionen aus → Gewöhnung setzt **Gedächtnis** voraus."},
  {vid:"**Wachtel-Embryos** lernen einen Mutterlaut **4-mal schneller** und behalten ihn 4-mal länger, wenn zusätzlich ein **Lichtblitz** kommt → **Redundanz**: Lernen über zwei Sinne ist effizienter. Studie mit Schwangeren: Musik hören **und** Mutter wiegt sich im Takt (akustisch + vestibulär) vs. nur wiegen mit Kopfhörern vs. nur Musik."},
  {vid:"„Pränatal-Universitäten“ (Mozart für den Bauch): Der Fetus erwartet die normalen Reize aus dem Alltag der Mutter – **Überstimulation** schadet eher, als dass sie nützt."},
  {vid:"Spricht die Mutter **direkt zum Fetus** (statt mit anderen über ihn), ist seine Reaktion (Herzrate, Bewegung) **stärker und länger**. Ob er etwas versteht oder fühlt, ist Interpretation – belegt ist nur die Reaktion."}]},
 {h:'Risiken der pränatalen Entwicklung', b:[
  '**Spontaner Abort:** am häufigsten, meist ganz am Anfang; Embryos mit schweren Missbildungen oder Chromosomenfehlern.',
  '**Teratogen:** externer Wirkstoff, der pränatal Schäden oder Tod verursachen kann. Entscheidend: **Zeitpunkt** (sensible Phase = besonders anfällige Zeitspanne) und **Dosis-Reaktions-Beziehung** (je länger und stärker, desto schwerer). Mehrere Faktoren wirken kumulativ.',
  '**Fetale Programmierung:** pränatale Erfahrungen programmieren physiologische Eckdaten fürs Erwachsenenalter.',
  '**Medikamente:** nur unter ärztlicher Aufsicht (z. B. Isotretinoin gegen Akne). Antidepressiva: Wirkung ungeklärt.',
  '**Nikotin:** weniger Sauerstoff → **weniger Atembewegungen** des Fetus (auch Passivrauchen); verlangsamtes Wachstum, geringes Geburtsgewicht, mehr plötzlicher Kindstod, geringerer IQ, Hörschäden. Auch E-Zigaretten riskant.',
  '**Alkohol:** überwindet die Plazentaschranke, bleibt länger im Fetus. Häufigste Ursache für Schädigung des fetalen Gehirns → **fetales Alkoholsyndrom**: deformierte Gesichtszüge, geistige Retardierung, Aufmerksamkeitsprobleme, Hyperaktivität.',
  '**Opioide:** ahmen Neurotransmitter nach → Gehirnschäden, Sucht. **Kokain:** Wachstumsverzögerung, Frühgeburt, Probleme mit Erregungs- und Aufmerksamkeitssteuerung. **Marihuana:** nicht eindeutig.',
  '**Umweltverschmutzung:** Metalle, Hormone, Kunststoffe, Pestizide – zusammen teratogen.',
  '**Genetische Risiken:** Chromosomenanomalien (z. B. Trisomie 21), steigen mit dem Alter der Mutter (weniger des Vaters).',
  '§Mütterliche Faktoren',
  '**Alter:** Mütter mit 15 oder jünger → Tod im 1. Jahr 3–4-mal so oft wie bei 23–29-Jährigen. Höheres Alter → mehr Autismus-Spektrum-Störungen, Mutationen, Chromosomenanomalien.',
  '**Ernährung:** **Folsäuremangel** → Neuralrohrdefekt (Spina bifida). Unterernährung spät → kleine Babys, kleiner Kopfumfang; früh → schwere Schädigungen.',
  '**Krankheit:** **Röteln** früh → Missbildungen, Gehörlosigkeit, Blindheit, geistige Behinderung. **Zytomegalievirus** = häufigste pränatale Infektionsquelle. Herpes genitalis → Blindheit bis Tod. HIV: meist nicht übertragen. **Grippe in den ersten 3 Monaten** → häufiger Schizophrenie.',
  '**Emotionaler Zustand:** Stress (Adrenalin, Kortisol) → aktivere Feten; später Hyperaktivität (Jungen), Störungen des Sozialverhaltens (Mädchen), emotionale Probleme (beide).',
  '**Chromosomenanomalien** entstehen während der Meiose und verursachen **50–70 % der Fehlgeburten im 1. Trimester**. Risiko steigt mit dem Alter der Mutter, der Vater hat geringeren Einfluss.',
  '**FAS – FAE – FASD:** **FAS** = volles fetales Alkoholsyndrom. **FAE** (mildere Form): Gesichtsanomalien, Retardierung, Aufmerksamkeitsstörungen, Hyperaktivität, Organschäden – gilt als **problematischer**, weil Betroffene **weniger Unterstützung** bekommen. **FASD** (Fetal Alcohol Spectrum Disorder): nicht alle Symptome, geringerer Schaden.',
  'Ca. **4 %** der Schwangeren weltweit konsumieren **illegale Drogen** → Entzug gleich nach der Geburt. Auch **Gefahren am Arbeitsplatz** (z. B. Lärm) zählen zu den schädlichen Umwelteinflüssen. Teratogene wirken je nach **Zeitpunkt, Menge und Dauer**; mehrere Faktoren können **kumulativ** wirken.',
  '**Alter der Mutter > 35** → medizinische **Risikoschwangerschaft** (mehr Chromosomenanomalien und Geburtskomplikationen).']},
 {h:'Die Geburt', b:[
  '38 Wochen nach Befruchtung beginnt der Uterus zu kontrahieren; reifende Lungen setzen evtl. ein Protein frei, das Wehen auslöst.',
  'Schmerzmittel helfen der Mutter, verlängern aber die Wehen und erhöhen das Risiko fetaler **Hypoxie** (Sauerstoffmangel).',
  'Der Druck verringert vorübergehend den Kopfumfang, regt Hormone an und presst Fruchtwasser aus der Lunge. Der **Geburtsschrei** öffnet die Alveolen → nach Kaiserschnitt häufiger Atemprobleme.',
  '**Kaiserschnittrate:** in **Brasilien** jedes 2. Kind, in **Österreich ca. 31,5 %** – stark steigend. Gründe: Angst vor Schmerzen, Alter der Frauen, Mehrlingsgeburten, Planbarkeit und Rechtssicherheit.']},
 {h:'Das Neugeborene', b:[
  '**6 Aktivierungszustände** (Erregungsniveau und Anteilnahme an der Umwelt) mit starken individuellen Unterschieden.',
  'Durchschnitt pro Tag (aus den Altfragen): ruhiger und aktiver Schlaf je ~8 h (zusammen ~16 h), **aufmerksam wach nur ~2,5 h**, wach und aktiv ~2,5 h, Schreien ~2 h, Dösen ~1 h.',
  '**REM-Schlaf:** schnelle Augenbewegungen, unregelmäßiger Puls und Atem. Neugeborene **50 % REM** → ca. **20 % mit 3–4 Jahren**. **Autostimulationstheorie:** REM-Aktivität erleichtert die Entwicklung des visuellen Systems (Ausgleich fehlender äußerer Reize). Myoklonisches Zucken fördert Sensomotorik.',
  '**Non-REM:** ruhiger, tiefer Schlaf, langsam und regelmäßig. Neugeborene lernen auch im Schlaf.',
  '**Schreien:** Hunger, Schmerz, Kälte, Überreizung, Frustration. Maximum mit **~6 Lebenswochen**, danach bis Ende des 1. Jahres auf **~1 h/Tag**; Tageshöhepunkt späten Nachmittag/Abend. Beruhigen: wiegen, schaukeln, singen, tragen, Schnuller. **Schreibabys** schreien unmäßig ohne Grund, meist Besserung ab dem 3. Monat.',
  '§Plötzlicher Kindstod – Risikofaktoren (Altfragen)',
  'Mutter **jünger als 15**, stillt nicht, raucht, geringe Schulbildung; Baby liegt **auf dem Bauch**, auf weicher Matratze mit Kissen, in vielen Schichten eingepackt.',
  '**Schlafprobleme:** ca. **50 %** der Eltern fühlen sich gestört. Hohe Persistenz: **86 %** der Einjährigen mit Schlafproblemen haben sie noch mit **18 Monaten**, **50–70 %** bis ins **3. Lebensjahr** – höher bei langem Stillen oder Schlafen im Elternbett. Kernproblem: **Selbstregulation** des Babys. Maßnahmen: Ritual und klare Signale, Belohnungssysteme, Ignorieren und Löschen, **Checking** (= abgestufte Extinktion).',
  {vid:"Gedächtnis über die Geburt hinweg: Die Tochter der Harfenistin blieb nach der Geburt bei „ihrem“ Stück im Tiefschlaf und zeigte bei jedem **Crescendo** Aufmerksamkeit (Herzrate sinkt). Ein anderes Baby wachte beim selben Stück auf und weinte – beruhigte sich aber beim **Rocksong**, den seine Mutter in der Schwangerschaft oft gehört hatte."},
  {vid:"Bei der Geburt ändert sich alles: Hören nur noch übers Trommelfell, Schwerkraft, direkte Berührung. Für Kontinuität sorgen **Stimme, Berührung und Geruch der Eltern**. Der Mensch ist das einzige Säugetier, das bei der Geburt so schreit."},
  {vid:"**REM-Schlaf** (paradoxer Schlaf): Neugeborene ca. **8 h** am Tag, Erwachsene nur ca. **2 von 24 h**. Im REM-Schlaf zeigt das Neugeborene alle **Grundemotionen** im Gesicht und lächelt ca. **32-mal in 100 Minuten** – ohne emotionale Bedeutung. Das verschwindet mit **4–5 Monaten**, wenn Mimik willentlich eingesetzt wird."}]},
 {h:'Ungünstige Geburtsausgänge', b:[
  '**Säuglingssterblichkeit:** Tod im 1. Lebensjahr; im Westen stark gesunken. Gründe: Armut, Krieg, Hunger.',
  '**Untergewichtig:** unter **2500 g**; stark untergewichtig unter **1500 g** (besonders anfällig). **Frühgeburt:** vor der **37. Woche** (normal 40). **Gestationsalter:** Dauer seit Befruchtung in Wochen. **Untergewichtig für das Gestationsalter:** deutlich leichter als dem Alter entspricht → Hinweis auf Mangelversorgung.',
  'Ursachen u. a. Teratogene, Mehrlingsschwangerschaften (Zwillinge 55 %, ab Drillingen 95 % untergewichtig). Folgen: mehr neurosensorische Defizite, niedriger IQ, Lernschwierigkeiten, Hyperaktivität, soziale Probleme.',
  '**Modell multipler Risiken:** Risikofaktoren treten gemeinsam auf (Rutter 1979: bei 4+ Risikofaktoren steigt das Risiko psychiatrischer Störungen auf fast das Zehnfache). Eng verknüpft mit dem **sozioökonomischen Status**.',
  '**Entwicklungsresilienz:** erfolgreiche Entwicklung trotz mehrfacher Risiken. Voraussetzungen: Intelligenz, Offenheit, Überzeugung, eigene Ziele erreichen zu können, Fürsorge durch irgendeine wohlwollende Person.',
  '**Säuglingssterblichkeit:** weltweit ca. **38 pro 1000**, **Österreich 4,2 pro 1000**. **Frühgeburt** = vor der **37. SSW**; vor der **24. SSW** kaum Überlebenschance. Langfristige Folgen: Hören, Sprache und Denken beeinträchtigt, häufiger ablenkbar und hyperaktiv, Lernschwierigkeiten, soziale Probleme.',
  {vid:"Frühgeburt (Elizabeth, 28 Wochen, ca. 1,4 kg): 12 Wochen Gehirnreifung müssen außerhalb des Uterus passieren, Licht und Lärm der Intensivstation überfluten das Gehirn. Fast **die Hälfte** hat später Probleme mit **Aufmerksamkeit, Lernen, Planen** – trotz guter Intelligenz."},
  {vid:"**Heidelise Als**: Eine **gebärmutterähnliche** Umgebung (dunkel, leise, sanft) und **Haut-zu-Haut-Kontakt** helfen Frühchen. Ob es wirkt, zeigt nur der **Gruppenvergleich** mit und ohne Intervention – nicht der Einzelfall."}]}
]},
{id:3, s:'Biologie', t:'Biologie und Verhalten', sec:[
 {h:'Grundlagen', b:[
  'Alles an einem Menschen geht auf das Zusammenwirken von Erbgut und Umwelt zurück.',
  '**Gregor Mendel** (Vererbung bei Erbsen/Bohnen), **Watson & Crick** (DNA-Struktur). Menschen haben ca. **21.000 Gene**. **Genom:** vollständiger Satz von Genen eines Organismus.']},
 {h:'Genotyp, Phänotyp, Umwelt – fünf Beziehungen', b:[
  '**Genotyp:** das genetische Material, das ein Individuum erbt. **Phänotyp:** beobachtbares Erscheinungsbild (Körper- und Verhaltensmerkmale), Ausprägung des Genotyps. **Umwelt:** alle Aspekte, die nicht Gene betreffen.',
  {tbl:[['Nr.','Beziehung','Kern'],
   ['1','Genotyp der Eltern → Genotyp des Kindes','Weitergabe der Chromosomen'],
   ['2','Genotyp des Kindes → Phänotyp des Kindes','Gene an/aus, Allele, polygenetisch'],
   ['3','Umwelt des Kindes → Phänotyp','Reaktionsnorm, elterliche Beiträge'],
   ['4','Phänotyp des Kindes → Umwelt','aktives Kind: ruft Reaktionen hervor, wählt Umwelten'],
   ['5','Umwelt → Genotyp des Kindes','epigenetische Mechanismen, Methylierung']]},
  '§1 · Eltern → Kind',
  'Chromosomen im Zellkern bestehen aus DNA; **Gene** sind DNA-Abschnitte, die je ein Protein codieren – Gene wirken **nur über Proteine**. 46 Chromosomen = 23 Paare.',
  '**Geschlechtschromosomen:** Frauen XX, Männer XY → der **Vater** bestimmt das Geschlecht. Ein Gen auf Y löst die Bildung der Hoden aus → Testosteron.',
  'Vielfalt: zufällige Kombination, **Crossing-over** (DNA-Abschnitte wechseln zwischen Chromosomen), **Mutationen** (meist schädlich).',
  '§2 · Genotyp → Phänotyp',
  'Gene wirken nur, wenn sie **angeschaltet** sind; gesteuert durch **Regulatorgene**. Externe Faktoren (Teratogene, z. B. Contergan) können das stören.',
  '**Allele:** verschiedene Formen eines Gens. Dominant-rezessive Vererbung: zwei gleiche Allele = **homozygot**, zwei verschiedene = **heterozygot**.',
  '**Polygenetische Vererbung:** Merkmale werden von mehr als einem Gen bestimmt – z. B. Schüchternheit, Aggressivität, Sensationssuche, Empathie.',
  '**Endophänotyp:** genetischer Phänotyp, der Gehirn/Nervensystem und so indirekt das Verhalten beeinflusst (z. B. Disposition zu Alkoholsucht).',
  '§3 · Umwelt → Phänotyp',
  '**Reaktionsnorm:** alle Phänotypen, die aus einem Genotyp in allen Umgebungen, in denen er überleben kann, theoretisch entstehen können.',
  'Beispiel **Phenylketonurie:** defektes rezessives Gen auf Chromosom 12 verhindert den Abbau von Phenylalanin → bei normaler Ernährung geistige Behinderung, mit Diät nicht.',
  'Elterliches Verhalten und die Erfahrungen, die Eltern ermöglichen, unterliegen selbst genetischen Einflüssen.',
  '§4 · Phänotyp → Umwelt',
  'Kinder rufen mit ihrem Wesen bestimmte Reaktionen hervor und wählen Umgebungen, die zu Interessen und Begabungen passen.',
  '§5 · Umwelt → Genotyp',
  'DNA-Struktur bleibt, aber **epigenetische Mechanismen** verändern das Funktionieren der Gene – teils sogar vererbbar. Erklärt, warum eineiige Zwillinge sich nicht identisch entwickeln.',
  '**Methylierung** schaltet Gene ab (wie ein Drehschalter, blockiert die Transkription). Frühkindlicher Stress (Misshandlung) verändert die Methylierung der Glukokortikoidrezeptorgene – möglicher Weg generationsübergreifender Stressübertragung.',
  '**Additive vs. nicht-additive Geneffekte:** additiv = die Wirkungen verschiedener Allele **addieren** sich; nicht-additiv = **Dominanz** zwischen Allelen. Verhaltenseigenschaften werden polygen vererbt.',
  '**Gen-Umwelt-Korrelation (GUK):** **passiv** – Eltern geben Gene *und* die dazu passende Umwelt weiter (musikalische Eltern fördern Musik) · **evokativ** – die Umwelt reagiert auf genetisch beeinflusste Merkmale (impulsive Kinder werden öfter getadelt) · **aktiv** – Kinder suchen passende Umwelten (intelligentere Kinder wählen kognitiv anregende Freizeit). **Im Verlauf: passiv ↓, aktiv ↑, evokativ bleibt etwa gleich.**']},
 {h:'Verhaltensgenetik', b:[
  'Analyse individueller Unterschiede im Hinblick auf genetische und umweltbedingte Faktoren. „Warum unterscheiden sich Menschen?“',
  'Merkmale wie Intelligenz, Geselligkeit, Stimmung, Aggression sind **polygenetisch** und **multifaktoriell** (viele genetische und Umweltfaktoren).',
  'Zwei Prämissen: genetisch ähnliche Individuen sind phänotypisch ähnlicher (familientypisch); gemeinsam aufgewachsene sind ähnlicher als getrennt aufgewachsene.',
  'Methoden der Familienstudien: **Zwillingsstudien** und **Adoptionsstudien**. Geteilte Umwelt (gemeinsam) vs. nicht geteilte Umwelt (unterschiedlich, z. B. erfahrenere Eltern für Jüngere).',
  {warn:'Altfrage „Im Laufe des Lebens sinkt der genetische Einfluss“ ist dort mit JA beantwortet – das ist falsch. Laut Buch nehmen genetische Einflüsse (z. B. auf den IQ) mit dem Alter ZU, weil Kinder ihre Umwelt zunehmend selbst wählen.'},
  'Deutliche **erbliche Komponente** u. a. bei: kindlichem **Aktivitätsniveau**, **Temperament**, **Leseleistung bzw. Dyslexie**, **antisozialem Verhalten**. h² und e² sagen nichts über die biologischen Mechanismen und gelten nur für eine bestimmte Population, Zeit und Umgebung.']},
 {h:'Aufbau des Gehirns', b:[
  '**Neuronen:** über 100 Mrd., Zellkörper bilden die graue Substanz. Sensorische, motorische Neuronen und Interneuronen (Vermittler).',
  'Aufbau: **Zellkörper** (Basismaterial) · **Dendriten** (empfangen Input, leiten zum Zellkörper) · **Axon** (leitet Signale vom Zellkörper weg) · **Synapse** (Spalt zwischen Axonende und Dendriten).',
  '**Gliazellen:** ca. **10-mal so häufig** wie Neuronen, Stützfunktionen, bilden die **Myelinscheide** (fetthaltige Isolierung → schnellere, effizientere Übertragung). Gestörte Myelinbildung: Multiple Sklerose; defektes Myelin-Gen bei Schizophrenie und bipolarer Störung.',
  '**Cerebraler Cortex:** ~80 % des Gehirns; Furchen schaffen mehr Fläche. Vier Lappen:',
  '**Okzipital** → Sehen · **Temporal** → Gedächtnis, visuelles Erkennen, Emotionen, Hören · **Parietal** → räumliche Verarbeitung, Integration der Sinne mit dem Gedächtnis · **Frontal** → „Exekutive“: kognitive Kontrolle, Arbeitsgedächtnis, Planen, Hemmung.',
  '**Assoziationsfelder:** liegen zwischen sensorischen und motorischen Feldern und integrieren deren Input.',
  '**Cerebrale Lateralisierung:** zwei Hemisphären, verbunden durch den **Corpus callosum** (Balken). Input und Motorik jeweils über die Gegenseite. Sprache meist links.']},
 {h:'Entwicklung des Gehirns', b:[
  '**Neurogenese:** Vermehrung der Neuronen ab der 3./4. pränatalen Woche, nach ~**18 Wochen** praktisch abgeschlossen; bei Geburt fast so viele Neuronen wie Erwachsene. Lebenslang kommen in manchen Regionen neue hinzu (Belohnung ↑, Bedrohung/Stress ↓).',
  'Neuronen wandern (passiv geschoben oder aktiv) und differenzieren sich: Axon, Dendritenbaum, **Dornen**. Im Cortex stärkstes Wachstum erst nach der Geburt.',
  '**Myelinisierung:** beginnt vor der Geburt im Hirnstamm, dauert bis ins frühe Erwachsenenalter, Cortexbereiche unterschiedlich schnell.',
  '**Synaptogenese:** Bildung von Synapsen, pränatal und rapide nach der Geburt, führt zu einem Überschuss.',
  '**Synapsenreduktion:** ca. **40 %** des Überschusses werden abgebaut. Visueller Cortex: Ende 1. LJ bis ~10 Jahre, frontal langsamer, bis Anfang 30. Atypisch bei Autismus und Schizophrenie. In der Pubertät neue Welle.',
  'Zuletzt reift der **dorsolaterale präfrontale Cortex** (Aufmerksamkeit, Impulskontrolle, Konsequenzen, Prioritäten). Häufig aktivierte Synapsen bleiben: **„use it or lose it“**.',
  '**Neuralrohrdefekte:** **Spina bifida** und **Anencephalie**. **4.–6. Woche:** 3 **Primärbläschen** (Vorder-, Mittel-, Hinterhirn) → später 5 **Sekundärbläschen**: Vorderhirn → **Telencephalon + Diencephalon** (leitet sensorische Reize an den Cortex) · Mittelhirn → **Mesencephalon** (Reflexe) · Hinterhirn → **Metencephalon + Myelencephalon** (Hirnstamm: Muskelkoordination, lebenserhaltende Funktionen). Ende der **8. Woche** Gehirn und Rückenmark angelegt, **9. Woche** zwei Hemisphären.',
  '**Neurogenese in Zahlen:** anfangs ca. **125.000** Neurone im Neuralrohr, Spitze **250.000 neue Zellen pro Minute**; ab der **18. SSW** fast abgeschlossen; bei Geburt **> 100 Milliarden** Neurone. **Gliazellen:** Mikroglia, Oligodendrozyten, Astrozyten.',
  'Überschüssige Nervenverbindungen können zu **Synästhesie** führen: verschiedene Sinneseindrücke vermischen sich zu einer Wahrnehmung.',
  {vid:"Nach ca. **3 Wochen** formt sich das **Neuralrohr** (unten → Rückenmark, oben → Gehirn). Mit 4 Wochen entstehen Neuronen rasend schnell (im Video: 500.000 pro Minute; im Buch: bis 250.000). Neuronen entstehen fast nur pränatal und arbeiten bis ins hohe Alter – anders als z. B. Hautzellen."},
  {vid:"**Migration**: Neuronen kriechen wie eine Raupe an **Glia-Fasern** entlang nach außen, Schicht für Schicht wie bei einer Zwiebel. **McConnell** (Transplantation): Eine Vorläuferzelle übernimmt die Funktion ihrer neuen **Nachbarn** (noch plastisch); ein schon wanderndes Neuron folgt seiner **ursprünglichen Bestimmung** → es weiß schon, was es wird."},
  {vid:"Mit **24 Wochen** sind fast alle Neuronen da; dann bis zu 2 Mio. neue Verbindungen pro Sekunde. Verdrahtung in **2 Phasen**: 1) grob nach **genetischem Bauplan** (z. B. Auge → Sehbahn, wie Telefonleitung Boston → New York), 2) Feinabstimmung durch **Nutzung**: Genutztes wird gestärkt, Ungenutztes abgebaut – **„use it or lose it“**."},
  {vid:"Ein junges Kind hat ca. **doppelt so viele Synapsen** wie ein Erwachsener. Bild: ein Marmorblock – die **Erfahrung ist der Bildhauer**, der Überflüssiges wegnimmt. Lernen = Gewichte der Verbindungen ändern sich."}]},
 {h:'Plastizität', b:[
  '**Plastizität:** Fähigkeit des Gehirns, durch Erfahrung beeinflusst zu werden; bei Kindern höher.',
  'Hirnschädigung am schwersten, wenn sie **pränatal oder im 1. Lebensjahr** passiert (Neurogenese läuft). Günstigste Zeit für Erholung: frühe Kindheit (Synaptogenese und Reduktion laufen).',
  '**Erfahrungserwartende Plastizität:** allgemeine Erfahrungen, die jeder Mensch in normaler Umgebung macht, formen das Gehirn (weniger Gene nötig). Kehrseite: Verletzlichkeit bei Reizdeprivation. Bei gehörlos Geborenen verarbeiten Hörareale visuelle Informationen. Beispiel aus den Altfragen: **Katarakt** von Geburt an. Sensible Phasen.',
  '**Erfahrungsabhängige Plastizität:** idiosynkratische, individuelle Erfahrungen bauen Nervenverbindungen auf und um. Beispiel: Geiger haben eine größere Repräsentation der Finger der linken Hand.',
  {vid:"**Sur** (Frettchen): Die Augen wurden auf den **Hörcortex** umgeleitet → dort entstanden sehtypische Muster („Windrad“) und die Tiere konnten sehen – aber unschärfer (ca. 20/60). Die Umwelt formt das Gehirn, schreibt aber **nicht auf eine leere Tafel** → Zusammenspiel von Anlage und Umwelt."},
  {vid:"**Katarakt** (grauer Star) bei Babys: sofort operieren – schon **1–2 Monate** ohne Seherfahrung ab Geburt können **bleibende** Folgen haben. Bei Großeltern egal, weil ihre Verbindungen längst stabil sind. Danach wird jahrelang das **gute Auge abgeklebt**, sonst übernimmt es den ganzen Sehcortex."},
  {vid:"**Terri Lewis**: Nach der Katarakt-OP sehen Babys nach **10 Minuten** so gut wie Neugeborene, nach **1 Stunde** schon deutlich besser → ohne Seherfahrung reift das Gehirn bis zum Neugeborenen-Niveau und holt dann schnell auf (bis zum 1. Geburtstag)."},
  {vid:"**Hemisphärektomie** (linke Hälfte wegen Anfällen entfernt): Das **Sprachverstehen** ist nach ca. 6 Monaten wieder auf dem alten Stand, das **Sprechen** kommt über Jahre langsam zurück. Die **rechte Hemisphäre** übernimmt in entsprechenden Arealen, braucht aber mehr Fläche (Boatman; Erholung auch noch mit 16 Jahren)."}]},
 {h:'Körper und Ernährung', b:[
  'Wachstumsphase = ~20 % der Lebensspanne; bis 20 werden wir **3-mal so groß** und **15–20-mal so schwer**. Am schnellsten: erste 2 Jahre und Pubertät. Mädchen volle Größe mit **15,5**, Jungen mit **17,5** Jahren.',
  'Körperfett am höchsten im Säuglingsalter, sinkt bis 6–8; in der Pubertät sinkt es bei Jungen, steigt bei Mädchen (Menstruation).',
  'Hormone: Wachstumshormon (Hirnanhangsdrüse), Thyroxin (Schilddrüse). **Jahrhunderttrends:** Erwachsene größer, frühere Menstruation (bessere Ernährung, Gesundheit). Stress hemmt Wachstum.',
  '**Gedeihstörung:** Säuglinge ohne medizinischen Grund unterernährt, wachsen nicht.',
  '**Muttermilch:** keimfrei, stärkt Immunsystem, Antikörper, Fettsäuren für die kognitive Entwicklung, gut für die Mutter (weniger Brust- und Eierstockkrebs).',
  'Präferenzen teils angeboren: süß → Lächeln, sauer → Stirnrunzeln, bitter → ganzes Gesicht; Reaktion auf **salzig erst ab 4 Monaten**. Kleinkinder regulieren ihre Essmenge gut – Kontrolle durch Eltern verschlechtert das.',
  '**Nahrungsmittelneophobie:** Unwilligkeit, Unbekanntes zu essen; Neues wird eher von der Bezugsperson akzeptiert.',
  '**Übergewicht:** westliche Ernährung, wenig Bewegung, >2 h Fernsehen; Risiko wird polygen vererbt. **Unterernährung:** ¼ der Kinder in Entwicklungsländern; fast die Hälfte der Todesfälle unter 5; Apathie, verzögerte Entwicklung.',
  'Geschmackspräferenz über die **Muttermilch**: **Vanille und Knoblauch** werden **Bier** vorgezogen. Im Vorschulalter gute Eigenregulation des Essens.',
  '**Österreich:** **24 %** der 7–14-Jährigen übergewichtig oder adipös (Adipositas bei Buben gleich geblieben, bei Mädchen gesunken). **40 %** der 18–64-Jährigen übergewichtig, **12 %** adipös; steigt mit dem Alter, bei Männern deutlich häufiger.']}
]},
{id:4, s:'Kognitive Theorien', t:'Theorien der kognitiven Entwicklung', sec:[
 {h:'Wozu Theorien?', b:['Sie bieten einen Rahmen, werfen Fragen über das Wesen des Menschen auf, führen zu besserem Verstehen und regen Forschung an.']},
 {h:'Piaget – Grundlagen', b:[
  'Bis heute umfassendste Theorie: lebhafte Beschreibung kindlichen Denkens, große Bandbreite bis ins Jugendalter, beachtet Anlage/Umwelt und Kontinuität/Diskontinuität.',
  'Drei Grundannahmen: **Kind als Wissenschaftler** (konstruktivistisch: Hypothesen, Experimentieren, Schlussfolgern) · lernt viel selbst, ohne Instruktion · **intrinsisch motiviert**.',
  '§Quellen der Kontinuität',
  '**Assimilation:** neue Informationen in bestehende Konzepte einfügen. **Akkommodation:** bestehende Wissensstrukturen an neue Erfahrungen anpassen. **Äquilibration:** beides ausbalancieren → stabiles Verstehen (Äquilibrium → Disäquilibrium → stabileres Äquilibrium).',
  '§Quellen der Diskontinuität – Eigenschaften der Stufen',
  '**Qualitative Veränderung** · **breite Anwendbarkeit** (über viele Themen) · **kurze Übergangszeiten** · **invariante Abfolge** (gleiche Reihenfolge, nie übersprungen).',
  'Piagets Erkenntnistheorie heißt **genetische Epistemologie**: Woher kommt Wissen und wie wird es erworben? Falschantworten sind nicht zufällig, sondern zeigen **systematische Fehlermuster** → Methode: **klinisches Interview**; zentrale Versuchspersonen waren seine **eigenen Kinder**.']},
 {h:'Die vier Stadien', b:[
  {tbl:[['Stadium','Alter','Kern'],
   ['Sensomotorisch','0–2','Intelligenz über Sinne und Motorik, Hier und Jetzt; Reflexe → Verhaltenseinheiten; Objektpermanenz; A-nicht-B-Fehler; verzögerte Nachahmung'],
   ['Präoperational','2–7','Symbolische Repräsentation; Egozentrismus; Zentrierung; fehlende Invarianz und Reversibilität; Animismus, Realismus'],
   ['Konkret-operational','7–12','Logisches Denken über Konkretes; Invarianz, Reversibilität; Pendelproblem noch nicht systematisch'],
   ['Formal-operational','ab 12','Abstraktes, hypothetisches, deduktives Denken; Pendelproblem gelöst; nicht jeder erreicht es']]},
  '§Sensomotorisch',
  'Mitte des 1. Jahres: Handlungen mit interessanten Ergebnissen werden wiederholt. **Objektpermanenz:** Objekte existieren weiter, auch außerhalb des Wahrnehmungsfelds. Ende des 1. LJ suchen Kinder versteckte Objekte, machen aber den **A-nicht-B-Suchfehler** (greifen dorthin, wo das Objekt zuletzt gefunden wurde).',
  'Mit 18–24 Monaten dauerhafte mentale Repräsentationen → **zeitlich verzögerte Nachahmung**.',
  '§Präoperational',
  '**Egozentrismus:** Welt nur aus eigener Perspektive. **Drei-Berge-Versuch:** Kinder sollen das Bild wählen, das die Puppe gegenüber sieht; die meisten unter 6 wählen die eigene Perspektive.',
  '**Zentrierung:** Fokus auf ein einzelnes, auffälliges Merkmal. Balkenwaage: 5–6-Jährige beachten nur das Gewicht, nicht den Abstand.',
  '**Invarianzkonzept** fehlt (Umschütten in ein schmales Glas → „mehr“). Unrecht wird nach äußeren Folgen beurteilt, nicht nach Absicht (begrenzte soziale Kognition). **Reversibilität** fehlt. **Realismus:** Gedanken- und reale Welt werden nicht getrennt. **Animismus:** Unbelebtes hat Eigenschaften von Lebewesen.',
  '§Kritik an Piaget',
  '**1** Denken wird konsistenter dargestellt, als es ist (Zahlinvarianz mit 6, Masse erst mit 8). **2** Säuglinge sind kompetenter, als er dachte (zu schwere Tests). **3** Unterschätzt die soziale Welt. **4** Bleibt unscharf bei den Mechanismen kognitiven Wachstums.',
  '**Formal-operational:** deduktives Denken → Aufgaben zur **transitiven Inferenz** (A > B, B > C ⇒ A > C) werden gelöst; auch komplexe Analogien.']},
 {h:'Informationsverarbeitung', b:[
  'Theorien, die die Struktur des kognitiven Systems und die mentalen Aktivitäten (Aufmerksamkeit, Gedächtnis, Problemlösen) beschreiben – **Kind als Computer**, aktiver Problemlöser.',
  '**Aufgabenanalyse:** Ziele, relevante Informationen und mögliche Strategien einer Aufgabe bestimmen.',
  'Entwicklung = Überwinden der Kapazitätsgrenzen: mehr Information gleichzeitig, schnellere Prozesse, neue Strategien und Wissen.',
  '**Problemlösen:** Ausgangszustand → Zielzustand mit einer Strategie, die Hindernisse überwindet. **Mittel-Ziel-Analyse:** Ziel in aufeinander aufbauende Teilschritte zerlegen.',
  '§Gedächtnis',
  '**Arbeitsgedächtnis:** Werkstatt/Puffer, begrenzt, Spanne ca. **7 Elemente**; Organisation von früh an konstant, Kapazität und Geschwindigkeit wachsen. **Langzeitgedächtnis:** unbegrenzt. **Exekutive Funktion:** Hemmung kontraproduktiver Impulse, Arbeitsgedächtnis durch Strategien, kognitive Flexibilität; präfrontaler Cortex.',
  '§Warum das Gedächtnis besser wird',
  '**Basisprozesse** (assoziieren, wiedererkennen, abrufen, verallgemeinern; **Encodieren** = nur Beachtetes wird gespeichert) · **Strategien** (**Rehearsal** = ständiges Wiederholen, entwickelt sich zwischen 5 und 8; **selektive Aufmerksamkeit**) · **Inhaltswissen** (Vorwissen verbessert das Gedächtnis, z. B. Schach: Kinder, die Schach können, merken sich mehr Stellungen als Anfänger).',
  '§Problemlösen',
  '**Theorie der überlappenden Wellen** (Siegler): Kinder nutzen in jedem Alter mehrere Strategien, mit der Zeit immer häufiger die anspruchsvolleren.',
  '**Planen** hilft, ist für Jüngere aber schwer: sie wollen sofort loslegen und sind übertrieben optimistisch. Mit der Reifung des präfrontalen Cortex und Erfahrung wird das besser.',
  '**Metagedächtnis** = Wissen über das eigene Gedächtnis: Wissen über **Umfang**, über **Vergessen**, über die **Schwierigkeit** bestimmter Aufgaben und über **Gedächtnisstrategien**.',
  '**Elaboration** (Gedächtnisstrategie neben Rehearsal und Organisation/Planung): die zu merkenden Infos werden zu einem **Bild oder Satz** verbunden.']},
 {h:'Theorie des Kernwissens', b:[
  'Kinder kommen mit kognitiven Fähigkeiten in Domänen hoher evolutionärer Relevanz zur Welt (**Nativismus**): Unterscheidung belebt/unbelebt, Gesichtserkennung, Sprachverarbeitung, Anzahlen.',
  'Kernwissen ist **domänenspezifisch** (nicht domänenübergreifend). Kerntheorien zu Physik, Psychologie, Biologie werden ausdifferenziert → **Lernen = Erweiterung der Kernprinzipien**.']},
 {h:'Soziokulturelle Theorien', b:[
  'Betonen den Beitrag anderer Menschen und der Kultur: Entwicklung findet großteils in Interaktion statt.',
  '**Gelenkte Partizipation:** Kundige organisieren Aktivitäten so, dass weniger Kundige etwas lernen.',
  '**Soziale Stützung / Scaffolding:** Erwachsene bieten vorübergehend ein Gerüst, das Denken auf höherem Niveau ermöglicht (mehr explizite Anleitung als bei gelenkter Partizipation). Hilft z. B. beim Aufbau des autobiografischen Gedächtnisses.',
  '**Zone der proximalen Entwicklung:** Bereich zwischen dem, was das Kind allein kann, und dem, was es mit optimaler Unterstützung schafft.',
  '**Soziales Referenzieren:** in unbekannter Situation den Emotionsausdruck einer Bezugsperson zur Orientierung nutzen.',
  '**Intersubjektivität:** wechselseitiges Verstehen; mit 6 Monaten lernen Kinder neue Verhaltensweisen durch Beobachtung. **Geteilte Aufmerksamkeit:** Partner richten die Aufmerksamkeit bewusst auf denselben Gegenstand, ab **9–15 Monaten**.',
  '**Kulturwerkzeuge:** menschliche Errungenschaften wie Techniken und Sprache.',
  '§Wygotski',
  'Kinder sind soziale Wesen, geformt vom kulturellen Kontext, den sie mitgestalten. Seine Theorie ist **konstruktivistisch**.',
  {tbl:[['','Piaget','Wygotski'],
   ['Ziel','Logische Begriffe, die überall gleich sind','Teilnahme an lokalen Aktivitäten'],
   ['Veränderung','Qualitativ (Stufen)','Kontinuierlich, quantitativ']]},
  'Denken und Sprechen werden gemeinsam erworben. **Inneres Sprechen** (Internalisierung) in 3 Phasen: Verhalten gesteuert durch **1** Kommunikation mit anderen → **2** laute Selbstgespräche → **3** inneres Sprechen (Denken). Selbstgespräche nehmen ab, je besser die Aufgabe beherrscht wird.',
  '**Kinder als Lehrende und Lernende:** Menschen neigen dazu, anderen etwas beizubringen und davon zu lernen; schon 2-Jährige zeigen spontan auf Objekte. **Kinder als Produkte ihrer Kultur:** Prozesse universell, Inhalte kulturell verschieden.']},
 {h:'Theorien dynamischer Systeme', b:[
  'Wie sich Veränderung über die Zeit in komplexen Systemen abspielt; instabile Übergangsphasen, in denen sich Einflussfaktoren neu organisieren. Veränderung ist die einzige Konstante.',
  'Kind = gut integriertes System vieler Subsysteme (Wahrnehmung, Aufmerksamkeit, Handlung, Gedächtnis …) – also **nicht** nur ein Bereich. Fortschritte und **Rückschritte**.',
  'Angeborene Motivation und Interesse an der sozialen Welt = Entwicklungsmotivatoren. **Handlungen formen das Denken genauso wie Denken die Handlungen.**',
  '**Selbstorganisation:** Aufmerksamkeit, Gedächtnis, Emotionen und Handlungen werden so integriert, wie es die Anpassung erfordert.',
  'Veränderung durch **Variation** (verschiedene Wege zum selben Ziel) und **Selektion** (bewährte Wege werden häufiger). Auswahl nach **relativem Erfolg**, **Effizienz** und **Neuartigkeit**.']},
 {h:'Theorien im Vergleich (Altfragen-Tabelle)', b:[
  {tbl:[['Theorie','Verlauf','Konstruktivistisch','Universell/invariant','Bild vom Kind'],
   ['Piaget','diskontinuierlich','ja','ja (formal-operational nicht universell)','Kind als Wissenschaftler'],
   ['Informationsverarbeitung','kontinuierlich','ja','nein','Kind als Verarbeitungssystem/Computer'],
   ['Kernwissen','kontinuierlich','ja','ja','gut ausgestattetes Evolutionsprodukt'],
   ['Soziokulturell (Wygotski)','kontinuierlich','ja','nein','soziales Wesen in Interaktion'],
   ['Dynamische Systeme','kontinuierlich, mit Rückschritten','ja','nein','Handeln formt Denken und umgekehrt']]}]}
]},
{id:5, s:'Frühe Kindheit', t:'Die frühe Kindheit – Sehen, Denken und Tun', sec:[
 {h:'Überblick & Methoden', b:[
  'Vier eng verbundene Bereiche: **Wahrnehmung, Motorik, Lernen, Kognition**. Kernfrage: Anlage oder Lernen?',
  '**Blickpräferenz:** zwei Reize gleichzeitig; längeres Anschauen → Unterschied bemerkt, Präferenz (heute Eye-Tracking).',
  '**Habituation:** Reiz wiederholen, bis die Reaktion nachlässt → Kind unterscheidet alt/neu.',
  '**Erwartungsverletzung:** Ereignis widerspricht dem Wissen des Kindes → Überraschung, längeres Hinschauen, veränderter Puls.',
  'Typische abhängige Variablen (Altfragen): **Blickdauer, Saugrate, Kopfdrehen, Herzrate, Greifen**.']},
 {h:'Sehen', b:[
  '**Sinnesempfindung:** Verarbeitung grundlegender Informationen durch Rezeptoren. **Wahrnehmung:** Strukturieren und Interpretieren.',
  'Das **visuelle System ist bei Geburt am schwächsten** entwickelt. Schwache **Kontrastempfindlichkeit** → Vorliebe für kontrastreiche Muster; Zapfen noch unreif.',
  'Sehschärfe mit **8 Monaten** annähernd wie bei Erwachsenen, volle Sehschärfe mit **6 Jahren**. Farbwahrnehmung mit **2–3 Monaten**.',
  'Langsam bewegte Objekte geschmeidig verfolgen erst mit **4 Monaten**. Mit **1 Monat** fixieren sie bei Gesichtern die Außenkanten (Kinn, Haaransatz), ab **2 Monaten** auch innere Details.',
  'Präferenz für das Gesicht der Mutter, Gesichter des gleichen Geschlechts, attraktive Gesichter; ab **3 Monaten** für die eigene Ethnie.',
  '**Musterwahrnehmung:** 7 Monate alte Kinder sehen das **Scheinquadrat** (subjektive Kontur).',
  '**Wahrnehmungskonstanz:** Größe, Form, Farbe werden trotz anderem Netzhautbild konstant wahrgenommen – schon bei Neugeborenen (Größenkonstanz braucht keine visuelle Erfahrung).',
  '**Objekttrennung:** einzelne Objekte in einer Szene erkennen. Junge Säuglinge nutzen v. a. **gemeinsame Bewegung**, später Farbe, Form, Textur.',
  '§Tiefe',
  '**Objektausdehnung:** ein näherkommendes Objekt verdeckt immer mehr Hintergrund – schon mit **1 Monat** blinzeln Babys abwehrend.',
  '**Binokulare Disparität:** unterschiedliche Netzhautbilder beider Augen → **Stereopsis** ab ca. **4 Monaten** (Reifung des visuellen Cortex).',
  '**Monokulare Tiefenhinweise (Bildindikatoren)** mit 6–7 Monaten.',
  'Ideale Sehdistanz für Neugeborene: ca. **30 cm**. 1-Jährige interagieren mehr mit einer Versuchsleiterin mit **attraktivem** Gesicht.',
  '**Lichtpunkte:** 5 Monate alte Säuglinge erkennen wandernde Lichtpunkte als **gehende Menschen** – sie erkennen den Zusammenhang zwischen sich bewegenden Elementen.',
  {vid:"Neugeborene sehen die Welt wie ein **verblasstes Foto durch eine Röhre** – das schützt das unreife Gehirn vor Überreizung. Sehen entwickelt sich als **letzter Sinn**. Trotzdem erkennen Babys mit **2 Tagen** die Mutter allein am Gesicht."},
  {vid:"Gesichter: Neugeborene unterscheiden auch **Affengesichter** (zwei Schimpansen) – Erwachsene nur noch Gesichter des eigenen Umfelds (**Wahrnehmungsverengung**, wie bei Sprachlauten). Koreanische Kinder, mit **5–9 Jahren** nach Europa adoptiert, erkannten später europäische Gesichter gut, asiatische schlecht → Plastizität bleibt."},
  {vid:"5 Monate alte Babys bemerken in Filmen einen Wechsel der **Tätigkeit**, aber nicht der **Person** – ihre Aufmerksamkeit hängt an **Bewegung und Handlung**. Bei Standbildern erkennen sie den Personenwechsel."}]},
 {h:'Hören, Geschmack, Tasten, Intermodal', b:[
  'Hören schon im Mutterleib (Herzschlag, Sprachmelodie der Mutter). Bei Geburt Innenohr ausgereift, Außen- und Mittelohr leiten noch ineffizient.',
  '**Auditive Lokalisierung:** Neugeborene drehen sich zur Schallquelle, noch ungenau (kleiner Kopf).',
  '**Musik:** Vorliebe für konsonante Intervalle (auch Kinder gehörloser Eltern → keine Erfahrung nötig). 8-Monatige bemerken Tonänderungen in Melodien auch innerhalb der Tonart, Erwachsene nur bei Tonartwechsel; ebenso Balkan-Rhythmen. Erfahrung führt zum Verlust der Unterscheidungsfähigkeit (**Wahrnehmungsverengung**).',
  '**Geschmack/Geruch:** vor der Geburt entwickelt, angeborene Vorliebe für Süßes und den Geruch der Muttermilch.',
  '**Taktil:** anfangs orale Erkundung; ab ca. dem **4. Monat** Hände → bessere Auge-Hand-Koordination.',
  '**Intermodale Wahrnehmung:** Kombination mehrerer Sinne, schon sehr früh. Visuell-oral (Neugeborene schauen länger auf den Schnuller, an dem sie gesaugt haben); visuell-taktil (4 Monate, Ringe); auditiv-visuell (Spelke 1976: 4-Monatige schauen auf den Film, der zum Ton passt – Guck-guck vs. Trommeln); Emotion-Stimme (5–7 Monate).',
  {vid:"Intermodaler Transfer **Tasten → Sehen**: Ein **40 Stunden** altes Baby ertastet einen kleinen Zylinder, danach sieht es ihn und ein neues Objekt → in **98 %** schaut es kurz auf das ertastete und dann länger auf das **neue** (wiedererkannt)."}]},
 {h:'Motorik', b:[
  '**Reflexe:** angeborene, festgelegte Handlungsmuster. Überlebenswichtig: **Greif-**, **Such-** (Wange berühren → Kopf dreht sich, Mund öffnet), **Saug-**, **Schluckreflex**.',
  'Ohne klaren Nutzen: tonischer Halsreflex (ATNR = Fechterstellung, STNR), **Moro-Reflex** (Kopf sinkt plötzlich → Arme auseinander, dann klammern).',
  '**Schreitreflex:** erlischt mit 2–3 Monaten, nicht wegen cortikaler Reifung, sondern weil die **Beine schwerer** werden (im Wasser tritt er wieder auf). Pummelige Babys laufen und krabbeln deshalb oft später.',
  'Ungewöhnlich starke/schwache oder zu lange bestehende Reflexe → Hinweis auf neurologische Probleme. Husten, Niesen, Blinzeln bleiben lebenslang.',
  '§Kultur',
  'China: Kissenburgen → langsamer · Aché (Paraguay): 3 Jahre am Körper der Mutter → wenig Übung · **Kipsigi** (Kenia): Sitzen in Erdgruben üben → schneller als in den USA · Westafrika: Massage und Stimulation.',
  'Früher: cortikale Reifung bestimmt die Motorik. Heute: **dynamischer Ansatz** (Neuronen, Kraft, Haltung, Balance, Wahrnehmung, Körperproportionen, Motivation).',
  '**Affordanzen:** Handlungsmöglichkeiten, die Gegenstände und Situationen bieten.',
  '§Greifen und Fortbewegung',
  'Vorformen: tollpatschiges Schlagen; mit **3–4 Monaten** erfolgreiches Greifen; mit **7 Monaten** freies Sitzen; später Antizipation (Hand öffnet sich passend).',
  'Ab ~**8 Monaten** eigene Fortbewegung (Robben, Krabbeln). Mit **11–12 Monaten** Laufen: breite Basis, Knie gebeugt, Hände hoch; **60 %** der Zeit beide Füße am Boden (Erwachsene 20 %). 12–19-Monatige: ~2368 Schritte und 17 Stürze pro Stunde.',
  '**Skalierungsfehler:** eigene Körpergröße wird nicht berücksichtigt (Kind will sich auf einen Puppenstuhl setzen).',
  '**Visuelle Klippe** (Gibson & Walk 1960): Plexiglas, eine Seite wirkt tief. Misstrauen gegenüber Höhen entsteht erst mit eigener Fortbewegung. Wenig Krabbelerfahrung → Kinder rutschen eher eine steile Rampe hinunter.',
  'Entscheidung „sicher oder gefährlich“: eigene Erfahrung + Gesicht der Eltern (**Social Referencing**): Mutter fröhlich → 75 % überqueren, ängstlich → kein Kind, wütend → einige.',
  '**McGraw** fand mit **Zwillingsstudien** Unterschiede in der motorischen Entwicklung (Gesell: Reifung nach cephalo-kaudalem und proximo-distalem Prinzip).']},
 {h:'Lernen', b:[
  '**Habituation:** einfachste, früheste Form; Tempo spiegelt die Effektivität der Informationsverarbeitung.',
  '**Wahrnehmungslernen:** aktives Suchen nach Ordnung; **Differenzierung** (stabile Elemente herausfiltern) und **Affordanzen**.',
  '**Statistisches Lernen:** Assoziationen zwischen Reizen, die in vorhersagbaren Mustern auftreten; schon bei Neugeborenen.',
  '**Klassische Konditionierung:** neutraler Reiz wird mit einem Reiz verknüpft, der immer eine Reaktion auslöst; der neutrale Reiz muss **vor** dem unkonditionierten Reiz kommen. Auch Emotionen können so entstehen.',
  '**Operante Konditionierung:** Lernen der Beziehung zwischen eigenem Verhalten und Folgen; **Kontingenzbeziehung**. **Mobile-Versuch:** Bein ist ans Mobile gebunden; 3-Monatige behalten das eine Woche, 6-Monatige zwei Wochen; unter 6 Monaten nur mit demselben Mobile.',
  '**Beobachtungs-/Nachahmungslernen:** früh, mit 6 Monaten recht stabil. **Rationale Imitation:** Nachahmung nach bewusstem Nachdenken über die Absicht des Modells.',
  '**Rationales Lernen:** aus Erfahrungen Vorhersagen ableiten. **Aktives Lernen:** durch Auseinandersetzung mit der Welt statt passiver Beobachtung.',
  '**Habituation ↔ IQ:** Habituationsgeschwindigkeit im Säuglingsalter korreliert positiv mit dem **IQ 18 Jahre später**. **Visuelle Erwartung** mit **3½ Monaten** korreliert positiv mit dem **IQ mit 4 Jahren**.',
  '**Little Albert:** viele emotionale Reaktionen (z. B. Angst) werden vermutlich zuerst durch **klassische Konditionierung** gelernt.',
  '**Nachahmung:** ab **6 Monaten** verzögert; ab **15 Monaten** auch Handlungen eines Erwachsenen im **Fernsehen**; Verständnis für **Handlungsabsichten** ab **18 Monaten**. Kontingenzen (operant) lernen schon **2 Monate** alte Babys.',
  {vid:"Nachahmung: Schon mit **3½ Monaten** ahmen Babys den Gebrauch eines Gegenstands nach; **falschen Gebrauch** von Alltagsgegenständen schauen sie lange an. Beim Beobachten und Ausführen einer Bewegung feuern **dieselben Nervenzellen** (Spiegelneurone)."}]}
]},
{id:6, s:'Sprache & Symbole', t:'Die Entwicklung des Sprach- und Symbolgebrauchs', sec:[
 {h:'Komponenten der Sprache', b:[
  'Mit 5 Jahren beherrschen Kinder die Grundstruktur ihrer Muttersprache (gesprochen oder gebärdet). **Sprachverstehen** (verstehen, was andere sagen) geht der **Sprachproduktion** voraus.',
  '**Generativität:** aus endlich vielen Wörtern und Morphemen unendlich viele Sätze bilden.',
  '**Phoneme:** kleinste bedeutungsunterscheidende Laute (Rippe/Lippe). **Morpheme:** kleinste bedeutungstragende Einheiten („Hunde“ = Hund + e). **Syntax:** Regeln der Wortkombination. **Pragmatik:** Gebrauch im Kontext. **Metalinguistisches Wissen:** Wissen über Sprache als Sprache.',
  'Spracherwerb umfasst **phonologische**, **morphologische**, **semantische**, **syntaktische** und **pragmatische** Entwicklung. Gebärdensprache hat dieselben Komponenten – kein qualitativer Unterschied.']},
 {h:'Voraussetzungen', b:[
  'Menschliches Gehirn + Hören (oder Sehen). Sprache ist **artspezifisch** und **universell**.',
  'Tiere: Bonobo **Kanzi** ~350 Wörter, Hund **Rico** ~200, Papagei **Alex** Kleinkindniveau – aber nur nach intensivem Training, kaum Syntax (max. Dreiwortsätze), wenig Generativität.',
  '**Kritische Phase für den Spracherwerb:** laut Buch die Zeitspanne zwischen dem 5. Lebensjahr und der Pubertät, in der Sprache leicht erlernt wird und danach deutlich schwerer.',
  'Fälle: Wolfskind **Viktor** (Frankreich, um 1800), **Genie** (USA 1970, von 18 Monaten bis 13 Jahre eingesperrt) – unklar, ob fehlender Input oder allgemeine Deprivation. Erwachsene haben nach Hirnschädigung eher bleibende Sprachstörungen. Zweitsprache vor der Pubertät wird anders verarbeitet.',
  '**Weniger-ist-mehr** (Elissa Newport): Kinder speichern wegen begrenzter Wahrnehmung und Gedächtnis kleinere Sprachportionen – das erleichtert das Erfassen der Grundstrukturen. → Fremdsprachen und Gebärdensprache früh anbieten.',
  '**Kindzentrierte Sprache:** hohe Tonvariabilität, langsamer, kürzere Sätze, mehr Fragen und Wiederholungen, deutliche Vokale, übertriebene Mimik. Lenkt die Aufmerksamkeit auf Sprache, Kinder bevorzugen sie. Sehr häufig, aber **nicht universell**.',
  '**Bilingualismus:** **simultan** = vor 5 J. beiden Sprachen gleich ausgesetzt → Meilensteine in beiden Sprachen im normalen Alter. **Sequenziell** = Grammatik der Zweitsprache bei intensivem Kontakt innerhalb des 1. Jahres; Verlauf wie bei Einsprachigen, **keine Beeinträchtigung der Erstsprache**, oft aber **kleinerer Wortschatz** je Sprache.',
  '**Bilingualismus im Gehirn:** bei Kindern ähnliche Areale für beide Sprachen; das **Broca-Zentrum** wird erst ab einer bestimmten Wortschatzgröße aktiv. Erwachsene: **early-exposed** (vor dem 5. Geburtstag) → beide Sprachen linkshemisphärisch · **later-exposed** → stärker **bilateral** und mehr **Frontallappen**.',
  {vid:"Schon bei **12 Wochen** alten Babys läuft Sprachverarbeitung (fMRT, Geschichte vorgelesen) in der **linken Hemisphäre** – wie bei Erwachsenen. Angeboren ist die **Fähigkeit** zum Spracherwerb, nicht die Sprache selbst."},
  {vid:"**Debbie Mills**: Mit **13 Monaten** verarbeiten Babys Wörter mit **beiden** Hemisphären, mit **20 Monaten** (Wortschatzexplosion) **links**. Zweisprachige Kinder: links nur für die **besser bekannte** Sprache → **Erfahrung** (Wortschatz), nicht Reifung treibt die Spezialisierung."},
  {vid:"Zweisprachige Kinder trennen ihre Sprachen von Anfang an und **plappern** je nach Elternteil englisch- oder französisch-artig."},
  {vid:"Sprachentwicklungsstörung trotz normaler Intelligenz (Michael, 5 J.): Sprache hängt an vielen Hirnsystemen – fällt eines aus, leidet die Sprache. Mit Übung (Laute, Wörter) deutliche Fortschritte."}]},
 {h:'Laute wahrnehmen', b:[
  'Beginnt im Mutterleib. Basis ist die **Prosodie** (Rhythmus, Tempo, Melodie, Intonation).',
  '**Kategoriale Wahrnehmung:** kontinuierlich variierende Reize werden als diskrete Kategorien wahrgenommen – schon bei **Neugeborenen**, muss nicht gelernt werden.',
  '**Stimmeinsatzzeit (VOT):** Zeit zwischen Lösen der Lippen und Einsetzen der Stimmbänder (unter ~25 ms → /b/, darüber /p/). Gleich große VOT-Unterschiede werden nur über Phonemgrenzen hinweg wahrgenommen.',
  'Säuglinge unterscheiden **mehr Laute als Erwachsene** (alle ~600 Kontraste, z. B. /l/–/r/ bei japanischen Babys). Ab ca. **8 Monaten** Wahrnehmungsverengung auf die Muttersprache.',
  '**Wortsegmentierung:** Anfang und Ende von Wörtern im Sprachstrom erkennen (2. Hälfte des 1. LJ). **Verteilungscharakteristik:** bestimmte Laute treten wahrscheinlicher zusammen auf → statistisches Lernen.',
  'Eigener Name: mit **4,5 Monaten** achten Babys selektiv darauf, wenige Wochen später auch im Hintergrund.',
  {vid:"**Patricia Kuhl**: Zwei Mandarin-Laute, die für Amerikaner gleich klingen – mit **7 Monaten** unterscheiden US-Babys sie noch („**Weltbürger**“), mit **11 Monaten** nicht mehr (Spezialisten ihrer Sprache)."},
  {vid:"Neugeborene unterscheiden Sprachen mit **verschiedenem Rhythmus** (Englisch/Französisch, Italienisch/Niederländisch); rhythmisch ähnliche (Englisch/Niederländisch) erst mit **4–5 Monaten**."},
  {vid:"**Wortsegmentierung** mit **8 Monaten**: Eine Geschichte mit einem Schlüsselwort läuft, solange das Baby auf eine Lampe schaut → danach hört es das bekannte Wort länger an. Babys isolieren **Wortformen, bevor** sie ihnen Bedeutung geben."}]},
 {h:'Vorbereitung der Sprachproduktion', b:[
  'Erste 2 Monate: weinen, niesen, seufzen. Mit **6–8 Wochen** Gurren (**Cooing**: „ohh“, „gu“).',
  '**Plappern:** wiederholte Konsonant-Vokal-Silben („bababa“), zwischen **6 und 10 Monaten**. Gehörlose Kinder mit Gebärdensprache plappern mit den **Händen**.',
  '**Turn-taking** (Wechsel Sprecher/Zuhörer, Guck-guck-Spiele). Mit ca. 12 Monaten verstehen Kinder die Bedeutung des **Zeigens** (triadische Interaktion).',
  '**Feinere Phasen (PDF):** 0–2 Mon. reflexive Vokalisierung · **2–4 Mon. Cooing** (hinten im Mundraum, teils reziprok) · **4–6 Mon. Babbling** (Konsonant-Vokal, spielerisch) · **6–10 Mon. kanonisches Plappern** (Reduplikation „mamama“) · **ab 10 Mon. moduliertes Plappern** (sprachspezifisch). Gehörlose Kinder vokalisieren bis ca. **7 Monate**, dann hören sie auf. (Buch: Cooing schon ab 6–8 Wochen.)',
  '**Dyadisch vs. triadisch:** dyadisch = Turn-Taking zwischen zwei Partnern; triadisch = ein **Objekt** ist beteiligt (Kind zeigt, schaut zwischen Erwachsenem und Objekt hin und her).']},
 {h:'Wörter lernen', b:[
  '**Referenz:** Beziehung zwischen Wort und Bedeutung. Kinder verstehen anfangs mehr, als sie sagen können.',
  '**Erste Wörter mit 10–15 Monaten**. **Produktiver Wortschatz** = Wörter, die das Kind sagen kann. Vereinfachungsstrategien beim Aussprechen.',
  '**Holophrastische Phase:** Äußerungen aus einem einzigen Wort.',
  '**Überdehnung:** Wort zu weit verwendet (alle Vierbeiner „Hund“; oder „Apfel“ für die Birne, obwohl das Kind die Birne zeigen kann → Verstehen > Produktion). **Unterdehnung:** zu eng („Ball“ nur für den eigenen Ball).',
  'Mit ca. **18 Monaten ~50 Wörter**, dann **Wortschatzexplosion** (gegen Ende des 2. LJ).',
  'Hilfen der Erwachsenen: Betonung, Wiederholung, konsistente Umgebung.',
  '**Schnelle Bedeutungsbildung durch Mapping** (Fast Mapping): neues Wort wird gelernt, weil es kontrastiv zu einem bekannten gebraucht wird.',
  '**Wechselseitige Exklusivität:** ein Objekt hat nur einen Namen → ein neues Wort gehört zum unbekannten Objekt („Zeig mir das Blicket“). **Objekt als Ganzes:** Wörter bezeichnen ganze Objekte, nicht Teile.',
  '**Pragmatische Hinweise:** Blickrichtung des Erwachsenen, Intentionalität (gezielte vs. „ups“-Handlung), Emotionen (Freude beim Finden). **Syntaktische Selbsthilfe:** Satzstruktur nutzen, um die Bedeutung zu erschließen.',
  '13–18 Monate: auch Gesten und Laute als Namen akzeptiert; mit 20–26 Monaten nur noch Wörter.',
  '**Verlauf der Fehler:** zuerst **Unterextensionen**, später **Überextensionen**. Passiver Wortschatz mit 6 J. ca. **10.000**, bei Studierenden ca. **150.000** Wörter.']},
 {h:'Sätze, Grammatik, Gespräch', b:[
  'Gegen Ende des 2. LJ Zweiwortkombinationen im **Telegrammstil** (Unwesentliches fehlt).',
  '**Berko-Experiment** (Wug-Test): ein Fantasiewesen, Kinder bilden den Plural → sie generalisieren Regeln. **Übergeneralisierung:** unregelmäßige Formen werden regelmäßig behandelt („gegangt“). Eltern korrigieren Grammatik selten.',
  '**Miniatursprachen:** künstliche Sprachen; schon 8-Monatige lernen komplexe Muster und generalisieren.',
  '**Kollektive Monologe:** Kinder reden nebeneinander, ohne Bezug aufeinander. Mit 5 Jahren **Erzählungen**; Eltern helfen mit **elaborierenden Fragen**. Sprachpragmatik entwickelt sich in der Vorschulzeit (hängt von exekutiver Kontrolle ab).',
  'Schulalter: Wortschatz 6-Jährige ~10.000 → Fünftklässler ~40.000 → Studierende ~150.000; Passiv, Mehrdeutigkeit, differenziertere Pragmatik.',
  '**Kollektive Monologe:** 2-Jährige beantworten nur ca. **⅓** der an sie gerichteten Fragen. Erzählungen über Vergangenes sind mit 3 J. noch selten. Fragen anfangs ohne Umstellung, nur über **Intonation** und Fragewort am Anfang.']},
 {h:'Theorien des Spracherwerbs', b:[
  'Anlage (Gehirn) und Umwelt (Spracherfahrung) sind beide Voraussetzung.',
  '**Skinner** („Verbal Behavior“): Spracherwerb mit behavioristischen Prinzipien.',
  '**Chomsky:** Prinzipien des Spracherwerbs angeboren, **Universalgrammatik** (abstrakte Regeln aller Sprachen). **Language Acquisition Device (LAD):** angeborene Prädispositionen (formale und substanzielle Universalien, Verfahren zur Bildung und Bewertung von Hypothesen).',
  'Offen: Sind die Mechanismen sprachspezifisch (eigenes Modul) oder bereichsübergreifend? Wie viel interne, wie viel externe Faktoren?',
  '**Modularitätshypothese:** das Gehirn enthält ein angeborenes, unabhängiges Sprachmodul.',
  '**Konnektionismus:** Informationsverarbeitungstheorie mit gleichzeitig aktiven, vernetzten Einheiten; Lernmechanismen sind allgemein. Weniger-ist-mehr und statistisches Lernen sind nicht sprachspezifisch.',
  '**Nativisten:** neben Chomsky auch **Jerry Fodor** (angeborenes, unabhängiges Sprachmodul).']},
 {h:'Nichtsprachliche Symbole', b:[
  'Zahlen, Schrift, Grafiken, Fotos, Filme … Kompetenz = Symbole beherrschen und neue bilden.',
  '**Duale Repräsentation:** ein Artefakt gleichzeitig als reales Objekt und als Symbol sehen. **3-Jährige** lösen Suchaufgaben mit einem Modellraum, **2,5-Jährige** meist nicht.',
  'Deshalb sind **anatomisch geformte Puppen** bei Missbrauchsverdacht unzuverlässig – nicht unter 5 Jahren verwenden.',
  '**Als-ob-Spiel** ab **18 Monaten**, **Objektsubstitution** (Holzklotz als Telefon); mit Erwachsenen ausgereifter. Vorläufer der Theory of Mind.',
  '**Zeichnen:** erst die Tätigkeit selbst; mit **3–4 Jahren** darstellende Bilder (Kopffüßler). Mit **4 Jahren** verstehen Kinder: geschriebene Wörter entsprechen bestimmten gesprochenen Wörtern, Zeichnungen nicht.',
  '**DeLoache – „Schrumpfmaschine“:** Glauben **2½-Jährige**, der Raum sei geschrumpft, lösen sie die Suchaufgabe – es ist **keine duale Repräsentation** nötig. Das gleiche Problem gibt es bei **anatomischen Puppen**.',
  '**Kinderzeichnungen – Luquet:** **zufälliger Realismus** (Deutung ändert sich beim Zeichnen) → **intellektueller Realismus** → **visueller Realismus** (Realität abbilden, z. B. mit Farben).',
  '**Freeman & Janikoun:** Tasse mit Blumenmotiv, Henkel nicht sichtbar → **unter 8 J.** zeichnen Kinder den **Henkel**, aber nicht das Motiv; **ab 8 J.** das **Motiv**, aber keinen Henkel. **Autistische Kinder** beherrschen den visuellen Realismus von Anfang an (keine Interferenz durch symbolische Prozesse).',
  {vid:"**Lesen** muss – anders als Sprechen – **ausdrücklich gelehrt** werden; rund 17 Hirnregionen arbeiten zusammen. **Dyslexie**: Leseschwäche trotz normaler Intelligenz, Sinne und Förderung. Kern: Wörter nicht in ihre **Laute zerlegen** können (k-a-t). Training: Laute langsam zerlegen und wieder verbinden."}]}
]},
{id:7, s:'Konzepte', t:'Die Entwicklung von Konzepten', sec:[
 {h:'Konzepte und Kategorien', b:[
  '**Konzepte:** allgemeine Vorstellungen, mit denen man Ähnliches zu Klassen zusammenfasst – ohne sie wäre jede Situation neu.',
  '**Nativisten:** grundlegende Konzepte (Zeit, Raum, Zahl …) und spezialisierte Lernmechanismen sind angeboren. **Empiristen:** nur allgemeine Lernmechanismen, Konzepte kommen aus Erfahrung.',
  'Zwei Gruppen: **Dinge** (Menschen, Lebewesen, unbelebte Objekte) und **Dimensionen** (wo, wann, warum, wie viel).',
  'Informelle Theorien laut Mitschrift: Physik (unbelebte Objekte) angeboren, Psychologie (Menschen) ab 18 Monaten, Biologie (Lebewesen) ab 3 Jahren.',
  'Schon in den ersten Monaten Objektklassen: nach vielen Katzenbildern dishabituieren Babys bei einem Hund. **Wahrnehmungsbasierte Klassifizierung** (Farbe, Größe, Bewegung) ist zentral.',
  'Mit ca. **18 Monaten** achten Kinder stark auf **Beine** (Tiere) und **Räder** (Fahrzeuge); **gegen den 2. Geburtstag** klassifizieren sie nach der **Gesamtform**. Gegen Ende des 1. LJ auch nach Funktion (Altfragen: ab ~9 Monaten soll Ähnliches auch rasseln).',
  '**Klassenhierarchie:** 3 Ebenen – übergeordnet (Tier) · **Basisebene** (Hund, wird zuerst gelernt) · untergeordnet (Pudel). Kindliche Basisebenen weichen teils ab („Dinge mit Rädern“).',
  'Kausales Verstehen hilft beim Kategorisieren: Kinder, denen erklärt wurde, **warum** ein Fantasiewesen so aussieht, ordnen besser zu.',
  'Unter **18 Monaten** Klassifikation oft nach **einzelnen Objektteilen**, mit **2 Jahren** zunehmend nach der **Gesamtform**. Abfolge: Gesamtform → **Funktion** → Kategorien werden mit **Handlungen** assoziiert; Kausalbeziehungen erleichtern das Kategorisieren.',
  '**Beziehung zwischen Konzepten:** 9 Monate alte Säuglinge im Habituationsparadigma (Habituation + Testphase, **kongruent vs. inkongruent**) → sie schauen **länger auf inkongruente** Bedingungen.']},
 {h:'Naive Psychologie', b:[
  'Alltagsverständnis von sich und anderen. Zentrale Konzepte: **Wünsche, Annahmen, Handlungen**. Eigenschaften: bezieht sich auf unsichtbare Zustände, kausal verknüpft, entwickelt sich früh.',
  '**Implizites Selbstbewusstsein** schon bei Geburt. Babys schauen lieber auf Gesichter und imitieren Mimik (nicht aber unbelebte Bewegungen).',
  'Kleinkinder nehmen lieber Essen von Sprecher:innen ihrer Sprache an. Mit **12 Monaten** nehmen sie lieber **einen Keks** von einer netten als zwei von einer gemeinen Puppe. Im 2. LJ trösten Einjährige andere.',
  '§Theory of Mind',
  'Verbindung Wunsch → Handlung gegen Ende des 1. LJ, mit **2 Jahren** fest verankert. Mit 3 Jahren ist das Verständnis von Überzeugung → Handlung noch begrenzt.',
  '**Falsche-Überzeugungs-Aufgaben** (z. B. Smarties): 3-Jährige ~**14 %** richtig, 5-Jährige ~**85 %** – in allen untersuchten Kulturen. ToM entwickelt sich mit ca. **4 Jahren**.',
  'Erklärungen: **1 Nativistisch** – ToM-Modul im Gehirn, reift in den ersten 5 Jahren (Beleg: Autismus). **2 Erfahrung** – Interaktion mit Menschen mit anderen Interessen; Kinder mit (älteren, andersgeschlechtlichen) **Geschwistern** schneiden besser ab. **3 Informationsverarbeitung** – automatische Reaktionen unterdrücken und logisch denken.',
  '**Autismus – Trias:** Defizite in Kommunikation und Sprache, in sozialer Interaktion, stereotype Verhaltensweisen. Frühe Indikatoren: keine geteilte Aufmerksamkeit, kein Als-ob-Spiel.',
  '**Autismus:** Prävalenz ca. **4/10.000**, alle Formen zusammen ca. **60/10.000**. Frühe Indikatoren: **keine geteilte Aufmerksamkeit**, **kein Als-ob-Spiel**.',
  '**ToM-Aufgabe** fragt: **naming question**, **belief question** + zwei Kontrollfragen (**reality** und **memory question**).',
  '**Fiktive Begleiter:** Einzelkinder und Erstgeborene haben sie öfter – hängt **positiv** mit einer guten ToM zusammen.']},
 {h:'Spiel', b:[
  'Tätigkeit um ihrer selbst willen. Früheste spielerische Aktivitäten im 1. LJ (Essen auf den Boden werfen).',
  '**Als-ob-Spiel** ab ca. 18 Monaten mit **Objektsubstitution**. Wer öfter (vor allem **sozial**) Als-ob spielt, versteht Denken und Fühlen anderer besser.',
  'Etwa ein Jahr später **soziale Rollenspiele**, anspruchsvoller mit Eltern oder älteren Geschwistern. Grundschule: Regelspiele, Streit um Fairness.']},
 {h:'Naive Biologie', b:[
  'Mit 4–5 Jahren erstaunlich viel Wissen über Vererbung, Krankheit, Genesung, aber auch Irrtümer: viele 5-Jährige halten Pflanzen für nicht lebendig, manche den Mond für lebendig.',
  'Mensch, Tier und Unbelebtes werden schon im 1. LJ unterschieden; Pflanzen erst mit **7–9 Jahren** als lebendig. Kinder vom Land verstehen das schneller.',
  'Mit 3–4 Jahren: biologische Prozesse sind unabhängig von Wünschen. Vererbung: wissen, dass Körpermerkmale vererbt werden, glauben aber, Wünsche der Mutter spielten mit und Adoptivkinder ähnelten Adoptiveltern genauso.',
  '**Essenzialismus:** Lebewesen haben ein inneres Wesen, das sie zu dem macht, was sie sind.',
  '3–4-Jährige: Wachstum geht bei Lebewesen nur in eine Richtung; mit 3 Jahren grobe Vorstellung von Keimen.',
  '**Nativisten:** Biologiemodul (3 Argumente: Überleben, Faszination, weltweit ähnliche Struktur). **Empiristen:** Beobachtung und Kultur. Beides spielt eine Rolle.',
  '**9 Monate:** beobachten Kaninchen stärker als unbelebte Objekte, lächeln sie aber **seltener an als Menschen**.']},
 {h:'Kausalität und Raum', b:[
  '**David Hume:** Kausalzusammenhänge verbinden Ereignisse zu einem Ganzen. Nativisten: Kausalmodul; Empiristen: aus Beobachtung.',
  'Mit ca. **6 Monaten** kausale Verknüpfungen bei physikalischen Ereignissen. **9–11 Monate:** kausal verknüpfte Handlungen werden nachgemacht, unverbundene erst mit **20–22 Monaten**. Ende 2. LJ indirekte Schlüsse; mit ca. 5 wissen Kinder, dass selbst ein Zaubertrick eine Ursache hat.',
  'Raum: früh „über/unter/rechts/links“; der **Hippocampus** verbessert das Ortslernen; geometrische Information ist wichtig.',
  'Mit **7 Monaten** greifen Kinder richtig, wenn das Objekt 2 s vorher versteckt wurde, nach 4 s nicht; mit **12 Monaten** auch nach 10 s (Reifung des dorsolateralen präfrontalen Cortex).',
  'Piaget: in der sensomotorischen Phase nur **egozentrische Repräsentation** (Ort relativ zum eigenen Körper) – stimmt nicht absolut (mit auffälligem Orientierungspunkt klappt mehr). Eigene Fortbewegung fördert Repräsentationen ohne Körperanker; Puzzles fördern mentales Rotieren. Mit 5 Jahren mehrere Bezugspunkte.',
  'Kultur wirkt: Aborigine-Kinder merken sich Raumpositionen besser als Stadtkinder. Blind geborene Kinder repräsentieren Raum erstaunlich gut; nach früh operiertem Katarakt bleiben visuelle Defizite.']},
 {h:'Zeit und Zahl', b:[
  'Zeit: schon im 1. Halbjahr rudimentäres Zeitgefühl (Abfolge, Dauer). Dauern: 6 Monate **2:1**, mit 10 Monaten auch **1,5:1** – entscheidend ist das Verhältnis.',
  'Zeitpunkt vergangener Ereignisse (vor 3 Monaten): 5-Jährige 20 %, 7-Jährige 46 %, 9-Jährige 64 % richtig. Vorschulkinder verwechseln Vergangenheit und Zukunft. Aufmerksamkeit auf die Zeit lässt sie länger wirken. Zentrierung: Zug, der weiter fährt, ist „länger gefahren“.',
  '**Numerische Gleichheit:** alle Mengen mit gleicher Anzahl haben etwas gemeinsam – mit **5 Monaten** bei bis zu 3 Objekten (teils über Fläche/Kontur). Mengen: 6 Monate **2:1**, 9 Monate **1,5:1**.',
  '**Wynn (1992):** 1 Puppe, Schirm, zweite Puppe dazu → 5-Monatige schauen **länger, wenn nur eine** da ist. Gedeutet nicht als Arithmetik, sondern **Auf-einen-Blick-Erfassen** (Subitizing) mit bildlicher Repräsentation; bei erschwerter Repräsentation keine Überraschung.',
  'Mit 2 Jahren zählen viele, verstehen aber nicht, ob 5 > 3. Zahlwörter werden Zahl für Zahl gelernt („eins“, Monate später „zwei“ …).',
  'Zählprinzipien: **Eins-zu-eins-Korrespondenz** · **stabile Reihenfolge** · **Kardinalzahlprinzip** (letzte Zahl = Anzahl) · **Irrelevanz der Reihenfolge** · **Abstraktion**. Tempo hängt vom Zahlwortsystem der Kultur ab.',
  'Raum, Zeit und Zahl nutzen überlappende Bereiche des **Sulcus intraparietalis**.']}
]}];

[1,'Organismische Sichtweise','Der Mensch bewirkt in Interaktion mit der Umwelt aktiv seine eigene Entwicklung.'],

{c:1,t:'mc',alt:1,q:'Was versteht man unter einer Querschnittstudie?',o:['Kinder unterschiedlichen Alters werden zu einem Zeitpunkt untersucht','Dieselben Kinder werden über Jahre wiederholt untersucht','Dieselben Kinder werden in kurzer Zeit sehr oft untersucht','Eine Gruppe wird zufällig auf zwei Bedingungen aufgeteilt'],a:0,e:'Querschnitt zeigt Unterschiede zwischen Altersgruppen, aber keine individuellen Verläufe.'},
{c:1,t:'ms',alt:1,q:'Welche Aussagen über Längsschnittstudien stimmen?',o:['Sie zeigen die Stabilität individueller Unterschiede','Sie machen langfristige Veränderungsmuster sichtbar','Proband:innen fallen im Lauf der Zeit aus','Häufiges Testen kann die externe Validität gefährden','Sie sind schnell und billig durchzuführen'],a:[0,1,2,3],e:'Schnell und leicht durchführbar sind Querschnittstudien. Längsschnitt ist aufwendig und zeitintensiv.'},
{c:1,t:'ms',alt:1,q:'Welche Aussagen über Querschnittstudien stimmen?',o:['Sie liefern Daten über Unterschiede zwischen Altersgruppen','Sie sind schnell und leicht durchzuführen','Sie sagen nichts über langfristige individuelle Entwicklungsmuster','Sie leiden besonders unter dem Ausfall von Proband:innen','Sie zeigen die Stabilität von Eigenschaften einzelner Kinder'],a:[0,1,2],e:'Ausfall von Proband:innen und Stabilität betreffen Längsschnittstudien.'},
{c:1,t:'ms',alt:1,q:'Naturalistische Beobachtung – was stimmt?',o:['Vorteil: zeigt Verhalten in Alltagssituationen','Vorteil: macht soziale Interaktionsprozesse (z. B. Eltern–Kind) sichtbar','Nachteil: schwer zu sagen, welche Aspekte der Situation das Verhalten am stärksten beeinflussen','Nachteil: wenig nützlich für seltene Verhaltensweisen','Vorteil: erlaubt sichere Kausalschlüsse'],a:[0,1,2,3],e:'Kausalschlüsse erlaubt nur das Experiment.'},
{c:1,t:'ms',alt:1,q:'Korrelations- vs. Experimentaldesign – was stimmt?',o:['Korrelationsdesign: oft die einzige Möglichkeit, wenn man nicht manipulieren kann','Korrelationsdesign: Problem der dritten Variable und der Verursachungsrichtung','Experimentaldesign: Zufallszuweisung und Kontrolle der Bedingungen erlauben Kausalschlüsse','Experimentaldesign: Situation ist oft künstlich und nicht immer anwendbar','Korrelationsdesign: erlaubt sichere Kausalschlüsse'],a:[0,1,2,3],e:'Naturalistische Experimente können Ursache–Wirkung auch in natürlichen Situationen zeigen.'},
{c:1,t:'tf',alt:1,q:'Prädiktive (zeitlich versetzte) Korrelationsforschung beweist Kausalität besser als normale Korrelationsforschung.',a:false,e:'Auch zeitlich versetzte Zusammenhänge bleiben Korrelationen. Kausalität zeigt nur das Experiment. Im Altfragen-Katalog war die Antwort als unsicher (#) markiert.'},
{c:1,t:'ms',q:'Welche Begriffe sind Arten der Reliabilität?',o:['Interrater-Reliabilität','Test-Retest-Reliabilität','Interne Validität','Externe Validität'],a:[0,1],e:'Validität ist ein eigenes Gütekriterium: intern = Effekt geht sicher auf die UV zurück, extern = verallgemeinerbar.'},
{c:2,t:'ms',alt:1,q:'Welche sind Risikofaktoren für den plötzlichen Kindstod?',o:['Die Mutter raucht','Das Baby schläft auf dem Bauch','Weiche Matratze mit Kissen','Die Mutter ist jünger als 15','Die Mutter stillt','Das Baby schläft auf dem Rücken'],a:[0,1,2,3],e:'Außerdem: nicht stillen, geringe Schulbildung der Mutter, mehrere Schichten Kleidung oder Decken. Rückenlage senkt das Risiko.'},
{c:2,t:'ms',alt:1,q:'Welche Zuordnungen der pränatalen Phasen stimmen?',o:['Zygote: Befruchtung bis 2. Woche','Embryo: 3. bis 8. Woche','Fetus: 9. Woche bis Geburt','Embryo: 9. bis 20. Woche','Zygote: bis 12. Woche'],a:[0,1,2],e:'Zygote → Embryo → Fetus.'},

{c:2,t:'ms',alt:1,q:'Welche drei Merkmale fördern laut Altfragen die Resilienz?',o:['Positive persönliche Eigenschaften (z. B. hohe Intelligenz, Gelassenheit, Flexibilität)','Enge Beziehung zu mindestens einem Elternteil','Enge Beziehung zu mindestens einem weiteren Erwachsenen','Möglichst wenig Kontakt zu Gleichaltrigen','Hohes Familieneinkommen'],a:[0,1,2],e:'Resilienz = gesund bleiben und sich gut entwickeln trotz widriger Umstände.'},
{c:2,t:'ms',q:'Welche Stoffe wirken als Teratogene?',o:['Alkohol','Nikotin','Bestimmte Medikamente','Folsäure'],a:[0,1,2],e:'Folsäure schützt sogar, z. B. vor Neuralrohrdefekten.'},
{c:3,t:'mc',alt:1,q:'Was ist der Genotyp?',o:['Das genetische Material, das ein Individuum erbt','Das beobachtbare Erscheinungsbild','Die Umwelt der Eltern','Die Reaktionsnorm'],a:0,e:'Phänotyp = beobachtbares Erscheinungsbild aus Genotyp und Umwelt.'},
